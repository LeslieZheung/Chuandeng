    const stop = e => { if (this.busy) e.preventDefault(); };
    el.addEventListener('wheel', stop, { passive: false });
    el.addEventListener('touchmove', stop, { passive: false });
    document.addEventListener('keydown', e => { if (this.busy && [' ', 'PageDown', 'PageUp', 'ArrowDown', 'ArrowUp', 'Home', 'End', 'Enter', 'Tab'].indexOf(e.key) >= 0) e.preventDefault(); }, true);
    document.body.appendChild(el);
    this.el = el;
  },
  q(s){ return this.el.querySelector(s); },
  setVB(v){ this.q('.tr-map').setAttribute('viewBox', v.map(n => n.toFixed(1)).join(' ')); },
  unit(){ const w = this.q('.tr-map').clientWidth || 600; return this.vbW / w; },
  label(g, xy, text, cls, px, dx, dy, anchor){
    const k = this.unit();
    const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    t.setAttribute('x', xy[0] + dx * k); t.setAttribute('y', xy[1] + dy * k);
    t.setAttribute('font-size', px * k); t.setAttribute('stroke-width', 4 * k);
    t.setAttribute('text-anchor', anchor || 'start'); t.setAttribute('class', cls); t.textContent = text;
    g.appendChild(t); return t;
  },
  dot(g, xy, r, cls){
    const k = this.unit();
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('cx', xy[0]); c.setAttribute('cy', xy[1]); c.setAttribute('r', r * k); c.setAttribute('class', cls);
    g.appendChild(c); return c;
  },
  /* from: scene index just finished (0-based); to: next index, or N for the ending */
  play(from, to, mid){
    if (this.busy) return;
    if (!this.el) this.build();
    this.busy = true;
    const el = this.el, svg = this.q('.tr-map');
    const A = PL[from + 1], end = to >= N, B = end ? null : PL[to + 1];
    const sc = end ? null : D.scenes[to];
    this.q('.tr-no').textContent = end ? '終章' : '第' + sc.num + '幕　' + sc.title;
    this.q('.tr-place').textContent = end ? C.trEnd : B.name;
    this.q('.tr-now').textContent = end ? cnum(N) + '幕，你走過的地方' : '今' + shortNow(B.now) + (!C.years ? '' : '・' + (B.year < 0 ? '西元前 ' + (-B.year) : '西元 ' + B.year) + ' 年');
    this.q('.tr-time').innerHTML = timeStrip(from + 1);
    ['.m-olds', '.m-pts', '.m-lbls', '.m-rl'].forEach(s => { this.q(s).innerHTML = ''; });
    const go = this.q('.m-go'), sea = this.q('.m-sea'), trail = this.q('.m-trail');
    go.setAttribute('d', ''); sea.setAttribute('d', '');
    el.classList.add('on');
    // geometry for the view
    const aspect = (svg.clientWidth || 16) / (svg.clientHeight || 10);
    let target, travel = '', route = null, pts;
    if (end){
      pts = D.places.map(p => p.xy);
      target = [0, 0, MAP.w, MAP.h];
      if (MAP.w / MAP.h < aspect){ const w = MAP.h * aspect; target = [(MAP.w - w) / 2, 0, w, MAP.h]; } else { const h = MAP.w / aspect; target = [0, (MAP.h - h) / 2, MAP.w, h]; }
      travel = D.places.map((p, i) => i ? curve(D.places[i - 1].xy, p.xy, .1).replace(/^M[^Q]+/, '') : 'M' + p.xy[0] + ' ' + p.xy[1]).join('');
    } else {
      pts = [A.xy, B.xy].concat((B.viaXY || []).map(v => v.xy)).concat((B.alsoXY || []).map(v => v.xy));
      if (B.routeXY){ pts.push(B.routeXY.xy); if (B.routeXY.fromXY) pts.push(B.routeXY.fromXY); }
      target = fitBox(pts, aspect, 600);
      const same = Math.hypot(A.xy[0] - B.xy[0], A.xy[1] - B.xy[1]) < 4;
      if (!same) travel = travelPath(A.xy, B.xy, B.viaXY);
      if (B.routeXY) route = seaPath(B);
    }
    const start = this.vb || target.slice();
    this.vbW = target[2];
    this.setVB(target);
    // static layers drawn at the target scale
    const seen = D.places.slice(0, end ? N : from + 1);
    trail.setAttribute('d', '');
    go.classList.toggle('end', end);
    const olds = this.q('.m-olds'), pg = this.q('.m-pts'), lg = this.q('.m-lbls'), rl = this.q('.m-rl');
    MAP.riverLabels.forEach(r => this.label(rl, r.p, r.t, 'm-riverlabel', 12, 0, 0, 'middle'));
    seen.forEach(p => this.dot(olds, p.xy, 2.6, 'm-old'));
    let labelB = null, ring = null, routeLbl = null;
    if (!end){
      const left = B.xy[0] > target[0] + target[2] * .72;
      const sameA = Math.hypot(A.xy[0] - B.xy[0], A.xy[1] - B.xy[1]) < 4;
      if (!sameA) this.label(lg, A.xy, A.name, 'm-small m-faint', 12, 0, 18, 'middle');
      (B.viaXY || []).forEach(v => { this.dot(pg, v.xy, 2.6, 'm-old'); this.label(lg, v.xy, v.t, 'm-small m-faint', 12, 0, -9, 'middle'); });
      (B.alsoXY || []).forEach(v => { this.dot(pg, v.xy, 3, 'm-dot m-fade'); this.label(lg, v.xy, v.t, 'm-small m-fade', 13, 8, 4); });
      ring = this.dot(pg, B.xy, 9, 'm-ring');
      this.dot(pg, B.xy, 4.2, 'm-dot');
      labelB = this.label(lg, B.xy, B.name, 'm-label m-fade', 17, left ? -13 : 13, 6, left ? 'end' : 'start');
      if (B.routeXY){
        const rx = B.routeXY.xy;
        this.dot(pg, rx, 2.6, 'm-old');
        if (B.routeXY.fromXY){ this.dot(pg, B.routeXY.fromXY, 2.6, 'm-old'); if (B.routeXY.ft) this.label(lg, B.routeXY.fromXY, B.routeXY.ft, 'm-small m-fade', 12, 0, 18, 'middle'); }
        if (B.routeXY.dir === 'to'){
          // above-right of the far shore, clear of the incoming line; shift left if it would leave the view
          const k = this.unit(), w = B.routeXY.t.length * 13 * k, right = target[0] + target[2] - 6 * k;
          routeLbl = rx[0] + 8 * k + w < right ? this.label(lg, rx, B.routeXY.t, 'm-small m-fade', 13, 8, -10, 'start')
            : rx[0] + w / 2 < right ? this.label(lg, rx, B.routeXY.t, 'm-small m-fade', 13, 0, -12, 'middle')
            : this.label(lg, rx, B.routeXY.t, 'm-small m-fade', 13, -6, -12, 'end');
        } else routeLbl = this.label(lg, rx, B.routeXY.t, 'm-small m-fade', 13, 0, -12, 'middle');
      }
    } else {
      D.places.forEach(p => this.dot(pg, p.xy, 2.8, 'm-dot m-fade'));
    }
    go.setAttribute('d', travel);
    sea.setAttribute('d', route || '');
    const goLen = travel ? go.getTotalLength() : 0, seaLen = route ? sea.getTotalLength() : 0;
    // the line keeps a fixed screen width (non-scaling stroke), so its dashes are measured in screen pixels
    const pxLen = v => goLen * Math.min((svg.clientWidth || 600) / v[2], (svg.clientHeight || 400) / v[3]) + 4;
    const L0 = pxLen(target);
    go.style.strokeDasharray = L0 * 4 + ' ' + L0 * 4; go.style.strokeDashoffset = L0 * 4;
    sea.style.opacity = 0;
    const fades = Array.from(el.querySelectorAll('.m-fade'));
    fades.forEach(f => { f.style.opacity = 0; });
    if (ring) ring.style.opacity = 0;
    const now = this.q('.tl-now') || {style: {}};
    const y0 = end ? (PL[1] ? PL[1].year : YEAR0) : A.year, y1 = end ? PL[N].year : B.year;
    now.style.left = yearPct(y0) + '%';
    const T = reduce ? { inn: 150, draw: 0, hold: 1150, out: 200 } : { inn: 300, draw: end ? 1400 : (goLen ? 1000 : 450), hold: (route ? 800 : 550) + (innerWidth < 600 ? 150 : 0), out: 320 };
    const total = T.inn + T.draw + T.hold + T.out;
    let midDone = false; const t0 = performance.now();
    const step = now2 => {
      const t = now2 - t0;
      if (!midDone && t >= T.inn){ midDone = true; try { mid(); } catch (e) {} }
      const pd = T.draw ? Math.min(1, Math.max(0, (t - T.inn * .6) / T.draw)) : 1, e = ease(pd);
      // camera glides from the previous view to the new one
      const v = start.map((s, i) => s + (target[i] - s) * e);
      this.setVB(v);
      const L = pxLen(v); go.style.strokeDasharray = L + ' ' + L; go.style.strokeDashoffset = L * (1 - e);
      now.style.left = yearPct(y0 + (y1 - y0) * e) + '%';
      const pf = Math.min(1, Math.max(0, (t - T.inn - T.draw * .7) / 380));
      fades.forEach(f => { f.style.opacity = pf; });
      if (ring){ const pr = Math.min(1, Math.max(0, (t - T.inn - T.draw * .8) / 700)); ring.style.opacity = pr < 1 ? (1 - pr) * .9 : 0; ring.setAttribute('r', (5 + pr * 10) * this.unit()); }
      if (route) sea.style.opacity = Math.min(1, Math.max(0, (t - T.inn - T.draw * .85) / 500));
      if (t >= T.inn + T.draw + T.hold) el.classList.remove('on');
      if (t < total) requestAnimationFrame(step);
      else {
        this.vb = target; this.busy = false;
      }
    };
    requestAnimationFrame(step);
  }
};

/* sea route: from the scene place (or a named port) to the far shore, or back */
function seaPath(p){
  const r = p.routeXY, a = r.fromXY || p.xy;
  return r.dir === 'to' ? curve(a, r.xy, .22) : curve(r.xy, a, .22);
}
/* the full journey and the timeline, shown in the ending */
function placeGroups(){
  const groups = [];
  D.places.forEach(p => {
    const g = groups.find(g => Math.hypot(g.xy[0] - p.xy[0], g.xy[1] - p.xy[1]) < 9);
    if (g){ if (g.names.indexOf(p.name) < 0) g.names.push(p.name); g.ns.push(p.n); g.minor = false; }
    else groups.push({ xy: p.xy, names: [p.name], ns: [p.n] });
    (p.alsoXY || []).concat(p.viaXY || []).forEach(v => {
      if (!groups.find(g => Math.hypot(g.xy[0] - v.xy[0], g.xy[1] - v.xy[1]) < 9)) groups.push({ xy: v.xy, names: [v.t], ns: [], minor: true });
    });
  });
  return groups;
}
function journeyHTML(){
  const groups = placeGroups(), FS = 19, boxes = [];
  const fits = b => b[0] > 2 && b[1] > 2 && b[2] < MAP.w - 2 && b[3] < MAP.h - 2 &&
    !boxes.some(o => b[0] < o[2] && b[2] > o[0] && b[1] < o[3] && b[3] > o[1]) &&
    !groups.some(g => g.xy[0] > b[0] - 3 && g.xy[0] < b[2] + 3 && g.xy[1] > b[1] - 3 && g.xy[1] < b[3] + 3);
  let labels = '';
  MAP.riverLabels.forEach(r => boxes.push([r.p[0] - 17, r.p[1] - 14, r.p[0] + 17, r.p[1] + 4]));
  groups.slice().sort((a, b) => b.ns.length - a.ns.length || a.xy[1] - b.xy[1]).forEach(g => {
    const text = g.names.slice(0, 2).join('・'), w = text.length * FS, h = FS;
    const [x, y] = g.xy;
    const cand = [[x + 8, y + 6, 'start'], [x - 8, y + 6, 'end'], [x, y - 10, 'middle'], [x, y + 24, 'middle'], [x + 7, y - 8, 'start'], [x - 7, y - 8, 'end'], [x + 7, y + 21, 'start'], [x - 7, y + 21, 'end'],
      [x + 10, y + 26, 'start'], [x - 10, y + 26, 'end'], [x + 10, y - 13, 'start'], [x - 10, y - 13, 'end'], [x, y + 44, 'middle'], [x, y - 28, 'middle'], [x + 24, y + 6, 'start'], [x - 24, y + 6, 'end']];
    for (const [lx, ly, an] of cand){
      const x0 = an === 'start' ? lx : an === 'end' ? lx - w : lx - w / 2;
      const b = [x0, ly - h * .85, x0 + w, ly + h * .2];
      if (fits(b)){ boxes.push(b); labels += '<text class="m-small' + (g.minor ? ' m-faint' : '') + '" x="' + lx + '" y="' + ly + '" font-size="' + FS + '" stroke-width="5" text-anchor="' + an + '">' + text + '</text>'; return; }
    }
  });
  const route = D.places.map((p, i) => i ? curve(D.places[i - 1].xy, p.xy, .1).replace(/^M[^Q]+/, '') : 'M' + p.xy[0] + ' ' + p.xy[1]).join('');
  const seas = D.places.filter(p => p.routeXY).map(seaPath).join('');
  const seaLbls = D.places.filter(p => p.routeXY).map(p => [p.routeXY.xy].concat(p.routeXY.fromXY ? [p.routeXY.fromXY] : []).map(xy => '<circle class="m-old" cx="' + xy[0] + '" cy="' + xy[1] + '" r="3"/>').join('')).join('');
  const dots = groups.map(g => '<circle class="' + (g.minor ? 'm-old' : 'm-dot') + '" cx="' + g.xy[0] + '" cy="' + g.xy[1] + '" r="' + (g.minor ? 3 : 4.2) + '"/>').join('');
  const rl = MAP.riverLabels.map(r => '<text class="m-riverlabel" x="' + r.p[0] + '" y="' + r.p[1] + '" font-size="15" text-anchor="middle">' + r.t + '</text>').join('');
  return '<p class="swipe">左右滑動，看全圖</p><div class="mapscroll"><div class="mapbox"><svg viewBox="0 0 ' + MAP.w + ' ' + MAP.h + '" role="img" aria-label="' + C.mapAria + '">' + baseMap() + rl +
    '<path class="m-path" d="' + route + '"/><path class="m-sea" d="' + seas + '"/>' + dots + seaLbls + labels + '</svg></div></div>' +
    '<p class="maplegend">' + C.mapLegend + '</p>';
}
const TL_ORDER = ['三論', '法相', '天台', '華嚴', '律', '淨土', '臨濟', '曹洞', '密', '涅槃師', '地論', '攝論', '三階'];
const TL_STYLE = { 興盛: 'tl-s', 延續: 'tl-m', 衰微: 'tl-w', 萌芽: 'tl-b', 典籍: 'tl-d' };
function timelineHTML(){
  const L = 118, R = 988, top = 26, rowH = 30, gap = 18;
  const X = y => L + (y - YEAR0) / (YEAR1 - YEAR0) * (R - L);
  const rowY = i => top + i * rowH + (i >= 9 ? gap : 0);
  const H = rowY(TL_ORDER.length - 1) + 64;
  let s = '<svg viewBox="0 0 1000 ' + H + '" role="img" aria-label="八宗興衰時間軸">';
  for (let y = 400; y <= 2000; y += 200) s += '<line class="tl-grid" x1="' + X(y) + '" x2="' + X(y) + '" y1="' + (top - 14) + '" y2="' + (H - 40) + '"/><text class="tl-yr" x="' + X(y) + '" y="' + (H - 18) + '" text-anchor="middle">' + y + '</text>';
  TL_ORDER.forEach((name, i) => {
    const y = rowY(i), lost = i >= 9;
    s += '<text class="tl-name' + (lost ? ' lost' : '') + '" x="' + (L - 14) + '" y="' + (y + 6) + '" text-anchor="end">' + name + '</text>';
    (D.timeline || []).forEach((seg, j) => {
      if (seg.s !== name) return;
      s += '<line class="tl-seg ' + TL_STYLE[seg.st] + (lost ? ' lost' : '') + '" x1="' + X(seg.a) + '" x2="' + X(seg.b) + '" y1="' + y + '" y2="' + y + '"/>' +
        '<line class="tl-hit" data-tl="' + j + '" x1="' + X(seg.a) + '" x2="' + X(seg.b) + '" y1="' + y + '" y2="' + y + '"><title>' + name + '　' + seg.a + '–' + seg.b + '　' + seg.st + '</title></line>';
    });
  });
  const ay = H - 40;
  s += '<line class="tl-axis" x1="' + L + '" x2="' + R + '" y1="' + ay + '" y2="' + ay + '"/>';
  D.places.forEach(p => { const x = X(p.year); s += '<path class="tl-you" d="M' + x + ' ' + (ay - 1) + 'l-4 -7h8z"/>'; });
  s += '</svg>';
  const key = '<p class="tl-key"><span><i class="k tl-s"></i>興盛</span><span><i class="k tl-m"></i>延續</span><span><i class="k tl-w"></i>衰微</span><span><i class="k tl-b"></i>萌芽</span><span><i class="k tl-d"></i>只在典籍或海外</span><span><i class="k you"></i>你走過的年代</span></p>';
  return '<p class="swipe">左右滑動，看完整的時間軸</p><div class="mapscroll"><div class="tlbox">' + s + '</div></div>' + key + '<p class="tl-cap" id="tl-cap">點一段線，看那一段的興衰。灰色四列，是後來沒有列進八宗、併入他宗或失傳的學派。</p>';
}

/* ---------- render ---------- */
function introHTML(){
  let h = D.intro.slice(0, 4).map(p => '<p>' + p + '</p>').join('');
  if (pos > 0 && pos < N) h += '<button type="button" class="resume" data-act="resume">接著讀第' + D.scenes[pos].num + '幕</button>';
  else if (pos >= N) h += '<button type="button" class="resume" data-act="resume">看你的結局</button>';
  return h;
}
function progress(){
  const lamps = $('#lamps');
  if (!lamps.children.length){
    lamps.innerHTML = D.scenes.map((s, i) => '<i' + (i > 0 && D.volumes[s.vol].first === i + 1 ? ' class="v"' : '') + '></i>').join('');
  }
  Array.from(lamps.children).forEach((el, i) => {
    el.classList.toggle('lit', i < pos || (i === pos && picks.length > pos));
    el.classList.toggle('now', i === pos && picks.length <= pos);
  });
  if (pos < N){
    const sc = D.scenes[pos];
    $('#where').textContent = '第 ' + (pos + 1) + '／' + N + ' 幕';
    $('#vol-now').textContent = D.volumes[sc.vol].label + '・' + D.volumes[sc.vol].title.split('：')[0];
  } else {
    $('#where').textContent = cnum(N) + '幕走完了';
    $('#vol-now').textContent = '終章';
  }
}
function render(freshIdx){
  let h = '';
  const upto = Math.min(pos, N - 1);
  for (let i = 0; i <= upto; i++){
    const sc = D.scenes[i];
    if (D.volumes[sc.vol].first === i + 1) h += volumeHTML(D.volumes[sc.vol]);
    h += (i < pos) ? doneHTML(i) : activeHTML(i, freshIdx === i);
  }
  if (pos >= N) h += endingHTML(freshIdx === N);
  story.innerHTML = h;
  $('#intro').innerHTML = introHTML();
  tidy(story); tidy($('#intro'));
  progress();
}
function goTo(el){
  if (!el) return;
  el.scrollIntoView({behavior: reduce ? 'auto' : 'smooth', block: 'start'});
}

/* ---------- actions ---------- */
function choose(i){
  if (pos >= N || picks.length > pos) return;
  picks[pos] = i; picks.length = pos + 1;
  save();
  const art = $('#scene-' + pos);
  const tmp = document.createElement('div');
  tmp.innerHTML = activeHTML(pos, false);
  const fresh = tmp.firstChild;
  const after = fresh.querySelector('.after'); if (after) after.classList.add('fresh');
  art.replaceWith(fresh); tidy(fresh);
  progress();
  const a = $('#after-' + pos);
  if (a){ a.focus({preventScroll: true}); a.scrollIntoView({behavior: reduce ? 'auto' : 'smooth', block: 'nearest'}); }
}
function next(){
  if (picks.length <= pos) return;
  pos += 1; save();
  render(pos);
  const el = pos >= N ? $('#ending') : $('#scene-' + pos);
  const vol = el && el.previousElementSibling && el.previousElementSibling.classList.contains('vol') ? el.previousElementSibling : el;
  goTo(vol);
  if (pos >= N && el) el.focus({preventScroll: true});
}
let armTimer = null;
function restart(btn){
  if (!btn.hasAttribute('data-armed')){
    document.querySelectorAll('[data-armed]').forEach(b => { b.removeAttribute('data-armed'); b.textContent = '重新開始'; });
    btn.setAttribute('data-armed', ''); btn.textContent = '再按一次，確定重新開始';
    clearTimeout(armTimer);
    armTimer = setTimeout(() => { btn.removeAttribute('data-armed'); btn.textContent = '重新開始'; }, 4000);
    return;
  }
  clearTimeout(armTimer);
  picks = []; pos = 0; save();
  render(0);
  const b = $('#bar-restart'); b.removeAttribute('data-armed'); b.textContent = '重新開始';
  window.scrollTo({top: 0, behavior: reduce ? 'auto' : 'smooth'});
}

document.addEventListener('click', e => {
  const h = e.target.closest('.tl-hit');
  if (h){ const seg = D.timeline[+h.dataset.tl]; const cap = $('#tl-cap'); if (seg && cap) cap.innerHTML = '<b>' + seg.s + '　' + seg.a + '–' + seg.b + '　' + seg.st + '</b>　' + seg.t; return; }
  const ms = e.target.closest('.mi>summary, .rfold>summary');
  if (ms){ e.preventDefault(); const d = ms.parentElement, want = !d.open || d.classList.contains('closing'); toggleCard(d, want, true);
    const sec = d.closest('.allm, #sutras'); if (sec){ const btn = sec.querySelector('[data-act="allm"], [data-act="allsut"]');
      if (btn) btn.textContent = [...sec.querySelectorAll('.mi')].some(x => x === d ? !want : (!x.open || x.classList.contains('closing'))) ? '全部展開' : '全部收起'; }
    return; }
  const c = e.target.closest('.choice');
  if (c && !c.disabled && c.closest('.scene')) { choose(+c.dataset.i); return; }
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act;
  if (act === 'next'){ if (Tr.busy || picks.length <= pos) return; if (D.places && D.places.length === N) Tr.play(pos, pos + 1, next); else next(); }
  else if (act === 'restart') restart(b);
  else if (act === 'allm'){ const cards = [...document.querySelectorAll('.allm .mi')]; const open = cards.some(d => !d.open);
    cards.forEach(d => toggleCard(d, open, false)); b.textContent = open ? '全部收起' : '全部展開'; }
  else if (act === 'allsut'){ const cards = [...document.querySelectorAll('#sutras .mi')]; const open = cards.some(d => !d.open);
    cards.forEach(d => toggleCard(d, open, false)); b.textContent = open ? '全部收起' : '全部展開'; }
  else if (act === 'sjump'){ const g = document.getElementById('sg-' + b.dataset.g); if (!g) return;
    const top = document.querySelector('.bar'), off = top ? top.getBoundingClientRect().height + 8 : 12;
    window.scrollTo({top: g.getBoundingClientRect().top + window.scrollY - off, behavior: reduce ? 'auto' : 'smooth'});
    const h = g.querySelector('h4'); if (h) h.focus({preventScroll: true}); }
  else if (act === 'top') window.scrollTo({top: 0, behavior: reduce ? 'auto' : 'smooth'});
  else if (act === 'resume') goTo(pos >= N ? $('#ending') : $('#scene-' + pos));
});
story.addEventListener('change', e => {
  if (e.target.id === 'ex-school' || e.target.id === 'ex-fate'){
    $('#exout').innerHTML = comboBlock($('#ex-school').value, $('#ex-fate').value); tidy($('#exout'));
  }
});

/* back-to-top button: shows after scrolling down about one and a half screens */
(function(){
  const tb = $('.totop'); if (!tb) return; let on = false, tick = false;
  const upd = () => { tick = false; const v = window.scrollY > window.innerHeight * 1.5; if (v !== on){ on = v; tb.classList.toggle('show', v); tb.tabIndex = v ? 0 : -1; } };
  window.addEventListener('scroll', () => { if (!tick){ tick = true; requestAnimationFrame(upd); } }, {passive: true});
  upd();
})();

function start(data){
  const st = valid(data) ? data : load();
  if (valid(st)) { picks = st.picks.slice(); pos = st.pos; }
  render(-1);
}
try { window.claude && window.claude.hot && window.claude.hot.snapshot && window.claude.hot.snapshot(() => ({picks: picks.slice(), pos})); } catch(e) {}
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();
