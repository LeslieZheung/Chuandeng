<style>
/* Layout: one reading column like a sutra scroll on rice paper. Scenes stack as leaves, finished leaves fold shut,
   a row of small lamps tracks the journey. Single light theme by request: 米白紙、墨褐字、低彩度的燈色。 */
:root{
  --paper:#F7F4EF;      /* 主底：羊皮紙白 */
  --leaf:#FCFAF6;       /* 幕卡 */
  --well:#ECE6DC;       /* 凹面：軌道、輸入 */
  --ink:#2B2623;        /* 主文字與線條：古木墨棕 */
  --ink-2:#5E534B;      /* 次要文字 */
  --rule:#DCD2C4;       /* 細線 */
  --lamp:#9A6A4A;       /* 泥磚赭褐：裝飾與填色 */
  --lamp-ink:#7A4A2F;   /* 泥磚赭褐：文字與按鈕 */
  --lamp-wash:#F1E6DA;  /* 選中底色 */
  --cinnabar:#A64A3D;   /* 敦煌朱砂紅（低飽和） */
  --cinnabar-wash:#F4E3DE;
  --lapis:#3D5A80;      /* 青金石藍 */
  --lapis-wash:#E5EBF2;
  --dai:#3D5A80;        /* 連結：青金石藍 */
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.85;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:680px;margin:0 auto;padding-block:36px 72px}
h1,h2,h3{font-family:var(--serif);text-wrap:balance;margin:0;line-height:1.35;color:var(--ink)}
p{margin:0}
/* line breaking: no lone character on a last line; keep dashes, ranges and short phrases together */
h4,.big,.tagline,.fbox h3,#sutras .mi .nm{text-wrap:balance}
.nb{white-space:nowrap}
.seg{display:inline-block}
a{color:var(--dai);text-underline-offset:2px}
button{font:inherit}
:focus-visible{outline:2px solid var(--dai);outline-offset:2px}

/* header */
.eyebrow{font-size:.8rem;letter-spacing:.18em;color:var(--lamp-ink);font-weight:500}
h1{font-size:2.7rem;font-weight:700;letter-spacing:.22em;margin-top:4px}
.sub{color:var(--ink-2);margin-top:8px;font-family:var(--serif);font-size:1.02rem}
.intro{margin:22px 0 0;padding:16px 18px;background:var(--leaf);border:1px solid var(--rule);border-radius:10px;display:grid;gap:10px;font-size:.95rem}
.intro strong{color:var(--lamp-ink)}
.resume{justify-self:start;background:transparent;color:var(--lamp-ink);border:1px solid var(--lamp-ink);border-radius:8px;padding:6px 14px;font-weight:500;cursor:pointer}
.resume:hover{background:var(--lamp-wash)}

/* progress bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:12px 10px;margin-top:20px;border-bottom:1px solid var(--rule);display:grid;gap:8px}
.bar-row{display:flex;align-items:center;gap:12px;font-size:.85rem;color:var(--ink-2);font-variant-numeric:tabular-nums}
.bar-row .where{font-weight:500;color:var(--ink)}
.bar-row .tiny{margin-left:auto;background:transparent;border:0;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:2px 0;font-size:.85rem}
.bar-row .tiny[data-armed]{color:var(--lamp-ink);font-weight:500}
.lamps{display:grid;grid-template-columns:repeat(37,1fr);gap:3px}
.lamps i{display:block;height:6px;border-radius:3px;background:var(--well)}
.lamps i.v{margin-left:5px}
.lamps i.lit{background:var(--lamp)}
.lamps i.now{background:var(--lamp-wash);box-shadow:inset 0 0 0 1.5px var(--lamp)}

/* story */
#story{display:grid;gap:14px;margin-top:18px}
.vol{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin-top:22px;padding:4px 2px}
.vol .slip{writing-mode:vertical-rl;font-family:var(--serif);font-weight:700;font-size:1.05rem;letter-spacing:.25em;color:var(--lamp-ink);
  border:1px solid var(--lamp);border-radius:3px;padding:10px 5px;background:var(--leaf)}
.vol h3{font-size:1.2rem;font-weight:700}
.vol p{color:var(--ink-2);font-size:.93rem;margin-top:6px}

.scene{background:var(--leaf);border:1px solid var(--rule);border-radius:10px;padding:22px 20px;display:grid;gap:16px;scroll-margin-top:84px}
.no{font-size:.8rem;letter-spacing:.14em;color:var(--lamp-ink);font-weight:500}
.scene h2{font-size:1.5rem;font-weight:700;margin-top:2px}
.era{font-size:.84rem;color:var(--ink-2);margin-top:4px}
.narr{font-family:var(--serif);font-size:1.04rem;line-height:1.95;display:grid;gap:12px}
.narr ul{margin:0;padding-left:1.2em;display:grid;gap:8px}
.choices{display:grid;gap:10px}
.choice{display:grid;grid-template-columns:1.9em 1fr;gap:12px;align-items:start;text-align:left;color:var(--ink);background:var(--paper);
  border:1px solid var(--rule);border-radius:9px;padding:12px 14px;cursor:pointer;line-height:1.75}
.choice .k{font-family:var(--serif);font-weight:700;color:var(--lamp-ink);border:1px solid var(--rule);border-radius:6px;text-align:center;line-height:1.75;background:var(--leaf)}
.choice:hover:not(:disabled){border-color:var(--lamp);background:var(--lamp-wash)}
.choice.picked{border-color:var(--lamp);background:var(--lamp-wash);cursor:default}
.choice.picked .k{background:var(--lamp-ink);border-color:var(--lamp-ink);color:var(--leaf)}
.choice:disabled:not(.picked){opacity:.5;cursor:default}
.memory{font-family:var(--serif);background:var(--paper);border:1px dashed var(--lamp);border-radius:8px;padding:10px 14px 12px;display:grid;gap:4px}
.memory b{font-family:var(--sans);font-size:.75rem;letter-spacing:.18em;color:var(--lamp-ink);font-weight:500}
.choice.extra{border-style:dashed;border-color:var(--lamp)}
.choice.extra .k{color:var(--leaf);background:var(--lamp);border-color:var(--lamp)}
.hidden-end{display:grid;gap:12px;padding-bottom:22px;border-bottom:1px solid var(--rule)}
.hcard{background:var(--paper);border:1px dashed var(--lamp);border-radius:8px;padding:12px 14px;display:grid;gap:6px}
.hcard h4{margin:0;font-family:var(--serif);font-size:1.12rem;color:var(--lamp-ink)}
.hcard p{font-family:var(--serif);font-size:.98rem;line-height:1.9}
.hint{font-size:.85rem;color:var(--ink-2)}
.after{display:grid;gap:12px;border-top:1px dashed var(--rule);padding-top:16px}
.after-label{font-family:var(--serif);font-weight:700;color:var(--lamp-ink);letter-spacing:.2em}
.hist{display:grid;gap:10px;font-size:.98rem}
.src{font-size:.82rem;color:var(--ink-2);line-height:1.75}
.src em{font-style:normal}
.srcf{margin:0}
.srcf>summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:7px;font-size:.84rem;color:var(--ink-2);padding:6px 0;min-height:32px}
.srcf>summary::-webkit-details-marker{display:none}
.srcf>summary::before{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:translateY(-1px) rotate(-45deg);transition:transform .22s cubic-bezier(.3,.7,.3,1)}
.srcf[open]>summary::before{transform:translateY(-2px) rotate(45deg)}
.srcf>summary:hover{color:var(--lamp-ink)}
.srcf>.src{margin:2px 0 0}
.fdrow{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;margin:0}
.fdi{display:inline-flex;align-items:baseline;gap:8px}
.fdl{font-size:.76rem;letter-spacing:.1em;color:var(--ink-2)}
.fd{font:inherit;font-family:var(--serif);font-weight:600;font-size:1.02rem;color:var(--lamp-ink);background:none;border:0;border-bottom:1px dashed var(--lamp-ink);padding:2px 0;cursor:pointer}
.fd small{font-family:var(--sans);font-weight:400;font-size:.76rem;color:var(--ink-2);margin-left:6px}
.fd:hover{border-bottom-style:solid}
.fd:focus-visible,.fx:focus-visible{outline:2px solid var(--lamp-ink);outline-offset:3px}
body.modal-open{overflow:hidden}
.fmask{position:fixed;inset:0;z-index:1000;background:rgba(43,33,24,.45);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.fmask[hidden]{display:none}
.fbox{position:relative;display:flex;flex-direction:column;background:#fff;color:var(--ink);border-radius:14px;box-shadow:0 20px 60px rgba(40,28,15,.3);width:100%;max-width:560px;max-height:min(86vh,700px);max-height:min(86dvh,700px);overflow:hidden;animation:fpop .22s cubic-bezier(.3,.7,.3,1)}
.fin{overflow:auto;overscroll-behavior:contain;padding:26px 24px 18px}
@keyframes fpop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fbox{animation:none}}
.fx{position:absolute;z-index:1;top:8px;right:8px;width:44px;height:44px;background:#fff;border:0;border-radius:50%;color:var(--ink-2);font-size:1.7rem;line-height:1;cursor:pointer}
.fx:hover{background:var(--leaf);color:var(--ink)}
.fbox .frole{margin:0;font-size:.78rem;letter-spacing:.16em;color:var(--ink-2)}
.fbox h3{margin:4px 46px 2px 0;font-family:var(--serif);font-size:1.65rem;line-height:1.3;color:var(--lamp-ink)}
.fbox .fmeta{margin:0 0 12px;font-size:.9rem;color:var(--ink-2)}
.fbox .ftext{margin:0 0 10px;font-family:var(--serif);font-size:1.02rem;line-height:1.95}
.next{justify-self:start;font-weight:500;background:var(--lamp-ink);color:#FCFAF6;border:0;border-radius:8px;padding:10px 20px;cursor:pointer}
.next:hover{background:var(--ink)}

.done{border:1px solid var(--rule);border-radius:10px;background:transparent}
.done>summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;padding:10px 14px}
.done>summary::-webkit-details-marker{display:none}
.done>summary .no{min-width:4.6em}
.done>summary .st{font-family:var(--serif);font-weight:600}
.done>summary .mine{margin-left:auto;font-size:.82rem;color:var(--ink-2)}
.done>summary:hover .st{color:var(--lamp-ink)}
.done[open]{background:var(--leaf)}
.done[open]>summary{border-bottom:1px solid var(--rule)}
.done .body{padding:16px 18px 18px;display:grid;gap:14px}

/* ending */
.ending{background:var(--leaf);border:1.5px solid var(--lamp);border-radius:12px;padding:24px 20px;display:grid;gap:22px;scroll-margin-top:84px}
.ending .head h2{font-size:1.5rem}
.res{display:grid;gap:10px;padding-bottom:22px;border-bottom:1px solid var(--rule)}
.label{font-size:.78rem;letter-spacing:.16em;color:var(--ink-2);font-weight:500}
.big{font-family:var(--serif);font-weight:700;font-size:2rem;line-height:1.3;color:var(--lamp-ink)}
.big.sm{font-size:1.4rem}
.tagline{font-family:var(--serif);font-weight:600;font-size:1.08rem}
.res .txt{font-family:var(--serif);font-size:1.03rem;line-height:1.95}
.modern{background:var(--paper);border-radius:8px;padding:12px 14px;font-size:.94rem;display:grid;gap:2px}
.modern b{font-size:.78rem;letter-spacing:.14em;color:var(--lamp-ink);font-weight:500}
.lead{font-size:.88rem;color:var(--ink-2);background:var(--paper);border-radius:8px;padding:12px 14px}
details.lead>summary{cursor:pointer}
details.lead p{margin:8px 0 0}
.lead b{display:block;font-size:.78rem;letter-spacing:.14em;color:var(--lamp-ink);font-weight:500;margin-bottom:2px}
.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:22px}
.bars{display:grid;gap:7px;margin-top:10px}
.brow{display:grid;grid-template-columns:minmax(4.2em,max-content) 1fr 2em;gap:10px;align-items:center;font-size:.9rem;font-variant-numeric:tabular-nums}
.brow .n{text-align:right;color:var(--ink-2)}
.brow>span:first-child{white-space:nowrap}
.track{height:8px;background:var(--well);border-radius:4px;overflow:hidden}
.fill{height:100%;background:#A08C7C;border-radius:4px}
.brow.top .fill{background:var(--lamp)}
.brow.top span:first-child{color:var(--lamp-ink);font-weight:700}
.four{display:grid;gap:10px;margin:4px 0 0}
.four>div{display:grid;grid-template-columns:4.8em 1fr;gap:10px;align-items:baseline}
.four dt{font-family:var(--serif);font-weight:700;color:var(--lamp-ink);letter-spacing:.04em}
.four dd{margin:0;line-height:1.85}
.four .ctx{border-top:1px dashed var(--rule);padding-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;gap:6px;align-items:baseline;border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:5px 12px;font-size:.9rem}
.chip small{color:var(--ink-2);font-size:.78rem}
.chip.main{border-color:var(--lamp);background:var(--lamp-wash)}
.chip.main b{color:var(--lamp-ink)}
.mixcard{background:var(--paper);border-left:3px solid var(--dai);border-radius:0 8px 8px 0;padding:12px 14px;display:grid;gap:4px}
.mixcard h4,.rcard h4{margin:0;font-family:var(--serif);font-size:1.05rem}
.mixcard h4{color:var(--dai)}
.rcards{display:grid;gap:12px}
.rcard{border:1px solid var(--rule);border-radius:10px;padding:12px 14px;display:grid;gap:4px;background:var(--leaf)}
.rcard h4 small{font-family:var(--sans);font-weight:400;font-size:.8rem;color:var(--ink-2);margin-left:6px}
.rcard p,.mixcard p{margin:0;line-height:1.85}
.master p{margin:0}
.master .txt b{color:var(--lamp-ink);font-weight:600}
.also{display:grid;gap:6px;background:var(--paper);border-radius:8px;padding:12px 14px;font-size:.94rem}
.also>b{font-size:.78rem;letter-spacing:.14em;color:var(--lamp-ink);font-weight:500}
.also p{margin:0}
.roster{display:grid;gap:8px;font-size:.92rem;margin-top:10px}
.allm .note{margin:0;color:var(--ink-2);font-size:.9rem}
.allm .tbar,.sut .tbar{display:flex;justify-content:flex-end}
.allm .tbar .ghost,.sut .tbar .ghost{padding:6px 14px;font-size:.88rem}
.mlist{display:grid;gap:8px}
.mcards{display:grid;gap:10px}
.mcard{background:var(--leaf);border:1px solid var(--rule);border-radius:10px;padding:12px 14px;display:grid;gap:4px}
.mcard.first{border-color:var(--lamp-ink)}
.mcard h4{margin:0;font-family:var(--serif);font-size:1.12rem;color:var(--lamp-ink)}
.md{font-family:var(--sans);font-weight:400;font-size:.78rem;letter-spacing:.02em;color:var(--ink-2);font-variant-numeric:tabular-nums}
.mcard .md{display:block;margin-top:-2px}
.also .md{margin-left:8px}
.mi .nm .md{display:block;margin-top:2px;line-height:1.5}
.mi .nm em{white-space:nowrap;display:inline-block}
.mcard h4 small{font-family:var(--sans);font-weight:400;font-size:.76rem;letter-spacing:.08em;color:var(--ink-2);margin-left:8px}
.mcard .txt p{margin:0;line-height:1.85}
.mcard .txt b{color:var(--lamp-ink);font-weight:600}
.sut .note{margin:0;color:var(--ink-2);font-size:.9rem}
.sut .gnav{display:flex;flex-wrap:wrap;gap:6px}
.sut .gnav button{font:inherit;font-size:.86rem;color:var(--lamp-ink);background:var(--leaf);border:1px solid var(--rule);border-radius:999px;padding:4px 12px;cursor:pointer}
.sut .gnav button:hover{border-color:var(--lamp-ink);background:var(--lamp-wash)}
.sut .gnav small{color:var(--ink-2);margin-left:4px;font-size:.74rem}
.sgroup{display:grid;gap:6px;scroll-margin-top:16px}
.sgroup h4:focus{outline:none}
.sgroup h4{margin:10px 0 0;font-family:var(--serif);font-size:1.08rem;color:var(--ink)}
.sgroup h4 small{font-family:var(--sans);font-weight:400;font-size:.76rem;color:var(--ink-2);margin-left:8px}
.sgroup .gintro{margin:0;font-size:.88rem;color:var(--ink-2);line-height:1.75}
.mi.su .sid{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline;font-variant-numeric:tabular-nums}
.mi.su[open]:not(.closing) .sid{display:flex}
.mi .tg{display:inline-flex;flex-wrap:wrap;gap:4px}
.mi .tg span{font-size:.72rem;line-height:1.6;border:1px solid var(--rule);border-radius:999px;padding:0 7px;color:var(--ink-2);background:var(--leaf)}
.mi .mbody p.cat{font-size:.84rem;color:var(--ink-2);line-height:1.7}
.mi .mbody p b{color:var(--lamp-ink);font-weight:600}
.mi .mbody p.lk{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 12px}
.lk a{font-size:.85rem;line-height:1.5;padding:6px 12px;border-radius:999px;border:1px solid var(--rule);background:var(--leaf);text-decoration:none;color:var(--dai)}
.lk a:hover{border-color:var(--dai)}
.lk a.pri{background:var(--lamp-ink);border-color:var(--lamp-ink);color:var(--paper)}
.lk a.pri:hover{background:#5E3A24}
.mi{background:var(--paper);border-radius:8px;border:1px solid transparent}
.mi.me{border-color:var(--lamp-ink)}
.mi.near{border-color:var(--rule)}
.mi>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:2em 1fr 18px;column-gap:6px;align-items:baseline;padding:11px 14px}
.mi>summary::-webkit-details-marker{display:none}
.mi .n{font-size:.74rem;color:var(--ink-2);font-variant-numeric:tabular-nums}
.mi .nm{font-family:var(--serif);font-weight:600;font-size:1.02rem}
.mi .nm em{font-style:normal;font-family:inherit;font-size:.74rem;letter-spacing:.08em;color:var(--lamp-ink);font-weight:500;margin-left:8px}
.mi .sid{grid-column:2/3;font-size:.86rem;color:var(--ink-2);line-height:1.6;margin-top:2px}
.mi .chev{grid-column:3;grid-row:1;justify-self:end;align-self:center;width:8px;height:8px;border-right:1.6px solid var(--ink-2);border-bottom:1.6px solid var(--ink-2);transform:translateY(-2px) rotate(45deg);transition:transform .32s cubic-bezier(.3,.7,.3,1),border-color .2s}
.mi>summary:hover .chev{transform:translateY(1px) rotate(45deg);border-color:var(--lamp-ink)}
.mi[open]:not(.closing) .chev{transform:translateY(2px) rotate(225deg)}
.mi[open]:not(.closing)>summary:hover .chev{transform:translateY(-1px) rotate(225deg)}
.mi[open]:not(.closing) .sid{display:none}
.mi>summary:hover .nm{color:var(--lamp-ink)}
.mbody{overflow:hidden;padding:0 14px 0 calc(14px + 2em + 6px)}
.mbody>:last-child{margin-bottom:12px}

<script type="application/json" id="data">{"hidden":[],"hiddenLead":"","hiddenSrc":"","intro":["這是「傳燈」三部曲的第二部。佛陀入滅百年後，僧團第一次分裂；此後一千多年，佛法在印度本地從部派走到般若、中觀、唯識、如來藏與密乘，直到十二、十三世紀之交，超戒寺等大寺被毀，那爛陀只剩下幾十位僧人，佛教在印度衰微。","可是在這一千多年裡，一代又一代的祖師，在不同的時代把佛法帶離印度：往南渡海到獅子洲與南海諸國，成為上座部；越過雪山到吐蕃，成為藏傳；經過西域與海上絲路到中原，成為漢傳。佛法到了每一個地方，都長成了那裡自己的樣子。","你一世接一世轉生，有時一世會走過好幾幕。三十七幕都取材自史料記載的轉折。每一幕選一個選項，選項沒有對錯，只有你這一世的方向；前世的選擇，會在後來的某一世回來找你。如果你玩過一部曲，你在世尊身邊的那一生，也會在這裡留下回音。","上座部、藏傳、漢傳各依自己傳統的史料來寫，各家記載不同的地方兩說並列，不替任何一方下結論。「你」是虛構的，其他人物都有史料記載；較晚的傳記裡的神奇事蹟，會標明是傳說。畫面上的出處只引 CBETA、印順導師、聖嚴法師、星雲大師的著作與平川彰《印度佛教史》。","走完三十七幕，你會知道自己最接近哪一種思潮、你的法脈流向何方，以及哪幾位祖師大德和你最像。進度只存在你自己的瀏覽器裡。"],"volumes":[{"label":"卷一","title":"部派：百年之後","intro":"佛陀入滅了，他的話靠弟子們一代代背誦下來。可是時代在變，對戒律與法義的理解也開始不同；阿育王的時代，佛法第一次渡海南去。","first":1},{"label":"卷二","title":"般若與中觀","intro":"西元前後，一批講「般若波羅蜜」的新經典開始流傳；論師們一面整理部派的論書，一面有人說「一切法空」。同一時期，佛經第一次被譯成漢文。","first":8},{"label":"卷三","title":"佛性與心識","intro":"佛法越過葱嶺，在西域的綠洲城國落了地。印度本地的論師們，問的是另一些問題：如果一切皆空，眾生為什麼能成佛？心識是怎麼運作的？","first":14},{"label":"卷四","title":"渡海的人","intro":"五世紀起，求法的人與傳法的人，在印度、獅子洲、南海與漢地之間來來往往。印度本地，如來藏、因明與空有之爭，讓論辯越來越精密。","first":19},{"label":"卷五","title":"雪山與海路","intro":"七世紀起，佛法翻過雪山進入吐蕃。那爛陀興起了真言與灌頂的密法，傳法的人從陸路與海路，把它帶往東方。","first":26},{"label":"卷六","title":"最後的燈火","intro":"十一世紀，印度的大寺還在，雪域與南方的佛教，已經長成了自己的樣子。然後，火來了。","first":32}],"scenes":[{"n":1,"num":"一","title":"十事與分裂","era":"佛滅後約百年・毘舍離、華氏城","body":[{"h":"一百年前，你在王舍城看過一次結集：小小戒該捨哪些，大家說法不一，大迦葉說「佛所不制，不應妄制」。如今爭的，又是戒律能不能隨地變通。","kind":"宿緣","c":{"t":"xpick","p":1,"n":37,"k":null}},{"h":"這一世，你是毘舍離的一位比丘。這裡的跋闍子比丘們行「十事」，說這些都清淨、是佛所允許的，其中一件是：布薩日檀越布施的金銀，比丘可以收下來分。"},{"h":"長老耶舍迦那子從遠方來，看見了，當眾說：「沙門釋子不應受取金銀。」跋闍子比丘們很不高興，要他去向在家人賠罪。耶舍去了，卻向在家人說明比丘為什麼不該收金銀，在家人反而信了他。跋闍子比丘們更氣，要舉他的罪；耶舍便四處去找長老評理。最後七百位比丘在毘舍離集會，逐條評斷十事。"},{"h":"你見過僧團在拘舍彌吵到世尊獨自離開，也見過伽耶山的五百人被帶回來。那兩次都合回來了。","kind":"宿緣","c":{"t":"or","items":[{"t":"xpick","p":1,"n":22,"k":null},{"t":"xpick","p":1,"n":26,"k":null}]}}],"options":[{"k":"A","t":"我站在耶舍這邊。戒律是佛定的，不能因為方便就改。","s":{"上座":2},"f":"島"},{"k":"B","t":"時代不同了，有些規矩確實可以變通。我想聽聽跋闍子比丘怎麼說。","s":{"大眾":2},"f":"恆"},{"k":"C","t":"我不急著站邊。我要先把佛當年為什麼制這一條弄清楚。","s":{"有部":1,"經量":1},"f":"恆"},{"k":"D","t":"我只希望僧團不要分裂。不管結論是什麼，大家都要能留下來。","s":{"大眾":1,"如來藏":1},"f":"漢"}],"after":["四分律記載，七百比丘評定十事都不合法，這就是「第二次結集」。此後不久，僧團分成上座部與大眾部兩部。分裂的原因各家記載不同：上座部的史料說起於十事；說一切有部的《異部宗輪論》與《大毘婆沙論》則說起於大天提出的「五事」，地點在摩竭陀國的俱蘇摩城（華氏城）。兩說並列，學界至今沒有定論；平川彰認為十事才是根本分裂的原因，大天五事是把後來枝末分裂的事往前推了。"],"source":"<em>出處：《四分律》卷五十四〈七百集法毘尼〉（T22, 968c–971c）；《異部宗輪論》（T49, 15a–b）；《大毘婆沙論》卷九十九（T27）；元亨寺版《島王統史》；印順《印度佛教思想史》<\/em>","vol":0},{"n":2,"num":"二","title":"法敕","era":"約西元前 250 年・華氏城","body":[{"h":"阿育王統一了大半個印度。他在征服羯陵伽之後深深後悔，從此宣揚「法」，把勸人行善、不殺生、尊重各教的敕令刻在石柱與岩壁上，立遍全國。"},{"h":"你記得拘尸那羅城外那一天：七國的軍隊為了舍利對峙，香姓婆羅門把舍利平分成八份。如今，阿育王打開了那些塔。","kind":"宿緣","c":{"t":"xpick","p":1,"n":35,"k":null}},{"h":"《阿育王傳》說，國王取出阿闍世王所埋的舍利，又取出其他幾處所埋的舍利（只有羅摩村那一份由龍王守護，沒有取），造了八萬四千寶篋，分送各地建塔。上座部的傳統還說，這時目犍連子帝須在華氏城主持了第三次結集，並派出傳法者到四方。"},{"h":"這一世，你是華氏城寺院裡的比丘，國王的供養多得像河水一樣。"}],"options":[{"k":"A","t":"國王護法是好事，但僧團要和王宮保持距離。","s":{"上座":1,"有部":1},"f":"恆"},{"k":"B","t":"我要報名，跟著傳法者到遠方去。","s":{"上座":2},"f":"島"},{"k":"C","t":"國王把「法」刻在石頭上，我要把法刻在自己心上。我回林中修行。","s":{"經量":1,"大眾":1},"f":"恆"},{"k":"D","t":"八萬四千座塔，讓每個地方的人都能親近佛。我要去守其中一座。","s":{"大眾":1,"如來藏":1},"f":"漢"}],"after":["阿育王的石刻至今仍立在印度各地，是印度最早、可以確定年代的文字史料之一。第三次結集只見於上座部的傳統記載，北傳的史料沒有提到，學界看法不一。"],"source":"<em>出處：《阿育王傳》卷一（T50, 99c–102a）；印順《印度佛教思想史》（Y34, pp. 40a、43a）；《善見律毘婆沙》卷一至卷二（T24）；元亨寺版《阿育王刻文》；星雲〈轉輪聖王阿育王〉；平川彰《印度佛教史》<\/em>","vol":0},{"n":3,"num":"三","title":"芒果樹之問","era":"約西元前 247 年・獅子洲（斯里蘭卡）眉沙迦山","body":[{"h":"這一世還沒有結束。幾年後，你跟著長老摩哂陀出海了。摩哂陀是阿育王的兒子，受第三次結集之後的派遣，帶著幾位比丘來到獅子洲。"},{"h":"那天島上的國王天愛帝須正在山上打獵，追一頭鹿追到你們面前。摩哂陀叫住他。為了看看國王能不能聽懂法，摩哂陀問他：這棵是什麼樹？國王說是芒果樹。除了這棵，還有別的芒果樹嗎？有很多。除了這棵和那些，還有別的樹嗎？有很多不是芒果的樹。除了那些不是芒果的樹，還有嗎？國王說：還有這棵芒果樹。"},{"h":"摩哂陀知道，這位國王能聽懂法。"}],"options":[{"k":"A","t":"我在山下為隨行的人說法。國王聽懂了，百姓也要聽懂。","s":{"上座":2},"f":"島"},{"k":"B","t":"我想知道摩哂陀為什麼要這樣考國王。說法之前，要先懂得聽的人。","s":{"經量":1,"上座":1},"f":"島"},{"k":"C","t":"我會留在這座島上，一輩子不回去了。","s":{"上座":1,"大眾":1},"f":"島"},{"k":"D","t":"我要回華氏城報告：法已經渡過大海了。","s":{"有部":1,"上座":1},"f":"恆"}],"after":["上座部的史書記載，天愛帝須王當天就和隨從一起歸依三寶；不久，又把首都阿努拉德普勒的大雲林園布施給僧團，建了大寺。"],"source":"<em>出處：《善見律毘婆沙》卷二（T24）；元亨寺版《島王統史》《大王統史》；聖嚴《印度佛教史》；平川彰《印度佛教史》<\/em>","vol":0},{"n":4,"num":"四","title":"菩提樹的枝","era":"約西元前 245 年・阿努拉德普勒","body":[{"h":"你記得那摩提精舍外，大愛道和釋迦族的婦女赤著腳站在門口。那天，阿難替她們向世尊請求。","kind":"宿緣","c":{"t":"xpick","p":1,"n":14,"k":null}},{"h":"島上王族的婦女阿奴羅（各書或說是國王的妃子，或說是副王的妃子）和許多婦女想出家，可是比丘不能為女人授戒，要有比丘尼才行。摩哂陀請國王派人去華氏城，請他的妹妹僧伽蜜多比丘尼來。"},{"h":"僧伽蜜多帶著菩提伽耶那棵菩提樹的南枝，乘船渡海而來。樹枝種在阿努拉德普勒，她為王妃和婦女們授戒，島上有了比丘尼僧團。"},{"h":"這一世還沒有結束。你留在島上，看著她們等待受戒。"}],"options":[{"k":"A","t":"我去碼頭迎接僧伽蜜多。島上的女人，等這一天已經很久了。","s":{"上座":2},"f":"島"},{"k":"B","t":"我要照顧這棵樹。只要它活著，就提醒大家佛陀是在什麼樣的樹下成道的。","s":{"上座":1,"如來藏":1},"f":"島"},{"k":"C","t":"我請僧伽蜜多把比丘尼律好好傳下去，我幫忙安排。","s":{"上座":1,"有部":1},"f":"島"},{"k":"D","t":"我想知道，海的另一邊還有沒有等著出家的女人。","s":{"大眾":1,"上座":1},"f":"漢"}],"after":["阿努拉德普勒的那棵菩提樹，至今仍受人禮拜。島上的比丘尼僧團延續了一千多年；西元五世紀，還有獅子洲的比丘尼渡海到建康，為漢地的尼眾授戒。"],"source":"<em>出處：元亨寺版《島王統史》《大王統史》；《善見律毘婆沙》卷三（T24, 691b–692b）；《比丘尼傳》卷二〈僧果尼傳〉（T50, 939c）；聖嚴《印度佛教史》<\/em>","vol":0},{"n":5,"num":"五","title":"那先","era":"約西元前 2 世紀・印度西北舍竭國","body":[{"h":"舍竭國的國王彌蘭陀是希臘人，聰明好辯，常找各派的修行人來辯論，很少有人答得上來。"},{"h":"這一天，他遇見了比丘那先。國王問：你叫什麼名字？那先說：大家叫我那先，但這只是一個名字，裡面沒有一個「那先」。"},{"h":"國王笑了：那跟我說話的是誰？那先反問：大王是坐車來的嗎？車是什麼？是車軸嗎？是車輪嗎？是車轅嗎？都不是。那車在哪裡？國王答：是這些合在一起，才叫車。那先說：那先也是這樣。"},{"h":"這一世，你是國王的護衛，站在宮殿門口。"}],"options":[{"k":"A","t":"我想去找那先，問問那個「沒有」的我，怎麼修行。","s":{"上座":1,"經量":1},"f":"恆"},{"k":"B","t":"我把這段對話記下來。這比任何戰爭都值得留下。","s":{"有部":1,"上座":1},"f":"島"},{"k":"C","t":"國王輸了辯論，還很高興。我想學他這種輸得起的心。","s":{"大眾":1,"中觀":1},"f":"恆"},{"k":"D","t":"我想跟著那先出家。","s":{"上座":2},"f":"島"}],"after":["這段問答在漢譯稱為《那先比丘經》，在巴利稱為《彌蘭王問經》，兩者內容大致相同而詳略有別。車子的比喻，兩本也不一樣：巴利本是國王自己答出「合在一起才叫車」，漢譯本是國王默然不語，由那先說破。印順導師說，這部書南北共傳，而誦本不同。"],"source":"<em>出處：《那先比丘經》（T32, 694a–703c）；元亨寺版《彌蘭王問經》（N63, pp. 39a–44a）；印順《原始佛教聖典之集成》（Y35, p. 874a）；平川彰《印度佛教史》<\/em>","vol":0},{"n":6,"num":"六","title":"石欄上的前生","era":"約西元前 2 世紀末至前 1 世紀・中印度巴爾胡特與山奇的佛塔","body":[{"h":"你在世尊身邊時，只聽他說過這一生的事：三時殿、閻浮樹下、尼連禪河邊。如今塔上刻的，是他的前生。","kind":"宿緣","c":{"t":"or","items":[{"t":"xpick","p":1,"n":6,"k":null},{"t":"xpick","p":1,"n":7,"k":null}]}},{"h":"這一世，你是為佛塔雕刻石欄的工匠。"},{"h":"塔的欄楯與門上，刻滿了佛陀過去世的故事：他曾是猴王，用自己的身體搭成橋，讓猴群逃過河；曾是象王，把自己的象牙給了獵人；曾是一位把一切都布施出去的太子。這些故事叫做「本生」，在各部派之間流傳，後來上座部的巴利三藏把五百多則本生收在小部，名為《本生經》；漢地也譯出了《六度集經》等。"},{"h":"佛陀過去生中的「菩薩大行」，就是從這些故事流傳開來的。"}],"options":[{"k":"A","t":"這些故事是佛陀親口說的前生，我照經裡的樣子一刀一刀刻。","s":{"上座":2},"f":"島"},{"k":"B","t":"我不在乎它們是不是真的發生過，它們讓每個看見的人都想做好人。","s":{"大眾":1,"如來藏":1},"f":"漢"},{"k":"C","t":"佛陀能一世一世修過來，我也可以。我要發願，像他一樣行菩薩道。","s":{"中觀":1,"如來藏":1},"f":"漢"},{"k":"D","t":"我想知道，哪些故事最早，哪些是後來加的。","s":{"有部":1,"經量":1},"f":"恆"}],"after":["印順導師指出，佛陀入滅後，弟子們對佛的懷念，使「釋尊過去生中——菩薩的大行，也從『本生』、『譬喻』、『因緣』中流傳出來」，這成為後來大乘佛法興起的一個源頭。他也指出，巴爾胡特塔西元前二世紀的雕刻銘文中，對成佛以前的釋尊還沒有稱為「菩薩」，不過這只是沿用阿含的說法，不足以證明當時還沒有「菩薩」一詞。學者對本生與大乘起源的關係，看法不一。"],"source":"<em>出處：元亨寺版《本生經》（N31–N42）；《六度集經》（T03）；印順《初期大乘佛教之起源與開展》（Y37, pp. 114a、126a、130a）、《印度佛教思想史》自序（Y34, p. a2）；平川彰《印度佛教史》；聖嚴《印度佛教史》<\/em>","vol":0},{"n":7,"num":"七","title":"寫下三藏","era":"約西元前 1 世紀・獅子洲（傳說在阿盧寺）","body":[{"h":"這一世，你在獅子洲出家，負責背誦經典的一部分。三藏從來都是口口相傳：一群比丘背長部，一群背中部，代代相傳。"},{"h":"可是這些年島上饑荒、戰亂不斷，很多比丘餓死或離散。長老們擔心：再這樣下去，有些經典會沒有人記得了。"},{"h":"於是，比丘們第一次把巴利三藏（經、律、論）與注釋，一字一字寫在貝葉上。同一時期，國王建了無畏山寺，島上的僧團也分成了大寺與無畏山寺兩派。"}],"options":[{"k":"A","t":"該寫下來了。記憶會出錯，人會死，貝葉卻可以留很久。","s":{"上座":2},"f":"島"},{"k":"B","t":"我還是會背。寫下來的經，要有人懂才有用。","s":{"上座":1,"經量":1},"f":"島"},{"k":"C","t":"我想知道無畏山寺的比丘在想什麼。不同的看法，也許能讓法更活。","s":{"大眾":1,"中觀":1},"f":"島"},{"k":"D","t":"我要把一份抄本帶到海的另一邊。","s":{"上座":1,"大眾":1},"f":"漢"}],"after":["上座部的史書記載，這是在毘多伽摩尼王（元亨寺版譯作瓦達伽摩尼）時代的事；印順導師說，傳說地點在阿盧精舍。寫在貝葉上的巴利三藏，後來成為上座部傳承的根本，傳到緬甸、泰國、柬埔寨與寮國。"],"source":"<em>出處：元亨寺版《島王統史》《大王統史》（N65, pp. 132a、340a）；印順《印度佛教思想史》（Y34, p. 113a）、《初期大乘佛教之起源與開展》（Y37, p. 520a）；聖嚴《印度佛教史》；平川彰《印度佛教史》<\/em>","vol":0},{"n":8,"num":"八","title":"新來的經","era":"約西元前 1 世紀至 1 世紀・南印度與西北印度","body":[{"h":"你記得伽藍人說：每個沙門都說自己對、別人錯，我們該信誰？世尊說：「汝等自無淨智。」先看清自己心裡的貪、恚、癡。","kind":"宿緣","c":{"t":"xpick","p":1,"n":18,"k":null}},{"h":"這一世，你是一座精舍裡的比丘。有人帶來一部新的經，講「般若波羅蜜」：菩薩要學一切法空，不執著任何相，為了度一切眾生而修行。"},{"h":"精舍裡吵了起來。有的比丘說這是佛說的深法，以前只是沒有傳開；有的說這不在三藏裡，不能算佛說。"}],"options":[{"k":"A","t":"我要先讀，讀懂了再判斷。不讀就反對，和不讀就相信一樣。","s":{"中觀":1,"經量":1},"f":"恆"},{"k":"B","t":"三藏裡沒有的，我不接受。結集時大迦葉說過：佛所不制，不應妄制。","s":{"上座":1,"有部":1},"f":"島"},{"k":"C","t":"經裡說菩薩為一切眾生修行。這正是我想走的路。","s":{"中觀":2},"f":"漢"},{"k":"D","t":"我把它抄下來，帶給遠方的人，讓他們自己判斷。","s":{"大眾":1,"中觀":1},"f":"漢"}],"after":["這就是後來被稱為「初期大乘」的思想興起。大乘經典從哪裡來，各家說法不同：大乘傳統認為是佛說而後世才流傳；平川彰認為與在家信眾的佛塔信仰有關；印順導師則認為是佛弟子對佛的永恆懷念，加上部派中大眾系的思想，逐漸發展而成。最早的般若經典之一，就是後來在洛陽譯出的《道行般若經》。"],"source":"<em>出處：《道行般若經》（T08）；印順《初期大乘佛教之起源與開展》、《印度佛教思想史》自序（Y34）；聖嚴《印度佛教史》；平川彰《印度佛教史》<\/em>","vol":1},{"n":9,"num":"九","title":"馬鳴","era":"約 1–2 世紀・中天竺","body":[{"h":"這一世，你是中天竺一座寺院的年輕比丘。"},{"h":"寺裡有一位比丘，後來被人稱為馬鳴。他從前是外道的論師，聰明善辯，揚言比丘們若辯不過他，就不准敲犍椎集眾。後來一位從北天竺來、貌不驚人的老比丘「長老脇」接受了他的挑戰，在國王與大眾面前把他說服了。他從此出家，成了脇的弟子。"},{"h":"這一年，北天竺小月氏國的國王帶兵圍城，開口要三億金。中天竺王說：整個國家連一億金都湊不出來。月氏王說：你國內有兩件寶，一是佛鉢，二是這位善辯的比丘，給我就抵二億金。"},{"h":"國王捨不得。馬鳴卻勸國王：佛道本來就是要救度一切眾生的，度人不分遠近，「今弘宣佛道，自可為四海法王也」。國王聽了，把佛鉢和馬鳴都交了出去。"}],"options":[{"k":"A","t":"我跟著佛鉢和馬鳴去北天竺。法往哪裡去，我就往哪裡去。","s":{"大眾":1,"中觀":1},"f":"恆"},{"k":"B","t":"我想學他把道理寫成詩。有些話講不進人心裡，唱得進去。","s":{"大眾":1,"如來藏":1},"f":"島"},{"k":"C","t":"我留下來。佛鉢走了，寺裡的人還在，日子還要過。","s":{"上座":1,"有部":1},"f":"恆"},{"k":"D","t":"我想知道，那位不起眼的老比丘，到底說了什麼，讓一位外道論師心服口服。","s":{"有部":1,"經量":1},"f":"恆"}],"after":["《馬鳴菩薩傳》說，月氏王的大臣嫌一位比丘不值一億金。國王便把七匹馬餓了六天，在大眾聚會時請比丘說法，再把草放到馬前。馬聽法流淚，不肯吃草，從此人們稱他為「馬鳴」。馬鳴又把佛陀從王宮到雙林的一生寫成長詩，就是《佛所行讚》。五百多年後，義淨記載這部詩「五天南海無不諷誦」，從印度一路唱到了南海諸國。關於馬鳴，各書記載不一：《婆藪槃豆法師傳》說他曾為迦濕彌羅的《毘婆沙》潤文，印順導師認為這個傳說不可信；西藏傳說作《一百五十讚》的摩咥里制吒就是馬鳴，印順導師依義淨的記載，認為是兩個人。"],"source":"<em>出處：《馬鳴菩薩傳》（T50, 183a–184a）；《佛所行讚》（T04）；《南海寄歸內法傳》卷四（T54, 228a）；《婆藪槃豆法師傳》（T50, 189a）；印順《印度佛教思想史》（Y34, pp. 187a、204a–205a）；平川彰《印度佛教史》<\/em>","vol":1},{"n":10,"num":"十","title":"毘婆沙","era":"約 2 世紀・迦濕彌羅","body":[{"h":"這一世，你在北印度的迦濕彌羅出家，屬於說一切有部。"},{"h":"有部的論師們花了很多年，把阿毘達磨的種種問題逐條討論，各家論師的意見都記下來，再一一評斷，編成一部極大的論：《大毘婆沙論》（玄奘後來譯成兩百卷）。玄奘後來記下的傳說說，這次集論是迦膩色迦王護持的。"},{"h":"你被分配去整理其中幾卷。每一個法的定義、分類、因果，都要說得一清二楚。"}],"options":[{"k":"A","t":"我願意一輩子做這件事。把法分析清楚，修行才不會走錯路。","s":{"有部":2},"f":"恆"},{"k":"B","t":"分析得再細，也要回到修行。我每天抄完論，還要坐禪。","s":{"有部":1,"經量":1},"f":"恆"},{"k":"C","t":"有些論師說「三世實有」說得太過了。我比較相信經上本來的意思。","s":{"經量":2},"f":"恆"},{"k":"D","t":"這部論要是能傳到別的國家就好了。","s":{"有部":1,"大眾":1},"f":"漢"}],"after":["《大毘婆沙論》成為說一切有部教義的集大成。後來從有部分出、主張「以經為量」的一派，稱為經量部（印順《印度之佛教》語）。玄奘在七世紀把這部兩百卷的大論譯成漢文。"],"source":"<em>出處：《大毘婆沙論》（T27）；《大唐西域記》卷三〈迦濕彌羅國〉（T51, 886b–887a）；《異部宗輪論》（T49, 15b）；印順《印度之佛教》（Y33, p. 119a）、《印度佛教思想史》（Y34, p. 187a）、《說一切有部為主的論書與論師之研究》；平川彰《印度佛教史》<\/em>","vol":1},{"n":11,"num":"十一","title":"洛陽的譯者","era":"約 179 年・洛陽","body":[{"h":"東漢桓帝初年，一位從安息國來的僧人安世高到了洛陽。他原本是安息國的太子，把王位讓給叔父，出家修行。他譯出了講禪數、講五陰十二因緣的經典。"},{"h":"約二十年後，月支國的支婁迦讖也來到洛陽，譯出了《道行般若經》等大乘經典。"},{"h":"這一世，你是洛陽城裡一個識字的漢人，被請來當「筆受」，把譯師口述的意思寫成漢文。很多名詞，漢語裡根本沒有。"}],"options":[{"k":"A","t":"我讀安世高留下的譯本，學數息、觀五陰。先把心安下來。","s":{"上座":1,"有部":1},"f":"漢"},{"k":"B","t":"我跟著支婁迦讖，學「般若波羅蜜」。這是漢地從來沒聽過的道理。","s":{"中觀":2},"f":"漢"},{"k":"C","t":"我先把每一個新名詞抄成表，弄清楚它們到底是什麼意思。","s":{"有部":1,"經量":1},"f":"漢"},{"k":"D","t":"我把譯好的經帶回家鄉，讓更多人讀到。","s":{"大眾":1,"中觀":1},"f":"漢"}],"after":["安世高譯出了數十部講禪數的經典；支婁迦讖於光和二年（179）譯出《般若道行品經》。佛經從此有了漢文，但早期譯本文字艱澀。一百多年後，講經的人還要拿中國典籍裡的名目來比配佛經的名相，這就是「格義」。"],"source":"<em>出處：《出三藏記集》卷七〈道行經後記〉（T55, 47c）、卷十三〈安世高傳〉〈支讖傳〉（T55, 95a–96a）；《高僧傳》卷一（T50, 323a–324b）、卷四〈竺法雅傳〉（T50, 347a）；印順〈中國佛教史略〉（Y22）<\/em>","vol":1},{"n":12,"num":"十二","title":"緣起性空","era":"約 2 世紀末至 3 世紀初・南印度","body":[{"h":"這一世，你在南印度出家，先學了說一切有部的阿毘達磨，背得滾瓜爛熟。"},{"h":"有一位叫龍樹的論師，寫了一部《中論》。他說：「眾因緣生法，我說即是無，亦為是假名，亦是中道義。」這裡的「無」，梵文就是「空」，漢譯的注釋也直接說「我說即是空」。一切法都是因緣生的，所以沒有自性，所以是空；正因為空，才能有因緣、有生滅、有修行。"},{"h":"你讀了，心裡很亂。你花了好多年背的那些法相，龍樹說它們都沒有自性。"}],"options":[{"k":"A","t":"我願意重新學。如果龍樹說得對，我背的那些也不會白費，只是要換個方式看。","s":{"中觀":2},"f":"恆"},{"k":"B","t":"我還是相信阿毘達磨。不先把法說清楚，怎麼說空？","s":{"有部":2},"f":"恆"},{"k":"C","t":"我去找龍樹的弟子提婆，聽他和外道辯論。","s":{"中觀":1,"大眾":1},"f":"恆"},{"k":"D","t":"空與有，也許只是兩種說法。我想找出它們相通的地方。","s":{"中觀":1,"唯識":1},"f":"漢"}],"after":["龍樹被後世大乘各宗尊為祖師，漢傳稱他為「八宗共祖」。《提婆菩薩傳》說，他的弟子提婆以辯才破斥外道，後來被一位外道弟子所害。"],"source":"<em>出處：《中論》卷四〈觀四諦品〉（T30, 33b）；《龍樹菩薩傳》（T50, 184a–186c）；印順《印度佛教思想史》（Y34, p. 129a）、《中觀今論》（Y09, p. 2a）；星雲〈八宗共祖龍樹菩薩〉（《佛光教科書》第三冊）<\/em>","vol":1},{"n":13,"num":"十三","title":"以刀勝我","era":"約 3 世紀前半・南天竺","body":[{"h":"這一世還沒有結束。後來，你成了提婆的弟子。"},{"h":"提婆是南天竺的婆羅門，龍樹的弟子，博學善辯。傳說他只有一隻眼睛，人稱「迦那提婆」，意思是獨眼的提婆。他在王都立下三句論題：諸聖之中佛最第一，諸法之中佛法第一，救世之中佛僧第一。各方的論師來和他辯論，輸的人就剃髮出家，做他的弟子。"},{"h":"有一個外道的弟子，看著自己的老師被說服出家，心裡恨極了，咬著刀發誓：「汝以口勝伏我，我當以刀勝伏汝。」"},{"h":"提婆辯完了，帶著你們住進林中，寫下《百論》與《四百論》。這天，大家各自在樹下坐禪。提婆出定經行的時候，那個人衝了出來，一刀剖開了他的腹部。"},{"h":"提婆沒有叫人抓他，反而告訴他：我的三衣和鉢就在座位上，你拿去，趕快往山上跑，不要走大路，我的弟子們還沒有證得法忍，追上你會把你送官。"},{"h":"你和師兄弟們聽見聲音，從樹林裡奔了過來。有人哭喊，有人已經往路口追去。提婆對大家說：「慎無以狂追狂，以哀悲哀也。」不要用瘋狂去追瘋狂，不要用悲哀去加重悲哀。"}],"options":[{"k":"A","t":"我停下腳步。師父最後教的，就是這一句。","s":{"中觀":2},"f":"恆"},{"k":"B","t":"我還是追了出去。可是追到半路，我想起師父的話，停了下來。","s":{"大眾":1,"中觀":1},"f":"恆"},{"k":"C","t":"我留在師父身邊，把《百論》一字一字抄好。","s":{"中觀":1,"有部":1},"f":"漢"},{"k":"D","t":"我想找到那個人。不是報仇，是想問他：現在心裡好過一點了嗎？","s":{"如來藏":1,"大眾":1},"f":"恆"}],"after":["《提婆菩薩傳》記下了他臨終的話：受苦的「實自無主」，加害的「實自無人」，誰親誰怨、誰害誰，都是顛倒所見。挖眼、天神現身等情節屬於傳說。《百論》後來由鳩摩羅什譯成漢文，與龍樹的《中論》《十二門論》合稱「三論」；《四百論》的後半，由玄奘譯為《廣百論》。提婆的出身各說不同：《提婆菩薩傳》說他是南天竺人；印順導師則說他是錫蘭人，從犢子部出家，後來到南印度從龍樹學。印順導師也指出，留傳下來的提婆事蹟，主要是到處破斥各種執見，最後為外道所殺。"],"source":"<em>出處：《提婆菩薩傳》（T50, 186c–188a）；《百論》（T30）；《廣百論本》（T30）；印順《印度佛教思想史》（Y34, p. 147a）；平川彰《印度佛教史》<\/em>","vol":1},{"n":14,"num":"十四","title":"西行求經","era":"260–282 年・于闐","body":[{"h":"這一世，你是洛陽的一位漢人比丘。你的同學朱士行講《道行般若經》，常常講到一半就講不下去：譯本文字不全，前後意思接不起來。"},{"h":"他說：我要自己去西方找原本。曹魏甘露五年，他從雍州出發，越過流沙，到了于闐，在那裡找到了九十章的般若梵本。"},{"h":"他派弟子把經本送回洛陽。可是于闐有一群學者向國王說：這是外道的書，不能讓它流出去，會讓漢地的人走錯路。"}],"options":[{"k":"A","t":"我跟著弟子護送經本，再遠也要送到洛陽。","s":{"中觀":2},"f":"漢"},{"k":"B","t":"我留在于闐陪朱士行。他年紀大了，需要有人照顧。","s":{"大眾":1,"如來藏":1},"f":"漢"},{"k":"C","t":"我去和于闐的學者談。他們反對，總有他們的理由。","s":{"有部":1,"經量":1},"f":"恆"},{"k":"D","t":"我在于闐學梵文，以後自己翻譯。","s":{"中觀":1,"有部":1},"f":"漢"}],"after":["《出三藏記集》記載，朱士行以經投火，誓言若是佛法就不會燒毀，結果經本完好。經本終於送到洛陽，譯出了《放光般若經》。朱士行自己留在于闐，八十歲在那裡去世。他常被稱為漢地西行求法的先驅；義淨則推崇法顯「創闢荒途」。"],"source":"<em>出處：《出三藏記集》卷七〈放光經記〉（T55, 47c）、卷十三〈朱士行傳〉（T55, 97a–b）；《高僧傳》卷四〈朱士行傳〉（T50, 346b–c）；《大唐西域求法高僧傳》序（T51, 1a）<\/em>","vol":2},{"n":15,"num":"十五","title":"從有到空","era":"約 4 世紀中・龜茲與沙勒","body":[{"h":"這一世，你在西域的龜茲國出家，和一位少年同學一起學說一切有部的論典。他叫鳩摩羅什。他的父親鳩摩炎是天竺人，家世代代做國相，本來要繼承相位，卻辭去出家，越過葱嶺東來，龜茲王親自出城迎接，請他做國師，還把妹妹嫁給了他。羅什七歲就跟著母親出家，記性好得驚人。"},{"h":"後來他隨母親到沙勒，遇見了莎車的王子須利耶蘇摩。須利耶蘇摩專學大乘，對他說：一切法都是空的。鳩摩羅什起初不信，兩人往復辯論了很久，他終於信服，嘆道：我從前所學，就像不認識金子的人，把黃銅當成寶貝。"},{"h":"你記得南印度那一世，第一次讀到「眾因緣生法，我說即是空」時心裡的亂。如今羅什要走的，是你走過的路。","kind":"宿緣","c":{"t":"or","items":[{"t":"pick","n":12,"k":["A"]},{"t":"pick","n":12,"k":["C"]}]}}],"options":[{"k":"A","t":"我跟他一起轉學大乘。","s":{"中觀":2},"f":"漢"},{"k":"B","t":"我留在有部。不同的路，總要有人守著。","s":{"有部":2},"f":"恆"},{"k":"C","t":"我想知道須利耶蘇摩到底說了什麼，讓羅什改變。","s":{"中觀":1,"經量":1},"f":"恆"},{"k":"D","t":"他將來一定會去很遠的地方。我要跟著他。","s":{"中觀":1,"大眾":1},"f":"漢"}],"after":["數十年後，前秦的大將呂光攻下龜茲，把鳩摩羅什帶到涼州，滯留了十多年。後秦姚興迎他到長安，他譯出《中論》《百論》《十二門論》與大批大乘經典，那是三部曲的故事了。羅什遇見須利耶蘇摩的時地，《出三藏記集》說是回到龜茲以後，兩說並列。"],"source":"<em>出處：《出三藏記集》卷十四〈鳩摩羅什傳〉（T55, 100a–c）；《高僧傳》卷二〈鳩摩羅什傳〉（T50, 330a–332a）；印順《印度佛教思想史》（Y34, p. 119a）<\/em>","vol":2},{"n":16,"num":"十六","title":"一切眾生悉有佛性","era":"約 4 世紀末・中印度","body":[{"h":"這一世，你在中印度出家。這時流傳著一批新的經典：《勝鬘經》說眾生身中本有「如來藏」，被煩惱遮住了；《大般涅槃經》說「一切眾生悉有佛性」。"},{"h":"精舍裡又吵了起來。有人問：那麼斷盡善根的一闡提呢？也能成佛嗎？有的經本說不能，有的說能。"}],"options":[{"k":"A","t":"我相信人人都有佛性。否則修行有什麼意義？","s":{"如來藏":2},"f":"漢"},{"k":"B","t":"說「本有」，會不會讓人以為有一個不變的我？我要小心。","s":{"中觀":1,"經量":1},"f":"恆"},{"k":"C","t":"一闡提能不能成佛，我不急著下結論。我先照顧好眼前每一個人。","s":{"如來藏":1,"大眾":1},"f":"漢"},{"k":"D","t":"如來藏和般若的空，也許說的是同一件事的兩面。","s":{"如來藏":1,"唯識":1},"f":"雪"}],"after":["如來藏思想後來對漢傳與藏傳都影響很深。印順導師把它歸入「真常唯心」一系，並指出它與梵我思想表面相似，要特別小心分辨；其他學者與傳統則有不同理解。法顯帶回的《大般泥洹經》說一闡提不能成佛，後來在建康引起道生的爭論，那是三部曲的故事。"],"source":"<em>出處：《大般涅槃經》（南本）卷八〈如來性品〉（T12, 648b）；《勝鬘經》〈如來藏章〉〈法身章〉（T12, 221b–c）；《究竟一乘寶性論》（T31）；印順《如來藏之研究》（Y39, 自序）；聖嚴《印度佛教史》；平川彰《印度佛教史》<\/em>","vol":2},{"n":17,"num":"十七","title":"夜裡的說法堂","era":"約 4 世紀末・阿踰陀國","body":[{"h":"這一世還沒有結束。後來，你到了阿踰陀城西南的菴沒羅林。"},{"h":"林中寺院裡有一位法師無著，北印度健馱邏國人。他出家後修禪定，雖然離了欲，卻怎麼也想不通「空」的道理，苦惱到想要了結自己的生命。一位阿羅漢為他講空觀，他入了門，心裡還是不安。"},{"h":"傳記說，後來他以神通上兜率天，向彌勒菩薩請教大乘的道理，回來講給大家聽，卻很少有人相信。他便發願請彌勒下來親自說法。"},{"h":"於是，一連四個月，每到夜裡，說法堂裡就誦出一部《十七地經》，也就是後來的《瑜伽師地論》。大家同在一堂，只有無著能靠近，其他人只能遠遠地聽。到了白天，無著再把夜裡聽到的，一段一段解釋給大家。"},{"h":"《大唐西域記》也記下了這座林子：無著「夜昇天宮」，從彌勒受《瑜伽師地論》等論，「晝為大眾講宣妙理」。"},{"h":"你坐在說法堂的最後面。"}],"options":[{"k":"A","t":"夜裡聽不清楚，白天我就把無著講的，一句一句記下來。","s":{"唯識":2},"f":"恆"},{"k":"B","t":"我不在乎是在天上說的，還是在人間說的。說得通、做得到，就是好法。","s":{"經量":1,"唯識":1},"f":"漢"},{"k":"C","t":"我想先跟他學禪定。他是在定中想不通，才一路問到天上去的。","s":{"唯識":1,"上座":1},"f":"雪"},{"k":"D","t":"他曾經苦惱到不想活。我想知道，他是怎麼走出來的。","s":{"如來藏":1,"唯識":1},"f":"恆"}],"after":["無著被尊為瑜伽行派（唯識學派）的開創者。《瑜伽師地論》後來由玄奘譯成一百卷，藏傳也奉為根本論典。無著從彌勒受論的事，漢傳與藏傳都有記載；彌勒是兜率天的菩薩，還是一位人間的論師，學界看法不一。無著最初在哪一部出家，各書也不同：《婆藪槃豆法師傳》說是說一切有部，《大唐西域記》說是化地部（彌沙塞部）。"],"source":"<em>出處：《婆藪槃豆法師傳》（T50, 188c）；《大唐西域記》卷五〈阿踰陀國〉（T51, 896b）；印順《印度佛教思想史》（Y34, pp. 241a、243a）；星雲〈唯識家無著大師〉（《佛光教科書》第三冊）；平川彰《印度佛教史》<\/em>","vol":2},{"n":18,"num":"十八","title":"舌頭","era":"約 4–5 世紀・阿踰陀國與丈夫國","body":[{"h":"這一世還沒有結束。你在阿踰陀的有部講堂，和一位叫世親的比丘一起學論。世親是無著的弟弟。"},{"h":"世親聰明絕頂。他為大眾講《大毘婆沙論》，每講完一天，就寫一首偈總結當天的內容，刻在赤銅葉上，掛在醉象的頭下，擊鼓宣告：誰能破這首偈，就站出來。這樣寫了六百多首，沒有人能破，這就是《俱舍論》的偈。後來他又為偈寫了解釋，遇到有部說法偏頗的地方，就用經量部的道理來破。"},{"h":"那時他還不信大乘，說大乘不是佛說的。一天，住在丈夫國的哥哥派人來說：「我今疾篤，汝可急來。」世親趕到，問哥哥生了什麼病。無著說：我心裡有重病，是因你而生的——你毀謗大乘，將來要墮惡道，我愁得命都快保不住了。"},{"h":"世親請哥哥為他講大乘。聽懂之後，他悔恨自己從前的毀謗，說：「我昔由舌故生毀謗，今當割舌以謝此罪。」"},{"h":"無著說：你就算割掉一千條舌頭，也滅不了這個罪。「汝舌能善以毀謗大乘，汝若欲滅此罪，當善以解說大乘。」"}],"options":[{"k":"A","t":"我跟著世親轉學大乘。","s":{"唯識":2},"f":"恆"},{"k":"B","t":"我還是留在有部。《俱舍論》已經說得很好了。","s":{"有部":1,"經量":1},"f":"恆"},{"k":"C","t":"一個人能在最得意的時候承認自己錯了，這比任何論都難。我要學他這一點。","s":{"唯識":1,"如來藏":1},"f":"漢"},{"k":"D","t":"我想知道他接下來要怎麼解說大乘：識是什麼？心是怎麼變現出一切的？","s":{"唯識":1,"經量":1},"f":"雪"}],"after":["無著去世後，世親造了許多大乘論，包括唯識的論典；後世以《唯識三十頌》《唯識二十論》說明一切都是「識」所變現，講八識與阿賴耶識。傳記說，天竺與邊地學習佛法的人，都以他的論為學習的根本。無著、世親兄弟被尊為瑜伽行派的祖師。《大唐西域記》的記載不同：世親是在阿踰陀附近，聽到無著的弟子夜誦《十地經》而感悟，要斷舌謝罪，無著說「昔以舌毀大乘，今以舌讚大乘」。印順導師也指出，傳中說世親早年已建大乘寺，與毀謗大乘、割舌謝罪前後矛盾。學界對世親的年代，甚至寫《俱舍論》的世親與唯識的世親是否同一人，看法也不同。各說並列。"],"source":"<em>出處：《婆藪槃豆法師傳》（T50, 190b–191a）；《大唐西域記》卷五〈阿踰陀國〉（T51, 896c–897a）；印順《印度佛教思想史》（Y34, pp. 241a、243a、247a）；星雲〈千部論師世親菩薩〉（《佛光教科書》第三冊）；平川彰《印度佛教史》<\/em>","vol":2},{"n":19,"num":"十九","title":"扇子","era":"410–412 年・獅子洲與耶婆提","body":[{"h":"這一世還沒有結束。晚年，你渡海到了獅子洲，住在無畏山寺。寺裡來了一位漢地的老比丘法顯。他上了年紀才從長安出發，越過沙漠與雪山，走遍印度，現在要從海路回國。"},{"h":"有一天，你看見他站在一尊青玉佛像前，忽然流下淚來。佛像旁有一把商人供養的白絹扇，是從他的故鄉晉地來的。他離開漢地已經很多年了，同行的人有的死在路上，有的留在印度，只剩下他一個人。"},{"h":"他在這裡住了兩年，又求得《彌沙塞律》《長阿含》《雜阿含》與《雜藏》，都是漢地還沒有的。現在，他帶著在巴連弗邑得到的《摩訶僧祇律》《大般泥洹經》，和這些經律一起，搭上了商人的大船。"}],"options":[{"k":"A","t":"我跟他一起上船。總要有人幫他看著這些經。","s":{"大眾":1,"如來藏":1},"f":"漢"},{"k":"B","t":"我送他一部獅子洲的經律，讓漢地也知道上座部的傳承。","s":{"上座":2},"f":"島"},{"k":"C","t":"我陪他坐一會兒。那把扇子讓他想家，我什麼都不說，只是陪著。","s":{"如來藏":1,"上座":1},"f":"島"},{"k":"D","t":"我想知道，他走了這麼遠，最想帶回去的是什麼。","s":{"大眾":1,"經量":1},"f":"漢"}],"after":["《高僧法顯傳》記載，船在海上遇到大風，漏水，商人們把貨物丟下海，法顯怕他們把經像也丟掉，一心念觀世音。船漂到耶婆提國，停了五個月，再搭船往廣州，又遇風暴，最後在青州的長廣郡上岸。他帶回的《大般泥洹經》在建康譯出。"],"source":"<em>出處：《高僧法顯傳》（T51, 857a–866c）；《高僧傳》卷三〈法顯傳〉（T50, 337b–338b）；《出三藏記集》卷十五〈法顯傳〉（T55, 111b–112b）<\/em>","vol":3},{"n":20,"num":"二十","title":"闍婆的國王","era":"約 420 年代・闍婆國（一般認為在今印尼爪哇一帶）","body":[{"h":"你記得世尊坐在路旁那棵沒有枝葉的枯樹下，擋在流離王的大軍前面。他擋了兩次，第三次沒有再去。","kind":"宿緣","c":{"t":"xpick","p":1,"n":28,"k":null}},{"h":"這一世，你是闍婆國王宮裡的小侍童，才十來歲。"},{"h":"從罽賓來了一位法師，名叫求那跋摩，意思是「功德鎧」。他出身罽賓王族，三十歲那年罽賓王去世，沒有子嗣，群臣再三請他還俗繼位，他不肯，獨自躲進山林。後來他到了獅子洲，又搭船來到這裡。"},{"h":"傳記說，他到達的前一夜，王太后夢見一位修行人乘船飛進國中；第二天，跋摩果然來了。太后從他受了五戒，又勸國王也受戒。"},{"h":"這一天，鄰國的軍隊打過來了。國王問跋摩：「若與鬪戰，傷殺必多；如其不拒，危亡將至。」我該怎麼辦？"},{"h":"跋摩說：「暴寇相攻，宜須禦捍，但當起慈悲心，勿興害念耳。」"}],"options":[{"k":"A","t":"我求國王讓我跟著上戰場。守住國家，但不讓自己的心生恨。","s":{"大眾":1,"上座":1},"f":"島"},{"k":"B","t":"我留在宮裡，和太后一起受五戒。","s":{"上座":1,"如來藏":1},"f":"島"},{"k":"C","t":"我想問跋摩：刀已經拿在手上了，真的能不生害念嗎？","s":{"經量":1,"中觀":1},"f":"島"},{"k":"D","t":"我想跟著這位法師，看他下一站要把法帶到哪裡。","s":{"有部":1,"上座":1},"f":"漢"}],"after":["《高僧傳》記載，兩軍才一交鋒，來犯的軍隊就退了。國王後來想出家，群臣苦苦挽留，國王便提出三個願望才肯留下治國：境內都奉跋摩為師、全國斷殺、把國庫的儲財拿來救濟貧病。群臣答應了，「一國皆從受戒」。跋摩的名聲傳到漢地，宋文帝派人迎請，他在元嘉八年（431）到了建康，同年在那裡去世。闍婆國的確切位置，學界有爪哇、蘇門答臘等不同看法。"],"source":"<em>出處：《高僧傳》卷三〈求那跋摩傳〉（T50, 340a–342b）；《出三藏記集》卷十四〈求那跋摩傳〉（T55, 104b 起）<\/em>","vol":3},{"n":21,"num":"二十一","title":"清淨道","era":"約 430 年前後・阿努拉德普勒大寺","body":[{"h":"這一世還沒有結束。長大以後，你搭船到了獅子洲，在阿努拉德普勒大寺出家。有一位從印度來的學僧覺音（元亨寺版譯作佛音），想把島上用僧伽羅文寫的注釋，譯回巴利語，讓各國的比丘都能讀。"},{"h":"《小王統史》記載，大寺的長老們先拿兩首偈考他。他寫出了一部《清淨道論》，把戒、定、慧三學說得有條有理。長老們讀了，把所有的注釋都交給他。"}],"options":[{"k":"A","t":"我做他的助手，幫他找每一段注釋的出處。","s":{"上座":2},"f":"島"},{"k":"B","t":"我要把《清淨道論》裡的禪修方法一個一個試過。","s":{"上座":1,"經量":1},"f":"島"},{"k":"C","t":"大寺的傳承要守住，但無畏山寺的看法我也想聽聽。","s":{"上座":1,"大眾":1},"f":"島"},{"k":"D","t":"這些巴利注釋，應該傳到更遠的地方去。","s":{"上座":1,"有部":1},"f":"漢"}],"after":["《清淨道論》成為上座部最重要的論書之一，至今仍是上座部禪修與教理的根本依據。覺音整理的巴利注釋，奠定了大寺派的教學傳統。覺音的出身，有印度婆羅門、南印度人、緬甸人等不同說法。《小王統史》還說，天人曾把他寫好的書藏起來考驗他，這屬於傳說；這部史書成於覺音之後數百年。"],"source":"<em>出處：元亨寺版《清淨道論》（N67–N69）、《小王統史》第三十七章（N66, pp. 12a–14a）；聖嚴《印度佛教史》<\/em>","vol":3},{"n":22,"num":"二十二","title":"不同外道","era":"約 5 世紀中・印度","body":[{"h":"這一世，你是一座精舍裡講經的比丘。"},{"h":"精舍裡在讀一部經，叫《楞伽經》；印順導師認為，它大約在四世紀末集成。經裡有一段問答，讓精舍裡吵了好幾天。"},{"h":"大慧菩薩問佛：經上說「如來藏自性清淨」，在一切眾生身中，像一顆被髒衣服包著的寶珠，常住不變。這聽起來，和外道說的「我」有什麼不同？「云何世尊同外道說我，言有如來藏耶？」"},{"h":"佛回答：「我說如來藏，不同外道所說之我。」有時候說空、無相、無願、法身、涅槃，也就是說如來藏；說如來藏，是為了讓害怕「無我」的人不再害怕，也為了引導執著有我的外道，讓他們離開錯誤的我見。"},{"h":"這部經還把如來藏和瑜伽行者講的阿賴耶識放在一起，稱為「如來藏識藏」。"},{"h":"年輕的比丘們來問你：那我們心裡，到底有沒有一個不變的東西？"}],"options":[{"k":"A","t":"說如來藏是方便，是讓怕「無我」的人敢走進門來。","s":{"中觀":1,"如來藏":1},"f":"漢"},{"k":"B","t":"眾生的心本來清淨，只是被塵垢蓋住了。我相信這一點。","s":{"如來藏":2},"f":"漢"},{"k":"C","t":"如來藏和阿賴耶識怎麼合得起來？我要把它想清楚。","s":{"唯識":1,"如來藏":1},"f":"雪"},{"k":"D","t":"這部經自己說：「當依於義，莫著言說。」我不爭名相，只看它讓人往哪裡走。","s":{"經量":1,"中觀":1},"f":"恆"}],"after":["《楞伽經》在元嘉二十年（443）由求那跋陀羅譯成四卷。後來菩提達摩把這部四卷《楞伽》交給弟子慧可，說：「我觀漢地，惟有此經，仁者依行，自得度世。」印順導師指出，大約在四世紀末，論師把當時流行的如來藏經典整理成《究竟一乘寶性論》；他也詳細討論了《楞伽經》怎樣把如來藏和阿賴耶識連在一起。如來藏與阿賴耶識的關係，後來各宗各派說法不一，這裡並列不評。"],"source":"<em>出處：《楞伽阿跋多羅寶經》卷一、卷二、卷四（T16, 489a–b, 510b–c）；《究竟一乘寶性論》（T31）；《續高僧傳》卷十六（T50, 552b）；印順《如來藏之研究》（Y39, pp. 6a, 8a, 237a–242a）；平川彰《印度佛教史》<\/em>","vol":3},{"n":23,"num":"二十三","title":"東方的邊隅","era":"約 5 世紀後半・南天竺的海港","body":[{"h":"這一世還沒有結束。後來，你南下到了南天竺的海港，住在一座寺院裡。"},{"h":"寺裡住著一位禪師，菩提達摩。他是南天竺的婆羅門出身，「志存大乘，冥心虛寂」，對禪定之學尤其精通。"},{"h":"往東方去的商船，從這裡出發。《續高僧傳》說他「悲此邊隅，以法相導」：他悲憫遠方的邊地，要親自去那裡，用佛法引導人。"},{"h":"他教人的方法很簡單。一是「理入」：「深信含生同一真性」，一切眾生本來同一個真性，只是被外來的塵垢遮住了；所以要安心「壁觀」，不分自他、凡聖。二是「行入」：遇到苦，知道是自己過去種下的，不怨；遇到樂，知道是因緣聚合，不喜；什麼都不貪求；一切行為都和法相應。"},{"h":"船明天就要開了。"}],"options":[{"k":"A","t":"我跟他上船。東方那麼大，總要有人坐下來，教人安心。","s":{"如來藏":1,"大眾":1},"f":"漢"},{"k":"B","t":"我留在南天竺。要安心，不必到哪裡去，這裡也坐得下。","s":{"上座":1,"如來藏":1},"f":"恆"},{"k":"C","t":"我想先問他：「同一真性」，和外道說的那個「我」，有什麼不同？","s":{"中觀":1,"經量":1},"f":"恆"},{"k":"D","t":"我送他一部經，讓他帶在路上。","s":{"如來藏":1,"唯識":1},"f":"漢"}],"after":["《續高僧傳》說，達摩先到了劉宋境內的南越，後來又北上到北魏，隨處教人禪法。當時北方盛行講經，很多人聽到他的禪法就批評他，只有道育、慧可等少數人跟隨他。他把四卷《楞伽經》交給慧可，「自言年一百五十餘歲」，最後不知所終。後來的禪宗尊他為初祖。面壁九年、與梁武帝對答、隻履西歸等著名故事，多出自較晚的禪宗典籍，屬於傳說；《洛陽伽藍記》則說他是波斯國人，各說並列。"],"source":"<em>出處：《續高僧傳》卷十六〈菩提達摩傳〉（T50, 551b–c）、〈慧可傳〉（T50, 552b）；《洛陽伽藍記》卷一（T51）；印順《中國禪宗史》第一章（Y40, pp. 3a–8a）<\/em>","vol":3},{"n":24,"num":"二十四","title":"孤山","era":"約 5–6 世紀・案達羅國瓶耆羅城外的孤山","body":[{"h":"這一世，你跟著陳那住在山上。"},{"h":"陳那覺得，佛教講道理用的「因明」，說得太深、太散，學的人花了力氣也學不成。他躲進山崖裡靜坐，想清楚該怎麼把它寫得又精簡、又周全。"},{"h":"《大唐西域記》記載了這座山的傳說：那天山谷震動，雲氣變色，山神讚歎陳那要重新弘揚因明。國王看見山上放出光明，以為他已經入了金剛定，便請他趕快證得阿羅漢果。"},{"h":"陳那說：「吾入定觀察，欲釋深經，心期正覺，非願無生果也。」我入定是為了解釋經論，心裡想的是成佛，不是只求自己解脫。可是國王一再勸請，他也動了心，正要答應。"},{"h":"這時文殊菩薩彈了一下手指，提醒他：你本來發的是度一切眾生的大願，怎麼要放下別人，只顧自己呢？應該把彌勒的《瑜伽師地論》廣傳出去，引導後來的人。"},{"h":"陳那接受了。他回到因明，問的是一個最根本的問題：我們怎麼知道一件事是真的？靠親眼所見的「現量」，和依道理推知的「比量」。"}],"options":[{"k":"A","t":"我要學因明。講任何道理之前，先問自己：我是怎麼知道的？","s":{"經量":1,"唯識":1},"f":"恆"},{"k":"B","t":"國王的話也有道理。先讓自己解脫，有什麼不對？","s":{"上座":1,"有部":1},"f":"島"},{"k":"C","t":"我記住那一彈指：學問再好，也要回到度人。","s":{"唯識":1,"如來藏":1},"f":"漢"},{"k":"D","t":"辯論的勝負不重要，重要的是兩邊都說得出自己的根據。","s":{"經量":1,"中觀":1},"f":"雪"}],"after":["陳那被尊為新因明的開創者，後來的法稱繼續發展，成為印度佛教後期最重要的「量論」。這一門學問傳入吐蕃，在藏傳寺院裡特別受重視；漢地則由玄奘、義淨譯出陳那的《因明正理門論》。義淨從印度回程時，在南海寫下《南海寄歸內法傳》，說他在印度見到的法師「曉因明論則思擬陳那」。山神、文殊彈指等情節屬於傳說。"],"source":"<em>出處：《大唐西域記》卷十〈案達羅國〉（T51, 930b–c）；《因明正理門論》（T32）；《南海寄歸內法傳》卷四（T54, 229c）；印順《印度佛教思想史》（Y34, pp. 324a–325a）、《印度之佛教》（Y33, p. 233a）；平川彰《印度佛教史》<\/em>","vol":3},{"n":25,"num":"二十五","title":"空與有","era":"約 6 世紀・南印度與摩揭陀","body":[{"h":"這一世還沒有結束。晚年，你回到南印度，跟隨中觀論師清辨學法。清辨聽說摩揭陀國的唯識論師護法正在弘法，學徒數千，想當面和他討論空與有的問題。"},{"h":"他走到波吒釐城，聽說護法在菩提樹那裡。清辨發過願：要等到能證得佛果時，才去見菩提樹。於是他派你帶話前去。護法回話說：「人世如幻，身命若浮，渴日勤誠，未遑談議。」書信往返了幾次，兩人終究沒有見面。"},{"h":"後來玄奘到那爛陀時，那裡已有數千位學僧，是五印度最大的學府。中觀與唯識的辯論，就在那裡一代一代延續。"}],"options":[{"k":"A","t":"我要替清辨把他的書信送到護法手上。","s":{"中觀":1,"唯識":1},"f":"恆"},{"k":"B","t":"我站在清辨這邊：空才是究竟的。","s":{"中觀":2},"f":"恆"},{"k":"C","t":"護法說得也有道理：與其辯論，不如修行。","s":{"唯識":2},"f":"恆"},{"k":"D","t":"我想去那爛陀，兩邊都聽聽。","s":{"中觀":1,"唯識":1},"f":"雪"}],"after":["玄奘在《大唐西域記》記下了清辨想見護法的事。印順導師在《印度之佛教》中，把這一時期稱為空有之爭。一百年後，玄奘本人也在那爛陀遇上了同樣的爭論，那是三部曲的故事了。"],"source":"<em>出處：《大唐西域記》卷十〈馱那羯磔迦國〉（T51, 930c–931a）；印順《印度之佛教》（Y33, pp. 287a–289a）、《印度佛教思想史》（Y34, pp. 324a、327a）<\/em>","vol":3},{"n":26,"num":"二十六","title":"兩位公主","era":"約 641 年・拉薩","body":[{"h":"這一世，你是護送佛像的人。"},{"h":"吐蕃的贊普松贊干布統一了高原，向唐朝求婚。唐太宗把宗室女文成公主嫁給他，她從長安走了幾千里路來到拉薩；藏傳的史書說，她帶來了佛像、經典與工匠。"},{"h":"藏傳的史書還記載，松贊干布也迎娶了尼泊爾的尺尊公主，她同樣帶來了佛像。兩位公主各自建了佛寺，供奉帶來的佛像。"}],"options":[{"k":"A","t":"佛像要有人照顧，也要有人說明它是誰、為什麼值得禮拜。我留在拉薩。","s":{"中觀":1,"密乘":1},"f":"雪"},{"k":"B","t":"我要記住這條路。以後會有更多經典沿著它上來。","s":{"大眾":1,"中觀":1},"f":"雪"},{"k":"C","t":"兩位公主來自不同的地方，帶來的佛像卻一樣莊嚴。我想看看兩邊的寺院。","s":{"如來藏":1,"中觀":1},"f":"雪"},{"k":"D","t":"我送完佛像就回長安。","s":{"大眾":1,"如來藏":1},"f":"漢"}],"after":["漢文史書記載了文成公主入藏的事；尺尊公主與兩位公主帶佛像入藏的事，見於藏文史料，屬傳統記載。這時的吐蕃還沒有出家人，佛法正式扎根，要再等一百多年。"],"source":"<em>出處：聖嚴《西藏佛教史》<\/em>","vol":4},{"n":27,"num":"二十七","title":"傳國的寶珠","era":"約 7 世紀後半・那爛陀","body":[{"h":"這一世，你是那爛陀的學僧。"},{"h":"那爛陀是五印度最大的學府，中觀、瑜伽、因明在這裡都有大師。這些年，寺裡又多了一種新的修法：持誦真言、結手印、觀想本尊、在曼荼羅中受灌頂。印順導師稱它為「秘密大乘」。"},{"h":"《宋高僧傳》記載，有一位叫善無畏的人來到寺裡。他是烏荼國的王子，十三歲繼位，兄長們起兵爭位，他打贏了，卻把王位讓給兄長，自己出家。母親捨不得，偷偷給了他一顆傳國的寶珠。"},{"h":"到了那爛陀，他把這顆寶珠嵌在大佛像的額頭上，「晝如月魄，夜若曦輪」。"},{"h":"寺裡有一位達摩掬多，「掌定門之祕鑰，佩如來之密印」。善無畏拜他為師，從他受了總持、瑜伽與三密之法，當天就受了灌頂。多年以後，掬多對他說：「善男子，汝與震旦有緣，今可行矣。」"},{"h":"善無畏要動身了。他要從陸路往北，經迦濕彌羅、烏萇，越過雪山，出吐蕃，往東方的大唐去。"}],"options":[{"k":"A","t":"我留下來，跟達摩掬多學真言與印契。","s":{"密乘":2},"f":"恆"},{"k":"B","t":"我跟善無畏東行。路很長，總要有人替他背經。","s":{"密乘":1,"如來藏":1},"f":"漢"},{"k":"C","t":"我還是在那爛陀讀《中論》與《瑜伽》。經論的基礎打好了，再學密法。","s":{"中觀":1,"唯識":1},"f":"恆"},{"k":"D","t":"我想知道，一位捨下王位的人，為什麼要把傳國的寶珠留在佛像上。","s":{"如來藏":1,"大眾":1},"f":"恆"}],"after":["《宋高僧傳》記載，善無畏在開元四年（716）帶著梵本到達長安，這時他已年事很高。後來他與一行禪師譯出《大毘盧遮那成佛神變加持經》（《大日經》），和稍後從海路來的金剛智、不空，後世合稱「開元三大士」。《宋高僧傳》寫成於十世紀，書中記載了許多神異事蹟，屬於傳說。印順導師指出，「秘密大乘」攝取了中觀與瑜伽，繼承如來藏說，從信仰與修行中發展完成；藏傳與漢傳的密教傳統，對它各有自己的理解。"],"source":"<em>出處：《宋高僧傳》卷二〈善無畏傳〉（T50, 714b–716a）；《大毘盧遮那成佛神變加持經》（T18）；印順《印度佛教思想史》自序（Y34, p. a6）、第十章（Y34, p. 389a）；平川彰《印度佛教史》<\/em>","vol":4},{"n":28,"num":"二十八","title":"東印度的海口","era":"約 685 年・耽摩立底","body":[{"h":"你記得須提那犯戒那天，世尊第一次為比丘們立戒，說了十個理由，最後一個是「正法得久住」。","kind":"宿緣","c":{"t":"xpick","p":1,"n":12,"k":null}},{"h":"這一世還沒有結束。後來，你到了耽摩立底，住在一座寺院裡。這裡是「東印度之海口」，往南海、往漢地的船，都從這裡出發。"},{"h":"十多年前，一位漢地的僧人義淨從廣州搭船，經過室利佛逝，在咸亨四年（673）二月八日到了這裡。他在這裡一直住到五月，才跟著商旅往西去。看了這裡的僧人怎麼過日子，他說自己在漢地時以為很懂律，到了這裡才發現：「昔在神州自言明律，寧知到此反作迷人。向若不移步西方，何能鑒斯正則！」"},{"h":"後來他在那爛陀住了十年。他說，他在印度跟過的法師們，「曉因明論則思擬陳那，味瑜伽宗實罄懷無著，談空則巧符龍猛」。"},{"h":"現在他回來了，帶著幾十萬頌的梵本，要從這裡上船，經室利佛逝回漢地。他寫道，親近這些法師，是「想傳燈之一望」。"},{"h":"你在碼頭邊幫他把經夾搬上船。"}],"options":[{"k":"A","t":"我跟他上船。到了室利佛逝，還要有人幫他抄經。","s":{"有部":1,"唯識":1},"f":"島"},{"k":"B","t":"我把寺裡的規矩一條一條講給他聽，讓他寫下來帶回漢地。","s":{"有部":2},"f":"漢"},{"k":"C","t":"我留在耽摩立底。往來的人，總要有個地方學梵語、等季風。","s":{"有部":1,"大眾":1},"f":"恆"},{"k":"D","t":"我想問他：律，是要照天竺的樣子做，還是要隨漢地的需要改？","s":{"經量":1,"大眾":1},"f":"漢"}],"after":["義淨在室利佛逝住了好幾年，寫成《南海寄歸內法傳》與《大唐西域求法高僧傳》，託人送回漢地。證聖元年（695）他回到洛陽，武則天親自到上東門外迎接。他帶回梵本經律論近四百部，後來譯出許多經律，特別是根本說一切有部的律典。他在《求法高僧傳》裡，也記下了許多從漢地、交州出發，死在海上或印度的求法僧。"],"source":"<em>出處：《南海寄歸內法傳》卷二、卷四（T54, 213c, 229c, 233b）；《大唐西域求法高僧傳》（T51）；《宋高僧傳》卷一〈義淨傳〉（T50, 710b）<\/em>","vol":4},{"n":29,"num":"二十九","title":"航向廣州","era":"約 8 世紀初（719 年抵達）・獅子洲、室利佛逝、廣州","body":[{"h":"這一世，你在一艘從獅子洲往東開的商船上。"},{"h":"船上有一位南天竺摩賴耶國來的大師，金剛智。他十六歲出家，跟著師父到那爛陀學經論，遍聽各部的律；又到西印度學瑜伽、三密與陀羅尼，十幾年間通達三藏。後來他到了獅子洲，登上楞伽山。"},{"h":"他聽說東方的「脂那」佛法興盛，決定渡海過去。《宋高僧傳》說，他「東行佛誓、裸人等二十餘國」，因為海上多難，走了好幾年才到。"}],"options":[{"k":"A","t":"海上多難，我先護住那些經本。","s":{"密乘":2},"f":"漢"},{"k":"B","t":"我照顧金剛智大師。走了這麼多年，他也累了。","s":{"密乘":1,"如來藏":1},"f":"漢"},{"k":"C","t":"我在室利佛逝下船。這條海路，中途也要有人接應。","s":{"上座":1,"密乘":1},"f":"島"},{"k":"D","t":"我想跟他學陀羅尼。他學過經論，也學過密法，我想知道兩者怎麼合在一起。","s":{"密乘":1,"中觀":1},"f":"漢"}],"after":["開元七年（719），金剛智到了廣州，後來在長安、洛陽建立灌頂道場，傳授密法。《宋高僧傳》說，北天竺婆羅門出身的不空，幼年隨叔父來到東方，十五歲時拜金剛智為師。金剛智去世後，不空遵照師命，又從海路回到獅子洲求取密教經論。金剛智去世的年代，《宋高僧傳》作開元二十年（732），《貞元錄》作開元二十九年（741），兩說並列。他們與善無畏在唐朝弘傳的密法，後世稱為唐密，那是三部曲的故事了。"],"source":"<em>出處：《宋高僧傳》卷一〈金剛智傳〉〈不空傳〉（T50, 711b–714a）；《貞元新定釋教目錄》卷十四（T55, 875a）<\/em>","vol":4},{"n":30,"num":"三十","title":"桑耶","era":"約 8 世紀後半・吐蕃山南桑耶","body":[{"h":"這一世，你生在吐蕃。"},{"h":"贊普赤松德贊想在吐蕃弘揚佛法，從印度迎請了那爛陀的大學者寂護。寂護是中觀的論師，也精通瑜伽行派的學說，他把那爛陀的經論與戒律一起帶上了雪域。"},{"h":"藏文史書記載，寂護到了吐蕃，遇到了許多阻力。他向贊普推薦了一位以修持密法聞名的大師：從烏仗那（今巴基斯坦北部斯瓦特河谷一帶）來的蓮花生大士。"},{"h":"後來，他們在山南建了桑耶寺，這是吐蕃第一座有出家僧團的寺院。寂護為七位吐蕃人剃度、授戒，他們是第一批出家的吐蕃人。"}],"options":[{"k":"A","t":"我要成為第一批出家的吐蕃人。","s":{"中觀":1,"唯識":1},"f":"雪"},{"k":"B","t":"我跟隨蓮花生大士修行。","s":{"密乘":2},"f":"雪"},{"k":"C","t":"我跟著寂護學經論。佛法要有人懂，才能傳下去。","s":{"中觀":2},"f":"雪"},{"k":"D","t":"我想學梵文，把經典譯成我們的文字。","s":{"中觀":1,"有部":1},"f":"雪"}],"after":["桑耶寺的建立，被視為吐蕃佛教「前弘期」的高峰。藏傳佛教尊蓮花生大士為「第二佛」，寧瑪派奉他為祖師；他降伏神魔等神奇事蹟，多出自後世的伏藏傳記，屬於傳說。寂護入藏的年代與蓮花戒何時入藏，說法不一：印順導師記寂護在 747 年應請入藏，與弟子蓮華戒同行；藏文史料則說蓮花戒是後來才入藏的，兩說並列。"],"source":"<em>出處：聖嚴《西藏佛教史》；印順《印度佛教思想史》（Y34, pp. 376a、411a）；平川彰《印度佛教史》<\/em>","vol":4},{"n":31,"num":"三十一","title":"頓與漸","era":"約 792–794 年・桑耶","body":[{"h":"六十年前，你在滑臺的無遮大會上，聽神會說只有「頓悟」才是達摩的正宗，北宗「法門是漸」。如今翻過雪山來到吐蕃的摩訶衍，卻是神秀弟子的門下，也以頓悟為宗。","kind":"宿緣","c":{"t":"xpick","p":3,"n":19,"k":null}},{"h":"這一世還沒有結束。你已經是桑耶寺的僧人。漢地的禪師摩訶衍在吐蕃傳禪，教人不起思惟、不作觀察，頓悟本性，很多吐蕃人跟他學。寂護的弟子蓮花戒從印度來，主張要循序漸修，以智慧觀察，才能證悟。"},{"h":"兩派的爭論越來越激烈，贊普召集雙方，當面辯論。"}],"options":[{"k":"A","t":"我跟著摩訶衍。心本清淨，直下就是。","s":{"如來藏":2},"f":"漢"},{"k":"B","t":"我跟著蓮花戒。沒有觀察，怎麼知道自己悟的是不是真的？","s":{"中觀":2},"f":"雪"},{"k":"C","t":"我兩位師父都跟過。頓與漸，也許只是起點不同。","s":{"中觀":1,"如來藏":1},"f":"雪"},{"k":"D","t":"我把雙方的論點都記下來，留給後人判斷。","s":{"中觀":1,"唯識":1},"f":"恆"}],"after":["這場論辯的勝負，兩邊的史料說法相反：藏文史料《拔協》等說蓮花戒獲勝，摩訶衍返回漢地；敦煌出土的漢文寫本《頓悟大乘正理決》則說摩訶衍獲勝。此後吐蕃佛教以印度的漸修傳統為主。兩說並列。蓮花戒的《修習次第》至今仍是藏傳佛教重要的禪修論典。"],"source":"<em>出處：聖嚴《西藏佛教史》；印順《中國禪宗史》（Y40, p. 313a）；平川彰《印度佛教史》<\/em>","vol":4},{"n":32,"num":"三十二","title":"師徒","era":"約 10 世紀末至 11 世紀初・那爛陀與孟加拉","body":[{"h":"這一世，你是那爛陀的學僧，跟隨一位名滿天下的學者那洛巴。後來的傳記說他是那爛陀的大論師；印順導師則記他是超岩寺（超戒寺）「六賢門」之一，守寺的北門。"},{"h":"有一天，那洛巴忽然離開了那爛陀。他說，他要去找一位叫帝洛巴的瑜伽士為師。後來的傳記說，帝洛巴對他百般考驗，他經歷了十二次大苦，才得到傳承。"}],"options":[{"k":"A","t":"我跟著他去找帝洛巴。","s":{"密乘":2},"f":"恆"},{"k":"B","t":"我留在那爛陀。經論的傳承也需要有人守。","s":{"中觀":1,"唯識":1},"f":"恆"},{"k":"C","t":"一個學者肯放下一切去拜師，我想知道他在找什麼。","s":{"密乘":1,"如來藏":1},"f":"雪"},{"k":"D","t":"我把他留下的論著整理好，帶到雪域去。","s":{"密乘":1,"中觀":1},"f":"雪"}],"after":["那洛巴的傳承經馬爾巴傳入西藏，成為噶舉派的源頭。帝洛巴、那洛巴的種種考驗故事，出自噶舉派較晚的傳記，屬於傳說。印度後期佛教，密乘的修行特別重視師徒傳承。"],"source":"<em>出處：印順《印度之佛教》（Y33, p. 317a）、《印度佛教思想史》（Y34, pp. 390a、392a）；聖嚴《西藏佛教史》<\/em>","vol":5},{"n":33,"num":"三十三","title":"菩提道燈","era":"1042 年・阿里古格","body":[{"h":"你記得那爛陀的經藏，記得那洛巴離開的那一天。那一世你走得早。如今那爛陀與超戒寺的學者，又要翻過雪山了。","kind":"宿緣","c":{"t":"or","items":[{"t":"pick","n":32,"k":["B"]},{"t":"pick","n":32,"k":["D"]}]}},{"h":"這一世，你是超戒寺的學僧，跟隨大學者阿底峽。西藏阿里的古格王一再派人來迎請，阿底峽終於答應，帶著你們翻過喜馬拉雅山。"},{"h":"在古格，他寫了一部《菩提道燈論》，把顯教與密教、從皈依到成佛的修行次第，說得清清楚楚。"},{"h":"他的西藏弟子仲敦巴，後來開創了噶當派。"}],"options":[{"k":"A","t":"我留在西藏，幫他教導弟子。","s":{"中觀":1,"密乘":1},"f":"雪"},{"k":"B","t":"我要把《菩提道燈論》背熟，照著次第一步一步修。","s":{"中觀":2},"f":"雪"},{"k":"C","t":"我回超戒寺。印度的寺院也需要有人。","s":{"中觀":1,"唯識":1},"f":"恆"},{"k":"D","t":"我跟著仲敦巴，去建一座新的道場。","s":{"中觀":1,"密乘":1},"f":"雪"}],"after":["阿底峽在西藏住了十多年，在聶塘去世。《菩提道燈論》開啟了藏傳佛教的「道次第」傳統，三百多年後宗喀巴的《菩提道次第廣論》就是依此寫成。阿底峽入藏的年代，藏傳史書作 1042 年，印順導師作 1026 年，兩說並列。"],"source":"<em>出處：聖嚴《西藏佛教史》；印順《印度佛教思想史》（Y34, p. 411a）、《印度之佛教》（Y33, p. 317a）<\/em>","vol":5},{"n":34,"num":"三十四","title":"蒲甘","era":"約 1057 年・緬甸蒲甘","body":[{"h":"這一世，你是蒲甘王國的一個少年。國王阿奴律陀受一位上座部比丘信阿羅漢的教導，皈依了上座部佛教。"},{"h":"信阿羅漢說，南方的直通國有完整的三藏與持戒的比丘。阿奴律陀派人去求，直通國王不肯給。阿奴律陀發兵攻下直通，把三藏、比丘與工匠都帶回蒲甘。"},{"h":"上座部從此在緬甸立足。"}],"options":[{"k":"A","t":"經典是用戰爭換來的。我心裡很不安，要好好讀它，才對得起那些死去的人。","s":{"上座":2},"f":"島"},{"k":"B","t":"我跟著信阿羅漢出家。","s":{"上座":2},"f":"島"},{"k":"C","t":"我去當刻經的工匠，讓這些經典不再被搶走。","s":{"上座":1,"有部":1},"f":"島"},{"k":"D","t":"我想去獅子洲，看看這些經典最初是從哪裡來的。","s":{"上座":1,"大眾":1},"f":"島"}],"after":["這件事主要見於緬甸的傳統王統史，屬傳統記載，細節學界仍有討論。蒲甘王朝後來建造了數千座佛塔，至今仍立在伊洛瓦底江畔。"],"source":"<em>出處：聖嚴《印度佛教史》；平川彰《印度佛教史》<\/em>","vol":5},{"n":35,"num":"三十五","title":"十萬歌","era":"約 11 世紀末至 12 世紀初・洛扎與拉齊雪山","body":[{"h":"這一世，你是住在雪山腳下的獵人。"},{"h":"山洞裡住著一位苦行者，叫密勒日巴。聽說他年輕時為了替母親報仇，學咒術害死了很多人，後來悔恨不已，去找譯師馬爾巴求法。馬爾巴讓他一個人蓋房子、拆房子，蓋了又拆，拆了又蓋，吃盡苦頭，才把法傳給他。"},{"h":"如今他在山洞裡修行。傳記說，他只吃蕁麻，身體都綠了。他用唱歌的方式說法，留下了很多道歌。"}],"options":[{"k":"A","t":"我放下弓箭，跟他學。","s":{"密乘":2},"f":"雪"},{"k":"B","t":"我常送食物給他，聽他唱歌。","s":{"密乘":1,"如來藏":1},"f":"雪"},{"k":"C","t":"一個殺過很多人的人，也能成就。我相信人可以改變。","s":{"如來藏":1,"密乘":1},"f":"雪"},{"k":"D","t":"我把他的歌記下來，讓更多人聽到。","s":{"密乘":1,"中觀":1},"f":"雪"}],"after":["密勒日巴的弟子岡波巴融合了噶當派的教法與密勒日巴的大手印，噶舉派由此成形。密勒日巴的生平主要見於後世的《密勒日巴尊者傳》與《十萬歌集》，傳記中的神奇情節屬於傳說。"],"source":"<em>出處：聖嚴《西藏佛教史》<\/em>","vol":5},{"n":36,"num":"三十六","title":"統一僧團","era":"1165 年・獅子洲波隆納魯瓦","body":[{"h":"這一世，你是獅子洲的比丘。島上的僧團分成大寺、無畏山寺、祇多林寺三派，彼此不和，戒律也鬆弛了。"},{"h":"國王波羅迦摩巴忽一世召集三派，在大寺長老的主持下整頓僧團，統一以大寺的傳承為準。"},{"h":"你屬於被整併的那一派。"}],"options":[{"k":"A","t":"我接受整併。僧團和合，比我們這一派的名字重要。","s":{"上座":2},"f":"島"},{"k":"B","t":"我心裡不服，但我會守好戒律，讓大家看到我們這一派也是清淨的。","s":{"上座":1,"大眾":1},"f":"島"},{"k":"C","t":"我把我們這一派的論書整理好，就算不再用，也要留下來。","s":{"上座":1,"經量":1},"f":"島"},{"k":"D","t":"我去緬甸。那裡的比丘想來獅子洲受戒，需要有人帶路。","s":{"上座":2},"f":"島"}],"after":["統一後的獅子洲大寺傳承，後來傳向緬甸、泰國等地，成為今日東南亞上座部的主流。"],"source":"<em>出處：元亨寺版《小王統史》第七十八章（N66, pp. 320a–321a）；聖嚴《印度佛教史》<\/em>","vol":5},{"n":37,"num":"三十七","title":"火中的寺","era":"約 1200 年前後・超戒寺與那爛陀","body":[{"h":"你記得七葉窟裡，五百位比丘一句一句把世尊的話誦出來。那時候，佛的話還沒有寫在任何東西上，只在人的心裡。","kind":"宿緣","c":{"t":"xpick","p":1,"n":37,"k":null}},{"h":"這一世，你是超戒寺的學僧。超戒寺是波羅王朝的達磨波羅王所建，印順導師譯作超岩寺，後來成為印度佛教後期的重鎮；阿底峽就是從這裡翻過雪山的。"},{"h":"佛陀入滅已經一千六、七百年了。這些年，北方來的軍隊一次又一次攻入恆河流域，寺院被燒，僧人被殺或逃散。如今，歐丹多富梨寺和超戒寺先後被毀；印順導師記載，連那爛陀也只剩下七十多人。"},{"h":"可是這盞燈，早就不只在這裡了。一千多年來，摩哂陀渡海到了獅子洲，求那跋摩到了闍婆，義淨與金剛智走上了海上的路，羅什、達摩、善無畏去了東方，寂護、蓮花生、阿底峽翻過了雪山。"},{"h":"你只能帶幾部經走。這是這一生最後一個選擇。"}],"options":[{"k":"A","t":"我往北，翻過雪山，把經帶到雪域。","s":{"密乘":1,"中觀":1},"f":"雪"},{"k":"B","t":"我往南渡海，去獅子洲。那裡的比丘，還在誦巴利三藏。","s":{"上座":2},"f":"島"},{"k":"C","t":"我留下來，在廢墟裡教還願意聽的人。","s":{"如來藏":1,"唯識":1},"f":"恆"},{"k":"D","t":"我帶最少的經，背最多的經。書會燒掉，記在心裡的燒不掉。","s":{"有部":1,"經量":1},"f":"恆"},{"k":"E","t":"我往東，去那個把經譯了一千年的地方。","s":{"大眾":1,"如來藏":1},"f":"漢"}],"after":["超戒寺與那爛陀被毀，常被視為佛教在印度衰亡的象徵。學界也指出，衰微的原因不只一個：印度教的復興、佛教與印度教的相互融合、寺院經濟依賴王室，以及外來的軍事破壞。佛教在印度本地，要到二十世紀才重新興起；而在獅子洲與東南亞、雪域、西域與漢地，它早已長成了各自的樣子。漢地這一道的一千五百年，是三部曲的故事。"],"source":"<em>出處：印順《印度之佛教》第十七章第四節〈印度佛教之衰亡〉（Y33, p. 326a）、《印度佛教思想史》（Y34, pp. 391a–392a）；聖嚴《印度佛教史》；平川彰《印度佛教史》<\/em>","vol":5}],"schools":{"上座":{"tag":"守住最早的傳承","text":"上座部（分別說系）重視佛陀親說的經律，以巴利三藏與覺音的注釋為依據，從獅子洲傳到東南亞。你常選擇守住傳承、照經律行事（第 1、7、21、36 幕）。你的長處是穩重可靠；要提醒自己的是，守住傳承，是為了讓它活下去，不是讓它凍結。","modern":""},"有部":{"tag":"把法分析清楚","text":"說一切有部以阿毘達磨著稱，《大毘婆沙論》把每一個法的定義與因果都說得一清二楚；義淨帶回漢地的，也是這一部的律（第 10、28 幕）。你常想先把概念弄清楚，再談修行。你的長處是嚴謹；要提醒自己的是，分析是為了解脫，不是為了分析本身。","modern":""},"經量":{"tag":"以經為量","text":"經量部從有部分出，主張以佛說的經為準，不全依論師的論；陳那的因明，也總是先問「你怎麼知道」（第 10、18、24 幕）。你常想回到經典本來的意思。你的長處是獨立思考；要提醒自己的是，質疑別人之後，也要質疑自己。","modern":""},"大眾":{"tag":"隨順時代與眾生","text":"大眾部在根本分裂時與上座部分開，對戒律與佛陀觀都較寬，後來與大乘思想的興起有密切關係。你常選擇體諒變通、照顧眾人（第 1、6、9 幕）。你的長處是包容；要提醒自己的是，變通之前，先弄清楚什麼不能變。","modern":""},"中觀":{"tag":"緣起性空","text":"龍樹說「眾因緣生法，我說即是空」，一切法因緣生，所以沒有自性；提婆、清辨把這條路走了下去（第 8、12、13、25 幕）。你常願意放下執著，重新看事情。你的長處是不被概念綁住；要提醒自己的是，空不是什麼都沒有，正因為空，才要好好對待每一個因緣。","modern":""},"唯識":{"tag":"觀察心識","text":"無著、世親的瑜伽行派，探討心識的結構，說一切都是識所變現，講八識與阿賴耶識（第 17、18、24 幕）。你常想弄清楚自己的心是怎麼運作的。你的長處是細膩；要提醒自己的是，看清了心的運作，還要讓它真的轉變。","modern":""},"如來藏":{"tag":"一切眾生悉有佛性","text":"如來藏思想說，眾生本有成佛的可能，被煩惱遮住了；《楞伽經》又把它和阿賴耶識連在一起，菩提達摩把這部經帶到了東方（第 16、22、23 幕）。你常相信每個人都能變好。你的長處是給人希望；要提醒自己的是，「本有」不是一個不變的我，修行仍然要一步一步來。","modern":""},"密乘":{"tag":"重視師承與實修","text":"印度後期的密乘重視師徒傳承、真言、手印、灌頂與身心的實修，經善無畏、金剛智傳到漢地，經寂護、蓮花生、阿底峽、那洛巴的傳承進入雪域（第 27、29、30、32 幕）。你常願意跟隨一位老師，全心投入。你的長處是專注；要提醒自己的是，師承是為了修行，也要以經論檢驗。","modern":""}},"fates":{"島":{"name":"獅子洲與金地","text":"你的法脈往南流去，渡海到獅子洲，再到闍婆、室利佛逝、緬甸與東南亞各地。在這一道，巴利三藏與戒律的傳承最受重視，後來成為今日的上座部；幾度衰微，又從彼此之間接了回來（第 3、20、36 幕）。"},"雪":{"name":"雪域","text":"你的法脈越過喜馬拉雅山，到了吐蕃。這一道保存了大量印度後期的經論、因明與密法，從寂護、蓮花生，到阿底峽、密勒日巴，在雪域裡開出了寧瑪、噶當、噶舉、薩迦等宗派（第 30、33、35 幕）。"},"漢":{"name":"漢地","text":"你的法脈經過西域與海上絲路東來，到了漢地。從安世高、支婁迦讖、鳩摩羅什，到法顯、菩提達摩、義淨、善無畏、金剛智，一代代譯者與禪師把經典與修法帶到東方，後來在漢地開出八宗，那是三部曲的故事（第 11、23、28 幕）。"},"恆":{"name":"恆河兩岸","text":"你的法脈留在佛陀出生的土地上。印度本地的部派、般若、中觀、唯識、如來藏與密乘，在那爛陀與超戒寺達到高峰，又在十二、十三世紀之交衰微。燈火熄了，燈卻早已傳了出去（第 25、32、37 幕）。"}},"combosLead":"","combos":{},"roles":{},"rolesLead":[],"mix":{},"masters":[{"name":"摩哂陀","s":{"上座":3,"大眾":1},"f":{"島":2},"k":[[3,"A"],[3,"C"]],"bal":false,"text":"阿育王的兒子，出家後受派渡海到獅子洲，以一棵芒果樹的問答考驗國王，把佛法帶進了這座島。你像他：你願意把法帶到很遠的地方，也懂得先看清楚聽的人。他會提醒你：說法之前，先問一個好問題。","id":"阿育王的兒子，出家後受派渡海到獅子洲，以一棵芒果樹的問答考驗國王，把佛法帶進了這座島。","era":"約前 3 世紀","yrs":"生卒年不詳","b":-0.0594},{"name":"僧伽蜜多","s":{"上座":3,"如來藏":1},"f":{"島":2},"k":[[4,"A"],[4,"B"]],"bal":false,"text":"阿育王的女兒、摩哂陀的妹妹，帶著菩提樹的南枝渡海，為獅子洲的婦女授戒，建立了島上的比丘尼僧團。你像她：你願意為了別人能走上修行的路，親自走一趟遠路。她會提醒你：一棵樹要種下去，還要有人一代代照顧。","id":"阿育王的女兒、摩哂陀的妹妹，帶著菩提樹的南枝渡海，為獅子洲的婦女授戒，建立了島上的比丘尼僧團。","era":"約前 3 世紀","yrs":"生卒年不詳","b":-0.0897},{"name":"那先","s":{"上座":2,"經量":1,"中觀":1},"f":{"恆":1,"島":1},"k":[[5,"A"],[5,"D"]],"bal":false,"text":"以車子的比喻回答希臘國王彌蘭陀，說明「我」只是假名。漢譯《那先比丘經》與巴利《彌蘭王問經》都記下了這段問答。你像他：你擅長用簡單的比喻說深的道理。他會提醒你：辯論的目的是讓對方看清楚，不是讓自己贏。","id":"以車子的比喻回答希臘國王彌蘭陀，說明「我」只是假名。","era":"約前 2 世紀","yrs":"生卒年不詳","b":-0.0732},{"name":"馬鳴","s":{"大眾":2,"如來藏":1,"中觀":1},"f":{"恆":1,"島":1},"k":[[9,"A"],[9,"B"]],"bal":false,"text":"從外道論師成為佛弟子，被中天竺王當作「一億金」交給月氏王，又把佛陀的一生寫成長詩《佛所行讚》，從五天竺一路唱到南海。你像他：你知道道理有時要用歌，才唱得進人心。他會提醒你：美的文字，是為了讓人更接近真。","id":"從外道論師成為佛弟子，被中天竺王當作「一億金」交給月氏王，又把佛陀的一生寫成長詩《佛所行讚》，從五天竺一路唱到南海。","era":"約 1–2 世紀","yrs":"生卒年不詳","b":0.12},{"name":"世友","s":{"有部":3,"經量":1},"f":{"恆":2},"k":[[10,"A"],[1,"C"]],"bal":false,"text":"說一切有部的大論師，傳說是《大毘婆沙論》的重要評家，《異部宗輪論》也題為他所作。你像他：你喜歡把問題分析透徹，也願意把不同的說法一一記下。他會提醒你：記下別人的說法，是對真理的尊重。","id":"說一切有部的大論師，傳說是《大毘婆沙論》的重要評家，《異部宗輪論》也題為他所作。","era":"約 1–2 世紀","yrs":"生卒年不詳","b":-0.12},{"name":"童受（鳩摩邏多）","s":{"經量":3,"有部":1},"f":{"恆":2},"k":[[10,"C"],[8,"A"]],"bal":false,"text":"《大唐西域記》說他是「經部本師」，經量部的開創者。你像他：你相信經典勝過權威，願意從頭思考。他會提醒你：以經為量，也要讀懂經。","id":"《大唐西域記》說他是「經部本師」，經量部的開創者。","era":"約 2–3 世紀","yrs":"生卒年不詳","b":-0.12},{"name":"龍樹","s":{"中觀":3,"大眾":1},"f":{"恆":1,"漢":1},"k":[[12,"A"],[8,"C"]],"bal":false,"text":"中觀學派的開創者，作《中論》，說「眾因緣生法，我說即是空」。漢傳尊他為「八宗共祖」，藏傳也奉他為根本論師。你像他：你能看穿概念背後的執著。他會提醒你：空不是否定一切，是讓一切能夠成立。","id":"中觀學派的開創者，作《中論》，說「眾因緣生法，我說即是空」。","era":"約 2–3 世紀","yrs":"生卒年不詳","b":0.0338},{"name":"提婆","s /p><h4>學界有爭議或屬傳說的內容<\/h4><div class=\"tblwrap\"><table><tr><th>幕<\/th><th>爭議點<\/th><th>說明<\/th><\/tr><tr><td>1<\/td><td>根本分裂的原因與地點<\/td><td>上座部史料說起於十事；說一切有部的《異部宗輪論》《大毘婆沙論》說起於大天五事，地點在俱蘇摩城。兩說並列。<\/td><\/tr><tr><td>2–4<\/td><td>阿育王與摩哂陀入島的年代<\/td><td>依佛滅年代的不同推算，前後相差可達百年；這裡採常見的約前三世紀中葉。<\/td><\/tr><tr><td>2<\/td><td>第三次結集<\/td><td>只見於上座部傳統，北傳史料沒有記載。<\/td><\/tr><tr><td>6<\/td><td>本生與大乘的關係<\/td><td>印順導師、平川彰等學者都指出本生故事與菩薩思想的關係，但對大乘起源的看法不同。<\/td><\/tr><tr><td>8<\/td><td>大乘經典的起源<\/td><td>大乘傳統、平川彰的佛塔起源說、印順導師的看法各有不同，並列不評。<\/td><\/tr><tr><td>9<\/td><td>馬鳴的事蹟<\/td><td>各書記載不一；《婆藪槃豆法師傳》說他為《毘婆沙》潤文，印順導師認為不可信；作《一百五十讚》的摩咥里制吒是否就是馬鳴，也有兩說。<\/td><\/tr><tr><td>13<\/td><td>提婆的出身<\/td><td>《提婆菩薩傳》說是南天竺人，另有傳說是錫蘭人；挖眼、天神現身屬傳說。<\/td><\/tr><tr><td>17–18<\/td><td>彌勒與無著、世親<\/td><td>彌勒是兜率天菩薩還是人間論師，世親是一人或二人，學界看法不一。無著出家的部派，兩部傳記記載不同。<\/td><\/tr><tr><td>20<\/td><td>闍婆國的位置<\/td><td>一般認為在爪哇，也有蘇門答臘等說。<\/td><\/tr><tr><td>23<\/td><td>菩提達摩的出身與事蹟<\/td><td>《續高僧傳》說是南天竺人，《洛陽伽藍記》說是波斯國人；面壁九年、隻履西歸等出自較晚的禪宗典籍。<\/td><\/tr><tr><td>24<\/td><td>陳那的傳說<\/td><td>山神、文殊彈指等情節出自《大唐西域記》所記的傳說。<\/td><\/tr><tr><td>26<\/td><td>尺尊公主<\/td><td>見於藏文史料，漢文史料沒有記載。<\/td><\/tr><tr><td>27、29<\/td><td>善無畏、金剛智的事蹟<\/td><td>《宋高僧傳》所記多有神異，屬傳說。金剛智的出身、出家年歲與卒年，《宋高僧傳》與《貞元錄》記載不同。<\/td><\/tr><tr><td>30<\/td><td>蓮花生大士的事蹟；寂護入藏<\/td><td>蓮花生的神奇事蹟多出於較晚的伏藏傳記，屬傳說。寂護入藏的年代與蓮花戒同行與否，印順導師與藏文史料說法不同。<\/td><\/tr><tr><td>33<\/td><td>阿底峽入藏的年代<\/td><td>藏傳史書作 1042 年，印順導師作 1026 年。<\/td><\/tr><tr><td>31<\/td><td>桑耶論諍的勝負<\/td><td>藏文史料與敦煌漢文寫本說法相反，並列不評。<\/td><\/tr><tr><td>32、35<\/td><td>那洛巴、密勒日巴的事蹟<\/td><td>主要見於噶舉派較晚的傳記，屬傳說；那洛巴是那爛陀還是超岩寺的論師，說法不一。<\/td><\/tr><tr><td>34<\/td><td>阿奴律陀攻直通<\/td><td>見於緬甸王統史，細節學界有討論。<\/td><\/tr><tr><td>37<\/td><td>印度佛教衰微的原因<\/td><td>學界指出有多重原因，不只是外來的軍事破壞。<\/td><\/tr><\/table><\/div><h4>主要參考<\/h4><p class=\"ref\">CBETA：《佛所行讚》（T04）、《楞伽阿跋多羅寶經》（T16）、《大毘盧遮那成佛神變加持經》（T18）、《四分律》《五分律》（T22）、《善見律毘婆沙》（T24）、《大毘婆沙論》（T27）、《中論》《百論》（T30）、《究竟一乘寶性論》（T31）、《那先比丘經》《因明正理門論》（T32）、《異部宗輪論》（T49）、《阿育王傳》《馬鳴菩薩傳》《龍樹菩薩傳》《提婆菩薩傳》《婆藪槃豆法師傳》《高僧傳》《續高僧傳》《宋高僧傳》（T50）、《高僧法顯傳》《大唐西域記》《大唐西域求法高僧傳》《洛陽伽藍記 <script>
(function(){
const D = JSON.parse(document.getElementById('data').textContent);
const C = D.cfg;
const SCH = C.dims;
const FATES = C.fates;
const TIE = C.tie;
const FLABEL = C.flabel;
const N = D.scenes.length;
const PART = '2';
const TKEY = 'chuandeng-trilogy-v1';
function tload(){ try { const v = JSON.parse(localStorage.getItem(TKEY) || '{}'); return v && typeof v === 'object' ? v : {}; } catch(e) { return {}; } }
const TS = tload();
function tsave(res){
  try {
    const t = tload(), me = t[PART] || {};
    me.l = picks.map((p, i) => { const o = D.scenes[i] && D.scenes[i].options[p]; return o ? o.k : '-'; }).join('');
    me.pos = pos; me.n = N;
    if (res) me.res = res; else if (pos < N) delete me.res;
    t[PART] = me; localStorage.setItem(TKEY, JSON.stringify(t));
  } catch(e) {}
}
function xpick(c){ const t = TS[String(c.p)]; if (!t || !t.l) return false; const L = t.l[c.n - 1]; if (!L || L === '-') return false; return !c.k || c.k.indexOf(L) >= 0; }

const KEY = C.key;
const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let picks = [], pos = 0;

const $ = (s, r) => (r || document).querySelector(s);
const story = $('#story');

const CN = ['零','一','二','三','四','五','六','七','八','九'];
function cnum(n){ if (n < 10) return CN[n]; const t = Math.floor(n/10), u = n%10; return (t > 1 ? CN[t] : '') + '十' + (u ? CN[u] : ''); }
function letterOf(i){ const p = picks[i]; const o = D.scenes[i].options[p]; return o ? o.k : null; }
function evalCond(c, upto){
  if (!c) return true;
  switch (c.t){
    case 'xpick': return xpick(c);
    case 'pick': { const i = c.n - 1; return i < upto && i < picks.length && c.k.indexOf(letterOf(i)) >= 0; }
    case 'or': return c.items.some(x => evalCond(x, upto));
    case 'atleast': return c.items.filter(x => evalCond(x, upto)).length >= c.v;
    case 'fate': {
      let n = 0; for (let i = 0; i < Math.min(upto, picks.length); i++){ const o = D.scenes[i].options[picks[i]]; if (o && o.f === c.f) n++; }
      return c.op === '>=' ? n >= c.v : c.op === '<=' ? n <= c.v : n === c.v;
    }
    case 'ecount': { let n = 0; for (let i = 0; i < Math.min(upto, picks.length); i++){ const o = D.scenes[i].options[picks[i]]; if (o && o.c) n++; } return n >= c.v; }
  }
  return false;
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify({picks, pos})); } catch(e) {} tsave(); }
function load(){ try { return JSON.parse(localStorage.getItem(KEY) || 'null'); } catch(e) { return null; } }
function valid(st){
  if (!st || !Array.isArray(st.picks) || !Number.isInteger(st.pos)) return false;
  if (st.pos < 0 || st.pos > N || st.picks.length > N) return false;
  if (st.picks.length < st.pos || st.picks.length > st.pos + 1) return false;
  return st.picks.every((p, i) => Number.isInteger(p) && p >= 0 && p < D.scenes[i].options.length);
}

/* ---------- pieces ---------- */
function narrHTML(sc, idx){
  let h = '', inList = false;
  for (const b of sc.body){

    try {

function compute(){

const MAP = D.map;

const YEAR0 = C.years ? C.years[0] : 0, YEAR1 = C.years ? C.years[1] : 1;
const yearPct = y => !C.years ? 0 : Math.max(0, Math.min(100, (y - YEAR0) / (YEAR1 - YEAR0) * 100));
const shortNow = s => s.replace(/（.*?）/g, '');
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
function curve(a, b, bend){
  const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2, dx = b[0] - a[0], dy = b[1] - a[1];
  const k = bend == null ? .14 : bend;
  return 'M' + a[0] + ' ' + a[1] + 'Q' + (mx - dy * k).toFixed(1) + ' ' + (my + dx * k).toFixed(1) + ' ' + b[0] + ' ' + b[1];
}
function travelPath(a, b, via){
  const pts = [a].concat((via || []).map(v => v.xy)).concat([b]);
  let d = '';
  for (let i = 0; i < pts.length - 1; i++){
    const seg = curve(pts[i], pts[i + 1], .1);

}

}
function fitBox(pts, aspect, minW){
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  pts.forEach(p => { x0 = Math.min(x0, p[0]); y0 = Math.min(y0, p[1]); x1 = Math.max(x1, p[0]); y1 = Math.max(y1, p[1]); });
  const pad = 90; x0 -= pad; y0 -= pad; x1 += pad; y1 += pad;
  let w = x1 - x0, h = y1 - y0;

  if (w / h < aspect){ const nw = h * aspect; x0 -= (nw - w) / 2; w = nw; } else { const nh = w / aspect; y0 -= (nh - h) / 2; h = nh; }
  if (w >= MAP.w){ x0 = (MAP.w - w) / 2; } else { x0 = Math.max(0, Math.min(x0, MAP.w - w)); }
  if (h >= MAP.h){ y0 = (MAP.h - h) / 2; } else { y0 = Math.max(0, Math.min(y0, MAP.h - h)); }
  return [x0, y0, w, h];
}
function timeStrip(upto){

}

const Tr = {

      '<g class="m-rl"></g><path class="m-trail"/><g class="m-olds"></g><path class="m-go"/><path class="m-sea"/><g class="m-pts"></g><g class="m-lbls"></g></svg></div>' +

      }

      D.places.forEach(p => this.dot(pg, p.xy, 2.8, 'm-dot m-fade'));

    const goLen = travel ? go.getTotalLength() : 0, seaLen = route ? sea.getTotalLength() : 0;

/* sea route: from the scene place (or a named port) to the far shore, or back */
function seaPath(p){
  const r = p.routeXY, a = r.fromXY || p.xy;
  return r.dir === 'to' ? curve(a, r.xy, .22) : curve(r.xy, a, .22);
}
/* the full journey and the timeline, shown in the ending */
function placeGroups(){
  const groups = [];
  D.places.forEach(p => {
    const g = groups.find(g => Math.hypot(g.xy[0] - p.xy[0], g.xy[1] - p.xy[1]) < 9);
    if (g){ if (g.names.indexOf(p.name) < 0) g.names.push(p.name); g.ns.push(p.n); g.minor = false; }
    else groups.push({ xy: p.xy, names: [p.name], ns: [p.n] });
    (p.alsoXY || []).concat(p.viaXY || []).forEach(v => {
      if (!groups.find(g => Math.hypot(g.xy[0] - v.xy[0], g.xy[1] - v.xy[1]) < 9)) groups.push({ xy: v.xy, names: [v.t], ns: [], minor: true });
    });
  });
  return groups;
}

  const H = rowY(TL_ORDER.length - 1) + 64;
  let s = '<svg viewBox="0 0 1000 ' + H + '" role="img" aria-label="八宗興衰時間軸">';
  for (let y = 400; y <= 2000; y += 200) s += '<line class="tl-grid" x1="' + X(y) + '" x2="' + X(y) + '" y1="' + (top - 14) + '" y2="' + (H - 40) + '"/><text class="tl-yr" x="' + X(y) + '" y="' + (H - 18) + '" text-anchor="middle">' + y + '</text>';
  TL_ORDER.forEach((name, i) => {
    const y = rowY(i), lost = i >= 9;
    s += '<text class="tl-name' + (lost ? ' lost' : '') + '" x="' + (L - 14) + '" y="' + (y + 6) + '" text-anchor="end">' + name + '</text>';
    (D.timeline || []).forEach((seg, j) => {
      if (seg.s !== name) return;
      s += '<line class="tl-seg ' + TL_STYLE[seg.st] + (lost ? ' lost' : '') + '" x1="' + X(seg.a) + '" x2="' + X(seg.b) + '" y1="' + y + '" y2="' + y + '"/>' +
        '<line class="tl-hit" data-tl="' + j + '" x1="' + X(seg.a) + '" x2="' + X(seg.b) + '" y1="' + y + '" y2="' + y + '"><title>' + name + '　' + seg.a + '–' + seg.b + '　' + seg.st + '</title></line>';
    });
  });
  const ay = H - 40;
  s += '<line class="tl-axis" x1="' + L + '" x2="' + R + '" y1="' + ay + '" y2="' + ay + '"/>';
  D.places.forEach(p => { const x = X(p.year); s += '<path class="tl-you" d="M' + x + ' ' + (ay - 1) + 'l-4 -7h8z"/>'; });
  s += '</svg>';
  const key = '<p class="tl-key"><span><i class="k tl-s"></i>興盛</span><span><i class="k tl-m"></i>延續</span><span><i class="k tl-w"></i>衰微</span><span><i class="k tl-b"></i>萌芽</span><span><i class="k tl-d"></i>只在典籍或海外</span><span><i class="k you"></i>你走過的年代</span></p>';
  return '<p class="swipe">左右滑動，看完整的時間軸</p><div class="mapscroll"><div class="tlbox">' + s + '</div></div>' + key + '<p class="tl-cap" id="tl-cap">點一段線，看那一段的興衰。灰色四列，是後來沒有列進八宗、併入他宗或失傳的學派。</p>';
}
function journeySectionHTML(){
  return foldSec('journey', '', '一千五百年的行腳', '地圖與八宗興衰', journeyHTML() +
    '<p class="label" style="margin-top:14px">八宗興衰</p>' + timelineHTML());
}

/* ---------- render ---------- */
function introHTML(){
  let h = D.intro.slice(0, 4).map(p => '<p>' + p + '</p>').join('');
  if (pos > 0 && pos < N) h += '<button type="button" class="resume" data-act="resume">接著讀第' + D.scenes[pos].num + '幕</button>';
  else if (pos >= N) h += '<button type="button" class="resume" data-act="resume">看你的結局</button>';
  return h;
}
function progress(){
  const lamps = $('#lamps');
  if (!lamps.children.length){
    lamps.innerHTML = D.scenes.map((s, i) => '<i' + (i > 0 && D.volumes[s.vol].first === i + 1 ? ' class="v"' : '') + '></i>').join('');
  }
  Array.from(lamps.children).forEach((el, i) => {
    el.classList.toggle('lit', i < pos || (i === pos && picks.length > pos));
    el.classList.toggle('now', i === pos && picks.length <= pos);
  });
  if (pos < N){
    const sc = D.scenes[pos];
    $('#where').textContent = '第 ' + (pos + 1) + '／' + N + ' 幕';
    $('#vol-now').textContent = D.volumes[sc.vol].label + '・' + D.volumes[sc.vol].title.split('：')[0];
  } else {
    $('#where').textContent = cnum(N) + '幕走完了';
    $('#vol-now').textContent = '終章';
  }
}
function render(freshIdx){
  let h = '';
  const upto = Math.min(pos, N - 1);
  for (let i = 0; i <= upto; i++){
    const sc = D.scenes[i];
    if (D.volumes[sc.vol].first === i + 1) h += volumeHTML(D.volumes[sc.vol]);
    h += (i < pos) ? doneHTML(i) : activeHTML(i, freshIdx === i);
  }
  if (pos >= N) h += endingHTML(freshIdx === N);
  story.innerHTML = h;
  $('#intro').innerHTML = introHTML();
  tidy(story); tidy($('#intro'));
  progress();
}
function goTo(el){
  if (!el) return;
  el.scrollIntoView({behavior: reduce ? 'auto' : 'smooth', block: 'start'});
}

/* ---------- actions ---------- */
function choose(i){
  if (pos >= N || picks.length > pos) return;
  picks[pos] = i; picks.length = pos + 1;
  save();
  const art = $('#scene-' + pos);
  const tmp = document.createElement('div');
  tmp.innerHTML = activeHTML(pos, false);
  const fresh = tmp.firstChild;
  const after = fresh.querySelector('.after'); if (after) after.classList.add('fresh');
  art.replaceWith(fresh); tidy(fresh);
  progress();
  const a = $('#after-' + pos);
  if (a){ a.focus({preventScroll: true}); a.scrollIntoView({behavior: reduce ? 'auto' : 'smooth', block: 'nearest'}); }
}
function next(){
  if (picks.length <= pos) return;
  pos += 1; save();
  render(pos);
  const el = pos >= N ? $('#ending') : $('#scene-' + pos);
  const vol = el && el.previousElementSibling && el.previousElementSibling.classList.contains('vol') ? el.previousElementSibling : el;
  goTo(vol);
  if (pos >= N && el) el.focus({preventScroll: true});
}
let armTimer = null;
function restart(btn){
  if (!btn.hasAttribute('data-armed')){
    document.querySelectorAll('[data-armed]').forEach(b => { b.removeAttribute('data-armed'); b.textContent = '重新開始'; });
    btn.setAttribute('data-armed', ''); btn.textContent = '再按一次，確定重新開始';
    clearTimeout(armTimer);
    armTimer = setTimeout(() => { btn.removeAttribute('data-armed'); btn.textContent = '重新開始'; }, 4000);
    return;
  }
  clearTimeout(armTimer);
  picks = []; pos = 0; save();
  render(0);
  const b = $('#bar-restart'); b.removeAttribute('data-armed'); b.textContent = '重新開始';
  window.scrollTo({top: 0, behavior: reduce ? 'auto' : 'smooth'});
}

document.addEventListener('click', e => {
  const h = e.target.closest('.tl-hit');
  if (h){ const seg = D.timeline[+h.dataset.tl]; const cap = $('#tl-cap'); if (seg && cap) cap.innerHTML = '<b>' + seg.s + '　' + seg.a + '–' + seg.b + '　' + seg.st + '</b>　' + seg.t; return; }
  const ms = e.target.closest('.mi>summary, .rfold>summary');
  if (ms){ e.preventDefault(); const d = ms.parentElement, want = !d.open || d.classList.contains('closing'); toggleCard(d, want, true);
    const sec = d.closest('.allm, #sutras'); if (sec){ const btn = sec.querySelector('[data-act="allm"], [data-act="allsut"]');
      if (btn) btn.textContent = [...sec.querySelectorAll('.mi')].some(x => x === d ? !want : (!x.open || x.classList.contains('closing'))) ? '全部展開' : '全部收起'; }
    return; }
  const c = e.target.closest('.choice');
  if (c && !c.disabled && c.closest('.scene')) { choose(+c.dataset.i); return; }
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act;
  if (act === 'next'){ if (Tr.busy || picks.length <= pos) return; if (D.places && D.places.length === N) Tr.play(pos, pos + 1, next); else next(); }
  else if (act === 'restart') restart(b);
  else if (act === 'allm'){ const cards = [...document.querySelectorAll('.allm .mi')]; const open = cards.some(d => !d.open);
    cards.forEach(d => toggleCard(d, open, false)); b.textContent = open ? '全部收起' : '全部展開'; }
  else if (act === 'allsut'){ const cards = [...document.querySelectorAll('#sutras .mi')]; const open = cards.some(d => !d.open);
    cards.forEach(d => toggleCard(d, open, false)); b.textContent = open ? '全部收起' : '全部展開'; }
  else if (act === 'sjump'){ const g = document.getElementById('sg-' + b.dataset.g); if (!g) return;
    const top = document.querySelector('.bar'), off = top ? top.getBoundingClientRect().height + 8 : 12;
    window.scrollTo({top: g.getBoundingClientRect().top + window.scrollY - off, behavior: reduce ? 'auto' : 'smooth'});
    const h = g.querySelector('h4'); if (h) h.focus({preventScroll: true}); }
  else if (act === 'top') window.scrollTo({top: 0, behavior: reduce ? 'auto' : 'smooth'});
  else if (act === 'resume') goTo(pos >= N ? $('#ending') : $('#scene-' + pos));
});
story.addEventListener('change', e => {
  if (e.target.id === 'ex-school' || e.target.id === 'ex-fate'){
    $('#exout').innerHTML = comboBlock($('#ex-school').value, $('#ex-fate').value); tidy($('#exout'));
  }
});

/* back-to-top button: shows after scrolling down about one and a half screens */
(function(){
  const tb = $('.totop'); if (!tb) return; let on = false, tick = false;
  const upd = () => { tick = false; const v = window.scrollY > window.innerHeight * 1.5; if (v !== on){ on = v; tb.classList.toggle('show', v); tb.tabIndex = v ? 0 : -1; } };
  window.addEventListener('scroll', () => { if (!tick){ tick = true; requestAnimationFrame(upd); } }, {passive: true});
  upd();
})();

/* ---------- boot ---------- */
$('#notes').innerHTML = D.notesHtml; tidy($('#notes'));
function start(data){
  const st = valid(data) ? data : load();
  if (valid(st)) { picks = st.picks.slice(); pos = st.pos; }
  render(-1);
}
try { window.claude && window.claude.hot && window.claude.hot.snapshot && window.claude.hot.snapshot(() => ({picks: picks.slice(), pos})); } catch(e) {}
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();
</script>

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('../sw.js', {scope: '../'}).catch(() => {}));
}
