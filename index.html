rs":"約312–385","b":-0.0234},{"name":"淨檢","s":{"律":4,"天台":1,"淨土":1},"f":{"經":3,"融":2},"k":[[16,"A"],[3,"D"]],"bal":false,"text":"中國第一位比丘尼，本名仲令儀，早年守寡家貧，靠教貴族子女彈琴讀書維生。她聽沙門法始說法後問：「既云比丘、比丘尼，寧有異法？」當時漢地還沒有比丘尼戒法，她先剃髮受十戒，和二十四位同伴建立竹林寺，等了許多年，才在升平元年（357）於泗水的船上受了具足戒。你像她：你不因「沒有前例」就放棄，也不肯隨便湊合；該有的程序，你願意等，也願意去找。她會提醒你：她得到的布施「隨得隨散，常自後己，每先於人」；守規矩，是為了讓後來的人有路可走。","id":"中國第一位比丘尼，本名仲令儀，早年守寡家貧，靠教貴族子女彈琴讀書維生。","era":"兩晉","yrs":"生卒年不詳","b":0.12},{"name":"慧遠","s":{"淨土":4,"律":2,"曹洞":2},"f":{"山":5},"k":[[4,"A"],[4,"C"]],"bal":false,"text":"東晉廬山的僧團領袖，入山之後「影不出山，迹不入俗」；他與一百二十三人在般若臺前共發往生西方之願，又寫〈沙門不敬王者論〉，說出家人是「方外之賓」。你像他：你選擇了山，也選擇了一群一起修行的人；你對權勢客氣，卻不讓步。他會提醒你：溫和與堅定可以同時存在；守住的是修行，不是面子。","id":"東晉廬山的僧團領袖，入山之後「影不出山，迹不入俗」；他與一百二十三人在般若臺前共發往生西方之願，又寫〈沙門不敬王者論〉，說出家人是「方外之賓」。","era":"東晉","yrs":"334–約416","b":0.0516},{"name":"鳩摩羅什","s":{"三論":5,"天台":2,"淨土":1},"f":{"融":3,"宮":2,"經":1},"k":[[3,"B"]],"bal":false,"text":"後秦的譯經大師，譯出《中論》《法華經》《阿彌陀經》等，後世八宗有一半從他的譯場發芽。你像他：你最在乎的是讓深的道理被聽懂；你願意在原文與讀者之間來回斟酌，也能在不完美的處境裡把事做成。他會提醒你：「但採蓮花，勿取臭泥」；取人之長，也誠實看待自己的不足。","id":"後秦的譯經大師，譯出《中論》《法華經》《阿彌陀經》等，後世八宗有一半從他的譯場發芽。","era":"後秦","yrs":"約344–約413","b":0.0855},{"name":"僧肇","s":{"三論":5,"天台":1,"華嚴":1},"f":{"經":3,"融":2},"k":[[3,"B"]],"bal":false,"text":"鳩摩羅什門下的高足，被稱為「解空第一」。他家貧，「以傭書為業」，替人抄書時讀遍經史，原本最愛老莊，讀到舊譯《維摩經》才說「始知所歸矣」，因而出家。他寫的〈物不遷論〉〈不真空論〉〈般若無知論〉〈涅槃無名論〉後來合為《肇論》，羅什讀了也稱讚；他三十一歲就去世了。你像他：你年輕、聰明，能把最難懂的道理寫成清楚又優美的文字。他會提醒你：文字再美，要指向的是空，不是文字本身。","id":"鳩摩羅什門下的高足，被稱為「解空第一」。","era":"後秦","yrs":"384–414","b":0.0473},{"name":"道生","s":{"臨濟":3,"天台":2,"華嚴":2},"f":{"融":2,"山":2},"k":[[5,"B"],[5,"C"],[15,"B"],[15,"E"]],"bal":false,"text":"什門四聖之一，在完整的《涅槃經》傳來之前，就主張一闡提也能成佛，因此被擯出建康；後來經典傳到，證明了他。你像他：你相信每個人都有可能，即使要一個人站在大家的對面；你看重的是佛陀的本意，不只是字面。他會提醒你：孤明先發，靠的是對經義的深究，不是對自己的固執。","id":"什門四聖之一，在完整的《涅槃經》傳來之前，就主張一闡提也能成佛，因此被擯出建康；後來經典傳到，證明了他。","era":"晉宋之際","yrs":"？–434","b":0.0338},{"name":"曇曜","s":{"律":2,"密":2,"曹洞":1},"f":{"宮":3,"山":2,"經":1},"k":[[6,"C"],[6,"D"]],"bal":false,"text":"北魏的高僧。太武帝滅佛時，太子勸他還俗避禍，他不肯，仍暗中守著法服與法器。文成帝即位、佛教恢復之後，他出任沙門統，在平城西邊的武州塞開鑿五座大石窟，就是今天雲岡石窟的「曇曜五窟」；他又設立僧祇戶、佛圖戶，以寺院之力在荒年賑濟百姓，並主持譯出《付法藏因緣傳》等經。你像他：最壞的時候你守得住，最好的時候你建得起來；你也懂得讓朝廷與民間的力量一起做事。他會提醒你：石窟會風化，制度會變質，真正要守的是心。","id":"北魏的高僧。","era":"北魏","yrs":"生卒年不詳","b":-0.0499},{"name":"僧祐","s":{"律":4,"三論":1,"法相":1},"f":{"經":5,"宮":1},"k":[[2,"B"],[17,"C"]],"bal":false,"text":"南朝齊梁時的律師，精研《十誦律》，一生講律七十多遍。他編成中國現存最早的經錄《出三藏記集》，把東漢以來護法、論辯的文章收成《弘明集》，又寫了《釋迦譜》；他在建初寺、定林寺建立經藏，也主持設計剡縣石佛等大像。晚年腳有疾病，梁武帝仍特許他乘輿入宮傳戒；《宋高僧傳》還記載，道宣的母親夢見梵僧說，她懷的就是僧祐律師的後身。你像他：你喜歡把散亂的東西整理成冊，相信留下紀錄，就是替後人保住一條路。他會提醒你：整理別人的話之外，也要守好自己的戒。","id":"南朝齊梁時的律師，精研《十誦律》，一生講律七十多遍。","era":"南朝齊・梁","yrs":"445–518","b":0.0869},{"name":"梁武帝","s":{"律":3,"密":2,"淨土":1},"f":{"宮":6},"k":[[16,"D"],[2,"A"],[7,"A"]],"bal":false,"text":"南朝梁的開國皇帝蕭衍，在位四十八年。他在重雲殿與道俗二萬人一同發願捨道事佛，又依《涅槃經》等寫下〈斷酒肉文〉，漢傳僧人吃素從此成為傳統；他受菩薩戒，四次到同泰寺捨身為寺奴，再由群臣以錢贖回，人稱「皇帝菩薩」。但他晚年遭侯景之亂，國家殘破，自己也在圍城之中去世。你像他：你全心投入自己相信的事，也想用手中的權力讓整個社會變好。他會提醒你：個人的虔誠不能代替治理的責任；做了多少佛事，不等於心已清淨。","id":"南朝梁的開國皇帝蕭衍，在位四十八年。","era":"南朝梁","yrs":"464–549","b":-0.0097},{"name":"信行","s":{"淨土":2,"律":2,"臨濟":1},"f":{"融":3,"山":2},"k":[[11,"E"],[2,"D"]],"bal":false,"text":"隋代三階教的創立者。他認為末法時代的人戒、見俱破，修行不在講深理，而在「普敬」一切人、「認惡」只認自己的過錯；他學《法華經》的常不輕菩薩，路上見人就禮拜。他在相州發願創立無盡藏，勸人布施，用來修寺、救濟貧苦；他也派人勸隱居的僧邕出山：「修道立行，宜以濟度為先；獨善其身，非所聞也。」三階教後來屢遭禁斷，終於失傳。你像他：你不信只顧自己清淨的修行，寧可走進人群，從看見自己的不足開始。他會提醒你：普敬一切人，也包括那些你看不順眼的人。","id":"隋代三階教的創立者。","era":"隋","yrs":"約541–594","b":0.0922},{"name":"智顗","s":{"天台":6},"f":{"融":2,"山":2,"宮":1},"k":[[8,"A"],[10,"C"]],"bal":false,"text":"陳隋之際天台宗的實際開創者，晉王楊廣尊他為「智者」；他批評只坐不學的「闇證禪師」，也批評只讀不修的「誦文法師」。你像他：你要讀懂，也要做到；你看得見每一種法門的位置，也知道什麼時候該入山、什麼時候該出來。他會提醒你：體系再圓滿，最後還是要回到蒲團上實證。","id":"陳隋之際天台宗的實際開創者，晉王楊廣尊他為「智者」；他批評只坐不學的「闇證禪師」，也批評只讀不修的「誦文法師」。","era":"陳隋","yrs":"538–597","b":-0.0561},{"name":"吉藏","s":{"三論":6,"法相":1},"f":{"經":5},"k":[[9,"A"],[9,"D"]],"bal":false,"text":"隋唐之際三論宗的集大成者；陳亡時他走遍空寺收集文疏，堆滿三間堂，所以說「目學之長勿過於藏」。你像他：你讀得最多，也破得最徹底；別人急著站隊時，你先把每一家的說法都讀過一遍。他會提醒你：讀遍百家，是為了不被任何一家綁住，包括自己這一家。","id":"隋唐之際三論宗的集大成者；陳亡時他走遍空寺收集文疏，堆滿三間堂，所以說「目學之長勿過於藏」。","era":"隋唐之際","yrs":"549–623","b":0.0676},{"name":"靜琬","s":{"天台":2,"律":2},"f":{"經":6},"k":[[11,"A"],[25,"A"]],"bal":false,"text":"隋唐之際幽州的僧人，憂心法難，發願把佛經刻在石上；師徒相承，遼、金續刻，前後千年，成就了「房山石經」。你像他：你做的事，往往要很久以後才看得出意義；你寧可一刀一刀地刻，也不求今天被看見。他會提醒你：「世若有經，願勿輒開」；做好準備，不必期待被打開。","id":"隋唐之際幽州的僧人，憂心法難，發願把佛經刻在石上；師徒相承，遼、金續刻，前後千年，成就了「房山石經」。","era":"隋唐之際","yrs":"？–639","b":0.0993},{"name":"道綽","s":{"淨土":6},"f":{"山":5},"k":[[11,"B"],[12,"A"]],"bal":false,"text":"隋唐之際的淨土祖師，在并州玄中寺教人數著小豆念佛，并州三縣七歲以上的人都會念彌陀。你像他：你不高估自己，也不放棄任何人；你相信最簡單的方法，只要天天做，就能接住最多的人。他會提醒你：簡單不是淺；一聲佛號念得清清楚楚，比懂得許多道理更難。","id":"隋唐之際的淨土祖師，在并州玄中寺教人數著小豆念佛，并州三縣七歲以上的人都會念彌陀。","era":"隋唐之際","yrs":"562–645","b":0.0536},{"name":"善導","s":{"淨土":6},"f":{"融":4,"經":1},"k":[[12,"A"],[25,"B"]],"bal":false,"text":"唐代淨土宗的祖師，在西河拜見道綽，後來到長安弘化，「寫彌陀經數萬卷，士女奉者其數無量」，常在光明寺說法，世稱光明和尚；他的《觀經四帖疏》後來成為日本淨土宗的依據。他一生喜歡乞食，說：「釋迦尚乃分衛，善導何人端居索供？」你像他：你相信一聲至誠的佛號，就能接住最平凡的人；你自己卻過得簡樸，不肯被人供在高處。他會提醒你：念佛要至誠，持戒也不能鬆；信願與行持，本是一件事。","id":"唐代淨土宗的祖師，在西河拜見道綽，後來到長安弘化，「寫彌陀經數萬卷，士女奉者其數無量」，常在光明寺說法，世稱光明和尚；他的《觀經四帖疏》後來成為日本淨土宗的依據。","era":"唐","yrs":"613–681","b":-0.106},{"name":"玄奘","s":{"法相":6},"f":{"經":5,"宮":1},"k":[[13,"A"],[3,"A"],[14,"C"]],"bal":false,"text":"唐代的求法僧，私越國境西行，「寧可就西而死，豈歸東而生」，帶回六百五十七部經論，與弟子窺基開出法相唯識一宗。你像他：你要的是原典、是準確，為此可以走最遠的路；你相信把一件事做到最徹底，就是最好的貢獻。他會提醒你：帶回來之後，還要讓人讀得懂；學問是為了讓人離苦。","id":"唐代的求法僧，私越國境西行，「寧可就西而死，豈歸東而生」，帶回六百五十七部經論，與弟子窺基開出法相唯識一宗。","era":"唐","yrs":"約602–664","b":-0.12},{"name":"窺基","s":{"法相":6,"密":1},"f":{"經":4,"宮":2},"k":[[15,"A"],[15,"D"]],"bal":false,"text":"玄奘的弟子，出身將門尉遲氏，常住大慈恩寺，世稱慈恩大師。《宋高僧傳》說玄奘要度他出家，他先提出三個條件：不斷情欲、不斷葷血、可以過午而食；後人又傳說他出門有三車隨行，稱「三車和尚」。他二十五歲應詔入譯場，協助玄奘把十家注釋糅成《成唯識論》，又寫《成唯識論述記》，一生「造疏計可百本」，人稱百部論師。你像他：你出身好、性子傲，卻在一門學問裡下了最深的功夫，把老師帶回來的東西整理成後人學得會的體系。他會提醒你：學問越精，越要記得它是為了解脫，不是為了贏過別人。","id":"玄奘的弟子，出身將門尉遲氏，常住大慈恩寺，世稱慈恩大師。","era":"唐","yrs":"632–682","b":-0.0657},{"name":"道宣","s":{"律":6,"華嚴":1},"f":{"經":2,"融":2},"k":[[16,"A"],[16,"C"],[35,"A"]],"bal":false,"text":"唐代南山律宗的開創者，以大乘的心解釋《四分律》，也是《續高僧傳》的作者。他年輕時聽律一遍就想入山修禪，師父要他聽滿二十遍才准；晚年在淨業寺創立戒壇，寫下《關中創立戒壇圖經》。你像他：你相信制度是佛法久住的根本，但你要的不是死的條文，而是規矩背後那顆發大心的心。他會提醒你：戒、定、慧本是一體；守戒是為了心定，心定是為了看清。","id":"唐代南山律宗的開創者，以大乘的心解釋《四分律》，也是《續高僧傳》的作者。","era":"唐","yrs":"596–667","b":0.12},{"name":"鑑真","s":{"律":4,"天台":2,"華嚴":1},"f":{"經":4,"融":2},"k":[[20,"A"],[20,"D"],[20,"E"]],"bal":false,"text":"唐代律師，十二年間五次東渡失敗，雙目失明，第六次終於抵達日本，在東大寺設立戒壇。你像他：你一旦答應了，就不會半途放下；你相信法要有人親自送過去，才算真的傳了。他會提醒你：盡力，而不執著結果；成敗是因緣，願心是自己的。","id":"唐代律師，十二年間五次東渡失敗，雙目失明，第六次終於抵達日本，在東大寺設立戒壇。","era":"唐","yrs":"688–763","b":0.12},{"name":"法藏","s":{"華嚴":6},"f":{"宮":3,"融":2},"k":[[17,"A"],[17,"B"]],"bal":false,"text":"唐代華嚴宗的集大成者，後世稱賢首大師；他指著殿前的金獅子為武則天說法，又用十面鏡子演示「一即一切」。你像他：你善於把深奧的道理變成一眼就懂的比喻，也知道在什麼場合怎麼說。他會提醒你：比喻是指月的手指；說得再好，也要讓人自己去看月亮。","id":"唐代華嚴宗的集大成者，後世稱賢首大師；他指著殿前的金獅子為武則天說法，又用十面鏡子演示「一即一切」。","era":"唐","yrs":"643–712","b":0.0606},{"name":"義湘","s":{"華嚴":5,"淨土":1},"f":{"經":3,"山":2},"k":[[17,"C"],[13,"E"],[20,"D"]],"bal":false,"text":"新羅僧人，《宋高僧傳》稱他「海東華嚴初祖」。他與元曉結伴入唐，元曉半路悟道回國，他「隻影孤征，誓死無退」，到終南山跟智儼學《華嚴》，與法藏是同學。回國後在太伯山創浮石寺，作《華嚴一乘法界圖》，「括盡一乘樞要」。國王要賜他田莊奴僕，他說：「我法平等，高下共均，貴賤同揆」，「貧道以法界為家」。你像他：你肯走很遠的路去學，學成了就帶回家鄉，還能把大部頭的道理收成人人帶得走的樣子。他會提醒你：法帶回來，是要讓所有人一起受用，不分高下。","id":"新羅僧人，《宋高僧傳》稱他「海東華嚴初祖」。","era":"新羅","yrs":"625–702","b":0.036},{"name":"慧能","s":{"臨濟":4,"華嚴":1,"淨土":1},"f":{"山":4},"k":[[5,"C"],[13,"C"],[17,"D"]],"bal":false,"text":"禪宗六祖，嶺南人；朝廷徵召，他推辭不去，此後「了不度大庾嶺而終」。他在黃梅破柴踏碓八個多月，得法後又在獵人隊中隱了十五年，替獵人守網時「每見生命，盡放之」。你像他：你不靠典籍、不靠權勢，相信答案就在自己心上；你對花俏的東西沒興趣，只想直接看見。他會提醒你：直截不是粗率；「無諍」也是他的教法。","id":"禪宗六祖，嶺南人；朝廷徵召，他推辭不去，此後「了不度大庾嶺而終」。","era":"唐","yrs":"638–713","b":-0.1022},{"name":"神秀","s":{"曹洞":2,"臨濟":2,"華嚴":2},"f":{"宮":5},"k":[[18,"A"]],"bal":false,"text":"東山法門的大師，武則天請他「肩輿上殿，親加跪禮」，時人尊為「兩京法主，三帝門師」。你像他：你相信好的法要走進有影響力的地方，才能讓更多人受益；你穩重、有分寸，也願意承擔責任。他會提醒你：在殿上，也不要忘了山裡的坐禪；漸修不是慢，而是步步踏實。","id":"東山法門的大師，武則天請他「肩輿上殿，親加跪禮」，時人尊為「兩京法主，三帝門師」。","era":"唐","yrs":"約606–706","b":0.12},{"name":"僧一行","s":{"密":4,"天台":2,"曹洞":1},"f":{"經":4,"宮":2},"k":[[22,"C"],[21,"C"]],"bal":false,"text":"唐代的僧人一行，俗名張遂，和後面那位越南的一行禪師是不同的兩個人。他先從北宗的普寂出家學禪，又從善無畏、金剛智學密法，把善無畏講解《大日經》的內容寫成《大日經疏》；他也是天文學家，奉唐玄宗之命修訂《大衍曆》，和梁令瓚造黃道遊儀，主持大規模的天文測量。玄宗讚他「師實聖人也」，他圓寂後被諡為「大慧禪師」。你像他：你不覺得修行和科學互相衝突；你既能靜坐，也能計算星辰的運行。他會提醒你：測得出天上的度數，也要量得出自己的心。","id":"唐代的僧人一行，俗名張遂，和後面那位越南的一行禪師是不同的兩個人。","era":"唐","yrs":"683–727","b":0.1184},{"name":"不空","s":{"密":6},"f":{"宮":4},"k":[[21,"A"],[22,"B"]],"bal":false,"text":"唐代密教大師，歷事玄宗、肅宗、代宗三朝，皆為灌頂國師；他說：「眾生未度，吾安自度耶？」你像他：你懂得在權力之間為法爭取空間，也願意在危局裡挺身而出；你的力量，來自你能連結的人。他會提醒你：護國是為了護眾生；靠得越近，越要記得最初為了誰。","id":"唐代密教大師，歷事玄宗、肅宗、代宗三朝，皆為灌頂國師；他說：「眾生未度，吾安自度耶？」你像他：你懂得在權力之間為法爭取空間，也願意在危局裡挺身而出；你的力量，來自你能連結的人。","era":"唐","yrs":"705–774","b":-0.12},{"name":"空海","s":{"密":5,"華嚴":2,"天台":1},"f":{"經":4,"融":2},"k":[[22,"A"],[22,"C"],[33,"C"]],"bal":false,"text":"日本真言宗的開創者，弘法大師；入唐從惠果受兩部大法，惠果囑咐他「傳之東國」。你像他：你在不同的世界之間來回，把一整套法帶到海的那一邊，也讓它在新的土地上生根。他會提醒你：所受的託付，要一代代往下傳，不是收進自己的箱子。","id":"日本真言宗的開創者，弘法大師；入唐從惠果受兩部大法，惠果囑咐他「傳之東國」。","era":"日本平安時代","yrs":"774–835","b":0.12},{"name":"百丈懷海","s":{"律":3,"臨濟":2,"曹洞":2},"f":{"山":6},"k":[[23,"A"]],"bal":false,"text":"唐代禪師，年老仍與大眾一同勞作，留下「一日不作，一日不食」的話。他說「吾於大小乘中博約折中，設規務歸於善焉」，從此禪寺不立佛殿、只立法堂，行普請法，上下一同勞作。你像他：你相信修行就在勞動裡，不必看誰的臉色；你也會為一群人立下可以長久運作的規矩。他會提醒你：規矩是為了讓人自在，不是為了讓人害怕。","id":"唐代禪師，年老仍與大眾一同勞作，留下「一日不作，一日不食」的話。","era":"唐","yrs":"？–814","b":-0.045},{"name":"澄觀","s":{"華嚴":5,"律":1,"三論":1,"臨濟":1},"f":{"宮":3,"經":2},"k":[[17,"C"],[16,"C"]],"bal":false,"text":"唐代華嚴宗的祖師，後世尊為華嚴四祖、清涼國師。他學過相部律與南山律，傳過三論，聽過《起信》《涅槃》，也參過禪；最後專弘《華嚴》，寫成《華嚴經疏》，人稱「華嚴疏主」。他受菩薩戒後立下十條自我約束的誓願，一生守持；歷經多朝，為好幾位皇帝講經。你像他：你什麼都學過，最後選定一門深入，再用學過的一切把它講透。他會提醒你：學得多，是為了把一件事看清楚。","id":"唐代華嚴宗的祖師，後世尊為華嚴四祖、清涼國師。","era":"唐","yrs":"約738–約839","b":0.0293},{"name":"宗密","s":{"華嚴":5,"臨濟":2},"f":{"融":4},"k":[[24,"A"]],"bal":false,"text":"唐代兼通華嚴與禪的大師；甘露之變後，逃亡的李訓來投，他想為李訓剃髮；被捕之後，他說「本師教法，遇苦即救，不愛身命，死固甘心」。你像他：你相信禪與教本是一致，也相信救人不問立場；你思想圓融，行動卻不含糊。他會提醒你：圓融不是和稀泥；正因為看見一切相通，所以見苦不能不救。","id":"唐代兼通華嚴與禪的大師；甘露之變後，逃亡的李訓來投，他想為李訓剃髮；被捕之後，他說「本師教法，遇苦即救，不愛身命，死固甘心」。","era":"唐","yrs":"780–841","b":0.059},{"name":"裴休","s":{"臨濟":3,"華嚴":2},"f":{"宮":3,"經":3},"k":[[19,"C"],[29,"A"]],"bal":false,"text":"唐宣宗時的宰相，也是虔誠的居士，人稱「河東大士」。他向黃檗希運問法，把黃檗的開示記下來整理成《黃檗傳心法要》並作序；他也與宗密往來，替宗密的許多著作寫序，宗密圓寂後又為他撰寫碑文。中年以後他持齋素食，還把考中功名的兒子送進寺院，從挑水砍柴做起。你像他：你身在高位、公務繁忙，卻沒有讓修行停下來；你也願意把好老師的話記下來，留給後人。他會提醒你：位子是暫時的，記下來的法才走得遠。","id":"唐宣宗時的宰相，也是虔誠的居士，人稱「河東大士」。","era":"唐","yrs":"生卒年不詳","b":0.12},{"name":"臨濟義玄","s":{"臨濟":6},"f":{"山":3},"k":[[27,"C"],[19,"A"]],"bal":false,"text":"唐代禪師，臨濟宗的開創者；他在黃檗門下「三度發問，三度被打」，後來以峻烈的機鋒接引學人，說「隨處作主，立處皆真」。你像他：你直接、不繞路，不依賴任何外在的權威；你相信答案要自己撞出來。他會提醒你：喝，是為了斷掉執著，不是為了壓倒別人。","id":"唐代禪師，臨濟宗的開創者；他在黃檗門下「三度發問，三度被打」，後來以峻烈的機鋒接引學人，說「隨處作主，立處皆真」。","era":"唐","yrs":"？–約866","b":-0.0576},{"name":"永明延壽","s":{"淨土":2,"臨濟":2,"華嚴":2,"法相":2,"天台":2},"f":{"融":6},"k":[[27,"A"],[27,"B"]],"bal":false,"text":"五代吳越的禪師，編成一百卷《宗鏡錄》，「舉一心為宗，照萬法如鏡」，後世尊為淨土祖師之一。你像他：你不肯只守一家，想把禪、教、淨土都收進一面鏡子裡；你的選擇總在融合各宗。他會提醒你：融合是為了照見一心，不是為了什麼都要。","id":"五代吳越的禪師，編成一百卷《宗鏡錄》，「舉一心為宗，照萬法如鏡」，後世尊為淨土祖師之一。","era":"五代吳越","yrs":"904–975","b":0.0855},{"name":"諦觀","s":{"天台":6},"f":{"經":5,"融":1},"k":[[26,"A"],[26,"E"],[28,"C"]],"bal":false,"text":"高麗僧人，奉命把天台論疏送回中國，見到羲寂後「一見心服」，在螺溪留了十年；後人在他的箱篋裡發現了《天台四教儀》。你像他：你願意為一部書渡海，也願意為一位老師留下；你珍惜典籍，更珍惜讓典籍活起來的人。他會提醒你：書送到了，路還要自己走。","id":"高麗僧人，奉命把天台論疏送回中國，見到羲寂後「一見心服」，在螺溪留了十年；後人在他的箱篋裡發現了《天台四教儀》。","era":"高麗・吳越","yrs":"生卒年不詳","b":0.0119},{"name":"大慧宗杲","s":{"臨濟":6},"f":{"宮":3,"經":1},"k":[[29,"A"]],"bal":false,"text":"南宋臨濟宗的禪師，提倡看話禪，接引許多在官場忙碌的士大夫；因與主戰派往來得罪秦檜，被流放十餘年。你像他：你有熱情、有立場，相信修行要在最忙亂的生活裡用得上，也不怕得罪人。他會提醒你：一個話頭參到底；外面的是非，別奪走你心裡的疑情。","id":"南宋臨濟宗的禪師，提倡看話禪，接引許多在官場忙碌的士大夫；因與主戰派往來得罪秦檜，被流放十餘年。","era":"南宋","yrs":"1089–1163","b":0.0897},{"name":"宏智正覺","s":{"曹洞":6},"f":{"山":5},"k":[[29,"B"]],"bal":false,"text":"南宋曹洞宗的禪師，住持天童山將近三十年，寫下〈默照銘〉：「默默忘言，昭昭現前。」你像他：你安靜、綿密，不求奇特，也不急著被看見；你相信一次次坐下，心會自己亮起來。他會提醒你：安靜不是冷漠；他臨終寫信，把後事託給在法上互不相讓的大慧。","id":"南宋曹洞宗的禪師，住持天童山將近三十年，寫下〈默照銘〉：「默默忘言，昭昭現前。","era":"南宋","yrs":"1091–1157","b":-0.0348},{"name":"法珍","s":{"律":2,"淨土":2,"天台":1},"f":{"經":4,"融":2},"k":[[11,"A"],[6,"A"],[28,"A"]],"bal":false,"text":"金代潞州的比丘尼崔法珍。北宋官版藏經的經板在戰亂中被奪走，她發願重刻大藏經，在大眾面前自斷左臂明志；此後四處募化，前後近三十年，刻成約七千卷，後世稱為「趙城金藏」。她把印好的藏經進獻朝廷，獲賜紫衣，封「宏教大師」。這部藏經後來埋沒了好幾百年，到民國二十三年（1934）才被重新發現，保存了許多其他藏經沒有收的典籍。你像她：你一旦發願，就不計代價把它做完；你相信經典要有人一字一字刻下來，才傳得下去。她會提醒你：斷臂不是要人效法，要人記得的，是那份不退的願。","id":"金代潞州的比丘尼崔法珍。","era":"金","yrs":"生卒年不詳","b":0.12},{"name":"蓮池袾宏","s":{"淨土":4,"律":3,"臨濟":1},"f":{"融":4,"山":2},"k":[[31,"A"],[31,"B"],[30,"C"]],"bal":false,"text":"明末四大師之一，杭州人，住杭州雲棲寺，世稱雲棲大師。他訂下《雲棲共住規約》，戒律嚴明，提倡戒殺放生，參禪與念佛並行而以念佛為歸，著有《阿彌陀經疏鈔》《竹窗隨筆》，後世尊為蓮宗八祖。你像他：你既溫和又嚴謹；你相信一句佛號能接住所有人，但一個團體也不能沒有規矩。他會提醒你：念佛與持戒，本是同一件事的兩面。","id":"明末四大師之一，杭州人，住杭州雲棲寺，世稱雲棲大師。","era":"明末","yrs":"1535–1615","b":0.0093},{"name":"紫柏真可","s":{"臨濟":3,"法相":1,"華嚴":1,"密":1},"f":{"經":3,"宮":3},"k":[[31,"D"],[11,"A"],[28,"C"]],"bal":false,"text":"明末四大師之一的真可，字達觀，晚號紫柏。他年少任俠，十七歲本要到塞上立功，途中投宿蘇州虎丘寺而出家。後來他發願把卷帙繁重的梵夾藏經改刻成方便流通的方冊本（後稱《嘉興藏》），在五台山開雕、徑山續刻；印順導師整理的《中國佛教史略》說這部藏經「大有益於後代」。憨山被流放時，他在江邊握著憨山的手說：「公不生還，吾不有生日。」他把「老憨不歸」「礦稅不止」「傳燈未續」稱為一生的三大負，最後在妖書案中受誣下獄，死在獄中。你像他：你熱血、直率，看見不公就要出手，也肯為一件利益後世的大事奔走一生。他會提醒你：救人的心要熱，看局勢的眼要冷；離權力太近，代價常常落在自己身上。","id":"明末四大師之一的真可，字達觀，晚號紫柏。","era":"明末","yrs":"1543–1603","b":0.0743},{"name":"憨山德清","s":{"臨濟":3,"淨土":2,"華嚴":2},"f":{"融":3,"宮":2,"山":1},"k":[[31,"D"],[9,"B"]],"bal":false,"text":"明末四大師之一的德清，號憨山，精通儒、釋、道三家。他得慈聖太后護持，在牢山建海印寺，萬曆二十三年（1595）卻被以「私創寺院」的罪名充軍廣東雷州；他穿著囚服到廣州謁見大將軍，在軍營裡說法，遇上大疫就帶人掩埋屍骨。之後他應請入曹溪，整頓六祖的祖庭，選僧受戒、立義學、訂規約，最後圓寂於曹溪；門人把他的詩文、書信與開示編成《憨山老人夢遊集》。聖嚴法師說，像他這樣把定境、悟境寫得「如此的細微而明朗者，在中國禪宗史上，當可推為第一」。你像他：你遇到冤屈不辯不怨，把被放逐的地方也變成道場。他會提醒你：處境可以被別人安排，心要自己作主；到了哪裡，就在哪裡做事。","id":"明末四大師之一的德清，號憨山，精通儒、釋、道三家。","era":"明末","yrs":"1546–1623","b":0.12},{"name":"蕅益智旭","s":{"天台":4,"淨土":4,"律":2,"法相":1},"f":{"融":3,"經":2},"k":[[31,"C"],[27,"A"],[32,"D"]],"bal":false,"text":"明末四大師之一的智旭，以天台教觀融攝禪、教、律，而以淨土為歸宿，後世尊為蓮宗九祖，著有《阿彌陀經要解》，弟子成時把他的遺文輯成《靈峰蕅益大師宗論》。他自號「八不道人」：古來的儒、禪、律、教，他自認不敢當；當時的儒、禪、律、教，他又不屑為伍。他少年時寫文章闢佛，十七歲讀了蓮池的《自知錄》與《竹窗隨筆》，把那些文章燒了；二十四歲由憨山的門人雪嶺剃度出家。三十二歲那年，他要註《梵網經》，先在佛前拈鬮，問該依哪一宗，屢屢拈到天台，從此深研天台，卻不肯自居天台子孫，因為當時各宗各守門庭，不能和合。他說：「禪者佛心，教者佛語，律者佛行。」你像他：你讀得深，也修得實；你不肯被一個門戶框住，卻有清楚的歸宿。他會提醒你：心、語、行要合在一起；有心而無行，有語而無心，都不完整。","id":"明末四大師之一的智旭，以天台教觀融攝禪、教、律，而以淨土為歸宿，後世尊為蓮宗九祖，著有《阿彌陀經要解》，弟子成時把他的遺文輯成《靈峰蕅益大師宗論》。","era":"明末清初","yrs":"1599–1655","b":-0.0028},{"name":"隱元隆琦","s":{"臨濟":4,"律":2,"淨土":1},"f":{"融":2,"山":2,"宮":1},"k":[[27,"A"],[20,"A"]],"bal":false,"text":"明末清初福建黃檗山萬福寺的臨濟宗禪師。1654 年，六十三歲的他應長崎僧人再三邀請，帶著三十多位弟子東渡日本，後來在京都宇治開創黃檗山萬福寺，成為日本黃檗宗的開祖。他把明代叢林的威儀、清規與傳戒的規矩一起帶過去，日本至今還把一種豆子叫「隱元豆」。你像他：到了晚年，你還肯出遠門，在陌生的地方把一整套生活重新建立起來。他會提醒你：傳過去的不只是法，還要有一座能讓人安住的叢林。","id":"明末清初福建黃檗山萬福寺的臨濟宗禪師。","era":"明末清初","yrs":"1592–1673","b":0.0956},{"name":"楊仁山","s":{"法相":4,"淨土":2,"華嚴":2},"f":{"經":6},"k":[[33,"A"]],"bal":false,"text":"清末的居士，在南京創立金陵刻經處，託南條文雄從日本尋回約三百種中國早已失傳的佛典，刻版重印。你像他：你相信把書救回來，就是把法救回來；你不在台上，卻讓一整個時代重新讀懂了佛法。他會提醒你：書要有人讀，讀了要有人修。","id":"清末的居士，在南京創立金陵刻經處，託南條文雄從日本尋回約三百種中國早已失傳的佛典，刻版重印。","era":"清末","yrs":"1837–1911","b":0.0526},{"name":"印光","s":{"淨土":5,"律":1},"f":{"山":3,"經":2},"k":[[33,"D"],[31,"A"],[11,"B"],[35,"C"]],"bal":false,"text":"清末民初的淨土宗祖師，後世尊為蓮宗十三祖。他少年讀儒書，學韓愈、歐陽修闢佛，後來因眼疾讀佛經而回頭；出家後在普陀山法雨寺的藏經樓一住二十多年，閉門念佛閱藏。他一生不收出家徒眾、不當住持、不登大座，卻用書信回答各地來問的人，這些信編成《印光大師文鈔》；又創辦弘化社印送經書。弘一大師三次請求，才得以拜他為師。你像他：你不求場面，只把一件最簡單的事做到底；你相信寫給一個人的信，也能改變一個人。他會提醒你：「千經萬論，指歸淨土」；每一聲佛號，都要念得清清楚楚。","id":"清末民初的淨土宗祖師，後世尊為蓮宗十三祖。","era":"清末民初","yrs":"1861–1940","b":0.0936},{"name":"太虛","s":{"三論":2,"法相":2,"天台":2,"密":2,"律":1},"f":{"融":5,"宮":1},"k":[[33,"B"]],"bal":false,"text":"民國的佛教改革者，倡導「人生佛教」，說「此之八宗，皆實非權，皆圓非偏」，又辦僧學、創漢藏教理院。你像他：你不偏一宗，卻不只是調和；你想讓整個傳統在新的時代重新活起來，也願意站到最前面去推動。他會提醒你：改革從自己開始；理想走在前面，腳下也要踏實。","id":"民國的佛教改革者，倡導「人生佛教」，說「此之八宗，皆實非權，皆圓非偏」，又辦僧學、創漢藏教理院。","era":"民國","yrs":"約1890–1947","b":0.12},{"name":"弘一","s":{"律":5,"華嚴":2,"淨土":2},"f":{"山":3,"經":2},"k":[[31,"B"]],"bal":false,"text":"民國的李叔同，出家前是藝術家與教師，出家後專研南山律，被尊為重興南山律的一代律師；後人歸納他的學行是「以華嚴為境，四分律為行，導歸淨土為果」。他寫成《四分律比丘戒相表記》，說身後不必建塔，只要這部書能流通就夠了；他也曾三次請求，才拜印光大師為師。你像他：你對自己嚴格，對別人溫和；你從繁華裡轉身，選了一條最難也最安靜的路。他會提醒你：戒是對自己的要求，不是拿來衡量別人的尺。","id":"民國的李叔同，出家前是藝術家與教師，出家後專研南山律，被尊為重興南山律的一代律師；後人歸納他的學行是「以華嚴為境，四分律為行，導歸淨土為果」。","era":"民國","yrs":"1880–1942","b":0.0224},{"name":"寂然","s":{"淨土":3,"臨濟":3,"律":1},"f":{"融":4},"k":[[34,"A"],[9,"B"]],"bal":false,"text":"1937 年南京棲霞寺的監院；日軍攻陷南京時，他與志開、大本等法師開門收容難民，先後救護兩萬多人，積勞成疾，1939 年圓寂。你像他：你看見苦，就會開門；你相信出家人吃的是十方的飯，就該救十方的人。他會提醒你：開門需要勇氣，也需要眾人；有人開門，有人找米，有人記錄，有人求援。","id":"1937 年南京棲霞寺的監院；日軍攻陷南京時，他與志開、大本等法師開門收容難民，先後救護兩萬多人，積勞成疾，1939 年圓寂。","era":"民國","yrs":"？–1939","b":0.0399},{"name":"印順","s":{"三論":5,"法相":2},"f":{"經":4,"山":1},"k":[[37,"A"],[36,"B"]],"bal":false,"text":"二十世紀的佛學思想家，一生著書、不建大型道場，自說「不是宗派徒裔」，提倡契理契機的人間佛教。你像他：你用經論檢驗一切傳統，不為宗派所囿，也不怕和老師意見不同；你在意的是道理對不對，不是誰說的。他會提醒你：批判是為了回到佛陀的本懷，不是為了否定前人；他和太虛師生各持己見，卻終身相敬。","id":"二十世紀的佛學思想家，一生著書、不建大型道場，自說「不是宗派徒裔」，提倡契理契機的人間佛教。","era":"當代","yrs":"1906–2005","b":-0.0201},{"name":"星雲","s":{"臨濟":3,"淨土":3},"f":{"融":5},"k":[[37,"B"],[36,"C"]],"bal":false,"text":"臨濟正宗第四十八世，十二歲在南京棲霞寺禮志開上人出家，開創佛光山，把人間佛教帶到五大洲。你像他：你相信佛法要走進人群，喜歡和人在一起，也擅長把一件事做大，讓更多人受用。他會提醒你：給人歡喜之前，自己心裡先要有法；做大，是為了讓更多人離苦。","id":"臨濟正宗第四十八世，十二歲在南京棲霞寺禮志開上人出家，開創佛光山，把人間佛教帶到五大洲。","era":"當代","yrs":"1927–2023","b":0.0747},{"name":"聖嚴","s":{"曹洞":3,"臨濟":3},"f":{"經":4},"k":[[37,"C"],[29,"C"],[36,"A"]],"bal":false,"text":"法鼓山的創辦人，承接曹洞與臨濟兩宗的法，以「提昇人的品質，建設人間淨土」為理念，讓默照禪重新活了過來。你像他：你既能深入典籍，也能帶人禪修；你相信從自己的心開始，就是改變世界的開始。他會提醒你：學問和修行不必二選一，兩者合起來，才是一條完整的路。","id":"法鼓山的創辦人，承接曹洞與臨濟兩宗的法，以「提昇人的品質，建設人間淨土」為理念，讓默照禪重新活了過來。","era":"當代","yrs":"1930–2009","b":0.12},{"name":"惟覺","s":{"臨濟":5,"曹洞":1},"f":{"山":5},"k":[[37,"D"],[36,"D"]],"bal":false,"text":"中台禪寺的開山方丈，早年在萬里山中閉關十餘年，以禪七與各地精舍推廣禪修。你像他：你相信先把心坐下來，其他的事自然會明白；你踏實、專注，不喜歡多說。他會提醒你：「對上以敬、對下以慈、對人以和、對事以真」；禪不只在禪堂裡。","id":"中台禪寺的開山方丈，早年在萬里山中閉關十餘年，以禪七與各地精舍推廣禪修。","era":"當代","yrs":"1928–2016","b":-0.0756},{"name":"一行禪師","s":{"華嚴":3,"曹洞":3,"淨土":1},"f":{"融":5},"k":[[37,"E"]],"bal":false,"text":"越南臨濟宗的禪師，1966 年為越南和平出國奔走，從此流亡三十九年；他在法國梅村教人正念呼吸與行禪，講萬物「相即」。你像他：你相信修行就在每一次呼吸、每一步行走裡；你溫和，卻有不肯妥協的願力。他會提醒你：正念不只是讓自己舒服；它以正見為前導，以戒為根基。","id":"越南臨濟宗的禪師，1966 年為越南和平出國奔走，從此流亡三十九年；他在法國梅村教人正念呼吸與行禪，講萬物「相即」。","era":"當代","yrs":"1926–2022","b":0.0368}],"mastersLead":["最後，把三十七幕合起來看：你在九宗之間怎麼分配、在四種去向之間怎麼取捨，再加上幾個關鍵時刻的選擇，和下面六十五位祖師、大師的特質相比，一次找出最像的三位祖師大德，再列出兩位「也有幾分像」的人。比對時，每位祖師另有一個校正值（由大量模擬遊玩估算），讓性格最鮮明的幾位不會總是排在第一，六十五位都有機會出現；校正會改變排名，但原始分數最接近你的那一位，一定會出現在這三位之中。若你的選擇幾乎平均落在九宗之間，不偏任何一家，排在第一位的會是被尊為八宗共祖的龍樹。每段後面的「他會提醒你」，是從他的一生裡借來的一句提醒，不是他的原話。","方括號裡是比對用的特質：前段是九宗比重，中段是四種去向的比重，最後是幾個關鍵選擇（例如「4B」指第 4 幕選 B）。正式做成遊戲時不顯示給玩家。"],"mastersSrc":"<em>出處：《增壹阿含經》卷三〈弟子品〉〈比丘尼品〉〈清信士品〉（T02, pp. 557b、557c、558a、558c、559c）、卷五（T02, p. 570b）；《中阿含經》卷八〈阿難未曾有法經〉（T01, p. 473a）、卷二十八〈瞿曇彌經〉（T01, p. 605a–b）；《雜阿含經》（T02, pp. 62c href=\"https://books.masterhsingyun.org/ArticleDetail/artcle1986\" target=\"_blank\" rel=\"noopener\">〈淨土宗初祖廬山慧遠大師〉<\/a>、<a href=\"https://books.masterhsingyun.org/ArticleDetail/artcle1987\" target=\"_blank\" rel=\"noopener\">〈譯經聖手鳩摩羅什大師〉<\/a>、<a href=\"https://books.masterhsingyun.org/ArticleDetail/artcle1990\" target=\"_blank\" rel=\"noopener\">〈空有相融道生大師〉<\/a>、<a href=\"https://books.masterhsingyun.org/ArticleDetail/artcle23239\" target=\"_blank\" rel=\"noopener\">〈大慧宗杲禪師〉<\/a>、<a href=\"https://books.masterhsingyun.org/ArticleDetail/artcle2518\" target=\"_blank\" rel=\"noopener\">〈中興近代佛教的楊仁山〉<\/a>、<a href=\"https://books.masterhsingyun.org/ArticleDetail/artcle2552\" target=\"_blank\" rel=\"noopener\">〈民初佛教領袖太虛大師〉<\/a>、<a href=\"https://books.masterhsingyun.org/ArticleDetail/artcle24072\" target=\"_blank\" rel=\"noopener\">〈佛光山開山祖師星雲大師行狀〉<\/a>；<a href=\"https://www.shengyen.org/bio.php\" target=\"_blank\" rel=\"noopener\">法鼓山聖嚴法師數位典藏<\/a>；<a href=\"https://www.ctworld.org.tw/chan/master02.htm\" target=\"_blank\" rel=\"noopener\">中台禪寺〈惟覺安公老和尚行狀〉<\/a>；<a href=\"https://plumvillage.org/about/thich-nhat-hanh/thich-nhat-hanhs-health/thich-nhat-hanh-11-11-1926-01-22-2022\" target=\"_blank\" rel=\"noopener\">梅村 Plum Village〈Thich Nhat Hanh〉<\/a><\/em>","timelineLead":["粗線為興盛，中線為延續，細線為衰微，點線為萌芽，虛線表示在漢地中斷、只在典籍或海外延續。年代是大略分期，依各幕「後來」與印順導師《中國佛教史略》等；灰色四列，是後來沒有列進八宗、併入他宗或失傳的學派。"],"founders":{"intro":["八宗各有一位被尊為「祖」的人。這裡依佛光山佛陀紀念館本館前的八宗祖師石雕（<a href=\"https://www.fgs.org.tw/news/news_content.aspx?news_no=20120819000018\" target=\"_blank\" rel=\"noopener\">佛光山〈八宗祖師　解行並重〉<\/a>）：重行門的禪宗達摩、淨土宗慧遠、律宗道宣、密宗善無畏，重解門的天台宗智者、華嚴宗賢首、法相宗玄奘、三論宗嘉祥。此外另收日本天台宗開祖最澄。各宗的「祖」歷來有不同推法（例如華嚴初祖杜順、三論遠承羅什），卡片裡一併說明。生平依《星雲大師全集》改寫，並與 CBETA 的僧傳、印順導師與法鼓山的研究互相核對。"],"items":[{"n":"吉藏","k":"三論","role":"三論宗之祖","title":"嘉祥大師","dates":"549–623","text":"祖籍安息，生於金陵；七歲隨興皇寺的朗法師出家（《續高僧傳》與星雲大師全集作「道朗」，一般認為就是興皇法朗），承接鳩摩羅什一系的三論學。隋滅陳後住會稽嘉祥寺，問道的人上千，世稱嘉祥大師。陳亡時他走遍空寺收集文疏，一生講三論一百多遍，著《三論玄義》《中觀論疏》等，以破邪顯正、真俗二諦、八不中道闡明龍樹、提婆之學。三論學遠承羅什，到吉藏才集大成、立為一宗，星雲大師稱他「三論宗再興之祖」。","src":"<a href=\"https://books.masterhsingyun.org/ArticleDetail/artcle1996\" target=\"_blank\" rel=\"noopener\">星雲大師全集〈復興三論宗吉藏大師〉<\/a>、<a href=\"https://books.masterhsingyun.org/ArticleDetail/artcle8385\" target=\"_blank\" rel=\"noopener\">星雲大師全集〈宗派的競相建立〉<\/a>、<a href=\"https://cbetaonline.dila.edu.tw/zh/T2060_011\" target=\"_blank\" rel=\"noopener\">CBETA《續高僧傳》卷十一（T50, pp. 513c–514c）<\/a>、<a href=\"https://cbetaonline.dila.edu.tw/zh/Y0022_001\" target=\"_blank\" rel=\"noopener\">印順《佛教史地考論》〈中國佛教史略〉（Y22, p. 26a）<\/a>"},{"n":"玄奘","k":"法相","role":"法相宗之祖","title":"三藏法師","dates":"約602–664","text":"十三歲破格度為僧，問他為何出家，答「意欲遠紹如來，近光遺法」。貞觀三年（629，一說貞觀元年）私越國境西行，在那爛陀寺從戒賢學《瑜伽師地論》，在曲女城大會上立論，十八天無人能難。帶回經論六百五十七部，回國後譯出七十多部、一千三百多卷。弟子窺基承其唯識學撰《成唯識論述記》，法相宗由此成立；星雲大師以玄奘為宗祖、窺基為直承法統的慈恩大師。","src":"<a href=\"https://books.masterhsingyun.org/ArticleDetail/artcle1998\" target=\"_blank\" rel=\"noopener\">星雲大師全集〈留學聖僧玄奘大師〉<\/a>、<a href=\"https://books.masterhsingyun.org/ArticleDetail/artcle8385\" target=\"_blank\" rel=\"noopener\">星雲大師全集〈宗派的競相建立〉<\/a>、<a href=\"https://cbetaonline.dila.edu.tw/zh/T2053_001\" target=\"_blank\" rel=\"noopener\">CBETA《大慈恩寺三藏法師傳》卷一、五、十（T50, pp. 221c、247a–248a、277a）<\/a>、<a href=\"https://cbetaonline.dila.edu.tw/zh/Y0022_001\" target=\"_blank\" rel=\"noopener\">印順《佛教史地考論》〈中國佛教史略〉（Y22, pp. 45a–46a）<\/a>"},{"n":"智顗","k":"天台","role":"天台宗之祖","title":"智者大師","dates":"538–597","text":"十八歲出家，到光州大蘇山依慧思修學，入定有得，慧思讚歎「非爾弗證，非我莫識」。後入天台山結廬修禪，晚年在荊州玉泉寺講《法華玄義》《摩訶止觀》，與《法華文句》合稱天台三大部，都由弟子灌頂筆錄。晉王楊廣從他受菩薩戒，尊為「智者」。天台的傳承上溯北齊慧文、南嶽慧思，但以《法華經》為本、判教立觀而開成一宗的，是智顗。","src":"<a href=\"https://books.masterhsingyun.org/ArticleDetail/artcle1994\" target=\"_blank\" rel=\"noopener\">星雲大師全集〈天台宗初祖智顗大師〉<\/a>、<a href=\"https://books.masterhsingyun.org/ArticleDetail/artcle8385\" target=\"_blank\" rel=\"noopener\">星雲大師全集〈宗派的競相建立〉<\/a>、<a href=\"https://cbetaonline.dila.edu.tw/zh/T2050_001\" target=\"_blank\" rel=\"noopener\">CBETA《隋天台智者大師別傳》卷一（T50, pp. 191a–197b）<\/a>、<a href=\"https://cbetaonline.dila.edu.tw/zh/Y0022_001\" target=\"_blank\" rel=\"noopener\">印順《佛教史地考論》〈中國佛教史略〉（Y22, pp. 27a–28a）<\/a>"},{"n":"最澄","k":"天台","role":"日本天台宗開祖","title":"傳教大師","dates":"767–822","text":"近江國滋賀郡人，十四歲出家，在東大寺受具足戒後入比叡山潛修。延曆二十三年（804）隨遣唐使入唐，在台州從道邃、行滿學天台教觀，並從道邃受圓頓菩薩戒，又從翛然受牛頭禪、在越州從順曉受密教灌頂，在唐不到一年就回國。806 年朝廷准天台宗設年分度者，日本天台宗由此獨立。他力主在比叡山建大乘戒壇，寫《山家學生式》《顯戒論》，生前沒有獲准，822 年去世後朝廷才准許。貞觀八年（866）追諡「傳教大師」。","src":"<a href=\"https://books.masterhsingyun.org/ArticleDetail/artcle2775\" target=\"_blank\" rel=\"noopener\">星雲大師全集〈傳燈大法師最澄上人〉<\/a>、<a href=\"https://dongchu.dila.edu.tw/html/02/cwdc_02/cwdc_020258.html\" target=\"_blank\" rel=\"noopener\">東初老人《中日佛教交通史》〈最澄攜歸佛典之著錄〉<\/a>、<a href=\"https://www.chibs.edu.tw/ch_html/chbj/10/chbj1011.htm\" target=\"_blank\" rel=\"noopener\">楊曾文〈圓仁和日本天台宗〉，《中華佛學學報》第 10 期（1997）<\/a>、<a href=\"https://cbetaonline.dila.edu.tw/zh/T2159_001\" target=\"_blank\" rel=\"noopener\">CBETA《傳教大師將來台州錄》卷一（T55, p. 1058a）<\/a>"},{"n":"法藏","k":"華嚴","role":"華嚴宗之祖","title":"賢首大師","dates":"643–712","text":"祖籍康居，後來到了長安。十六歲在法門寺舍利塔前燃指供佛，後聽智儼講《華嚴經》而入其門。參與實叉難陀譯八十卷《華嚴經》，一生講《華嚴》三十多遍；為武則天以殿前金獅子說六相、十玄，又以十面鏡子演示重重無盡。《宋高僧傳》說他字賢首（星雲大師全集一說武則天所賜，一說唐高宗所賜），華嚴宗因此又稱賢首宗。傳統推杜順為初祖、智儼為二祖、法藏為三祖；五教十宗的判教與法界緣起的教理，到他手上才完備。","src":"<a href=\"https://books.masterhsingyun.org/ArticleDetail/artcle2003\" target=\"_blank\" rel=\"noopener\">星雲大師全集〈開拓華嚴判教法藏大師〉<\/a>、<a href=\"https://books.masterhsingyun.org/ArticleDetail/artcle6775\" target=\"_blank\" rel=\"noopener\">星雲大師全集〈華嚴的開宗及其傳承〉<\/a>、<a href=\"https://cbetaonline.dila.edu.tw/zh/T2061_005\" target=\"_blank\" rel=\"noopener\">CBETA《宋高僧傳》卷五（T50, p. 732a）<\/a>、<a href=\"https://cbetaonline.dila.edu.tw/zh/Y0022_001\" target=\"_blank\" rel=\"noopener\">印順《佛教史地考論》〈中國佛教史略〉（Y22, pp. 46a–47a）<\/a>"},{"n":"道宣","k":"律","role":"律宗之祖","title":"南山律師","dates":"596–667","text":"十六歲隨智頵出家，二十歲依智首受具足戒、專聽《四分律》。武德七年（624）入終南山，以大乘的心詮釋《四分律》，撰《四分律刪繁補闕行事鈔》等律學五大部，也寫了《續高僧傳》《廣弘明集》。晚年在淨業寺創立戒壇，作《關中創立戒壇圖經》，成為後世建壇的法式。唐以後講律的人多以他的系統為宗，稱南山律宗，他也被尊為南山律祖。","src":"<a href=\"https://books.masterhsingyun.org/ArticleDetail/artcle1997\" target=\"_blank\" rel=\"noopener\">星雲大師全集〈東土律祖道宣律師〉<\/a>、<a href=\"https://books.masterhsingyun.org/ArticleDetail/artcle8385\" target=\"_blank\" rel=\"noopener\">星雲大師全集〈宗派的競相建立〉<\/a>、<a href=\"https://cbetaonline.dila.edu.tw/zh/T2061_014\" target=\"_blank\" rel=\"noopener\">CBETA《宋高僧傳》卷十四（T50, p. 790b）<\/a>、<a href=\"https://cbetaonline.dila.edu.tw/zh/Y0022_001\" target=\"_blank\" rel=\"noopener\">印順《佛教史地考論》〈中國佛教史略〉（Y22, p. 49a）<\/a>"},{"n":"慧遠","k":"淨土","role":"淨土宗初祖","title":"廬山慧遠","dates":"334–約416","text":"雁門樓煩人，二十一歲聽道安講《般若經》，從此與弟弟慧持出家。後率徒南下廬山，住東林寺三十多年，「影不出山，迹不入俗」，送客以虎溪為界。元興元年（402）與道俗一百二十三人在無量壽佛像前立誓，共期往生西方，被視為中國結社念佛之始；宋代志磐《佛祖統紀》立「蓮社七祖」，以他為始祖，後世尊為淨土宗初祖。持名念佛的教理，則由北方的曇鸞、道綽、善導奠定。他也寫〈沙門不敬王者論〉，為僧團與朝廷劃下分際。","src":"<a href=\"https://books.masterhsingyun.org/ArticleDetail/artcle1986\" target=\"_blank\" rel=\"noopener\">星雲大師全集〈淨土宗初祖廬山慧遠大師〉<\/a>、<a href=\"https://books.masterhsingyun.org/ArticleDetail/artcle8385\" target=\"_blank\" rel=\"noopener\">星雲大師全集〈宗派的競相建立〉<\/a>、<a href=\"https://cbetaonline.dila.edu.tw/zh/T2059_006\" target=\"_blank\" rel=\"noopener\">CBETA《高僧傳》卷六（T50, pp. 357c–361b）<\/a>、<a href=\"https://cbetaonline.dila.edu.tw/zh/T2035_026\" target=\"_blank\" rel=\"noopener\">CBETA《佛祖統紀》卷二十六（T49, p. 260c）<\/a>、<a href=\"https://cbetaonline.dila.edu.tw/zh/Y0022_001\" target=\"_blank\" rel=\"noopener\">印順《佛教史地考論》〈中國佛教史略〉（Y22, p. 14a）<\/a>"},{"n":"菩提達摩","k":"禪","role":"禪宗初祖","title":"達摩祖師","dates":"生卒年不詳","text":"南天竺婆羅門種，先到劉宋境內的南越，後北上北魏，以「壁觀」教人，傳法給道育、慧可，並以四卷《楞伽經》授慧可：「我觀漢地，惟有此經」。弟子曇林記下他的「二入四行」：理入是深信眾生同一真性；行入是報怨行、隨緣行、無所求行、稱法行。後世奉為東土初祖，一花開五葉，臨濟、曹洞都出自這一脈。星雲大師全集也記述了梁普通年間到廣州、與梁武帝問答「並無功德」、一葦渡江、面壁九年、隻履西歸等禪門流傳的故事。印順導師提醒，達摩的事跡史書記載簡略、多有後人增飾；現存最早的記載，是楊衒之《洛陽伽藍記》記他讚歎洛陽永寧寺。","src":"<a href=\"https://books.masterhsingyun.org/ArticleDetail/artcle6648\" target=\"_blank\" rel=\"noopener\">星雲大師全集〈拈花微笑與達摩東來〉<\/a>、<a href=\"https://books.masterhsingyun.org/ArticleDetail/artcle8385\" target=\"_blank\" rel=\"noopener\">星雲大師全集〈宗派的競相建立〉<\/a>、<a href=\"https://cbetaonline.dila.edu.tw/zh/T2060_016\" target=\"_blank\" rel=\"noopener\">CBETA《續高僧傳》卷十六（T50, pp. 551b–552b）<\/a>、<a href=\"https://cbetaonline.dila.edu.tw/zh/T2092_001\" target=\"_blank\" rel=\"noopener\">CBETA《洛陽伽藍記》卷一（T51, p. 1000b）<\/a>、<a href=\"https://cbetaonline.dila.edu.tw/zh/Y0038_001\" target=\"_blank\" rel=\"noopener\">印順《中國禪宗史》（Y40, pp. 1a、3a–8a、14a）<\/a>、<a href=\"https://cbetaonline.dila.edu.tw/zh/Y0022_001\" target=\"_blank\" rel=\"noopener\">印順《佛教史地考論》〈中國佛教史略〉（Y22, p. 39a）<\/a>、<a href=\"https://ddc.shengyen.org/?doc=04-01-002\" target=\"_blank\" rel=\"noopener\">聖嚴法師《禪門修證指要》〈菩提達摩　略辨大乘入道四行〉<\/a>"},{"n":"善無畏","k":"密","role":"密宗之祖","title":"開元三大士","dates":"637–735","text":"出身印度烏荼國王族，十三歲嗣位，後讓國出家，遍學密法。唐開元四年（716）攜梵本到長安，玄宗以禮相待、尊為教主；此後在長安、洛陽譯出密典，《大日經》由他口授、一行筆受，一行並撰《大日經疏》，胎藏界密法由此傳入中國。他與後到的金剛智、不空合稱「開元三大士」，兩部密法在唐代完備，再經惠果傳給日本的空海。開元二十三年（735）示寂，享年九十九。","src":"<a href=\"https://books.masterhsingyun.org/ArticleDetail/artcle6768\" target=\"_blank\" rel=\"noopener\">星雲大師全集〈密宗傳承史略〉<\/a>、<a href=\"https://books.masterhsingyun.org/ArticleDetail/artcle8385\" target=\"_blank\" rel=\"noopener\">星雲大師全集〈宗派的競相建立〉<\/a>、<a href=\"https://cbetaonline.dila.edu.tw/zh/T2061_002\" target=\"_blank\" rel=\"noopener\">CBETA《宋高僧傳》卷二（T50, pp. 714b–716a）<\/a>、<a href=\"https://cbetaonline.dila.edu.tw/zh/Y0022_001\" target=\"_blank\" rel=\"noopener\">印順《佛教史地考論》〈中國佛教史略〉（Y22, p. 51a）<\/a>"}]},"sutras":{"title":"各宗修持經典","intro":["走完一千五百年，回頭看八宗各自倚重的經典。篇目以《星雲大師全集》經典篇的目錄為主，另補上密教三部、虛空藏二經、幾部常誦的大乘經與印順導師的兩部著作，共七十八部，依宗派歸類；各宗都讀、都誦的經放在「各宗共持」，標籤列出特別倚重它的宗派。「在說什麼」與「怎麼修」改寫自《星雲大師全集》的介紹（沒有星雲全集篇章的，依 CBETA 原典改寫，密教三部另參考高野山真言宗的官方說明），經號、譯者與卷數一律依 CBETA 核對。"],"groups":[{"name":"各宗共持","intro":"不專屬哪一宗，八宗都讀、都誦：阿含是佛陀教法的根本，般若、觀音、藥師、地藏是寺院與家庭的日課。","items":[{"n":"雜阿含經","id":"T0099","coll":"T","vol":2,"j":0,"tags":["各宗根本"],"cat":"《雜阿含經》，劉宋 求那跋陀羅譯，50 卷","c":"北傳四部阿含之一，依主題把佛陀的教說歸成一組組「相應」：五蘊、六入處、因緣、四諦、八正道、四念處……多是簡短的問答，最接近佛陀當年說法的樣子，一般認為是四部阿含中最早成形的一部。","p":"從觀察五蘊、六入下手，如實看見苦、無常、無我，再依四念處、八正道一步步放下煩惱——這正是四聖諦從「知苦」到「修道」的完整路線。","links":[{"t":"星雲大師全集","u":"https://books.masterhsingyun.org/ArticleDetail/artcle2121"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T02/T02n0099.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T0099_001"},{"n":"中阿含經","id":"T0026","coll":"T","vol":1,"j":0,"tags":["各宗根本"],"cat":"《中阿含經》，東晉 瞿曇僧伽提婆譯，60 卷","c":"北傳四部阿含之一，五誦十八品、二百二十二經，收篇幅中等的經。多記佛陀與弟子的問答，一再說明善惡業報，破斥外道對業報的誤解，也講忍辱、持戒、禪定、智慧與解脫，以及因緣生滅的道理。","p":"先把因果看清楚，正見才立得住；再用忍、戒、定、慧把它活出來。","links":[{"t":"星雲大師全集","u":"https://books.masterhsingyun.org/ArticleDetail/artcle2122"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T01/T01n0026.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T0026_001"},{"n":"長阿含經","id":"T0001","coll":"T","vol":1,"j":0,"tags":["各宗根本"],"cat":"《長阿含經》，後秦 佛陀耶舍共竺佛念譯，22 卷","c":"北傳四部阿含之一，四分三十經，收篇幅較長的經：過去諸佛的事蹟、修行的綱要、業報因果，以及對婆羅門與外道邪見的辨正；最後一分講世界的成住壞空與四姓的由來。","p":"以戒定慧、五戒十善、慈悲喜捨四無量心為根本，在生活裡實踐正見與善行。","links":[{"t":"星雲大師全集","u":"https://books.masterhsingyun.org/ArticleDetail/artcle2123"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T01/T01n0001.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T0001_001"},{"n":"增壹阿含經","id":"T0125","coll":"T","vol":2,"j":0,"tags":["各宗根本"],"cat":"《增壹阿含經》，東晉 瞿曇僧伽提婆譯，51 卷","c":"北傳四部阿含之一，依法數從一到十一依次編排，方便記誦。內容有念佛等「十念」、五戒的善惡果報、怎樣分辨善知識與惡知識，也出現菩薩道的思想；經中說「佛世尊皆出人間，非由天而得」，是人間佛教常引的依據。","p":"依法數一條條記、一條條做：從念佛、持戒到慈心、布施，建立日常修行的次第。","links":[{"t":"星雲大師全集","u":"https://books.masterhsingyun.org/ArticleDetail/artcle2124"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T02/T02n0125.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T0125_001"},{"n":"法句經","id":"T0210","coll":"T","vol":4,"j":0,"tags":["各宗"],"cat":"《法句經》，法救撰，吳 維祇難等譯，2 卷","c":"把佛陀在各處隨機說的法語編成簡短的偈頌，共三十九品。主軸是諸行無常與因果業報：離開愛欲、放下忿怒、實行慈悲，依四聖諦、八正道求解脫，同時也不輕忽今生的安樂。","p":"一次讀一首偈，帶著它過一天；反覆思惟無常、業報與離欲，是很好的入門功課。","links":[{"t":"星雲大師全集","u":"https://books.masterhsingyun.org/ArticleDetail/artcle2118"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T04/T04n0210.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T0210_001"},{"n":"八大人覺經","id":"T0779","coll":"T","vol":17,"j":0,"tags":["各宗"],"cat":"《佛說八大人覺經》，後漢 安世高譯，1 卷","c":"只有一卷的短經，把修行歸納成八種覺悟：世間無常、身心苦空無我；多欲是苦，要知足少欲；懈怠墮落，要精進；愚痴生死，要以智慧破除；布施時怨親平等；持戒離欲；最後發大乘心，願代眾生受苦。既講出離，也講入世救度。","p":"可以常讀常誦，每天對照一條：今天有沒有知足？有沒有精進？再把慈悲與布施落實在身邊的人身上。","links":[{"t":"星雲大師全集","u":"https://books.masterhsingyun.org/ArticleDetail/artcle2112"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T17/T17n0779.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T0779_001"},{"n":"四十二章經","id":"T0784","coll":"T","vol":17,"j":0,"tags":["各宗","禪"],"cat":"《四十二章經》，後漢 迦葉摩騰共法蘭譯，1 卷","c":"傳統上被視為最早譯成漢文的佛經，四十二章，每章都很短。用平易的話講出家證果、善惡業報、念頭要清淨、遠離貪欲、人命在呼吸之間，是一本入門書；星雲大師指出其中兼含大小乘，大乘部分以六度萬行為主。","p":"從斷除五欲、遠離貪愛、分辨善惡開始，適合初學者反覆讀、慢慢體會。","links":[{"t":"星雲大師全集","u":"https://books.masterhsingyun.org/ArticleDetail/artcle2113"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T17/T17n0784.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T0784_001"},{"n":"六度集經","id":"T0152","coll":"T","vol":3,"j":0,"tags":["各宗"],"cat":"《六度集經》，吳 康僧會譯，8 卷","c":"收集佛陀過去世修菩薩行的本生故事，依布施、持戒、忍辱、精進、禪定、智慧六度分章編排。主題是利他：不因眾生愚昧或冒犯就退心，用慈悲與智慧救度眾生，是中國早期弘揚菩薩行的重要經典。","p":"用故事學六度：布施不求回報、受辱不起瞋、做事不懈怠。","links":[{"t":"星雲大師全集","u":"https://books.masterhsingyun.org/ArticleDetail/artcle2116"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T03/T03n0152.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T0152_001"},{"n":"百喻經","id":"T0209","coll":"T","vol":4,"j":0,"tags":["各宗"],"cat":"《百喻經》，僧伽斯那撰，蕭齊 求那毘地譯，4 卷","c":"收錄九十八則譬喻小故事，從日常生活的笑話帶出善惡、罪福、因果的道理，每則後面再點明教義；有文學趣味，也是很好的弘法材料。","p":"笑完要回頭看自己：故事裡的愚人，常常就是我們自己的執著與邪見。","links":[{"t":"星雲大師全集","u":"https://books.masterhsingyun.org/ArticleDetail/artcle2117"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T04/T04n0209.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T0209_001"},{"n":"賢愚經","id":"T0202","coll":"T","vol":4,"j":0,"tags":["各宗"],"cat":"《賢愚經》，元魏 慧覺等譯，13 卷","c":"匯集賢者與愚者的因緣故事，共六十九品，情節生動。核心是善惡業報：行善終得福報，作惡必受其果；布施、持戒、忍辱、聽聞佛法，都會帶來長遠的利益。","p":"從故事反省自己的言行，增長信心與慚愧心。","links":[{"t":"星雲大師全集","u":"https://books.masterhsingyun.org/ArticleDetail/artcle2119"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T04/T04n0202.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T0202_001"},{"n":"那先比丘經","id":"T1670A","coll":"T","vol":32,"j":0,"tags":["各宗"],"cat":"《那先比丘經》，失譯，2 卷","c":"那先比丘與西北印度的彌蘭陀王一連串問答，最後國王皈依佛法。書中用生動的比喻講緣起、無我、業報與輪迴，例如善業要及早修、智慧能斷除愚痴，示範了佛法如何說理。CBETA 收有二卷本（T1670A）與三卷本（T1670B）兩種。","p":"有疑就問、問到明白；把握當下，及早行善。","links":[{"t":"星雲大師全集","u":"https://books.masterhsingyun.org/ArticleDetail/artcle2484"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T32/T32n1670A.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T1670A_001"},{"n":"般若波羅蜜多心經","id":"T0251","coll":"T","vol":8,"j":0,"tags":["各宗日誦","三論"],"cat":"《般若波羅蜜多心經》，唐 玄奘譯，1 卷","c":"不到三百字，是般若經典的精髓：以般若智慧照見五蘊皆空，便能度一切苦厄；再一一破除對諸法的執著，以「無所得」為究竟；最後以咒語象徵從此岸渡到彼岸。是最普遍讀誦的一部經。","p":"誦經時提醒自己：讓人煩惱的人、事、物都是因緣和合，沒有不變的實體；心無掛礙，就不再恐怖顛倒。","links":[{"t":"星雲大師全集","u":"https://books.masterhsingyun.org/ArticleDetail/artcle2127"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T08/T08n0251.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T0251_001"},{"n":"金剛般若波羅蜜經","id":"T0235","coll":"T","vol":8,"j":0,"tags":["禪","三論","各宗"],"cat":"《金剛般若波羅蜜經》，後秦 鳩摩羅什譯，1 卷","c":"佛陀與須菩提的問答，說明一切法沒有自性。核心是「無住」：布施時不執著施者、受者與所施之物；度眾生而不起度眾生的念頭；修行而不執著有所得；最後以「如夢幻泡影」觀照一切有為法。五祖弘忍勸人持誦此經，六祖惠能也因聽聞此經而開悟。","p":"把布施、利他、日常起居都當成般若的練習：做了好事，不放在心上。","links":[{"t":"星雲大師全集","u":"https://books.masterhsingyun.org/ArticleDetail/artcle2126"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T08/T08n0235.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T0235_001"},{"n":"維摩詰所說經","id":"T0475","coll":"T","vol":14,"j":0,"tags":["禪","天台","三論"],"cat":"《維摩詰所說經》，姚秦 鳩摩羅什譯，3 卷","c":"主角是在家居士維摩詰，藉他與文殊等人的對談闡揚大乘菩薩行：「隨其心淨，則佛土淨」；以不二法門超越一切對立，顯示在世間修行、度化眾生，就是解脫。","p":"在家人不必離開塵世，也能行菩薩道；在日常中調伏妄想執著，用方便度人。","links":[{"t":"星雲大師全集","u":"https://books.masterhsingyun.org/ArticleDetail/artcle2486"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T14/T14n0475.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T0475_001"},{"n":"勝鬘經","id":"T0353","coll":"T","vol":12,"j":0,"tags":["天台","華嚴","三論"],"cat":"《勝鬘師子吼一乘大方便方廣經》，劉宋 求那跋陀羅譯，1 卷","c":"在家女眾勝鬘夫人在佛前發十大受、三大願，說明「攝受正法」就是大乘。經中主張三乘終歸一乘，眾生本性清淨、具有如來藏，即使身在生死中，也有證得涅槃的可能。","p":"用十大受檢視自己的戒行、慈悲與護法之心，用三大願立定菩提心。","links":[{"t":"星雲大師全集","u":"https://books.masterhsingyun.org/ArticleDetail/artcle2483"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T12/T12n0353.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T0353_001"},{"n":"大乘起信論","id":"T1666","coll":"T","vol":32,"j":0,"tags":["華嚴","天台","禪","淨土","密"],"cat":"《大乘起信論》，馬鳴菩薩造，梁 真諦譯，1 卷","c":"以「眾生心」為根本，一心開出心真如、心生滅二門，說明如來藏如何生起萬法，凡夫又怎樣由迷轉悟。修行上講四種信心與五種修行，對各宗影響極深。舊題馬鳴造、真諦譯。","p":"以信心入門，依施、戒、忍、進、止觀五門實踐，對應六度，讓心從迷轉悟。","links":[{"t":"星雲大師全集","u":"https://books.masterhsingyun.org/ArticleDetail/artcle2942"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T32/T32n1666.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T1666_001"},{"n":"大寶積經","id":"T0310","coll":"T","vol":11,"j":0,"tags":["各宗","淨土","密"],"cat":"《大寶積經》，唐 菩提流志譯，120 卷","c":"新舊譯本合編而成的大乘經集，四十九會、一百二十卷，匯集大乘各種法門：有談般若性空的，有弘揚彌陀淨土的，也有宣說密法的，另有菩薩修行次第與授記成佛的內容。","p":"先認識大乘修行的全貌，再依自己的因緣選一個法門深入。","links":[{"t":"星雲大師全集","u":"https://books.masterhsingyun.org/ArticleDetail/artcle2482"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T11/T11n0310.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T0310_001"},{"n":"大佛頂首楞嚴經","id":"T0945","coll":"T","vol":19,"j":0,"tags":["禪","淨土","天台","各宗早課"],"cat":"《大佛頂如來密因修證了義諸菩薩萬行首楞嚴經》，唐 般剌蜜帝譯，10 卷","c":"以阿難遇摩登伽女之難為緣起，佛陀層層剖析五陰、六入、十二處、十八界、七大，指出都是如來藏妙真如心所現；卷五、卷六由二十五位聖者各說圓通法門，以觀世音的耳根圓通最適合此土；後段講修行位次、十二類眾生的由來，並列出五十種陰魔，提醒修禪的人不要把魔境當聖境。此經的譯出經過，近代學者有不同看法。","p":"經中以「奢摩他、三摩、禪那」為修行的最初方便；佛陀立下四種「清淨明誨」，斷婬、殺、盜、妄是修行的根本；〈楞嚴咒〉列在叢林早課，作為助行。","links":[{"t":"星雲大師全集","u":"https://books.masterhsingyun.org/ArticleDetail/artcle23575"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T19/T19n0945.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T0945_001"},{"n":"觀世音菩薩普門品","id":"T0262","coll":"T","vol":9,"j":7,"tags":["各宗","天台"],"cat":"《妙法蓮華經》，姚秦 鳩摩羅什譯，7 卷","c":"《法華經》第二十五品。觀世音菩薩以慈悲為本願，經中說眾生受苦時一心稱念名號，菩薩就觀其音聲令得解脫；又能隨眾生的根機示現種種身形來教化。經中說救離七難、脫離貪瞋痴三毒，真正的救度是慈悲、勇猛與智慧。","p":"平日一心稱念觀音聖號，也學著把自己的貪、瞋、痴轉成慈悲、勇猛與智慧，去化解別人的苦難。","links":[{"t":"星雲大師全集","u":"https://books.masterhsingyun.org/ArticleDetail/artcle2129"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T09/T09n0262.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T0262_007"},{"n":"大悲心陀羅尼經","id":"T1060","coll":"T","vol":20,"j":0,"tags":["各宗早課","密"],"cat":"《千手千眼觀世音菩薩廣大圓滿無礙大悲心陀羅尼經》，唐 伽梵達摩譯，1 卷","c":"觀世音菩薩在佛前自述，為利益眾生而說〈大悲心陀羅尼〉，也就是〈大悲咒〉；持誦的人要先對眾生起慈悲心，發「南無大悲觀世音，願我速知一切法」等十願。經中說，這陀羅尼的樣子就是大慈悲心、平等心、無為心、無染著心、空觀心、恭敬心、卑下心、無雜亂心、無見取心、無上菩提心。","p":"星雲大師說〈大悲咒〉是觀音內證功德的根本咒，與稱念聖號、誦〈普門品〉、禮大悲懺同屬觀音法門，時間不夠時擇一而修也可以；重點在虔誠如法、不起分別心，更要學觀音的慈悲——與其求觀音，不如自己去做別人的觀音。","links":[{"t":"星雲大師全集〈觀音法門〉","u":"https://books.masterhsingyun.org/ArticleDetail/artcle2451"},{"t":"星雲大師全集〈大悲懺法會〉","u":"https://books.masterhsingyun.org/ArticleDetail/artcle24264"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T20/T20n1060.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T1060_001"},{"n":"藥師琉璃光如來本願功德經","id":"T0450","coll":"T","vol":14,"j":0,"tags":["各宗","密"],"cat":"《藥師琉璃光如來本願功德經》，唐 玄奘譯，1 卷","c":"藥師如來在因地發了十二大願：願眾生都像自己一樣相好光明、衣食無缺、遠離邪見、身心健康……東方琉璃淨土物資豐足、清淨無病。經中說聽聞並憶念藥師佛的名號，能得種種利益。","p":"受持本經、稱念藥師佛名號；更要學藥師佛的願：讓身邊的人吃得飽、病有所醫、心有正見——這就是人間淨土的樣子。（通行本所附的〈藥師灌頂真言〉出自義淨譯本 T0451，玄奘譯本正文沒有。）","links":[{"t":"星雲大師全集","u":"https://books.masterhsingyun.org/ArticleDetail/artcle2480"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T14/T14n0450.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T0450_001"},{"n":"地藏菩薩本願經","id":"T0412","coll":"T","vol":13,"j":0,"tags":["各宗"],"cat":"《地藏菩薩本願經》，唐 實叉難陀譯，2 卷","c":"佛陀上忉利天為母親說法，講地藏菩薩過去世的孝行與大願，以及眾生造業受報的因果。核心是地藏菩薩的誓願：罪苦眾生還沒有度盡，自己就不成佛。","p":"以孝心和慈悲看待因果：行善積福、警覺業力、轉惡向善；常用於追思超薦與日常誦持。","links":[{"t":"星雲大師全集","u":"https://books.masterhsingyun.org/ArticleDetail/artcle2481"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T13/T13n0412.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T0412_001"},{"n":"盂蘭盆經","id":"T0685","coll":"T","vol":16,"j":0,"tags":["各宗"],"cat":"《佛說盂蘭盆經》，西晉 竺法護譯，1 卷","c":"目連看見亡母墮在餓鬼道，飯一入口就化成火炭，向佛陀求救；佛陀教他在七月十五日僧眾自恣日供養十方僧眾，以這份功德救度七世父母。核心是孝順報恩。","p":"以供僧行善表達孝思，更在日常裡記得父母的恩，把孝順化成行動。","links":[{"t":"星雲大師全集","u":"https://books.masterhsingyun.org/ArticleDetail/artcle2485"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T16/T16n0685.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T0685_001"}]},{"name":"三論宗","intro":"以龍樹、提婆的中觀為宗，講緣起性空、不落兩邊；宗名來自《中論》《十二門論》《百論》三部論（CBETA T1564、T1568、T1569）；這裡收星雲全集介紹過的《中論》與兩部相關論典，般若經另見「各宗共持」。","items":[{"n":"中論","id":"T1564","coll":"T","vol":30,"j":0,"tags":["三論","天台"],"cat":"《中論》，龍樹菩薩造，梵志青目釋，姚秦 鳩摩羅什譯，4 卷","c":"龍樹造偈、青目解釋、羅什漢譯。以空性、緣起與二諦闡明中道：不偏有、不偏無，破斥對世間與出世間的一切執著；開頭的「不生亦不滅，不常亦不斷，不一亦不異，不來亦不出」八不，說明諸法沒有自性，是中觀的根本典籍。","p":"以中道正觀破除常見與斷見：不執有、也不執空，正見由此生起。","links":[{"t":"星雲大師全集","u":"https://books.masterhsingyun.org/ArticleDetail/artcle2944"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T30/T30n1564.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T1564_001"},{"n":"大智度論","id":"T1509","coll":"T","vol":25,"j":0,"tags":["三論","天台","各宗"],"cat":"《大智度論》，龍樹菩薩造，後秦 鳩摩羅什譯，100 卷","c":"龍樹解釋《大品般若經》的大論。說明菩薩如何修六波羅蜜，收了大量本生故事，廣引阿含與大乘經典，有如當時佛教的百科全書，奠定了大乘思想的基礎。","p":"用六度的故事對照日常，看清每一度怎樣落到生活裡。","links":[{"t":"星雲大師全集","u":"https://books.masterhsingyun.org/ArticleDetail/artcle2943"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T25/T25n1509.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T1509_001"},{"n":"大乘大義章","id":"T1856","coll":"T","vol":45,"j":0,"tags":["三論","淨土"],"cat":"《鳩摩羅什法師大義》，東晉 慧遠問．羅什答，3 卷","c":"廬山慧遠寫信向羅什請教數十個佛學疑難，羅什一一作答，編成十八章（CBETA 題作《鳩摩羅什法師大義》）。重點在法身：也討論色法由四大組成而本質虛妄、念佛三昧中所見的佛，以及大乘以空為究竟。","p":"不執著法身的形相與文字戲論；以般若觀照無常與空性，正確理解念佛三昧。","links":[{"t":"星雲大師全集","u":"https://books.masterhsingyun.org/ArticleDetail/artcle2956"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T45/T45n1856.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T1856_001"}]},{"name":"法相宗","intro":"玄奘、窺基所傳的唯識學，以「萬法唯識」說明心與世界，修行講轉識成智；俱舍學後來也併入這一宗。","items":[{"n":"解深密經","id":"T0676","coll":"T","vol":16,"j":0,"tags":["法相"],"cat":"《解深密經》，唐 玄奘譯，5 卷","c":"唯識學的根本經典，八品，從境、行、果說明義理：辨析遍計所執、依他起、圓成實三種自性，以三時教判別了義與不了義，並提出阿賴耶識等觀念。","p":"止觀雙修，觀察一切都是心識所現，是唯識觀行的入門依據。","links":[{"t":"星雲大師全集","u":"https://books.masterhsingyun.org/ArticleDetail/artcle2490"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T16/T16n0676.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T0676_001"},{"n":"瑜伽師地論","id":"T1579","coll":"T","vol":30,"j":0,"tags":["法相"],"cat":"《瑜伽師地論》，彌勒菩薩說，唐 玄奘譯，100 卷","c":"相傳彌勒說、無著記。有系統地說明修行者由凡入聖所經歷的十七地，並闡述阿賴耶識與唯識思想，是瑜伽行派的根基、法相宗最主要的依據；主張不偏於空、也不執著有。","p":"依十七地的次第，從聞、思、修三慧走上菩薩道，循序漸進。","links":[{"t":"星雲大師全集","u":"https://books.masterhsingyun.org/ArticleDetail/artcle2939"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T30/T30n1579.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T1579_001"},{"n":"攝大乘論","id":"T1594","coll":"T","vol":31,"j":0,"tags":["法相","攝論"],"cat":"《攝大乘論本》，無著菩薩造，唐 玄奘譯，3 卷","c":"從實踐的角度統攝大乘：以阿賴耶識為所依，說三自性、六度、十地、無分別智與佛的三身，可說是一部大乘佛教概論。真諦的舊譯曾開出攝論學派，後來併入法相。","p":"透過唯識的聞思與觀照，理解六度十地的次第，以止觀和無分別智精進。","links":[{"t":"星雲大師全集","u":"https://books.masterhsingyun.org/ArticleDetail/artcle2941"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T31/T31n1594.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T1594_001"},{"n":"唯識二十論","id":"T1590","coll":"T","vol":31,"j":0,"tags":["法相"],"cat":"《唯識二十論》，世親菩薩造，唐 玄奘譯，1 卷","c":"世親以偈頌論證：外境都是心識所現，離開心識沒有實在的外物；並以夢境、地獄等譬喻，回應外道與小乘的質疑。","p":"體會「境由心現」：少一分對外境的抓取，也就少一分我執。","links":[{"t":"星雲大師全集","u":"https://books.masterhsingyun.org/ArticleDetail/artcle2932"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T31/T31n1590.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T1590_001"},{"n":"唯識三十論頌","id":"T1586","coll":"T","vol":31,"j":0,"tags":["法相"],"cat":"《唯識三十論頌》，世親菩薩造，唐 玄奘譯，1 卷","c":"世親以三十首偈頌說明萬法由心識轉變而現，三類能變識各司其職：前段講現象的相狀，中段點出本性，最後列出從凡夫到成佛的修行階位。","p":"依資糧、加行、通達、修習、究竟五位，一步步實踐、證入。","links":[{"t":"星雲大師全集","u":"https://books.masterhsingyun.org/ArticleDetail/artcle2935"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T31/T31n1586.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T1586_001"},{"n":"大乘百法明門論","id":"T1614","coll":"T","vol":31,"j":0,"tags":["法相"],"cat":"《大乘百法明門論》，天親菩薩造，唐 玄奘譯，1 卷","c":"世親從《瑜伽師地論》中提綱挈領，列出一百種法，歸為心法、心所有法、色法、心不相應行法、無為法五位，指出萬法不離心識，並沒有實在的「我」與「法」。","p":"通達人無我、法無我，斷除我執與法執，是入門修證的基礎。","links":[{"t":"星雲大師全集","u":"https://books.masterhsingyun.org/ArticleDetail/artcle2928"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T31/T31n1614.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T1614_001"},{"n":"八識規矩頌","id":"T1865","coll":"T","vol":45,"j":0,"tags":["法相"],"cat":"《八識規矩補註》，明 普泰補註，2 卷","c":"相傳玄奘所作，四章四十八句，概括整個唯識學：一切活動都離不開八識——前五識、意識、末那識、阿賴耶識；並說明如何轉八識成四智：成所作智、妙觀察智、平等性智、大圓鏡智。頌文收在明代普泰的《八識規矩補註》中。","p":"掌握每一識所緣的境界、它的性質與相應的心所，明白轉識成智的次第。","links":[{"t":"星雲大師全集","u":"https://books.masterhsingyun.org/ArticleDetail/artcle2922"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T45/T45n1865.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T1865_001"},{"n":"俱舍論","id":"T1558","coll":"T","vol":29,"j":0,"tags":["法相","俱舍"],"cat":"《阿毘達磨俱舍論》，尊者世親造，唐 玄奘譯，30 卷","c":"以四聖諦為綱：苦、集說明迷的世界怎樣輾轉相生，滅、道說明悟的世界怎樣成就；以五蘊、十二處、十八界總攝一切法，細分為七十五法，最後破除實我，顯示諸法無我。","p":"把迷與悟的因果、諸法的性質弄清楚，作為修定、修慧的基礎。","links":[{"t":"星雲大師全集","u":"https://books.masterhsingyun.org/ArticleDetail/artcle2930"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T29/T29n1558.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T1558_001"},{"n":"觀彌勒菩薩上生兜率天經","id":"T0452","coll":"T","vol":14,"j":0,"tags":["法相","各宗"],"cat":"《佛說觀彌勒菩薩上生兜率天經》，宋 沮渠京聲譯，1 卷","c":"彌勒菩薩在兜率天為天人說法；經中說兜率淨土離人間不遠，皈依三寶、持戒布施、發願稱念彌勒名號，便能往生。玄奘臨終發願往生兜率，窺基也為此經作疏。","p":"持戒、布施、供養、讀誦就是日常功課；彌勒以慈悲度眾，菩薩行落實在現實的利益上。","links":[{"t":"星雲大師全集","u":"https://books.masterhsingyun.org/ArticleDetail/artcle2479"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T14/T14n0452.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T0452_001"},{"n":"彌勒下生經","id":"T0453","coll":"T","vol":14,"j":0,"tags":["法相","各宗"],"cat":"《佛說彌勒下生經》，西晉 竺法護譯，1 卷","c":"預言彌勒菩薩未來下生人間成佛，在龍華樹下三會說法，度化無量眾生；那時的人間清淨安樂，是佛教對未來人間淨土的描繪。","p":"今生來不及往生兜率，也可以發願值遇龍華三會；更積極的是，從現在就動手把人間建設成那個樣子。","links":[{"t":"星雲大師全集","u":"https://books.masterhsingyun.org/ArticleDetail/artcle2479"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T14/T14n0453.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T0453_001"}]},{"name":"天台宗","intro":"智顗以《法華經》為根本，教觀並重：判教讓人看清佛法的全貌，止觀讓人在心上實修。","items":[{"n":"妙法蓮華經","id":"T0262","coll":"T","vol":9,"j":0,"tags":["天台","各宗"],"cat":"《妙法蓮華經》，姚秦 鳩摩羅什譯，7 卷","c":"主旨是「開權顯實」：聲聞、緣覺、菩薩三乘都是方便，最後同歸一佛乘，人人都能成佛。經中以火宅、窮子、化城等譬喻表現佛陀的悲心，並揭示佛陀成道以來久遠、壽命無量。","p":"以信心受持、讀誦、書寫；記得「一乘平等、人人能成佛」，對自己有信心，也不輕視任何人。","links":[{"t":"星雲大師全集","u":"https://books.masterhsingyun.org/ArticleDetail/artcle2128"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T09/T09n0262.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T0262_001"},{"n":"大般涅槃經","id":"T0374","coll":"T","vol":12,"j":0,"tags":["天台","涅槃師"],"cat":"《大般涅槃經》，北涼 曇無讖譯，40 卷","c":"曇無讖所譯的北本。說明佛的法身常住不滅，涅槃具有常、樂、我、淨；一切眾生都有佛性，連被認為斷了善根的一闡提也終能成佛。經中以醍醐、眾盲摸象等譬喻，把深義說得生動。南北朝的涅槃師以它為宗，天台則把它與《法華經》同列為最後的醍醐。","p":"對自己的佛性有信心，明白是煩惱把它遮住了；所以持戒精進、斷除煩惱，也不輕視任何眾生。","links":[{"t":"星雲大師全集","u":"https://books.masterhsingyun.org/ArticleDetail/artcle2115"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T12/T12n0374.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T0374_001"},{"n":"金光明經","id":"T0663","coll":"T","vol":16,"j":0,"tags":["天台","護國"],"cat":"《金光明經》，北涼 曇無讖譯，4 卷","c":"〈壽量品〉揭示佛陀壽命無量，使人發起廣大菩提心；〈懺悔品〉以懺悔法門淨除業障；又說四天王護持國土。智者大師為它講述玄義與文句；日本以《金光明經》（多用義淨譯的《金光明最勝王經》）與《法華經》《仁王經》合稱護國三部經。","p":"依懺悔法門淨除業障；觀想佛壽無量，發起大菩提心。","links":[{"t":"星雲大師全集","u":"https://books.masterhsingyun.org/ArticleDetail/artcle2487"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T16/T16n0663.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T0663_001"},{"n":"摩訶止觀","id":"T1911","coll":"T","vol":46,"j":0,"tags":["天台"],"cat":"《摩訶止觀》，隋 智顗說，10 卷","c":"智顗晚年在荊州玉泉寺宣講、灌頂筆錄，是天台最成熟的論著。以「五略十廣」的架構講圓頓止觀：發菩提心、四種三昧、十種所觀之境（實際講到第七「諸見境」為止）與十乘觀法，是教觀並重的代表作。","p":"依四種三昧與十乘觀法循序調心，在十境中辨識魔障與煩惱、一一破除。","links":[{"t":"星雲大師全集","u":"https://books.masterhsingyun.org/ArticleDetail/artcle2948"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T46/T46n1911.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T1911_001"},{"n":"天台四教儀","id":"T1931","coll":"T","vol":46,"j":0,"tags":["天台"],"cat":"《天台四教儀》，高麗 諦觀錄，1 卷","c":"高麗諦觀所錄的天台入門書。以五時說明佛陀說法的次第，分化儀四教（頓、漸、祕密、不定）與化法四教（藏、通、別、圓），並介紹圓教位次、二十五方便與十乘觀法。","p":"先具足持戒、閒居靜處、親近善知識等條件，調和身心、去除五蓋，再依十乘觀法修觀，循序而進。","links":[{"t":"星雲大師全集","u":"https://books.masterhsingyun.org/ArticleDetail/artcle2946"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T46/T46n1931.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T1931_001"},{"n":"教觀綱宗","id":"T1939","coll":"T","vol":46,"j":0,"tags":["天台"],"cat":"《教觀綱宗》，明 智旭述，1 卷","c":"明末蕅益智旭所作，原名《一代時教權實綱要圖》，以教觀兼備的立場講五時八教與十乘觀法；強調「教非觀不傳，觀非教不正」，並把四教比喻成對治不同煩惱的藥。","p":"先掌握判教的大綱，再依十乘觀法安心修止觀，明白自己的位次，不致凡聖混淆。","links":[{"t":"星雲大師全集","u":"https://books.masterhsingyun.org/ArticleDetail/artcle2947"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T46/T46n1939.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T1939_001"}]},{"name":"華嚴宗","intro":"依《華嚴經》講法界緣起、事事無礙；杜順、智儼、法藏、澄觀、宗密相承，普賢的行願是它的實踐。","items":[{"n":"大方廣佛華嚴經","id":"T0279","coll":"T","vol":10,"j":0,"tags":["華嚴","各宗"],"cat":"《大方廣佛華嚴經》，唐 實叉難陀譯，80 卷","c":"實叉難陀所譯的八十卷本，九會三十九品。以毗盧遮那佛的自證境界為主軸，講一心法界的廣大無邊，因行與果德互相輝映，展現重重無盡、事事無礙的世界，並鋪陳菩薩修行的層層位次。","p":"〈淨行品〉教人把日常每個動作都化成利益眾生的願；〈入法界品〉善財童子五十三參，示範一路參學、處處有善知識。","links":[{"t":"星雲大師全集","u":"https://books.masterhsingyun.org/ArticleDetail/artcle2130"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T10/T10n0279.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T0279_001"},{"n":"普賢行願品","id":"T0293","coll":"T","vol":10,"j":40,"tags":["華嚴","淨土"],"cat":"《大方廣佛華嚴經》，唐 般若譯，40 卷","c":"四十卷《華嚴經》全經題為〈入不思議解脫境界普賢行願品〉，通行單行的〈普賢行願品〉就是第四十卷。普賢菩薩告訴善財與大眾：要成就如來的功德，應修十種廣大行願——禮敬諸佛、稱讚如來、廣修供養、懺悔業障、隨喜功德、請轉法輪、請佛住世、常隨佛學、恆順眾生、普皆回向；末段發願臨命終時往生極樂。","p":"星雲大師把十大願講成生活的功課：禮敬是尊重每個人，稱讚是多說好話，懺悔要成為一生的性格，隨喜是見到別人行善也歡喜，回向是把自己有的與大家分享。","links":[{"t":"星雲大師全集","u":"https://books.masterhsingyun.org/ArticleDetail/artcle18762"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T10/T10n0293.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T0293_040"},{"n":"大方廣如來不思議境界經","id":"T0301","coll":"T","vol":10,"j":0,"tags":["華嚴"],"cat":"《大方廣如來不思議境界經》，唐 實叉難陀譯，1 卷","c":"佛陀在菩提樹下入「如來不思議境界」三昧，德藏菩薩請問，普賢菩薩解說：眾生隨自己的心與業，看見淨土或穢土，就像餓鬼看恆河只見膿血；一切佛土都是心所現——「自心作佛，離心無佛」。菩薩若能了知諸佛與一切法唯是心量，便得隨順忍。","p":"經中說想證此三昧，先要修智慧：遠離妄語、綺語和散亂無益的事，對眾生起大悲而常常攝心，再到佛像前禮拜、思惟十方諸佛——正語、正念、正定，一樣不少。","links":[],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T10/T10n0301.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T0301_001"},{"n":"華嚴五教章","id":"T1866","coll":"T","vol":45,"j":0,"tags":["華嚴"],"cat":"《華嚴一乘教義分齊章》，唐 法藏述，4 卷","c":"法藏所著，CBETA 題作《華嚴一乘教義分齊章》。分十門概說華嚴教義：先建立一乘，再把佛陀一代教法判為五教十宗，認為《華嚴經》是別教一乘；最後論十玄緣起與六相圓融，是法界緣起的核心論著。","p":"先掌握各宗義理在整體佛法中的位置，再體會華嚴圓融無盡的境界。","links":[{"t":"星雲大師全集","u":"https://books.masterhsingyun.org/ArticleDetail/artcle2945"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T45/T45n1866.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T1866_001"},{"n":"圓覺經","id":"T0842","coll":"T","vol":17,"j":0,"tags":["華嚴","禪"],"cat":"《大方廣圓覺修多羅了義經》，唐 佛陀多羅譯，1 卷","c":"由十二位菩薩依次向佛請問。眾生本具清淨的圓覺，迷了就輪迴，悟了就解脫；並指出修行要避開作、任、止、滅四種病，以平等心對待一切。宗密為它作疏，在華嚴與禪門都很受重視。","p":"依奢摩他、三摩缽提、禪那三種止觀，以二十五輪次第修習，離幻證覺。","links":[{"t":"星雲大師全集","u":"https://books.masterhsingyun.org/ArticleDetail/artcle2488"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T17/T17n0842.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T0842_001"}]},{"name":"律宗","intro":"「以戒為師」：道宣依《四分律》（CBETA T1428）立南山宗，戒律是一切宗派共同的地基。這裡收星雲全集介紹過的三部；《南海寄歸內法傳》記的是印度說一切有部的律儀，可與南山對照。","items":[{"n":"梵網經","id":"T1484","coll":"T","vol":24,"j":0,"tags":["律","各宗菩薩戒"],"cat":"《梵網經》，後秦 鳩摩羅什譯，2 卷","c":"說明菩薩修行的位次，以及應受持的十重四十八輕戒。釋迦牟尼佛在菩提樹下初結菩薩戒時就說「孝名為戒」：戒的根本與孝相通，孝心使人遠離惡行、開顯佛性，成就菩薩道。漢傳出家、在家受菩薩戒，多依此經。","p":"以慈悲與孝順為根本，用十重四十八輕戒檢視言行，作為受持菩薩戒的日常依據。","links":[{"t":"星雲大師全集","u":"https://books.masterhsingyun.org/ArticleDetail/artcle2491"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T24/T24n1484.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T1484_001"},{"n":"佛遺教經","id":"T0389","coll":"T","vol":12,"j":0,"tags":["律","禪","各宗"],"cat":"《佛垂般涅槃略說教誡經》，姚秦 鳩摩羅什譯，1 卷","c":"佛陀入涅槃前在娑羅雙樹間留下的最後教誡，叮囑弟子在佛滅後尊重戒律，「此則是汝大師」。先說世間功德：守持戒律、節制五根、不放逸；再說出世間功德：少欲知足、精進、正念、禪定、智慧，不作戲論。雖對比丘而說，道理人人適用。","p":"把持戒、知足、精進當作日常自我約束的準則；以正念與禪定守護心念，不讓它放逸。","links":[{"t":"星雲大師全集","u":"https://books.masterhsingyun.org/ArticleDetail/artcle2114"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T12/T12n0389.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T0389_001"},{"n":"南海寄歸內法傳","id":"T2125","coll":"T","vol":54,"j":0,"tags":["律","史傳"],"cat":"《南海寄歸內法傳》，唐 義淨撰，4 卷","c":"義淨赴印度求法，歸途中在南海寫下的見聞，詳細描述印度僧眾的飲食、衣著、洗浴、禮拜與安居等戒律實踐，保存了根本說一切有部寺院生活的珍貴史料。","p":"對照古印度僧團的威儀檢視自己，建立如法的生活態度。","links":[{"t":"星雲大師全集","u":"https://books.masterhsingyun.org/ArticleDetail/artcle2974"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T54/T54n2125.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T2125_001"}]},{"name":"淨土宗","intro":"以信、願、行三資糧，念佛求生阿彌陀佛的極樂淨土；也勉勵人在娑婆建設人間淨土。","items":[{"n":"佛說無量壽經","id":"T0360","coll":"T","vol":12,"j":0,"tags":["淨土"],"cat":"《佛說無量壽經》，曹魏 康僧鎧譯，2 卷","c":"俗稱「大本」。講阿彌陀佛在因地發四十八願，成就清淨莊嚴的極樂國土；經中也描述五惡、五痛、五燒的苦，勸人精進修行、發願往生，並說明三輩往生的差別。","p":"以信、願、行建立念佛的信心，明白往生的因與方法。","links":[{"t":"星雲大師全集","u":"https://books.masterhsingyun.org/ArticleDetail/artcle2478"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T12/T12n0360.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T0360_001"},{"n":"佛說觀無量壽佛經","id":"T0365","coll":"T","vol":12,"j":0,"tags":["淨土"],"cat":"《佛說觀無量壽佛經》，宋 畺良耶舍譯，1 卷","c":"緣起於阿闍世王幽禁父王，母后韋提希憂苦求佛；佛陀為她示現西方淨土，教她修三福與十六種觀想：觀阿彌陀佛、觀世音與大勢至二菩薩，以及淨土的種種莊嚴。","p":"觀想與持名相輔相成；經中說孝養父母、受持戒律、發菩提心深信因果這三福，是「三世諸佛淨業正因」，也是做人的根本。","links":[{"t":"星雲大師全集","u":"https://books.masterhsingyun.org/ArticleDetail/artcle2478"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T12/T12n0365.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T0365_001"},{"n":"佛說阿彌陀經","id":"T0366","coll":"T","vol":12,"j":0,"tags":["淨土","各宗晚課"],"cat":"《佛說阿彌陀經》，姚秦 鳩摩羅什譯，1 卷","c":"俗稱「小本」。描寫西方極樂世界的清淨莊嚴，說明往生要具足信、願、行三資糧，「執持名號」、一心不亂，並有六方諸佛同聲讚歎護念作證；也勉勵人在娑婆世界建立淨土的信念。","p":"持名念佛，信願行具足；叢林晚課也誦此經。","links":[{"t":"星雲大師全集","u":"https://books.masterhsingyun.org/ArticleDetail/artcle2478"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T12/T12n0366.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T0366_001"},{"n":"大勢至菩薩念佛圓通章","id":"T0945","coll":"T","vol":19,"j":5,"tags":["淨土"],"cat":"《大佛頂如來密因修證了義諸菩薩萬行首楞嚴經》，唐 般剌蜜帝譯，10 卷","c":"《楞嚴經》卷五二十五圓通中的一章。大勢至菩薩自述：十方如來憐念眾生，如母憶子；眾生若憶佛念佛，現前當來必定見佛；他在因地就是以念佛心入無生忍。星雲大師說，大勢至與觀世音同為西方三聖的脇侍，一位代表智慧、一位代表慈悲。","p":"「都攝六根，淨念相繼」：念佛時收攝眼耳鼻舌身意，一句佛號接一句，像孩子想念母親一樣真切——這正是正念與正定的功夫。","links":[{"t":"星雲大師全集","u":"https://books.masterhsingyun.org/ArticleDetail/artcle15165"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T19/T19n0945.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T0945_005"}]},{"name":"禪宗","intro":"不立文字、直指人心；但祖師的語錄、燈錄與清規，同樣是禪門代代相傳的經典。","items":[{"n":"六祖大師法寶壇經","id":"T2008","coll":"T","vol":48,"j":0,"tags":["禪"],"cat":"《六祖大師法寶壇經》，元 宗寶編，1 卷","c":"記錄六祖惠能在韶州大梵寺等處的說法。主張每個人自心本具般若智慧，返照自性就能覺悟，不必拘泥文字；以定慧一體為本，以「無念為宗、無相為體、無住為本」為綱領，強調禪不離日常生活。這裡列的 T2008 是元代宗寶本，CBETA 另收有敦煌本 T2007。","p":"行住坐臥、搬柴運水，都可以反觀自性，在念念之間體認本性清淨。","links":[{"t":"星雲大師全集","u":"https://books.masterhsingyun.org/ArticleDetail/artcle2949"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T48/T48n2008.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T2008_001"},{"n":"楞伽阿跋多羅寶經","id":"T0670","coll":"T","vol":16,"j":0,"tags":["禪","法相"],"cat":"《楞伽阿跋多羅寶經》，劉宋 求那跋陀羅譯，4 卷","c":"求那跋陀羅所譯的四卷本。闡明諸法唯心，以五法、三自性、八識、二無我為綱，說明如來藏與阿賴耶識的關係；菩提達摩以四卷《楞伽》傳給慧可，它也是法相宗所依的六經之一。經中並主張不食肉。","p":"經中講四種禪，從觀人無我、法無我，一步步進入如來禪。","links":[{"t":"星雲大師全集","u":"https://books.masterhsingyun.org/ArticleDetail/artcle2489"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T16/T16n0670.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T0670_001"},{"n":"祖堂集","id":"B0144","coll":"B","vol":25,"j":0,"tags":["禪"],"cat":"《祖堂集》，靜、筠二禪德編著，20 卷","c":"南唐保大十年（952）由靜、筠二位禪師編成，記述從過去七佛、初祖大迦葉到唐末五代諸禪師的傳承，收錄行狀與大量機鋒問答，是現存最早的禪宗燈史之一，保存了許多別處沒有的公案與偈頌。","p":"從歷代禪師的問答與悟道因緣中，找到參禪的契機，警醒自心、破除執著。","links":[{"t":"星雲大師全集","u":"https://books.masterhsingyun.org/ArticleDetail/artcle2950"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/B/B25/B25n0144.xml","cb":"https://cbetaonline.dila.edu.tw/zh/B0144_001"},{"n":"景德傳燈錄","id":"T2076","coll":"T","vol":51,"j":0,"tags":["禪"],"cat":"《景德傳燈錄》，宋 道原纂，30 卷","c":"北宋道原所編。記述禪宗從過去七佛、西天諸祖、東土六祖，一直到法眼文益的法嗣，收錄一千七百多人的機緣問答；「傳燈」是說法脈像燈火一樣輾轉相傳、不曾熄滅。","p":"讀祖師的機緣語句與悟道偈，體會師徒印證的過程，作為參禪學道的指南。","links":[{"t":"星雲大師全集","u":"https://books.masterhsingyun.org/ArticleDetail/artcle2951"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T51/T51n2076.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T2076_001"},{"n":"禪林寶訓","id":"T2022","coll":"T","vol":48,"j":0,"tags":["禪"],"cat":"《禪林寶訓》，宋 淨善重集，4 卷","c":"南宋淨善重集，收錄黃龍慧南到佛照拙菴等宋代禪師約三百則遺語，每則註明出處；勸人以道德立身，看重學問、誠實與謙和，也指點住持怎樣審慎取捨、誠懇待人、以德化眾。","p":"歷來是禪林初學的入門書，用來培養正直的操守與踏實的修行態度。","links":[{"t":"星雲大師全集","u":"https://books.masterhsingyun.org/ArticleDetail/artcle2953"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T48/T48n2022.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T2022_001"},{"n":"禪林象器箋","id":"B0103","coll":"B","vol":19,"j":0,"tags":["禪"],"cat":"《禪林象器箋》，無著道忠著，30 卷","c":"日本臨濟宗學僧無著道忠編撰的禪宗制度辭典，彙集《百丈清規》以來各種清規中有關寺院規矩、儀式與器物的用語，引據古書一一解釋，分二十九類、一千七百多條，可說是禪寺的百科全書。","p":"了解禪林的職事、禮儀與法會規矩從何而來，在寺院裡依序而行、安心修學。","links":[{"t":"星雲大師全集","u":"https://books.masterhsingyun.org/ArticleDetail/artcle2952"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/B/B19/B19n0103.xml","cb":"https://cbetaonline.dila.edu.tw/zh/B0103_001"},{"n":"萬善同歸集","id":"T2017","coll":"T","vol":48,"j":0,"tags":["禪","淨土"],"cat":"《萬善同歸集》，宋 延壽述，3 卷","c":"永明延壽以問答體寫成。主張一切善行都以實相為根本、同歸一處；站在教禪一致的立場闡明萬法唯心、理事無礙，依真俗二諦廣修萬行，廣引經論會通各家。","p":"萬行都從自心發起；體認唯心淨土、自性彌陀，以禪淨雙修相輔。","links":[{"t":"星雲大師全集","u":"https://books.masterhsingyun.org/ArticleDetail/artcle2957"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T48/T48n2017.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T2017_001"}]},{"name":"密宗","intro":"唐代善無畏、金剛智、不空傳入的真言密教，以《大日經》《金剛頂經》為兩部大經；在漢地中斷後，由空海在日本開創真言宗，傳承至今。","items":[{"n":"大日經","id":"T0848","coll":"T","vol":18,"j":0,"tags":["密"],"cat":"《大毘盧遮那成佛神變加持經》，唐 善無畏．一行譯，7 卷","c":"善無畏與一行共譯，是胎藏界的根本大經。主旨在開顯眾生本有的清淨菩提心：以菩提心為因、大悲為根本、方便為究竟，說明因、行、果三位，並述各種修法儀軌。","p":"高野山真言宗說，真言密教的修法叫「三密加持」：佛的身、口、意與修行人的身、口、意互相感應，佛入我、我入佛，稱為「入我我入」。換成人間佛教的話：身做好事、口說好話、心存好念，就是把自己的身口意調成佛的樣子，也就是八正道的正業、正語、正思惟；而「方便為究竟」，提醒一切修行最後要落實在利益眾生。","links":[{"t":"星雲大師全集","u":"https://books.masterhsingyun.org/ArticleDetail/artcle6769"},{"t":"高野山真言宗〈高野山真言宗とは〉","u":"https://www.koyasan.or.jp/sp/shingonshu/"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T18/T18n0848.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T0848_001"},{"n":"金剛頂經","id":"T0865","coll":"T","vol":18,"j":0,"tags":["密"],"cat":"《金剛頂一切如來真實攝大乘現證大教王經》，唐 不空譯，3 卷","c":"不空所譯的三卷本，是金剛界的根本大經；相傳原有十萬頌、十八會。主旨在修證本有不生的真理，金剛界曼荼羅就依此經而作，與胎藏界一理一智、互相契合。","p":"高野山真言宗說，密教的佛就是宇宙真理本身，稱為法身；法身直接向眾生說法，聽見它的當下，就是三密加持的境界。從人間佛教看：真理不在遙遠的地方，就在每天的身口意裡；以金剛般堅固的正見與正精進，把本有的智慧開顯出來。","links":[{"t":"星雲大師全集","u":"https://books.masterhsingyun.org/ArticleDetail/artcle6769"},{"t":"高野山真言宗〈高野山真言宗とは〉","u":"https://www.koyasan.or.jp/sp/shingonshu/"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T18/T18n0865.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T0865_001"},{"n":"蘇悉地經","id":"T0893a","coll":"T","vol":18,"j":0,"tags":["密"],"cat":"《蘇悉地羯羅經》，唐 輸波迦羅譯，3 卷","c":"善無畏（梵名輸波迦羅）所譯，廣說佛部、蓮華部、金剛部三部成就的儀軌，涵蓋持誦、灌頂、護摩等；與《大日經》《金剛頂經》並稱密教三部大經；天台密教更以它會通金剛、胎藏兩部。CBETA 收有三種傳本（T0893a、b、c）。","p":"高野山真言宗說，修法以佛與法界的「加持力」為前提，目的在證悟佛的智慧、累積功德、救度眾生並使他們得到幸福。所以儀軌不是形式：持誦、供養都要以清淨的身口意來做，最後回到利他——這就是正精進。","links":[{"t":"星雲大師全集","u":"https://books.masterhsingyun.org/ArticleDetail/artcle6769"},{"t":"高野山真言宗〈高野山真言宗とは〉","u":"https://www.koyasan.or.jp/sp/shingonshu/"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T18/T18n0893a.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T0893a_001"},{"n":"仁王護國般若波羅蜜多經","id":"T0246","coll":"T","vol":8,"j":0,"tags":["密","護國"],"cat":"《仁王護國般若波羅蜜多經》，唐 不空譯，2 卷","c":"不空新譯。佛陀為十六大國的國王說法：以般若智慧守護佛果、修十地善行，並護持國土。經中以諸法皆空破除執著，又強調緣起假有，避免落入斷滅，主張真俗二諦不二。","p":"受持讀誦、如法修行，用般若守護自心，也守護國土與大眾的平安。","links":[{"t":"星雲大師全集","u":"https://books.masterhsingyun.org/ArticleDetail/artcle2125"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T08/T08n0246.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T0246_001"},{"n":"虛空藏菩薩經","id":"T0405","coll":"T","vol":13,"j":0,"tags":["密","懺悔"],"cat":"《虛空藏菩薩經》，姚秦 佛陀耶舍譯，1 卷","c":"佛陀說虛空藏菩薩具大慈悲，能救拔犯了根本重罪、善根將盡的眾生：國王、大臣、聲聞、初發心菩薩各有應當警惕的根本罪；菩薩會在夢中或醒時以種種形象出現，為人說法、說明病相與藥方，引導他們懺悔。","p":"經中教犯了罪的人至誠發露懺悔、誓不再犯，安住布施、持戒、忍辱、精進、禪定、智慧，勤修慈悲。懺悔不是自責到底，而是看清苦從哪裡來（集），立刻改過向前（道）。","links":[],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T13/T13n0405.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T0405_001"},{"n":"虛空藏求聞持法","id":"T1145","coll":"T","vol":20,"j":0,"tags":["密"],"cat":"《虛空藏菩薩能滿諸願最勝心陀羅尼求聞持法》，唐 善無畏譯，1 卷","c":"題下註明出自《金剛頂經》〈成就一切義品〉。教人在絹布或淨板上畫滿月，月中畫虛空藏菩薩像，持誦菩薩的心陀羅尼，前後通計滿一百萬遍，中間不可間斷，最後在日蝕或月蝕時供養三寶、完成修法，求得「聞持」——聽過的法都能憶持不忘。","p":"經中也說，即使不作壇法、只是常常持誦，也有福德。從人間佛教看，求記憶是為了把法用出來：恆持不斷是正精進，時時憶念法義是正念，學到的要回饋大眾。","links":[],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T20/T20n1145.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T1145_001"}]},{"name":"史傳與典籍","intro":"不是用來誦的經，而是讓人看見佛法在人間走過的路：譯經、求法、護教、寺院與僧尼的一生。","items":[{"n":"高僧傳","id":"T2059","coll":"T","vol":50,"j":0,"tags":["史傳"],"cat":"《高僧傳》，梁 慧皎撰，14 卷","c":"梁代慧皎所撰，收錄東漢明帝到梁天監十八年二百五十多位高僧的傳記，依譯經、義解、神異、習禪、明律等十科分類，保存了中國早期佛教的珍貴史料；這個遊戲前半的許多場景都依據它。","p":"從譯經、講經、禪定與持戒的事蹟中，看見修學者應有的精進與德行。","links":[{"t":"星雲大師全集","u":"https://books.masterhsingyun.org/ArticleDetail/artcle2976"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T50/T50n2059.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T2059_001"},{"n":"比丘尼傳","id":"T2063","coll":"T","vol":50,"j":0,"tags":["史傳"],"cat":"《比丘尼傳》，梁 寶唱撰，4 卷","c":"梁代寶唱所撰，記述從東晉升平年間到梁天監年間六十五位比丘尼的生平：講經說法、建寺度眾、禪定苦行、護持戒律，是研究魏晉南北朝尼眾史的重要資料；中國第一位比丘尼淨檢的傳就在卷首。","p":"從比丘尼守戒、勤學、精進的身影中得到啟發。","links":[{"t":"星雲大師全集","u":"https://books.masterhsingyun.org/ArticleDetail/artcle2977"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T50/T50n2063.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T2063_001"},{"n":"高僧法顯傳","id":"T2085","coll":"T","vol":51,"j":0,"tags":["史傳"],"cat":"《高僧法顯傳》，東晉 法顯記，1 卷","c":"又名《佛國記》，法顯親自記述的西行求法經歷：從長安出發，穿越西域，遍訪中印度與師子國（今斯里蘭卡），帶回大量梵本；沿途記下各國的佛教盛況、聖跡與風俗，是現存最早的中國僧人西行求法記。","p":"學習法顯年過六十仍為求法不畏艱險的毅力，也認識聖地與古代僧團的樣貌。","links":[{"t":"星雲大師全集","u":"https://books.masterhsingyun.org/ArticleDetail/artcle2973"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T51/T51n2085.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T2085_001"},{"n":"大唐西域記","id":"T2087","coll":"T","vol":51,"j":0,"tags":["史傳"],"cat":"《大唐西域記》，唐 玄奘譯．辯機撰，12 卷","c":"玄奘口述、辯機撰文，奉唐太宗之命寫成。記載玄奘親歷的一百一十國與傳聞的二十八國：疆域、氣候、風俗、語言、宗教與佛教遺跡，是研究古代中亞、南亞史地與佛教最重要的典籍之一。","p":"透過玄奘的見聞認識佛陀遺跡與印度各派佛教的分布，理解佛教的源流。","links":[{"t":"星雲大師全集","u":"https://books.masterhsingyun.org/ArticleDetail/artcle2971"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T51/T51n2087.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T2087_001"},{"n":"洛陽伽藍記","id":"T2092","coll":"T","vol":51,"j":0,"tags":["史傳"],"cat":"《洛陽伽藍記》，元魏 楊衒之撰，5 卷","c":"北魏楊衒之所撰。他重遊洛陽，見昔日大寺在戰亂後大多成為廢墟，有感於盛衰無常，記下城內外四十多座伽藍的緣起、建築與掌故，也保存了宋雲、惠生西行求法的資料。","p":"認識北魏佛教的興衰，體會盛衰無常的道理。","links":[{"t":"星雲大師全集","u":"https://books.masterhsingyun.org/ArticleDetail/artcle2975"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T51/T51n2092.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T2092_001"},{"n":"弘明集","id":"T2102","coll":"T","vol":52,"j":0,"tags":["史傳"],"cat":"《弘明集》，梁 僧祐撰，14 卷","c":"梁代僧祐所編，收集東漢到齊梁約五百年間闡明佛法、回應排佛議論的文章，涵蓋儒、道兩家對出家、沙門禮敬王者、因果報應、神滅與否等問題的辯難，以及佛教的回應。","p":"了解外界對佛教的質疑與回應，堅定信心，也學會好好回答別人的疑問。","links":[{"t":"星雲大師全集","u":"https://books.masterhsingyun.org/ArticleDetail/artcle2978"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T52/T52n2102.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T2102_001"},{"n":"廣弘明集","id":"T2103","coll":"T","vol":52,"j":0,"tags":["史傳"],"cat":"《廣弘明集》，唐 道宣撰，30 卷","c":"唐代道宣接續《弘明集》而編，收錄六朝到唐初一百多位作者的文章，記錄佛教傳入中國後的興衰、佛道論爭與義理探討，分十篇，涵蓋論說、文書、詩賦與詔令。","p":"認識佛教在中國的歷史脈絡與各方論辯，培養歷史眼光與辨正的思考。","links":[{"t":"星雲大師全集","u":"https://books.masterhsingyun.org/ArticleDetail/artcle2979"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T52/T52n2103.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T2103_001"},{"n":"法苑珠林","id":"T2122","coll":"T","vol":53,"j":0,"tags":["史傳","類書"],"cat":"《法苑珠林》，唐 道世撰，100 卷","c":"唐代道世所編的佛教百科，分一百篇，從劫量、三界、六道講到傳記，涵蓋因果業報、戒律禪觀、咒術儀軌與寺塔器物；廣引四百多種經律論與傳記並註明出處，可以當作佛經索引。","p":"查經論、查名相的好工具；因果、懺悔、持戒、布施各篇，也能幫人建立正確的修學觀念。","links":[{"t":"星雲大師全集","u":"https://books.masterhsingyun.org/ArticleDetail/artcle2954"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T53/T53n2122.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T2122_001"},{"n":"經律異相","id":"T2121","coll":"T","vol":53,"j":0,"tags":["史傳","類書"],"cat":"《經律異相》，梁 寶唱等集，50 卷","c":"梁代寶唱等人奉敕編集，從各部經律中搜集罕見的事蹟與譬喻，依天、地、佛、菩薩、僧等分門別類，保存了不少已經失傳的經文內容。","p":"每則都註明出處，可以當作弘法的故事素材，也從善惡因果中體會持戒、布施的意義。","links":[{"t":"星雲大師全集","u":"https://books.masterhsingyun.org/ArticleDetail/artcle2955"}],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/T/T53/T53n2121.xml","cb":"https://cbetaonline.dila.edu.tw/zh/T2121_001"}]},{"name":"印順導師著作","intro":"人間佛教的思想源頭之一。這兩部收在 CBETA《印順法師佛學著作集》，這個遊戲裡的不少史事也依它們核對。","items":[{"n":"成佛之道","id":"Y0012","coll":"Y","vol":12,"j":0,"tags":["人間佛教"],"cat":"《成佛之道》，民國 釋印順著，5 卷","c":"印順導師依太虛大師以「五乘共法、三乘共法、大乘不共法」統攝一切佛法的開示，參考宗喀巴的菩提道次第，以偈頌加增注寫成。分歸敬三寶、聞法趣入、五乘共法、三乘共法、大乘不共法五章，從人乘正行趣向佛道，把一切佛法綜貫為成佛的次第。","p":"按部就班：先做好人——歸依三寶、五戒十善；再生起出離心，依四諦修戒定慧；最後發菩提心，行六度四攝。這正是從四聖諦、八正道走向菩薩道的路。","links":[],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/Y/Y12/Y12n0012.xml","cb":"https://cbetaonline.dila.edu.tw/zh/Y0012_001"},{"n":"佛教史地考論","id":"Y0022","coll":"Y","vol":22,"j":0,"tags":["人間佛教","史學"],"cat":"《佛教史地考論》，民國 釋印順著，20 卷","c":"印順導師的史地考證文集，收錄〈中國佛教史略〉（妙欽法師初稿、導師整理刪補）、〈印度佛教流變概觀〉、〈佛滅紀年抉擇談〉、〈龍樹龍宮取經考〉、〈文殊與普賢〉、〈護法韋馱考〉、〈北印度之教難〉、〈世親的年代〉等，用史料辨明傳說與史實。這個遊戲對各宗興衰的不少判斷，就依據此書。","p":"以理性求真的態度讀佛教史：傳說歸傳說、史實歸史實，信仰才不會建在沙上——這也是正見的一部分。","links":[],"gh":"https://github.com/cbeta-org/xml-p5/blob/master/Y/Y22/Y22n0022.xml","cb":"https://cbetaonline.dila.edu.tw/zh/Y0022_001"}]}]},"baseline":{"s":[0.0945,0.1051,0.1147,0.1189,0.1246,0.1014,0.1211,0.1094,0.1105],"f":[0.2048,0.2802,0.2721,0.2429],"balance":0.984,"wS":0.65,"wF":0.35,"wK":0.08},"notesHtml":"<p>各幕引文已依 CBETA 原典核對，並經多輪獨立審查修訂（史實依 CBETA、印順導師與聖嚴法師著作核對；結局另依四聖諦、八正道審查義理），頁碼標於各幕出處（T 為《大正藏》，X 為《卐續藏》，Y 為《印順法師佛學著作集》）。「你」是虛構的角色，對話依原典文意改寫；「你是某人的弟子」一類的情節是為了遊戲而設。<\/p><p><strong>關於「八宗」。<\/strong> 「漢傳八宗」是近代的歸納，印順導師概括太虛大師之說為「統隋唐來大乘以為八」（印順《太虛大師年譜》，Y13, p. 79）。日本凝然《八宗綱要》的八宗則是俱舍、成實、律、法相、三論、天台、華嚴、真言，與此不同。學界對隋唐的「宗」是學派還是教團組織，亦有不同看法。本腳本也提到三階教等未列入八宗、而確實消失的學派。<\/p><h4>學界有爭議或屬傳說的內容<\/h4><div class=\"tblwrap\"><table><tr><th>幕<\/th><th>內容<\/th><th>本腳本的處理<\/th><\/tr><tr><td>1<\/td><td>道安與僧先飛龍山對談的年代與地望<\/td><td>〈僧先傳〉說僧先「值石氏之亂，隱於飛龍山」，故置於石虎死後的後趙末年；方廣錩考證道安到飛龍山約在 352–353 年。飛龍山即封龍山，在今河北石家莊西南，一說在山西渾源；地圖依前說<\/td><\/tr><tr><td>3<\/td><td>羅什卒年<\/td><td>《高僧傳》作 409，僧肇誄文作 413；兩說並列<\/td><\/tr><tr><td>3、21<\/td><td>羅什譯經部數、不空攜回經數<\/td><td>腳本依《出三藏記集》《宋高僧傳》；聖嚴譯《中國佛教史概說》另作七十四部三百八十四卷、梵本一千二百卷<\/td><\/tr><tr><td>4<\/td><td>白蓮社、十八高賢、虎溪三笑<\/td><td>後世的附會；慧遠念佛為般舟三昧，依印順《淨土與禪》<\/td><\/tr><tr><td>5<\/td><td>生公說法，頑石點頭<\/td><td>傳說<\/td><\/tr><tr><td>5<\/td><td>道生頓悟與禪宗的關係<\/td><td>通說視為源頭之一；印順認為兩者無傳承關係（Y22, p. 41a）<\/td><\/tr><tr><td>6<\/td><td>雲岡五窟象徵五帝<\/td><td>學者推論<\/td><\/tr><tr><td>7<\/td><td>〈斷酒肉文〉的年份<\/td><td>原文只記五月二十二日、二十三日、二十九日，未記年份；依《佛祖統紀》卷三十七（T49, 349a–b）作天監十年（511），《星雲大師全集・懷古慨今 3》〈斷酒肉文〉亦同<\/td><\/tr><tr><td>8<\/td><td>「五時八教」<\/td><td>名稱不見於智顗自著，為湛然、諦觀等後學歸納<\/td><\/tr><tr><td>9<\/td><td>三論宗何時斷絕<\/td><td>吉藏後漸衰；依印順，南方三論「迄唐武滅法而後絕」（Y22, p. 27a）<\/td><\/tr><tr><td>10<\/td><td>天台宗唐初沉寂<\/td><td>傳統以湛然為中興；其間仍有恒景、智威、玄朗等傳承<\/td><\/tr><tr><td>11<\/td><td>靜琬為慧思弟子；兩則題記<\/td><td>「相傳」；《冥報記》作「智苑」；題記已依 CBETA B0146 核對：貞觀二年題刻殘缺，「已浸末法」四字依元代磑記補入<\/td><\/tr><tr><td>12<\/td><td>道綽讀曇鸞碑而回心<\/td><td>《續高僧傳》未載；依迦才《淨土論》「從大業五年已來，即捨講說」（T47, 98b）<\/td><\/tr><tr><td>13<\/td><td>玄奘出發年份<\/td><td>627 與 629 兩說並存<\/td><\/tr><tr><td>14<\/td><td>師子光與玄奘的論辯、《會宗論》<\/td><td>只見玄奘弟子所撰《慈恩傳》，師子光一方沒有記載；《會宗論》已佚。年代《慈恩傳》未載，依星雲〈留學聖僧玄奘大師〉繫於曲女城大會（642）前後<\/td><\/tr><tr><td>17<\/td><td>《大雲經》「偽撰」<\/td><td>依敦煌寫本研究，偽者為疏而非經；《佛祖統紀》與印順《中國佛教史略》作「重譯」<\/td><\/tr><tr><td>17<\/td><td>法藏曾預玄奘譯場<\/td><td>僅見《宋高僧傳》，崔致遠〈法藏和尚傳〉未載，學者多疑<\/td><\/tr><tr><td>18<\/td><td>慧能被徵召<\/td><td>詔文有潤飾，其事不虛；依印順《中國禪宗史》<\/td><\/tr><tr><td>19<\/td><td>傳衣是否為神會所造<\/td><td>胡適疑之，印順認為早已為北方所知；採印順說並註明<\/td><\/tr><tr><td>20<\/td><td>鑑真所傳章疏與最澄入唐<\/td><td>說見《叡山大師傳》，寫作因緣之一<\/td><\/tr><tr><td>22<\/td><td>唐密何時在漢地失傳<\/td><td>會昌法難是致命一擊；法難後仍有法全為圓珍灌頂（855，T55, 1097a）等記載，故寫作「主流的阿闍梨正統傳承在漢地基本絕響」；北宋「已無登壇灌頂者」依印順《中國佛教史略》（Y22, p. 79a）<\/td><\/tr><tr><td>23<\/td><td>懷海享年；是否有成文清規<\/td><td>享年有 95、66 兩說；成文清規學界存疑<\/td><\/tr><tr><td>23、25<\/td><td>禪、淨「較早復甦」<\/td><td>通說；禪宗實為洪州、石頭兩系延續，北宗與荷澤衰落（印順）<\/td><\/tr><tr><td>24<\/td><td>想為李訓剃髮的是誰<\/td><td>《宋高僧傳》主語不明；依《舊唐書》作宗密（《舊唐書》尚未逐字核對）<\/td><\/tr><tr><td>26<\/td><td>吳越求書的對象；《四教儀》作者<\/td><td>《佛祖統紀》高麗、日本、兩地三說並存；志磐認為《四教儀》據《八教大意》修訂<\/td><\/tr><tr><td>27<\/td><td>延壽盜官錢放生、七度拈鬮<\/td><td>南宋《佛祖統紀》《樂邦文類》所載，《宋高僧傳》未記<\/td><\/tr><tr><td>27<\/td><td>「四料簡」<\/td><td>多認為是後人託名<\/td><\/tr><tr><td>27<\/td><td>禪淨融合何時成為共同底色<\/td><td>延壽開其風；北宋禪、台仍分流，明末才諸宗融合（印順，Y22, pp. 64a、79a、90a）<\/td><\/tr><tr><td>29<\/td><td>大慧焚《碧巖錄》<\/td><td>見元代《碧巖錄》後序，屬後人記述，標明「後人還記載」；動機依後序作「救斯弊」。大慧所斥「默照邪禪」指誰，學界有爭議，腳本註明未必是宏智本人<\/td><\/tr><tr><td>32<\/td><td>清代廢止度牒<\/td><td>星雲《佛光教科書 4》說雍正廢止度牒試經，印順《中國佛教史略》繫於乾、嘉以來；腳本只引印順原文，不指明哪位皇帝<\/td><\/tr><tr><td>34<\/td><td>棲霞寺收容難民的人數、期間與細節<\/td><td>人數依「寂然上人碑」作二萬三千餘人，一說二萬四千；期間依碑文「時逾四月」；寂然等人的信件收入《拉貝日記》、廖耀湘脫險、志開為星雲剃度等，依《人間福報》與南京地方報導；不在 CBETA，原書未逐字核對<\/td><\/tr><tr><td>35<\/td><td>戰後首次傳戒的年份<\/td><td>星雲《百年佛緣》作 1952 年；李玉珍據戒期資料作 1952 年決定、1953 年 1 月舉行。腳本兩說並列<\/td><\/tr><tr><td>35<\/td><td>星雲大師與慈航法師被捕的人數<\/td><td>星雲〈開創台灣佛教的慈航法師〉作「慈航等二十餘人」；〈大陸僧侶在台灣〉則說星雲一組二十餘人關在桃園二十三天、慈航與七八十人關在台北一百多天。腳本只寫星雲被關二十三天，不寫人數<\/td><\/tr><tr><td>35、36<\/td><td>東初老人圓寂年；惟覺出家年<\/td><td>東初：法鼓山網站作 1978 年，《中華佛學學報》第 13 期年表作 1977 年 12 月，採後者。惟覺：中台禪寺年譜作 1964 年，新聞報導作 1963 年秋，採前者<\/td><\/tr><tr><td>37<\/td><td>近代五位大師的生平與法脈<\/td><td>依各道場官方資料、印順自述與新聞報導；五條路並列，不分高下<\/td><\/tr><tr><td>37<\/td><td>一行禪師的生平與「相即」的來源<\/td><td>生平依梅村官方傳記與 AP 報導；「相即」源自《華嚴經》，依一行著作的二手轉述；越南臨濟由元韶等中國僧人傳入，依 Encyclopedia of Buddhism<\/td><\/tr><tr><td>宿緣、轉生<\/td><td>前世記憶與轉生情節<\/td><td>遊戲虛構，借唯識「熏習」為比喻；轉生段落所引史事依《魏書・釋老志》與印順著作<\/td><\/tr><\/table><\/div><h4>主要參考<\/h4><p class=\"ref\">僧傳與史傳：《高僧傳》（T2059）、《續高僧傳》（T2060）、《宋高僧傳》（T2061）、《大慈恩寺三藏法師傳》（T2053）、《唐大和上東征傳》（收於《遊方記抄》，T2089）、《佛祖統紀》（T2035）、《景德傳燈錄》（T2076）、《五燈會元》（X1565）、《林間錄》（X1624）<\/p><p class=\"ref\">著作與文獻：《弘明集》（T2102）、《安樂集》（T1958）、迦才《淨土論》（T1963）、《樂邦文類》（T1969A）、《關中創立戒壇圖經》（T1892）、《宗鏡錄》（T2016）、空海《御請來目錄》（T2161）、宗密《禪源諸詮集都序》（T2015）、《冥報記》（T2082）、《集沙門不應拜俗等事》（T2108）、圓仁《入唐求法巡禮行記》（B0095）、《憨山老人夢遊集》（X1456）、《叡山大師傳》（不在 CBETA）、《大慧普覺禪師語錄》（T1998A）、《宏智禪師廣錄》（T2001）、《碧巖錄》（T2003）、《房山雲居寺石經》（B0146，含靜琬題刻）、圓珍《青龍寺求法目錄》（T2171）、《中阿含經》（T0026）、《增壹阿含經》（T0125）、《大智度論》（T1509）、《中論》（T1564）、《鎮州臨濟慧照禪師語錄》（T1985）、《雜阿含經》（T0099）、北本《大般涅槃經》（T0374）、《成唯識論》（T1585）、淨源《金師子章雲間類解》（T1880）、印順《佛法概論》（Y0008）、智旭《靈峰宗論》（嘉興藏 JB348）、《提婆菩薩傳》（T2048）、《比丘尼傳》（T2063）、《勝鬘師子吼一乘大方便方廣經》（T0353）、《賢愚經》（T0202）、《往生西方淨土瑞應傳》（T2070）、《三國遺事》（T2039）、《六祖大師法寶壇經》（T2008）、《敕修百丈清規》（T2025）、《紫柏尊者全集》（X1452）、《維摩詰所說經》（T0475）、《阿育王傳》（T2042）、《大唐西域記》（T2087）、《馬鳴菩薩傳》（T2046）、《付法藏因緣傳》（T2058）、《婆藪槃豆法師傳》（T2049）、《黃檗山斷際禪師傳心法要》（T2012A）<\/p><p class=\"ref\">印順導師：《中國佛教史略》（《佛教史地考論》，Y0022）、《中國禪宗史》（Y0038）、《華雨集》第四、五冊（Y0028、Y0029）、《淨土與禪》（Y0017）、《印度佛教思想史》（Y0032）、《太虛大師年譜》（Y0013）、《勝鬘經講記》（Y0003）、《大乘起信論講記》（Y0007）、《印度之佛教》（Y0031）<\/p><p class=\"ref\">聖嚴法師：〈明末中國的禪宗人物及其特色〉（《華岡佛學學報》第 7 期，1984）；譯野上俊靜等著《中國佛教史概說》（法鼓全集 02-02）；星雲大師：<a href=\"https://books.masterhsingyun.org/ArticleDetail/artcle3996\" target=\"_blank\" rel=\"noopener\">《星雲大師全集・佛光教科書 3 菩薩行證》第十課〈八宗共祖龍樹菩薩〉<\/a>、《星雲大師全集・佛教叢書 8–10 弟子》三十三篇（篇目與連結見「你最像哪幾位祖師大德」的出處）<\/p><p class=\"ref\">正史：《魏書・釋老志》、《晉書・藝術傳》（CBETA《大藏經補編》正史選輯，B0091，已核對）；《晉書・習鑿齒傳》、《魏書・世祖紀》、《舊唐書》〈則天皇后本紀〉〈武宗本紀〉〈李訓傳〉（不在 CBETA，尚未逐字核對）<\/p><p class=\" <script>
(function(){
const D = JSON.parse(document.getElementById('data').textContent);
const SCH = ['三論','法相','天台','華嚴','律','淨土','臨濟','曹洞','密'];
const FATES = ['宮','經','山','融'];
const TIE = ['融','山','經','宮'];
const FLABEL = {宮:'依靠宮廷',經:'保存典籍',山:'遁入山林',融:'調和諸宗'};
const N = D.scenes.length;
const KEY = 'chuandeng-1500-v1';
const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let picks = [], pos = 0;

const $ = (s, r) => (r || document).querySelector(s);
const story = $('#story');

const CN = ['零','一','二','三','四','五','六','七','八','九'];
function cnum(n){ if (n < 10) return CN[n]; const t = Math.floor(n/10), u = n%10; return (t > 1 ? CN[t] : '') + '十' + (u ? CN[u] : ''); }
function letterOf(i){ const p = picks[i]; const o = D.scenes[i].options[p]; return o ? o.k : null; }
function evalCond(c, upto){
  if (!c) return true;
  switch (c.t){
    case 'pick': { const i = c.n - 1; return i < upto && i < picks.length && c.k.indexOf(letterOf(i)) >= 0; }
    case 'or': return c.items.some(x => evalCond(x, upto));
    case 'atleast': return c.items.filter(x => evalCond(x, upto)).length >= c.v;
    case 'fate': {
      let n = 0; for (let i = 0; i < Math.min(upto, picks.length); i++){ const o = D.scenes[i].options[picks[i]]; if (o && o.f === c.f) n++; }
      return c.op === '>=' ? n >= c.v : c.op === '<=' ? n <= c.v : n === c.v;
    }
    case 'ecount': { let n = 0; for (let i = 0; i < Math.min(upto, picks.length); i++){ const o = D.scenes[i].options[picks[i]]; if (o && o.c) n++; } return n >= c.v; }
  }
  return false;
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify({picks, pos})); } catch(e) {} }
function load(){ try { return JSON.parse(localStorage.getItem(KEY) || 'null'); } catch(e) { return null; } }
function valid(st){
  if (!st || !Array.isArray(st.picks) || !Number.isInteger(st.pos)) return false;
  if (st.pos < 0 || st.pos > N || st.picks.length > N) return false;
  if (st.picks.length < st.pos || st.picks.length > st.pos + 1) return false;
  return st.picks.every((p, i) => Number.isInteger(p) && p >= 0 && p < D.scenes[i].options.length);
}

/* ---------- pieces ---------- */
function narrHTML(sc, idx){
  let h = '', inList = false;
  for (const b of sc.body){
    if (b.c && !evalCond(b.c, idx)) continue;
    if (b.h.startsWith('<li>')) { if (!inList) { h += '<ul>'; inList = true; } h += b.h; continue; }
    if (inList) { h += '</ul>'; inList = false; }
    if (b.kind) h += '<div class="memory"><b>' + (b.kind === '轉生' ? '上一世' : '宿緣') + '</b><p>' + b.h + '</p></div>';
    else h += '<p>' + b.h + '</p>';
  }
  if (inList) h += '</ul>';
  return h;
}
function srcFold(h, extra){ return '<details class="srcf"><summary>出處資料：</summary><p class="src">' + String(h || '').replace(/^(<em>)?出處：/, '$1') + '</p>' + (extra ? '<p class="src">' + extra + '</p>' : '') + '</details>'; }
const YRS = m => m.era ? '<span class="md"><span class="seg">' + m.era + '｜</span>' + m.yrs.split('、').map((y, i, a) => '<span class="seg">' + y + (i < a.length - 1 ? '、' : '') + '</span>').join('') + '</span>' : '';
/* era lines break only at the ・ between phrases (a phrase longer than the line still wraps inside) */
const ERA = t => String(t).split('・').map((x, i, a) => '<span class="seg">' + x + (i < a.length - 1 ? '・' : '') + '</span>').join('');
/* tidy(): runs after every render. Glues the last three characters of a block (with trailing punctuation) so no
   line ends up holding a single character; keeps 「——」 with the character before it; keeps page and year ranges whole. */
const CLOSEP = '，。、；：？！」』）》〉…,.;:?!)', OPENP = '「『（《〈(';
const GLUE = /[^\s—]——|(?:pp?\. ?)?(?:約|前)?\d+[a-c]?–(?:約|前)?\d+[a-c]?|pp?\. \d+[a-c]?|《[^《》]{1,7}》|〈[^〈〉]{1,7}〉|「[^「」]{1,4}」|[元正一二三四五六七八九十]{1,4}年(?:（[^（）]{1,12}）)?|[一-鿿]{2}(?= [一-鿿])|(?:[第約前]\s?)?\d[\d,]*\s[年月日歲卷冊部位人種幕次天多萬]|[第約前]\s\d[\d,]*/g;
/* titles and headings break after ：，、； rather than mid-phrase */
const PH = t => String(t).split(/(?<=[：，、；])/).map(x => '<span class="seg">' + x + '</span>').join('');
function glueRanges(t){
  const s = t.nodeValue; GLUE.lastIndex = 0; const ms = []; let m;
  while ((m = GLUE.exec(s))) ms.push([m.index, m[0].length]);
  for (let j = ms.length - 1; j >= 0; j--){
    const [i, len] = ms[j]; const mid = t.splitText(i); mid.splitText(len);
    const sp = document.createElement('span'); sp.className = 'nb'; mid.replaceWith(sp); sp.appendChild(mid);
  }
}
const SKIPT = '.nb,.seg,.k,.tg,.chips,.lk,.bars,.tl-key,.tr-card,summary';
/* word boundaries (where the browser supports it), so the glued tail does not cut a word such as 不會 in two */
const WSEG = (() => { try { return new Intl.Segmenter('zh-Hant', {granularity: 'word'}); } catch(e) { return null; } })();
function tidy(root){
  if (!root) return;
  try { tidyIn(root); } catch(e) {}
}
function tidyIn(root){
  const plan = [], seen = new Set();
  /* read phase (no DOM writes, so styles are computed once) */
  root.querySelectorAll('p,li,dd,td,th,.choice .t,.sid,.recap li>span:last-child').forEach(el => {
    if (el.dataset.td || el.closest(SKIPT)) return;
    el.dataset.td = '1';
    const all = [], ok = []; const tw = document.createTreeWalker(el, NodeFilter.SHOW_TEXT); let n;
    while ((n = tw.nextNode())){
      if (!/\S/.test(n.nodeValue)) continue; all.push(n);
      if (seen.has(n)) continue; seen.add(n);
      const pe = n.parentElement;
      if (!pe.closest(SKIPT) && !/flex|grid/.test(getComputedStyle(pe).display)) ok.push(n);
    }
    let cut = null; const t = all[all.length - 1];
    if (t && ok.indexOf(t) >= 0){
      const s = t.nodeValue; let j = s.length;
      while (j > 0 && (CLOSEP.includes(s[j - 1]) || /\s/.test(s[j - 1]))) j--;
      let k = j, c = 0;
      while (k > 0 && c < 3 && !/\s/.test(s[k - 1])){ if (!OPENP.includes(s[k - 1])) c++; k--; }
      while (k > 0 && OPENP.includes(s[k - 1])) k--;
      if (WSEG && k > 0 && k < j){ const from = Math.max(0, k - 6);
        for (const g of WSEG.segment(s.slice(from, j))){ const a = from + g.index, b = a + g.segment.length;
          if (a < k && b > k){ if (k - a <= 3 && /[\u4e00-\u9fff]/.test(g.segment)) k = a; break; } if (a >= k) break; } }
      const ob = Math.max(s.lastIndexOf('《', k - 1), s.lastIndexOf('「', k - 1));
      if (ob >= 0 && k - ob <= 6 && s.indexOf(s[ob] === '《' ? '》' : '」', ob) >= k) k = ob;
      if (k > 1 && /\s/.test(s[k - 1]) && /\d/.test(s[k - 2])){ k--; while (k > 0 && /[\d,]/.test(s[k - 1])) k--; }
      if (c >= 2 && !(k === 0 && all.length === 1)) cut = [t, k];
    }
    plan.push([ok, cut]);
  });
  /* write phase */
  for (const [ok, cut] of plan){
    try {
      if (cut){ const [t, k] = cut; if (k < t.nodeValue.length){ const tail = t.splitText(k); const sp = document.createElement('span'); sp.className = 'nb'; tail.replaceWith(sp); sp.appendChild(tail); } }
      ok.forEach(glueRanges);
    } catch(e) {}
  }

/* ---------- result ---------- */
function compute(){
  const s = {}, last = {};
  SCH.forEach(k => { s[k] = 0; last[k] = -1; });
  const f = {宮:0, 經:0, 山:0, 融:0};
  picks.forEach((p, i) => {
    const o = D.scenes[i].options[p];
    for (const k in o.s) { s[k] += o.s[k]; last[k] = i; }
    f[o.f] += 1;
  });
  const order = SCH.slice().sort((a, b) => (s[b] - s[a]) || (last[b] - last[a]));
  const mf = Math.max.apply(null, FATES.map(k => f[k]));
  const fate = TIE.find(k => f[k] === mf);
  return {s, f, order, school: order[0], fate};
}
function normv(v){ const n = Math.sqrt(v.reduce((a, x) => a + x * x, 0)) || 1; return v.map(x => x / n); }
function sumv(o){ let t = 0; for (const k in o) t += o[k]; return t; }
D.masters.forEach(m => {
  if (m.bal) return;
  const ts = sumv(m.s), tf = sumv(m.f);
  m.sv = normv(SCH.map((k, i) => (m.s[k] || 0) / ts - D.baseline.s[i]));
  m.fv = normv(FATES.map((k, i) => (m.f[k] || 0) / tf - D.baseline.f[i]));
});
function entropy(s){
  const t = SCH.reduce((a, k) => a + s[k], 0); let h = 0;
  SCH.forEach(k => { if (s[k] > 0) { const p = s[k] / t; h -= p * Math.log(p); } });
  return h / Math.log(SCH.length);
}
function matchMasters(r){
  const B = D.baseline, t = SCH.reduce((a, k) => a + r.s[k], 0), tf = FATES.reduce((a, k) => a + r.f[k], 0);
  const sv = normv(SCH.map((k, i) => r.s[k] / t - B.s[i])), fv = normv(FATES.map((k, i) => r.f[k] / tf - B.f[i]));
  const sc = D.masters.filter(m => !m.bal).map(m => {
    const hit = m.k.filter(x => letterOf(x[0] - 1) === x[1]).length;
    const raw = B.wS * m.sv.reduce((a, x, i) => a + x * sv[i], 0) + B.wF * m.fv.reduce((a, x, i) => a + x * fv[i], 0) + B.wK * Math.min(hit, 3);
    return {m, raw, v: raw + (m.b || 0)};
  });
  /* the calibration bias reorders, but the closest raw match is always among the three shown */
  const best = sc.reduce((a, x) => x.raw > a.raw ? x : a, sc[0]).m;
  const rk = sc.sort((a, b) => b.v - a.v).map(x => x.m);
  const keep = (list) => { if (list.indexOf(best) < 0){ const i = rk.indexOf(best); rk.splice(i, 1); rk.splice(list.length - 1, 0, best); } };
  const bal = D.masters.find(m => m.bal);
  if (bal && entropy(r.s) >= B.balance){ keep(rk.slice(0, 2)); return {top: [bal].concat(rk.slice(0, 2)), also: rk.slice(2, 4)}; }
  keep(rk.slice(0, 3));
  return {top: rk.slice(0, 3), also: rk.slice(3, 5)};
}
function naturalRoles(r){
  const o = r.order, out = [o[0], o[1]];
  if (r.s[o[2]] > 0 && r.s[o[2]] >= 0.8 * r.s[o[1]]) out.push(o[2]);
  return out;
}
