: 1.0}, "f": {"經": 6.0, "融": 1.0}, "k": [[6, "D"], [9, "C"], [19, "C"], [20, "C"], [32, "C"]], "bal": false, "text": "佛陀的侍者，自說「我奉侍佛來二十五年」，是弟子中的「多聞第一」；佛滅後第一次結集，由他誦出經藏，所以經典開頭都是「如是我聞」。你像他：一次又一次，你選擇把發生的事記下來、把說過的法保存好；你在乎的不是自己說了什麼，而是別人說的不要失傳。他會提醒你：聽得多、記得多，還要思惟、還要修，才是自己的。", "id": "佛陀的侍者，自說「我奉侍佛來二十五年」，是弟子中的「多聞第一」；佛滅後第一次結集，由他誦出經藏，所以經典開頭都是「如是我聞」。"}, {"name": "優波離", "s": {"律": 6.0}, "f": {"經": 3.0, "山": 1.0}, "k": [[4, "B"], [16, "A"], [24, "B"]], "bal": false, "text": "佛陀弟子中的「持律第一」，《增壹阿含經》說他「奉持戒律，無所觸犯」；第一次結集時，由他誦出律藏。你像他：你相信規矩是用來保護人的，一字一句守得分明；別人嫌繁瑣的地方，你知道為什麼不能省。他會提醒你：戒的根本是不傷害；守住條文的同時，別忘了條文為何而立。", "id": "佛陀弟子中的「持律第一」，《增壹阿含經》說他「奉持戒律，無所觸犯」；第一次結集時，由他誦出律藏。"}, {"name": "大迦葉", "s": {"曹洞": 4.0, "律": 2.0, "臨濟": 1.0}, "f": {"山": 5.0}, "k": [[2, "C"], [9, "D"], [19, "B"], [8, "C"]], "bal": false, "text": "佛陀弟子中修苦行的「頭陀第一」；佛滅後由他召集第一次結集，禪宗的傳燈譜系尊他為天竺第一祖。你像他：你一再選擇遠離權勢、回到山林，寧可清苦也要自在，不需要很多人懂你。他會提醒你：遠離，是為了看清，不是為了看輕；山下的人，也是你要度的人。", "id": "佛陀弟子中修苦行的「頭陀第一」；佛滅後由他召集第一次結集，禪宗的傳燈譜系尊他為天竺第一祖。"}, {"name": "龍樹", "s": {}, "f": {"融": 1.0, "經": 1.0}, "k": [[10, "D"]], "bal": true, "text": "約二、三世紀的南印度論師，作《中論》，開創中觀學，後世尊為「八宗共祖」。你像他：你的三十三個選擇幾乎平均落在九宗之間，不偏任何一家；八宗都從他那裡汲取了養分，你也從每一宗汲取了一點。他會提醒你：不偏一邊，是因為看見一切依緣而起，不是因為不肯選擇；中道不是折衷。", "id": "約二、三世紀的南印度論師，作《中論》，開創中觀學，後世尊為「八宗共祖」。"}, {"name": "道安", "s": {"法相": 2.0, "三論": 2.0, "律": 2.0}, "f": {"經": 4.0, "宮": 2.0}, "k": [[1, "A"], [2, "B"]], "bal": false, "text": "東晉的僧團領袖，編成可考最早、最有系統的經錄，讓出家人一律以「釋」為姓；他說「不依國主，則法事難立」。你像他：你既要把經讀準、把書整理好，也看得清現實，不排斥借助有力的人；你願意為整個團體承擔。他會提醒你：依靠國主，是為了讓法立得住，不是為了讓自己立得住；靠得越近，越要清醒。", "id": "東晉的僧團領袖，編成可考最早、最有系統的經錄，讓出家人一律以「釋」為姓；他說「不依國主，則法事難立」。"}, {"name": "慧遠", "s": {"淨土": 4.0, "律": 2.0, "曹洞": 2.0}, "f": {"山": 5.0}, "k": [[5, "A"], [5, "B"], [6, "A"]], "bal": false, "text": "東晉廬山的僧團領袖，入山之後「影不出山，迹不入俗」；他與一百二十三人在般若臺前共發往生西方之願，又寫〈沙門不敬王者論〉，說出家人是「方外之賓」。你像他：你選擇了山，也選擇了一群一起修行的人；你對權勢客氣，卻不讓步。他會提醒你：溫和與堅定可以同時存在；守住的是修行，不是面子。", "id": "東晉廬山的僧團領袖，入山之後「影不出山，迹不入俗」；他與一百二十三人在般若臺前共發往生西方之願，又寫〈沙門不敬王者論〉，說出家人是「方外之賓」。"}, {"name": "鳩摩羅什", "s": {"三論": 5.0, "天台": 2.0, "淨土": 1.0}, "f": {"融": 3.0, "宮": 2.0, "經": 1.0}, "k": [[3, "B"], [4, "A"]], "bal": false, "text": "後秦的譯經大師，譯出《中論》《法華經》《阿彌陀經》等，後世八宗有一半從他的譯場發芽。你像他：你最在乎的是讓深的道理被聽懂；你願意在原文與讀者之間來回斟酌，也能在不完美的處境裡把事做成。他會提醒你：「但採蓮花，勿取臭泥」；取人之長，也誠實看待自己的不足。", "id": "後秦的譯經大師，譯出《中論》《法華經》《阿彌陀經》等，後世八宗有一半從他的譯場發芽。"}, {"name": "道生", "s": {"臨濟": 3.0, "天台": 2.0, "華嚴": 2.0}, "f": {"融": 2.0, "山": 2.0}, "k": [[7, "B"], [7, "C"], [15, "B"], [15, "E"]], "bal": false, "text": "什門四聖之一，在完整的《涅槃經》傳來之前，就主張一闡提也能成佛，因此被擯出建康；後來經典傳到，證明了他。你像他：你相信每個人都有可能，即使要一個人站在大家的對面；你看重的是佛陀的本意，不只是字面。他會提醒你：孤明先發，靠的是對經義的深究，不是對自己的固執。", "id": "什門四聖之一，在完整的《涅槃經》傳來之前，就主張一闡提也能成佛，因此被擯出建康；後來經典傳到，證明了他。"}, {"name": "智顗", "s": {"天台": 6.0}, "f": {"融": 2.0, "山": 2.0, "宮": 1.0}, "k": [[9, "A"], [11, "C"]], "bal": false, "text": "陳隋之際天台宗的實際開創者，晉王楊廣尊他為「智者」；他批評只坐不學的「闇證禪師」，也批評只讀不修的「誦文法師」。你像他：你要讀懂，也要做到；你看得見每一種法門的位置，也知道什麼時候該入山、什麼時候該出來。他會提醒你：體系再圓滿，最後還是要回到蒲團上實證。", "id": "陳隋之際天台宗的實際開創者，晉王楊廣尊他為「智者」；他批評只坐不學的「闇證禪師」，也批評只讀不修的「誦文法師」。"}, {"name": "吉藏", "s": {"三論": 6.0, "法相": 1.0}, "f": {"經": 5.0}, "k": [[10, "A"], [10, "D"]], "bal": false, "text": "隋唐之際三論宗的集大成者；陳亡時他走遍空寺收集文疏，堆滿三間堂，所以說「目學之長勿過於藏」。你像他：你讀得最多，也破得最徹底；別人急著站隊時，你先把每一家的說法都讀過一遍。他會提醒你：讀遍百家，是為了不被任何一家綁住，包括自己這一家。", "id": "隋唐之際三論宗的集大成者；陳亡時他走遍空寺收集文疏，堆滿三間堂，所以說「目學之長勿過於藏」。"}, {"name": "靜琬", "s": {"天台": 2.0, "律": 2.0}, "f": {"經": 6.0}, "k": [[12, "A"], [26, "A"]], "bal": false, "text": "隋唐之際幽州的僧人，憂心法難，發願把佛經刻在石上；師徒相承，遼、金續刻，前後千年，成就了「房山石經」。你像他：你做的事，往往要很久以後才看得出意義；你寧可一刀一刀地刻，也不求今天被看見。他會提醒你：「世若有經，願勿輒開」；做好準備，不必期待被打開。", "id": "隋唐之際幽州的僧人，憂心法難，發願把佛經刻在石上；師徒相承，遼、金續刻，前後千年，成就了「房山石經」。"}, {"name": "道綽", "s": {"淨土": 6.0}, "f": {"山": 5.0}, "k": [[12, "B"], [13, "A"]], "bal": false, "text": "隋唐之際的淨土祖師，在并州玄中寺教人數著小豆念佛，并州三縣七歲以上的人都會念彌陀。你像他：你不高估自己，也不放棄任何人；你相信最簡單的方法，只要天天做，就能接住最多的人。他會提醒你：簡單不是淺；一聲佛號念得清清楚楚，比懂得許多道理更難。", "id": "隋唐之際的淨土祖師，在并州玄中寺教人數著小豆念佛，并州三縣七歲以上的人都會念彌陀。"}, {"name": "玄奘", "s": {"法相": 6.0}, "f": {"經": 5.0, "宮": 1.0}, "k": [[14, "A"], [3, "A"]], "bal": false, "text": "唐代的求法僧，私越國境西行，「寧可就西而死，豈歸東而生」，帶回六百五十七部經論，與弟子窺基開出法相唯識一宗。你像他：你要的是原典、是準確，為此可以走最遠的路；你相信把一件事做到最徹底，就是最好的貢獻。他會提醒你：帶回來之後，還要讓人讀得懂；學問是為了讓人離苦。", "id": "唐代的求法僧，私越國境西行，「寧可就西而死，豈歸東而生」，帶回六百五十七部經論，與弟子窺基開出法相唯識一宗。"}, {"name": "道宣", "s": {"律": 6.0, "華嚴": 1.0}, "f": {"經": 2.0, "融": 2.0}, "k": [[16, "A"], [16, "C"]], "bal": false, "text": "唐代南山律宗的開創者，以大乘的心解釋《四分律》，也是《續高僧傳》的作者。你像他：你相信制度是佛法久住的根本，但你要的不是死的條文，而是規矩背後那顆發大心的心。他會提醒你：戒、定、慧本是一體；守戒是為了心定，心定是為了看清。", "id": "唐代南山律宗的開創者，以大乘的心解釋《四分律》，也是《續高僧傳》的作者。"}, {"name": "鑑真", "s": {"律": 4.0, "天台": 2.0, "華嚴": 1.0}, "f": {"經": 4.0, "融": 2.0}, "k": [[21, "A"], [21, "D"], [21, "E"]], "bal": false, "text": "唐代律師，十二年間五次東渡失敗，雙目失明，第六次終於抵達日本，在東大寺設立戒壇。你像他：你一旦答應了，就不會半途放下；你相信法要有人親自送過去，才算真的傳了。他會提醒你：盡力，而不執著結果；成敗是因緣，願心是自己的。", "id": "唐代律師，十二年間五次東渡失敗，雙目失明，第六次終於抵達日本，在東大寺設立戒壇。"}, {"name": "法藏", "s": {"華嚴": 6.0}, "f": {"宮": 3.0, "融": 2.0}, "k": [[18, "A"], [18, "B"], [17, "D"]], "bal": false, "text": "唐代華嚴宗的集大成者，後世稱賢首大師；他指著殿前的金獅子為武則天說法，又用十面鏡子演示「一即一切」。你像他：你善於把深奧的道理變成一眼就懂的比喻，也知道在什麼場合怎麼說。他會提醒你：比喻是指月的手指；說得再好，也要讓人自己去看月亮。", "id": "唐代華嚴宗的集大成者，後世稱賢首大師；他指著殿前的金獅子為武則天說法，又用十面鏡子演示「一即一切」。"}, {"name": "慧能", "s": {"臨濟": 4.0, "華嚴": 1.0, "淨土": 1.0}, "f": {"山": 4.0}, "k": [[7, "C"], [14, "C"], [18, "D"]], "bal": false, "text": "禪宗六祖，嶺南人；朝廷徵召，他推辭不去，此後「了不度大庾嶺而終」。你像他：你不靠典籍、不靠權勢，相信答案就在自己心上；你對花俏的東西沒興趣，只想直接看見。他會提醒你：直截不是粗率；「無諍」也是他的教法。", "id": "禪宗六祖，嶺南人；朝廷徵召，他推辭不去，此後「了不度大庾嶺而終」。"}, {"name": "神秀", "s": {"曹洞": 2.0, "臨濟": 2.0, "華嚴": 2.0}, "f": {"宮": 5.0}, "k": [[19, "A"]], "bal": false, "text": "東山法門的大師，武則天請他「肩輿上殿，親加跪禮」，時人尊為「兩京法主，三帝門師」。你像他：你相信好的法要走進有影響力的地方，才能讓更多人受益；你穩重、有分寸，也願意承擔責任。他會提醒你：在殿上，也不要忘了山裡的坐禪；漸修不是慢，而是步步踏實。", "id": "東山法門的大師，武則天請他「肩輿上殿，親加跪禮」，時人尊為「兩京法主，三帝門師」。"}, {"name": "不空", "s": {"密": 6.0}, "f": {"宮": 4.0}, "k": [[22, "A"], [23, "B"]], "bal": false, "text": "唐代密教大師，歷事玄宗、肅宗、代宗三朝，皆為灌頂國師；他說：「眾生未度，吾安自度耶？」你像他：你懂得在權力之間為法爭取空間，也願意在危局裡挺身而出；你的力量，來自你能連結的人。他會提醒你：護國是為了護眾生；靠得越近，越要記得最初為了誰。", "id": "唐代密教大師，歷事玄宗、肅宗、代宗三朝，皆為灌頂國師；他說：「眾生未度，吾安自度耶？」你像他：你懂得在權力之間為法爭取空間，也願意在危局裡挺身而出；你的力量，來自你能連結的人。"}, {"name": "空海", "s": {"密": 5.0, "華嚴": 2.0, "天台": 1.0}, "f": {"經": 4.0, "融": 2.0}, "k": [[23, "A"], [23, "C"], [31, "C"]], "bal": false, "text": "日本真言宗的開創者，弘法大師；入唐從惠果受兩部大法，惠果囑咐他「傳之東國」。你像他：你在不同的世界之間來回，把一整套法帶到海的那一邊，也讓它在新的土地上生根。他會提醒你：所受的託付，要一代代往下傳，不是收進自己的箱子。", "id": "日本真言宗的開創者，弘法大師；入唐從惠果受兩部大法，惠果囑咐他「傳之東國」。"}, {"name": "百丈", "s": {"律": 3.0, "臨濟": 2.0, "曹洞": 2.0}, "f": {"山": 6.0}, "k": [[24, "A"]], "bal": false, "text": "唐代禪師懷海，年老仍與大眾一同勞作，留下「一日不作，一日不食」的話。你像他：你相信修行就在勞動裡，不必看誰的臉色；你也會為一群人立下可以長久運作的規矩。他會提醒你：規矩是為了讓人自在，不是為了讓人害怕。", "id": "唐代禪師懷海，年老仍與大眾一同勞作，留下「一日不作，一日不食」的話。"}, {"name": "宗密", "s": {"華嚴": 5.0, "臨濟": 2.0}, "f": {"融": 4.0}, "k": [[25, "A"]], "bal": false, "text": "唐代兼通華嚴與禪的大師；甘露之變後，逃亡的李訓來投，他想為李訓剃髮；被捕之後，他說「本師教法，遇苦即救，不愛身命，死固甘心」。你像他：你相信禪與教本是一致，也相信救人不問立場；你思想圓融，行動卻不含糊。他會提醒你：圓融不是和稀泥；正因為看見一切相通，所以見苦不能不救。", "id": "唐代兼通華嚴與禪的大師；甘露之變後，逃亡的李訓來投，他想為李訓剃髮；被捕之後，他說「本師教法，遇苦即救，不愛身命，死固甘心」。"}, {"name": "臨濟義玄", "s": {"臨濟": 6.0}, "f": {"山": 3.0}, "k": [[28, "C"], [20, "A"]], "bal": false, "text": "唐代禪師，臨濟宗的開創者；他在黃檗門下「三度發問，三度被打」，後來以峻烈的機鋒接引學人，說「隨處作主，立處皆真」。你像他：你直接、不繞路，不依賴任何外在的權威；你相信答案要自己撞出來。他會提醒你：喝，是為了斷掉執著，不是為了壓倒別人。", "id": "唐代禪師，臨濟宗的開創者；他在黃檗門下「三度發問，三度被打」，後來以峻烈的機鋒接引學人，說「隨處作主，立處皆真」。"}, {"name": "永明延壽", "s": {"淨土": 2.0, "臨濟": 2.0, "華嚴": 2.0, "法相": 2.0, "天台": 2.0}, "f": {"融": 6.0}, "k": [[28, "A"], [28, "B"]], "bal": false, "text": "五代吳越的禪師，編成一百卷《宗鏡錄》，「舉一心為宗，照萬法如鏡」，後世尊為淨土祖師之一。你像他：你不肯只守一家，想把禪、教、淨土都收進一面鏡子裡；你的選擇總在融合各宗。他會提醒你：融合是為了照見一心，不是為了什麼都要。", "id": "五代吳越的禪師，編成一百卷《宗鏡錄》，「舉一心為宗，照萬法如鏡」，後世尊為淨土祖師之一。"}, {"name": "諦觀", "s": {"天台": 6.0}, "f": {"經": 5.0, "融": 1.0}, "k": [[27, "A"], [27, "E"]], "bal": false, "text": "高麗僧人，奉命把天台論疏送回中國，見到羲寂後「一見心服」，在螺溪留了十年；後人在他的箱篋裡發現了《天台四教儀》。你像他：你願意為一部書渡海，也願意為一位老師留下；你珍惜典籍，更珍惜讓典籍活起來的人。他會提醒你：書送到了，路還要自己走。", "id": "高麗僧人，奉命把天台論疏送回中國，見到羲寂後「一見心服」，在螺溪留了十年；後人在他的箱篋裡發現了《天台四教儀》。"}, {"name": "大慧", "s": {"臨濟": 6.0}, "f": {"宮": 3.0, "經": 1.0}, "k": [[29, "A"]], "bal": false, "text": "南宋臨濟宗的禪師，提倡看話禪，接引許多在官場忙碌的士大夫；因與主戰派往來得罪秦檜，被流放十餘年。你像他：你有熱情、有立場，相信修行要在最忙亂的生活裡用得上，也不怕得罪人。他會提醒你：一個話頭參到底；外面的是非，別奪走你心裡的疑情。", "id": "南宋臨濟宗的禪師，提倡看話禪，接引許多在官場忙碌的士大夫；因與主戰派往來得罪秦檜，被流放十餘年。"}, {"name": "宏智", "s": {"曹洞": 6.0}, "f": {"山": 5.0}, "k": [[29, "B"]], "bal": false, "text": "南宋曹洞宗的禪師，住持天童山將近三十年，寫下〈默照銘〉：「默默忘言，昭昭現前。」你像他：你安靜、綿密，不求奇特，也不急著被看見；你相信一次次坐下，心會自己亮起來。他會提醒你：安靜不是冷漠；他臨終寫信，把後事託給在法上互不相讓的大慧。", "id": "南宋曹洞宗的禪師，住持天童山將近三十年，寫下〈默照銘〉：「默默忘言，昭昭現前。"}, {"name": "蓮池", "s": {"淨土": 4.0, "律": 3.0, "臨濟": 1.0}, "f": {"融": 4.0, "山": 2.0}, "k": [[30, "A"], [30, "B"]], "bal": false, "text": "明末雲棲寺的袾宏，訂下《雲棲共住規約》，參禪與念佛並行而以念佛為歸，後世尊為蓮宗八祖。你像他：你既溫和又嚴謹；你相信一句佛號能接住所有人，但一個團體也不能沒有規矩。他會提醒你：念佛與持戒，本是同一件事的兩面。", "id": "明末雲棲寺的袾宏，訂下《雲棲共住規約》，參禪與念佛並行而以念佛為歸，後世尊為蓮宗八祖。"}, {"name": "蕅益", "s": {"天台": 4.0, "淨土": 4.0, "律": 2.0}, "f": {"融": 3.0, "經": 2.0}, "k": [[30, "C"]], "bal": false, "text": "明末四大師之一的智旭，以天台教觀整合禪、教、律，而以淨土為歸宿。你像他：你讀得深，也修得實；你不偏一門，卻有清楚的歸宿。他會提醒你：讀得再多，最後要落在一句佛號、一念清楚上。", "id": "明末四大師之一的智旭，以天台教觀整合禪、教、律，而以淨土為歸宿。"}, {"name": "楊仁山", "s": {"法相": 4.0, "淨土": 2.0, "華嚴": 2.0}, "f": {"經": 6.0}, "k": [[31, "A"]], "bal": false, "text": "清末的居士，在南京創立金陵刻經處，託南條文雄從日本尋回約三百種中國早已失傳的佛典，刻版重印。你像他：你相信把書救回來，就是把法救回來；你不在台上，卻讓一整個時代重新讀懂了佛法。他會提醒你：書要有人讀，讀了要有人修。", "id": "清末的居士，在南京創立金陵刻經處，託南條文雄從日本尋回約三百種中國早已失傳的佛典，刻版重印。"}, {"name": "太虛", "s": {"三論": 2.0, "法相": 2.0, "天台": 2.0, "密": 2.0, "律": 1.0}, "f": {"融": 5.0, "宮": 1.0}, "k": [[31, "B"]], "bal": false, "text": "民國的佛教改革者，倡導「人生佛教」，說「此之八宗，皆實非權，皆圓非偏」，又辦僧學、創漢藏教理院。你像他：你不偏一宗，卻不只是調和；你想讓整個傳統在新的時代重新活起來，也願意站到最前面去推動。他會提醒你：改革從自己開始；理想走在前面，腳下也要踏實。", "id": "民國的佛教改革者，倡導「人生佛教」，說「此之八宗，皆實非權，皆圓非偏」，又辦僧學、創漢藏教理院。"}, {"name": "弘一", "s": {"律": 5.0, "華嚴": 2.0, "淨土": 2.0}, "f": {"山": 3.0, "經": 2.0}, "k": [[30, "B"]], "bal": false, "text": "民國的李叔同，出家前是藝術家與教師，出家後專研南山律，被尊為重興南山律的一代律師；後人歸納他的學行是「以華嚴為境，四分律為行，導歸淨土為果」。你像他：你對自己嚴格，對別人溫和；你從繁華裡轉身，選了一條最難也最安靜的路。他會提醒你：戒是對自己的要求，不是拿來衡量別人的尺。", "id": "民國的李叔同，出家前是藝術家與教師，出家後專研南山律，被尊為重興南山律的一代律師；後人歸納他的學行是「以華嚴為境，四分律為行，導歸淨土為果」。"}, {"name": "寂然", "s": {"淨土": 3.0, "臨濟": 3.0, "律": 1.0}, "f": {"融": 4.0}, "k": [[32, "A"], [10, "B"]], "bal": false, "text": "1937 年南京棲霞寺的監院；日軍攻陷南京時，他與志開、大本等法師開門收容難民，先後救護兩萬多人，積勞成疾，1939 年圓寂。你像他：你看見苦，就會開門；你相信出家人吃的是十方的飯，就該救十方的人。他會提醒你：開門需要勇氣，也需要眾人；有人開門，有人找米，有人記錄，有人求援。", "id": "1937 年南京棲霞寺的監院；日軍攻陷南京時，他與志開、大本等法師開門收容難民，先後救護兩萬多人，積勞成疾，1939 年圓寂。"}, {"name": "印順", "s": {"三論": 5.0, "法相": 2.0}, "f": {"經": 4.0, "山": 1.0}, "k": [[33, "A"]], "bal": false, "text": "二十世紀的佛學思想家，一生著書、不建大型道場，自說「不是宗派徒裔」，提倡契理契機的人間佛教。你像他：你用經論檢驗一切傳統，不為宗派所囿，也不怕和老師意見不同；你在意的是道理對不對，不是誰說的。他會提醒你：批判是為了回到佛陀的本懷，不是為了否定前人；他和太虛師生各持己見，卻終身相敬。", "id": "二十世紀的佛學思想家，一生著書、不建大型道場，自說「不是宗派徒裔」，提倡契理契機的人間佛教。"}, {"name": "星雲", "s": {"臨濟": 3.0, "淨土": 3.0}, "f": {"融": 5.0}, "k": [[33, "B"]], "bal": false, "text": "臨濟正宗第四十八世，十二歲在南京棲霞寺禮志開上人出家，開創佛光山，把人間佛教帶到五大洲。你像他：你相信佛法要走進人群，喜歡和人在一起，也擅長把一件事做大，讓更多人受用。他會提醒你：給人歡喜之前，自己心裡先要有法；做大，是為了讓更多人離苦。", "id": "臨濟正宗第四十八世，十二歲在南京棲霞寺禮志開上人出家，開創佛光山，把人間佛教帶到五大洲。"}, {"name": "聖嚴", "s": {"曹洞": 3.0, "臨濟": 3.0}, "f": {"經": 4.0}, "k": [[33, "C"], [29, "C"]], "bal": false, "text": "法鼓山的創辦人，承接曹洞與臨濟兩宗的法，以「提昇人的品質，建設人間淨土」為理念，讓默照禪重新活了過來。你像他：你既能深入典籍，也能帶人禪修；你相信從自己的心開始，就是改變世界的開始。他會提醒你：學問和修行不必二選一，兩者合起來，才是一條完整的路。", "id": "法鼓山的創辦人，承接曹洞與臨濟兩宗的法，以「提昇人的品質，建設人間淨土」為理念，讓默照禪重新活了過來。"}, {"name": "惟覺", "s": {"臨濟": 5.0, "曹洞": 1.0}, "f": {"山": 5.0}, "k": [[33, "D"]], "bal": false, "text": "中台禪寺的開山方丈，早年在萬里山中閉關十餘年，以禪七與各地精舍推廣禪修。你像他：你相信先把心坐下來，其他的事自然會明白；你踏實、專注，不喜歡多說。他會提醒你：「對上以敬、對下以慈、對人以和、對事以真」；禪不只在禪堂裡。", "id": "中台禪寺的開山方丈，早年在萬里山中閉關十餘年，以禪七與各地精舍推廣禪修。"}, {"name": "一行禪師", "s": {"華嚴": 3.0, "曹洞": 3.0, "淨土": 1.0}, "f": {"融": 5.0}, "k": [[33, "E"]], "bal": false, "text": "越南臨濟宗的禪師，1966 年為越南和平出國奔走，從此流亡三十九年；他在法國梅村教人正念呼吸與行禪，講萬物「相即」。你像他：你相信修行就在每一次呼吸、每一步行走裡；你溫和，卻有不肯妥協的願力。他會提醒你：正念不只是讓自己舒服；它以正見為前導，以戒為根基。", "id": "越南臨濟宗的禪師，1966 年為越南和平出國奔走，從此流亡三十九年；他在法國梅村教人正念呼吸與行禪，講萬物「相即」。"}], "mastersLead": ["最後，把三十三幕合起來看：你在九宗之間怎麼分配、在四種去向之間怎麼取捨，再加上幾個關鍵時刻的選擇，和下面三十九位祖師、大師的特質相比，找出最像的一位，也列出另外兩位「也有幾分像」的人。若你的選擇幾乎平均落在九宗之間，不偏任何一家，你最像的會是被尊為八宗共祖的龍樹。每段後面的「他會提醒你」，是從他的一生裡借來的一句提醒，不是他的原話。", "方括號裡是比對用的特質：前段是九宗比重，中段是四種去向的比重，最後是幾個關鍵選擇（例如「6D」指第 6 幕選 D）。正式做成遊戲時不顯示給玩家。"], "mastersSrc": "<em>出處：《增壹阿含經》卷三〈弟子品〉（T02, pp. 557b、557c、558a）；《中阿含經》卷八〈阿難未曾有法經〉（T01, p. 473a）；《大智度論》卷二（T25, pp. 69a–c）；《景德傳燈錄》卷一（T51, p. 205c）；《中論》卷二（T30, p. 18c）；《雜阿含經》（T02, pp. 62c、177a）；《鎮州臨濟慧照禪師語錄》（T47, pp. 498a、504c）；<a href=\"https://books.masterhsingyun.org/ArticleDetail/artcle3996\" target=\"_blank\" rel=\"noopener\">星雲大師〈八宗共祖龍樹菩薩〉<\/a>；<a href=\"https://dlbs.liberal.ntu.edu.tw/search/search_detail.jsp?seq=641857\" target=\"_blank\" rel=\"noopener\">楊玉雲《華枝春滿，天心月圓：弘一大師生平及其學行研究》摘要（逢甲大學博士論文，2021）<\/a>；其餘人物事蹟見各幕出處<\/em>", "baseline": {"s": [0.0818, 0.0921, 0.1157, 0.1318, 0.1254, 0.1045, 0.1188, 0.107, 0.1228], "f": [0.2244, 0.2682, 0.2535, 0.2539], "balance": 0.984, "wS": 0.65, "wF": 0.35, "wK": 0.08}, "notesHtml": "<p>各幕引文已依 CBETA 原典核對，並經多輪獨立審查修訂（史實依 CBETA、印順導師與聖嚴法師著作核對；結局另依四聖諦、八正道審查義理），頁碼標於各幕出處（T 為《大正藏》，X 為《卐續藏》，Y 為《印順法師佛學著作集》）。「你」是虛構的角色，對話依原典文意改寫；「你是某人的弟子」一類的情節是為了遊戲而設。<\/p><p><strong>關於「八宗」。<\/strong> 「漢傳八宗」是近代的歸納，印順導師概括太虛大師之說為「統隋唐來大乘以為八」（印順《太虛大師年譜》，Y13, p. 79）。日本凝然《八宗綱要》的八宗則是俱舍、成實、律、法相、三論、天台、華嚴、真言，與此不同。學界對隋唐的「宗」是學派還是教團組織，亦有不同看法。本腳本也提到三階教等未列入八宗、而確實消失的學派。<\/p><h4>學界有爭議或屬傳說的內容<\/h4><div class=\"tblwrap\"><table><tr><th>幕<\/th><th>內容<\/th><th>本腳本的處理<\/th><\/tr><tr><td>1<\/td><td>道安與僧先飛龍山對談的年代<\/td><td>依〈道安傳〉約在後趙石虎時，兩人約三十多歲<\/td><\/tr><tr><td>4<\/td><td>羅什卒年<\/td><td>《高僧傳》作 409，僧肇誄文作 413；兩說並列<\/td><\/tr><tr><td>4<\/td><td>羅什吞針<\/td><td>《晉書》奇談，標明「未必是事實」<\/td><\/tr><tr><td>5<\/td><td>白蓮社、十八高賢、虎溪三笑<\/td><td>唐宋以後的附會；慧遠念佛為般舟三昧，依印順《淨土與禪》<\/td><\/tr><tr><td>7<\/td><td>生公說法，頑石點頭<\/td><td>傳說<\/td><\/tr><tr><td>8<\/td><td>雲岡五窟象徵五帝<\/td><td>學者推論<\/td><\/tr><tr><td>9<\/td><td>「五時八教」<\/td><td>名稱不見於智顗自著，為湛然、諦觀等後學歸納<\/td><\/tr><tr><td>11<\/td><td>天台宗唐初沉寂<\/td><td>傳統以湛然為中興；其間仍有恒景、智威、玄朗等傳承<\/td><\/tr><tr><td>12<\/td><td>靜琬為慧思弟子；兩則題記<\/td><td>「相傳」；《冥報記》作「智苑」；題記已依 CBETA B0146 核對：貞觀二年題刻殘缺，「已浸末法」四字依元代磑記補入<\/td><\/tr><tr><td>13<\/td><td>道綽讀曇鸞碑而回心<\/td><td>《續高僧傳》未載；依迦才《淨土論》「從大業五年已來，即捨講說」（T47, 98b）<\/td><\/tr><tr><td>14<\/td><td>玄奘出發年份<\/td><td>627 與 629 兩說並存<\/td><\/tr><tr><td>17<\/td><td>《大雲經》「偽撰」<\/td><td>依敦煌寫本研究，偽者為疏而非經；《佛祖統紀》與印順《中國佛教史略》作「重譯」<\/td><\/tr><tr><td>18<\/td><td>法藏曾預玄奘譯場<\/td><td>僅見《宋高僧傳》，崔致遠〈法藏和尚傳〉未載，學者多疑<\/td><\/tr><tr><td>19<\/td><td>慧能被徵召<\/td><td>詔文有潤飾，其事不虛；依印順《中國禪宗史》<\/td><\/tr><tr><td>20<\/td><td>傳衣是否為神會所造<\/td><td>胡適疑之，印順認為早已為北方所知；採印順說並註明<\/td><\/tr><tr><td>21<\/td><td>鑑真所傳章疏與最澄入唐<\/td><td>說見《叡山大師傳》，寫作因緣之一<\/td><\/tr><tr><td>24<\/td><td>懷海享年；是否有成文清規<\/td><td>享年有 95、66 兩說；成文清規學界存疑<\/td><\/tr><tr><td>24、26<\/td><td>禪、淨「較早復甦」<\/td><td>通說；禪宗實為洪州、石頭兩系延續，北宗與荷澤衰落（印順）<\/td><\/tr><tr><td>23<\/td><td>唐密何時在漢地失傳<\/td><td>會昌法難是致命一擊；法難後仍有法全為圓珍灌頂（855，T55, 1097a）等記載，故寫作「主流的阿闍梨正統傳承在漢地基本絕響」；北宋「已無登壇灌頂者」依印順《中國佛教史略》（Y22, p. 79a）<\/td><\/tr><tr><td>25<\/td><td>想為李訓剃髮的是誰<\/td><td>《宋高僧傳》主語不明；依《舊唐書》作宗密（《舊唐書》尚未逐字核對）<\/td><\/tr><tr><td>27<\/td><td>吳越求書的對象；《四教儀》作者<\/td><td>《佛祖統紀》高麗、日本、兩地三說並存；志磐認為《四教儀》據《八教大意》修訂<\/td><\/tr><tr><td>28<\/td><td>延壽盜官錢放生、七度拈鬮<\/td><td>南宋《佛祖統紀》《樂邦文類》所載，《宋高僧傳》未記<\/td><\/tr><tr><td>28<\/td><td>「四料簡」<\/td><td>多認為是後人託名<\/td><\/tr><tr><td>7<\/td><td>道生頓悟與禪宗的關係<\/td><td>通說視為源頭之一；印順認為兩者無傳承關係（Y22, p. 41a）<\/td><\/tr><tr><td>10<\/td><td>三論宗何時斷絕<\/td><td>吉藏後漸衰；依印順，南方三論「迄唐武滅法而後絕」（Y22, p. 27a）<\/td><\/tr><tr><td>28<\/td><td>禪淨融合何時成為共同底色<\/td><td>延壽開其風；北宋禪、台仍分流，明末才諸宗融合（印順，Y22, pp. 64a、79a、90a）<\/td><\/tr><tr><td>3、22<\/td><td>羅什譯經部數、不空攜回經數<\/td><td>腳本依《出三藏記集》《宋高僧傳》；聖嚴譯《中國佛教史概說》另作七十四部三百八十四卷、梵本一千二百卷<\/td><\/tr><tr><td>29<\/td><td>大慧焚《碧巖錄》<\/td><td>見元代《碧巖錄》後序，屬後人記述，標明「後人還記載」；動機依後序作「救斯弊」。大慧所斥「默照邪禪」指誰，學界有爭議，腳本註明未必是宏智本人<\/td><\/tr><tr><td>33<\/td><td>近代五位大師的生平與法脈<\/td><td>依各道場官方資料、印順自述與新聞報導；五條路並列，不分高下<\/td><\/tr><tr><td>33<\/td><td>一行禪師的生平與「相即」的來源<\/td><td>生平依梅村官方傳記與 AP 報導；「相即」源自《華嚴經》，依一行著作的二手轉述；越南臨濟由元韶等中國僧人傳入，依 Encyclopedia of Buddhism<\/td><\/tr><tr><td>宿緣、轉生<\/td><td>前世記憶與轉生情節<\/td><td>遊戲虛構，借唯識「熏習」為比喻；轉生段落所引史事依《魏書・釋老志》與印順著作<\/td><\/tr><tr><td>32<\/td><td>棲霞寺收容難民的人數、期間與細節<\/td><td>人數依「寂然上人碑」作二萬三千餘人，一說二萬四千；期間依碑文「時逾四月」；寂然等人的信件收入《拉貝日記》、廖耀湘脫險、志開為星雲剃度等，依《人間福報》與南京地方報導；不在 CBETA，原書未逐字核對<\/td><\/tr><\/table><\/div><h4>主要參考<\/h4><p class=\"ref\">僧傳與史傳：《高僧傳》（T2059）、《續高僧傳》（T2060）、《宋高僧傳》（T2061）、《大慈恩寺三藏法師傳》（T2053）、《唐大和上東征傳》（收於《遊方記抄》，T2089）、《佛祖統紀》（T2035）、《景德傳燈錄》（T2076）、《五燈會元》（X1565）、《林間錄》（X1624）<\/p><p class=\"ref\">著作與文獻：《弘明集》（T2102）、《安樂集》（T1958）、迦才《淨土論》（T1963）、《樂邦文類》（T1969A）、《關中創立戒壇圖經》（T1892）、《宗鏡錄》（T2016）、空海《御請來目錄》（T2161）、宗密《禪源諸詮集都序》（T2015）、《冥報記》（T2082）、《集沙門不應拜俗等事》（T2108）、圓仁《入唐求法巡禮行記》（B0095）、《憨山老人夢遊集》（X1456）、《叡山大師傳》（不在 CBETA）、《大慧普覺禪師語錄》（T1998A）、《宏智禪師廣錄》（T2001）、《碧巖錄》（T2003）、《房山雲居寺石經》（B0146，含靜琬題刻）、圓珍《青龍寺求法目錄》（T2171）、《中阿含經》（T0026）、《增壹阿含經》（T0125）、《大智度論》（T1509）、《中論》（T1564）、《鎮州臨濟慧照禪師語錄》（T1985）、《雜阿含經》（T0099）、北本《大般涅槃經》（T0374）、《成唯識論》（T1585）、淨源《金師子章雲間類解》（T1880）、印順《佛法概論》（Y0008）<\/p><p class=\"ref\">印順導師：《中國佛教史略》（《佛教史地考論》，Y0022）、《中國禪宗史》（Y0038）、《華雨集》第四、五冊（Y0028、Y0029）、《淨土與禪》（Y0017）、《印度佛教思想史》（Y0032）、《太虛大師年譜》（Y0013）<\/p><p class=\"ref\">聖嚴法師譯：野上俊靜等著《中國佛教史概說》（法鼓全集 02-02）；星雲大師：<a href=\"https://books.masterhsingyun.org/ArticleDetail/artcle3996\" target=\"_blank\" rel=\"noopener\">《星雲大師全集・佛光教科書 3 菩薩行證》第十課〈八宗共祖龍樹菩薩〉<\/a><\/p><p class=\"ref\">正史：《魏書・釋老志》、《晉書・藝術傳》（CBETA《大藏經補編》正史選輯，B0091，已核對）；《晉書・習鑿齒傳》、《魏書・世祖紀》、《舊唐書》〈則天皇后本紀〉〈武宗本紀〉〈李訓傳〉（不在 CBETA，尚未逐字核對）<\/p><p class=\"ref\">頁碼一律依 CBETA 電子版標示（《卍續藏》用新纂本 X 頁碼，印順著作用 CBETA 版頁碼，與紙本舊版不同）。原典來源：<a href=\"https://github.com/cbeta-org/xml-p5\" target=\"_blank\" rel=\"noopener\">CBETA XML P5（GitHub）<\/a><\/p>"}</script>
<script>
(function(){
const D = JSON.parse(document.getElementById('data').textContent);
const SCH = ['三論','法相','天台','華嚴','律','淨土','臨濟','曹洞','密'];
const FATES = ['宮','經','山','融'];
const TIE = ['融','山','經','宮'];
const FLABEL = {宮:'依靠宮廷',經:'保存典籍',山:'遁入山林',融:'調和諸宗'};
const N = D.scenes.length;
const KEY = 'chuandeng-1500-v1';
const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let picks = [], pos = 0;

const $ = (s, r) => (r || document).querySelector(s);
const story = $('#story');

const CN = ['零','一','二','三','四','五','六','七','八','九'];
function cnum(n){ if (n < 10) return CN[n]; const t = Math.floor(n/10), u = n%10; return (t > 1 ? CN[t] : '') + '十' + (u ? CN[u] : ''); }
function letterOf(i){ const p = picks[i]; const o = D.scenes[i].options[p]; return o ? o.k : null; }
function evalCond(c, upto){
  if (!c) return true;
  switch (c.t){
    case 'pick': { const i = c.n - 1; return i < upto && i < picks.length && c.k.indexOf(letterOf(i)) >= 0; }
    case 'or': return c.items.some(x => evalCond(x, upto));
    case 'atleast': return c.items.filter(x => evalCond(x, upto)).length >= c.v;
    case 'fate': {
      let n = 0; for (let i = 0; i < Math.min(upto, picks.length); i++){ const o = D.scenes[i].options[picks[i]]; if (o && o.f === c.f) n++; }
      return c.op === '>=' ? n >= c.v : c.op === '<=' ? n <= c.v : n === c.v;
    }
    case 'ecount': { let n = 0; for (let i = 0; i < Math.min(upto, picks.length); i++){ const o = D.scenes[i].options[picks[i]]; if (o && o.c) n++; } return n >= c.v; }
  }
  return false;
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify({picks, pos})); } catch(e) {} }
function load(){ try { return JSON.parse(localStorage.getItem(KEY) || 'null'); } catch(e) { return null; } }
function valid(st){
  if (!st || !Array.isArray(st.picks) || !Number.isInteger(st.pos)) return false;
  if (st.pos < 0 || st.pos > N || st.picks.length > N) return false;
  if (st.picks.length < st.pos || st.picks.length > st.pos + 1) return false;
  return st.picks.every((p, i) => Number.isInteger(p) && p >= 0 && p < D.scenes[i].options.length);
}

/* ---------- pieces ---------- */
function narrHTML(sc, idx){
  let h = '', inList = false;
  for (const b of sc.body){
    if (b.c && !evalCond(b.c, idx)) continue;
    if (b.h.startsWith('<li>')) { if (!inList) { h += '<ul>'; inList = true; } h += b.h; continue; }
    if (inList) { h += '</ul>'; inList = false; }
    if (b.kind) h += '<div class="memory"><b>' + (b.kind === '轉生' ? '上一世' : '宿緣') + '</b><p>' + b.h + '</p></div>';
    else h += '<p>' + b.h + '</p>';
  }
  if (inList) h += '</ul>';
  return h;
}
function choicesHTML(sc, picked, idx){
  return '<div class="choices" role="group" aria-label="你的選擇">' + sc.options.map((o, i) => (o.c && !evalCond(o.c, idx)) ? '' :
    '<button type="button" class="choice' + (o.c ? ' extra' : '') + (picked === i ? ' picked' : '') + '" data-i="' + i + '"' + (o.c ? ' title="宿緣選項"' : '') +
    (picked != null ? ' disabled' : '') + ' aria-pressed="' + (picked === i) + '">' +
    '<span class="k">' + o.k + '</span><span class="t">' + o.t + '</span></button>').join('') + '</div>';
}
function afterHTML(sc, i, withNext, fresh){
  let h = '<section class="after' + (fresh ? ' fresh' : '') + '" id="after-' + i + '" tabindex="-1">' +
    '<p class="after-label">後來</p><div class="hist">' + sc.after.map(p => '<p>' + p + '</p>').join('') + '</div>' +
    '<p class="src">' + sc.source + '</p>';
  if (withNext) h += '<button type="button" class="next" data-act="next">' + (i === N - 1 ? '看看你的結局' : '往下一幕') + '</button>';
  return h + '</section>';
}
function headHTML(sc){
  return '<div><p class="no">第' + sc.num + '幕</p><h2>' + sc.title + '</h2><p class="era">' + sc.era + '</p></div>';
}
function volumeHTML(v){
  return '<div class="vol"><span class="slip">' + v.label + '</span><div><h3>' + v.title + '</h3><p>' + v.intro + '</p></div></div>';
}
function activeHTML(i, fresh){
  const sc = D.scenes[i];
  const picked = picks.length > i ? picks[i] : null;
  let h = '<article class="scene' + (fresh ? ' fresh' : '') + '" id="scene-' + i + '">' + headHTML(sc) +
    '<div class="narr">' + narrHTML(sc, i) + '</div>' + choicesHTML(sc, picked, i);
  if (picked != null) h += afterHTML(sc, i, true, false);
  return h + '</article>';
}
function doneHTML(i){
  const sc = D.scenes[i];
  return '<details class="done" id="scene-' + i + '"><summary><span class="no">第' + sc.num + '幕</span><span class="st">' + sc.title +
    '</span><span class="mine">你選了 ' + sc.options[picks[i]].k + '</span></summary><div class="body">' +
    '<p class="era">' + sc.era + '</p><div class="narr">' + narrHTML(sc, i) + '</div>' + choicesHTML(sc, picks[i], i) +
    afterHTML(sc, i, false, false) + '</div></details>';
}

/* ---------- result ---------- */
function compute(){
  const s = {}, last = {};
  SCH.forEach(k => { s[k] = 0; last[k] = -1; });
  const f = {宮:0, 經:0, 山:0, 融:0};
  picks.forEach((p, i) => {
    const o = D.scenes[i].options[p];
    for (const k in o.s) { s[k] += o.s[k]; last[k] = i; }
    f[o.f] += 1;
  });
  const order = SCH.slice().sort((a, b) => (s[b] - s[a]) || (last[b] - last[a]));
  const mf = Math.max.apply(null, FATES.map(k => f[k]));
  const fate = TIE.find(k => f[k] === mf);
  return {s, f, order, school: order[0], fate};
}
function normv(v){ const n = Math.sqrt(v.reduce((a, x) => a + x * x, 0)) || 1; return v.map(x => x / n); }
function sumv(o){ let t = 0; for (const k in o) t += o[k]; return t; }
D.masters.forEach(m => {
  if (m.bal) return;
  const ts = sumv(m.s), tf = sumv(m.f);
  m.sv = normv(SCH.map((k, i) => (m.s[k] || 0) / ts - D.baseline.s[i]));
  m.fv = normv(FATES.map((k, i) => (m.f[k] || 0) / tf - D.baseline.f[i]));
});
function entropy(s){
  const t = SCH.reduce((a, k) => a + s[k], 0); let h = 0;
  SCH.forEach(k => { if (s[k] > 0) { const p = s[k] / t; h -= p * Math.log(p); } });
  return h / Math.log(SCH.length);
}
function matchMasters(r){
  const B = D.baseline, t = SCH.reduce((a, k) => a + r.s[k], 0), tf = FATES.reduce((a, k) => a + r.f[k], 0);
  const sv = normv(SCH.map((k, i) => r.s[k] / t - B.s[i])), fv = normv(FATES.map((k, i) => r.f[k] / tf - B.f[i]));
  const rk = D.masters.filter(m => !m.bal).map(m => {
    const hit = m.k.filter(x => letterOf(x[0] - 1) === x[1]).length;
    return {m, v: B.wS * m.sv.reduce((a, x, i) => a + x * sv[i], 0) + B.wF * m.fv.reduce((a, x, i) => a + x * fv[i], 0) + B.wK * Math.min(hit, 3)};
  }).sort((a, b) => b.v - a.v).map(x => x.m);
  const bal = D.masters.find(m => m.bal);
  if (bal && entropy(r.s) >= B.balance) return {top: bal, also: rk.slice(0, 2)};
  return {top: rk[0], also: rk.slice(1, 3)};
}
function naturalRoles(r){
  const o = r.order, out = [o[0], o[1]];
  if (r.s[o[2]] > 0 && r.s[o[2]] >= 0.8 * r.s[o[1]]) out.push(o[2]);
  return out;
}
function mixKey(roles){
  const main = D.roles[roles[0]].cat;
  const others = Array.from(new Set(roles.slice(1).map(k => D.roles[k].cat).filter(c => c !== main)));
  return others.length === 0 ? main : others.length === 1 ? main + '+' + others[0] : 'all';
}
function comboHTML(c){
  return '<p class="txt">' + c.lead + '</p><dl class="four">' + c.parts.map(p =>
    '<div' + (p.k === '在人群裡' ? ' class="ctx"' : '') + '><dt>' + p.k + '</dt><dd>' + p.t + '</dd></div>').join('') + '</dl>';
}
function masterText(t){
  return t.split(/(?=你像他：)|(?=他會提醒你：)/).map(x => {
    const m = x.match(/^(你像他|他會提醒你)：(.*)$/);
    return '<p>' + (m ? '<b>' + m[1] + '</b>　' + m[2] : x) + '</p>';
  }).join('');
}
function rolesHTML(roles){
  const mix = D.mix[mixKey(roles)];
  const chips = roles.map((k, i) => {
    const ro = D.roles[k];
    return '<span class="chip' + (i === 0 ? ' main' : '') + '"><small>' + (i === 0 ? '主角色' : '副角色') + '</small><b>' + ro.name + '</b><small>' + k + '・' + ro.cat + '型</small></span>';
  }).join('');
  const cards = roles.map(k => { const ro = D.roles[k]; return '<div class="rcard"><h4>' + ro.name + '<small>' + k + '・' + ro.cat + '型</small></h4><p>' + ro.text + '</p></div>'; }).join('');
  return '<section class="res"><p class="label">你在人群裡的角色</p><p class="big sm">' + roles.map(k => D.roles[k].name).join('・') + '</p>' +
    '<div class="chips">' + chips + '</div>' +
    '<div class="mixcard"><h4>' + mix.name + '</h4><p>' + mix.text + '</p></div>' +
    '<div class="rcards">' + cards + '</div>' +
    '<details class="lead"><summary><b style="display:inline">這一節怎麼讀</b></summary>' + D.rolesLead.map(p => '<p>' + p + '</p>').join('') + '</details></section>';
}
function masterHTML(mm){
  return '<section class="res master"><p class="label">你最像的祖師</p><p class="big">' + mm.top.name + '</p>' +
    '<div class="txt">' + masterText(mm.top.text) + '</div>' +
    '<div class="also"><b>也有幾分像</b>' + mm.also.map(m => '<p><strong>' + m.name + '</strong>　' + m.id + '</p>').join('') + '</div>' +
    '<p class="src">' + D.mastersSrc + '</p></section>';
}
function barsHTML(keys, vals, top, labelFn){
  const mx = Math.max(1, Math.max.apply(null, keys.map(k => vals[k])));
  return '<div class="bars">' + keys.map(k =>
    '<div class="brow' + (k === top ? ' top' : '') + '"><span>' + labelFn(k) + '</span><div class="track"><div class="fill" style="width:' +
    Math.round(vals[k] / mx * 100) + '%"></div></div><span class="n">' + vals[k] + '</span></div>').join('') + '</div>';
}
function comboBlock(sk, fk){
  const sc = D.schools[sk], fa = D.fates[fk];
  return '<h4>' + sk + '宗：' + sc.tag + '</h4><p>' + sc.text + '</p>' +
    (sc.modern ? '<p class="modern"><b>近代知音</b>' + sc.modern + '</p>' : '') +
    '<h4>' + fa.name + '</h4><p>' + fa.text + '</p>' +
    '<h4>' + sk + '宗 × ' + fa.name + '</h4>' + comboHTML(D.combos[sk][fa.name]);
}
function endingHTML(fresh){
  const r = compute();
  const sc = D.schools[r.school], fa = D.fates[r.fate];
  const roles = naturalRoles(r), mm = matchMasters(r);
  const hid = D.hidden.filter(x => evalCond(x.c, N));
  const hidHTML = '<section class="hidden-end"><p class="label">隱藏結局</p>' +
    (hid.length ? hid.map(x => '<div class="hcard"><h4>' + x.name + '</h4><p>' + x.text + '</p></div>').join('') + '<p class="src">' + D.hiddenSrc + '</p>'
                : '') +
    '<p class="hint">' + (hid.length === D.hidden.length ? '三個隱藏結局，你全都解開了。' : '還有 ' + (D.hidden.length - hid.length) + ' 個隱藏結局沒有解開：試試不同的路，也留意那些只在某一世出現的選項 E。') + '</p></section>';
  const optS = SCH.map(k => '<option value="' + k + '"' + (k === r.school ? ' selected' : '') + '>' + k + '宗</option>').join('');
  const optF = FATES.map(k => '<option value="' + k + '"' + (k === r.fate ? ' selected' : '') + '>' + D.fates[k].name + '</option>').join('');
  const recap = D.scenes.map((s, i) => {
    const o = s.options[picks[i]];
    return '<li><span class="no">第' + s.num + '幕</span><span><b>' + s.title + '</b>　' + o.k + '．' + o.t + '</span></li>';
  }).join('');
  return '<article class="ending' + (fresh ? ' fresh' : '') + '" id="ending" tabindex="-1">' +
    '<div class="head"><p class="no">終章</p><h2>你這一盞燈</h2><p class="era">' + cnum(N) + '幕走完了。下面是你的思想、法脈、兩者交會的解讀，你在人群裡的角色，以及你最像的祖師' + (hid.length ? '；還有你解開的隱藏結局' : '') + '。</p></div>' +
    '<section class="res"><p class="label">你的思想</p><p class="big">' + r.school + '宗</p><p class="tagline">' + sc.tag + '</p>' +
      '<p class="txt">' + sc.text + '</p>' + (sc.modern ? '<p class="modern"><b>近代知音</b>' + sc.modern + '</p>' : '') + '</section>' +
    '<section class="res"><p class="label">你的法脈</p><p class="big">' + fa.name + '</p><p class="txt">' + fa.text + '</p></section>' +
    '<section class="res"><p class="label">兩者交會</p><p class="big sm">' + r.school + '宗 × ' + fa.name + '</p>' +
      comboHTML(D.combos[r.school][fa.name]) + '<details class="lead"><summary><b style="display:inline">三十六種組合的共同線索</b></summary><p>' + D.combosLead + '</p></details></section>' +
    rolesHTML(roles) + masterHTML(mm) + hidHTML +
    '<section class="scores"><div><p class="label">九宗得分</p>' + barsHTML(r.order, r.s, r.school, k => k) + '</div>' +
      '<div><p class="label">法脈數值</p>' + barsHTML(FATES, r.f, r.fate, k => k + '<small style="color:var(--ink-2);font-weight:400">・' + FLABEL[k] + '</small>') + '</div></section>' +
    '<details class="fold"><summary>回顧你的' + cnum(N) + '個選擇</summary><ol class="recap">' + recap + '</ol></details>' +
    '<details class="fold"><summary>看看其他結局（九宗 × 四種去向）</summary><div class="explore">' +
      '<div class="pickers"><label for="ex-school">思想<select id="ex-school">' + optS + '</select></label>' +
      '<label for="ex-fate">法脈<select id="ex-fate">' + optF + '</select></label></div>' +
      '<div class="exout" id="exout">' + comboBlock(r.school, r.fate) + '</div></div></details>' +
    '<details class="fold"><summary>九種角色與' + cnum(D.masters.length) + '位祖師</summary><div class="roster">' +
      SCH.map(k => '<p><strong>' + D.roles[k].name + '</strong>（' + k + '・' + D.roles[k].cat + '型）</p>').join('') +
      '<p style="margin-top:8px"></p>' + D.masters.map(m => '<p><strong>' + m.name + '</strong>　' + m.id + '</p>').join('') + '</div></details>' +
    '<div class="actions"><button type="button" class="ghost" data-act="restart">重新開始</button><button type="button" class="ghost" data-act="top">回到開頭</button></div>' +
    '</article>';
}

/* ---------- render ---------- */
function introHTML(){
  let h = D.intro.slice(0, 4).map(p => '<p>' + p + '</p>').join('');
  if (pos > 0 && pos < N) h += '<button type="button" class="resume" data-act="resume">接著讀第' + D.scenes[pos].num + '幕</button>';
  else if (pos >= N) h += '<button type="button" class="resume" data-act="resume">看你的結局</button>';
  return h;
}
function progress(){
  const lamps = $('#lamps');
  if (!lamps.children.length){
    lamps.innerHTML = D.scenes.map((s, i) => '<i' + (i > 0 && D.volumes[s.vol].first === i + 1 ? ' class="v"' : '') + '></i>').join('');
  }
  Array.from(lamps.children).forEach((el, i) => {
    el.classList.toggle('lit', i < pos || (i === pos && picks.length > pos));
    el.classList.toggle('now', i === pos && picks.length <= pos);
  });
  if (pos < N){
    const sc = D.scenes[pos];
    $('#where').textContent = '第 ' + (pos + 1) + '／' + N + ' 幕';
    $('#vol-now').textContent = D.volumes[sc.vol].label + '・' + D.volumes[sc.vol].title.split('：')[0];
  } else {
    $('#where').textContent = cnum(N) + '幕走完了';
    $('#vol-now').textContent = '終章';
  }
}
function render(freshIdx){
  let h = '';
  const upto = Math.min(pos, N - 1);
  for (let i = 0; i <= upto; i++){
    const sc = D.scenes[i];
    if (D.volumes[sc.vol].first === i + 1) h += volumeHTML(D.volumes[sc.vol]);
    h += (i < pos) ? doneHTML(i) : activeHTML(i, freshIdx === i);
  }
  if (pos >= N) h += endingHTML(freshIdx === N);
  story.innerHTML = h;
  $('#intro').innerHTML = introHTML();
  progress();
}
function goTo(el){
  if (!el) return;
  el.scrollIntoView({behavior: reduce ? 'auto' : 'smooth', block: 'start'});
}

/* ---------- actions ---------- */
function choose(i){
  if (pos >= N || picks.length > pos) return;
  picks[pos] = i; picks.length = pos + 1;
  save();
  const art = $('#scene-' + pos);
  const tmp = document.createElement('div');
  tmp.innerHTML = activeHTML(pos, false);
  const fresh = tmp.firstChild;
  const after = fresh.querySelector('.after'); if (after) after.classList.add('fresh');
  art.replaceWith(fresh);
  progress();
  const a = $('#after-' + pos);
  if (a){ a.focus({preventScroll: true}); a.scrollIntoView({behavior: reduce ? 'auto' : 'smooth', block: 'nearest'}); }
}
function next(){
  if (picks.length <= pos) return;
  pos += 1; save();
  render(pos);
  const el = pos >= N ? $('#ending') : $('#scene-' + pos);
  const vol = el && el.previousElementSibling && el.previousElementSibling.classList.contains('vol') ? el.previousElementSibling : el;
  goTo(vol);
  if (pos >= N && el) el.focus({preventScroll: true});
}
let armTimer = null;
function restart(btn){
  if (!btn.hasAttribute('data-armed')){
    document.querySelectorAll('[data-armed]').forEach(b => { b.removeAttribute('data-armed'); b.textContent = '重新開始'; });
    btn.setAttribute('data-armed', ''); btn.textContent = '再按一次，確定重新開始';
    clearTimeout(armTimer);
    armTimer = setTimeout(() => { btn.removeAttribute('data-armed'); btn.textContent = '重新開始'; }, 4000);
    return;
  }
  clearTimeout(armTimer);
  picks = []; pos = 0; save();
  render(0);
  const b = $('#bar-restart'); b.removeAttribute('data-armed'); b.textContent = '重新開始';
  window.scrollTo({top: 0, behavior: reduce ? 'auto' : 'smooth'});
}

document.addEventListener('click', e => {
  const c = e.target.closest('.choice');
  if (c && !c.disabled && c.closest('.scene')) { choose(+c.dataset.i); return; }
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act;
  if (act === 'next') next();
  else if (act === 'restart') restart(b);
  else if (act === 'top') window.scrollTo({top: 0, behavior: reduce ? 'auto' : 'smooth'});
  else if (act === 'resume') goTo(pos >= N ? $('#ending') : $('#scene-' + pos));
});
story.addEventListener('change', e => {
  if (e.target.id === 'ex-school' || e.target.id === 'ex-fate'){
    $('#exout').innerHTML = comboBlock($('#ex-school').value, $('#ex-fate').value);
  }
});

/* ---------- boot ---------- */
$('#notes').innerHTML = D.notesHtml;
function start(data){
  const st = valid(data) ? data : load();
  if (valid(st)) { picks = st.picks.slice(); pos = st.pos; }
  render(-1);
}
try { window.claude && window.claude.hot && window.claude.hot.snapshot && window.claude.hot.snapshot(() => ({picks: picks.slice(), pos})); } catch(e) {}
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();
</script>
