<script type="application/json" id="data">{"hidden":[{"name":"無名的燈","c":{"t":"fate","f":"宮","op":"==","v":0},"text":"一千五百年，你一次也沒有走進宮門。你只是山裡、街上、田間的一個出家人，史書上沒有你的名字。慧皎編《高僧傳》時說：「若實行潛光，則高而不名」，這樣的人他也想記下。每一次法難過後，重新點起燈來的，有帝王身邊的師賢、曇曜，也有許多像你這樣沒留下名字的人。離開權勢，不等於離開眾生；走近宮廷，也不等於離開修行。"},{"name":"種子現行","c":{"t":"ecount","v":3},"text":"你一次又一次在後來的某一世，認出從前留下的東西。唯識說，念頭與行為會熏成「種子」：種子「剎那滅」，才生就滅，所以沒有常住不變的東西；又「恒隨轉」，前後相續；還要「待眾緣」，遇到因緣才會現行。這不是命運早已寫好，也不是有一個不變的我在輪轉，而是因緣：過去熏成的種子，是今天這一念的因緣之一；今天的選擇，也正在為明天熏習。所以要緊的不是記得前世，而是看清此刻這一念。"},{"name":"行住坐臥","c":{"t":"atleast","v":3,"items":[{"t":"pick","n":13,"k":["A","C"]},{"t":"pick","n":18,"k":["D"]},{"t":"pick","n":24,"k":["A"]},{"t":"pick","n":33,"k":["E"]}]},"text":"你一次次把修行放回日常：數豆念佛的時候、劈柴挑水的時候、下田的時候、跟著一行禪師呼吸、行禪的時候。道綽、百丈、一行禪師的用意各不相同：一位一心繫念佛名，一位在勞動中參禪，一位在呼吸與行動中觀照身心；但三人都不把修行關在禪堂裡。《念處經》說「行則知行，住則知住，坐則知坐，臥則知臥」；印順導師說，四念處就是八正道中正念的內容。這樣的正念，不只是清楚知道自己在做什麼，還要在當中看見身心念念生滅；它以正見為前導，以戒為根基。"},{"name":"消失的宗派","c":{"t":"atleast","v":3,"items":[{"t":"pick","n":7,"k":["E"]},{"t":"pick","n":9,"k":["E"]},{"t":"pick","n":12,"k":["E"]},{"t":"pick","n":14,"k":["E"]}]},"text":"你一再走上後來沒有列進「八宗」的路。南朝的涅槃師以《涅槃經》為宗，講佛性常住、一闡提也能成佛；智顗把《法華》《涅槃》同判為第五時，印順導師說，涅槃之學從此「全入台家之手」。北魏譯出《十地經論》之後，地論師在洛陽分成南北二道，「當現兩說自斯始也」；華嚴宗的智儼問學於地論師智正，印順導師說法藏「別承地論系而宗《華嚴》」。真諦在嶺南譯出《攝大乘論》，法泰帶回建業，卻「道俗無受」，後來靠靖嵩、曇遷才傳到北方；玄奘一系糅譯《成唯識論》，用來駁斥地論、攝論諸師，攝論之學也就併入了法相。信行創三階教，普敬一切人、只認自己的惡，又設無盡藏濟貧。隋開皇二十年下敕禁斷三階教，武周把它的典籍判為偽經，唐開元十三年再令除毀，終於「被禁於隋、唐而歇滅」；典籍要到近代才從敦煌等地的古寫本中找回一部分。宗派的名字，本是因緣和合而立的假名；名字散了，它們追問的問題：人人有沒有佛性、心識如何生起、末法之時該怎麼修，還活在後來的宗派裡。執著一個宗名非留下不可，是集；看清名字本來無常，問題卻一直有人接著問，就是正見。"}],"hiddenLead":"四個隱藏結局，與你的思想、法脈並列出現，條件成立才看得到。","hiddenSrc":"<em>出處：慧皎《高僧傳》序錄（T50, 419a）；《魏書・釋老志》（B17, no. 91, pp. 509a、510a）；《成唯識論》（T31, 9b）；《中阿含經・念處經》（T01, 582b）；印順《佛法概論》（Y08, pp. 8a、226a）；消失的宗派：《續高僧傳》卷一〈法泰傳〉（T50, p. 431a）、卷七〈道寵傳〉（T50, p. 482c）、卷十六〈信行傳〉（T50, p. 560a）、卷十八〈曇遷傳〉（T50, p. 572b）；《大周刊定眾經目錄》卷十五（T55, p. 475a）；《開元釋教錄》卷十八（T55, p. 679a）；印順《中國佛教史略》（Y22, pp. 28a、41a、46a、47a）；矢吹慶輝《三階教之研究》（東京：岩波書店，1927）<\/em>","intro":["你將在一千五百年間一次次出家：從北方亂世山中的一盞油燈，到二十一世紀台灣的一座禪堂。三十三幕都是真實發生過的轉折，你每做一個選擇，就會讀到當年的人怎麼選、後來發生了什麼。沒有標準答案。","走到最後，你會得到五個答案：你的<strong>思想<\/strong>最接近哪一宗、你這一支<strong>法脈今天在哪裡<\/strong>、兩者交會的<strong>組合解讀<\/strong>（依四聖諦細說）、你和別人一起做事時最自然的<strong>角色<\/strong>，以及綜合三十三幕、你<strong>最像的祖師<\/strong>。每一宗另有一位或幾位「近代知音」。","<strong>宿緣。<\/strong> 你在某一世做的選擇，會在後來的某一世冒出來：有時是一段回憶，有時多出一個只屬於你的選項（虛線框）。兩次法難之後的那一幕，也會依你上一世的選擇，交代那一世怎麼結束。唯識說，念頭與行為會熏成「種子」，遇到因緣就現行；這是遊戲借用的比喻。這裡的「你」只是說故事的方便：一世接一世延續下去的，不是一個不變的我，而是念念生滅、前後相續的因果之流，《成唯識論》把它比作瀑流。重點不在前世，而在此刻的選擇。","<strong>地圖。<\/strong> 幕與幕之間有一段兩秒多的地圖過場，畫出你從上一世走到下一世的路；走完三十三幕，結局頁另有全程地圖與八宗興衰時間軸。","<strong>九宗計分。<\/strong> 每個選項會替一至兩個宗派加分，分別是三論、法相、天台、華嚴、律、淨土、臨濟、曹洞、密，共九種（禪宗分為臨濟、曹洞兩家）。得分最高者，就是你的思想結局；同分時，以最後一次得分的宗派優先。","<strong>法脈去向。<\/strong> 每個選項另外累積一項隱藏數值，決定你的法脈在法難與亂世之後的命運：","同分時依「融、山、經、宮」的順序判定。每個選項後方以〔　〕標示計分，例如〔天台＋2｜經＋1〕。正式做成遊戲時，計分標記不顯示給玩家。以【宿緣】【轉生】開頭的段落和選項，只在條件成立時出現。"],"volumes":[{"label":"卷一","title":"東來：用別人的語言，說自己的法","intro":"佛法初入中土的兩三百年，最大的難題不是有沒有人信，而是怎麼說。一套在印度孕育的思想，要用漢字重新生一次。","first":1},{"label":"卷二","title":"立根：在亂世裡安放佛法","intro":"從東晉末年到南北朝，政權更迭如走馬。佛法要在這片土地上扎根，就得回答幾個問題：出家人該不該向君王下跪？誰能成佛？經典被燒了怎麼辦？","first":6},{"label":"卷三","title":"開宗：八家的種子","intro":"隋朝統一南北，也把南北各自發展了兩百年的佛學帶到同一張桌上。判教、立宗、譯經、求法，後世所說的宗派，大多在這幾十年間成形。","first":11},{"label":"卷四","title":"盛世：宮廷、戒壇與講堂","intro":"初唐到武周，是漢傳佛教最風光的半個世紀。帝王親臨譯場，高僧肩輿上殿。這份榮耀替學派帶來了資源，也替它們埋下了命運。","first":16},{"label":"卷五","title":"東渡：法在海的那一邊","intro":"盛唐的光芒照到了海外。日本與新羅的僧人渡海而來，唐人也渡海而去。當時沒有人知道，這些帶過海的經卷與法脈，有一天會比留在長安的更長久。","first":21},{"label":"卷六","title":"存亡：法難之後","intro":"會昌年間的一連串詔令，決定了八宗後來一千年的命運。有的宗派從此斷了，有的在海外等了幾百年才回家，有的則把自己融進了別人的生命裡。","first":26},{"label":"卷七","title":"人間：近代的燈","intro":"清末以來，佛教在戰亂、革命與現代化之中重新找路。這一次，八宗不再各自為政，而是由幾位大師把它們帶進人間；漢傳的燈也隨臨濟法脈傳到越南，再隨一位流亡的禪師走向世界。","first":31}],"scenes":[{"n":1,"num":"一","title":"舊瓶","era":"後趙末至前燕初（約 350 年前後）・飛龍山","body":[{"h":"北方正亂。石虎死後，後趙諸子相殘，兵禍不斷，逃進山裡的人，比讀經的人還多。你出家第五年，在飛龍山隨眾修行。"},{"h":"這幾十年，佛經一部部譯成漢文，讀的人卻總覺得隔著一層紗。於是講經的法師想出一個辦法：把佛經裡的名相條目，一一比配到讀書人早已熟悉的中國典籍上，例如以佛教的五戒比配儒家的五常。史書說這是「以經中事數，擬配外書」，叫作「格義」。早期譯經也常借用老莊的「本無」「無為」等詞來說佛理。士大夫聽了，彷彿久別重逢。"},{"h":"這天，釋道安與他的老友竺僧先在山中重逢。夜裡對坐談經，道安忽然說：「先舊格義，於理多違。」前輩們用老莊配佛理，很多地方是說錯了的。"},{"h":"僧先不以為然：「且當分折逍遙，何容是非先達？」我們只管把道理講明白，哪輪得到評斷前輩的對錯？"},{"h":"道安答：「弘贊理教，宜令允愜。法鼓競鳴，何先何後？」弘揚真理，就要講得恰如其分；法鼓齊響的時候，哪裡還分先輩後輩。"},{"h":"油燈下，兩位三十多歲的法師都看向你這個年輕人。"}],"options":[{"k":"A","t":"道安說得對。借來的衣裳再合身，也不是自己的。寧可講得慢、聽的人少，也要講得準。","s":{"三論":1,"法相":1},"f":"經"},{"k":"B","t":"僧先也有他的道理。讀書人聽得懂老莊，就從老莊入門；先讓人走進門來，再慢慢說清楚。","s":{"淨土":1,"臨濟":1},"f":"融"},{"k":"C","t":"兩種說法都留著：對初學的人借老莊打比方，對深入的人說回佛經本意。法本來就應該因人而說。","s":{"天台":1,"華嚴":1},"f":"融"},{"k":"D","t":"名相之爭，終究是紙上的事。我想找一位真能禪修的老師，先把心安住。","s":{"曹洞":2},"f":"山"}],"after":["道安一生致力於把佛法「說準」。他編成可考最早、最有系統的佛經目錄《綜理眾經目錄》（原書已佚，內容大致保存在僧祐《出三藏記集》中），分辨哪些經可信、哪些可疑；也歸納出翻譯的「五失本、三不易」，提醒譯者哪些地方最容易走樣。出家人一律以「釋」為姓，也是從他開始。格義並未立刻消失，東晉的「六家七宗」仍帶著玄學的影子；要到鳩摩羅什譯出中觀論書、僧肇寫成《不真空論》，中國人才第一次用佛教自己的道理講清楚什麼是「空」。"],"source":"<em>出處：《高僧傳》卷五〈竺僧先傳〉〈釋道安傳〉；僧祐《出三藏記集》；僧肇《不真空論》<\/em>","vol":0},{"n":2,"num":"二","title":"不依國主","era":"東晉興寧三年（365）・新野","body":[{"h":"前燕的大軍逼近河南，道安帶著數百位徒眾往南逃難。走到新野，糧食快要見底，這麼多人再也不可能走在一起了。"},{"h":"道安召集大眾，說了一句後來影響中國佛教一千多年的話：「今遭凶年，不依國主，則法事難立；又教化之體，宜令廣布。」如今是凶年，沒有君王的依靠，佛法的事業立不起來；而教化本來就該向四方散開。"},{"h":"於是他把徒眾分成幾路：竺法汰帶一支往東南，到東晉京城建康；法和帶一支入蜀；他自己帶著慧遠等四百多人南下襄陽。你必須決定走哪一條路。"}],"options":[{"k":"A","t":"去建康。亂世之中，沒有王公護持，寺院連一年都撐不過；京城裡有願意護法的人。","s":{"天台":1,"密":1},"f":"宮"},{"k":"B","t":"跟道安去襄陽。他手邊的經卷與注疏最多，我想留在他身邊抄書、校經。","s":{"法相":1,"三論":1},"f":"經"},{"k":"C","t":"哪一路都不走。佛法若要靠權勢才能存續，那就不是佛陀的法了。我留在山裡，自己耕種、自己修行。","s":{"曹洞":2},"f":"山"},{"k":"D","t":"「教化之體，宜令廣布」——我想往更偏遠、還沒有佛法的地方去，在那裡和百姓一起過日子。","s":{"淨土":1,"律":1},"f":"融"}],"after":["道安在襄陽住了十五年，受東晉地方官與名士習鑿齒供養。379 年前秦苻堅遣苻丕攻下襄陽，把他迎到長安，還說自己「以十萬之師取襄陽，唯得一人半」，一人是道安，半人是習鑿齒。在長安，道安主持譯場，並勸苻堅迎請西域的鳩摩羅什。「不依國主」從此成為漢傳佛教的雙面刃：王權能讓一個學派一夜興盛，也能讓它一夜斷絕。"],"source":"<em>出處：《高僧傳》卷五〈釋道安傳〉；《晉書・習鑿齒傳》<\/em>","vol":0},{"n":3,"num":"三","title":"嚼飯與人","era":"後秦弘始年間（約 402–413）・長安逍遙園","body":[{"h":"鳩摩羅什終於到了長安。後秦國主姚興以國師之禮迎他入逍遙園，幾百位學僧團團圍坐，譯經時聽講的人動輒上千。你是其中一位「筆受」，負責把口譯的內容寫成漢文。"},{"h":"譯到《法華經》時，舊譯本有一句「天見人，人見天」。羅什說：意思與西域原文相同，只是「在言過質」，太粗樸了。你身邊的僧叡輕聲說：「將非『人天交接，兩得相見』？」羅什很高興：「實然。」"},{"h":"羅什常說，天竺最重文采，經中偈頌本可入樂歌唱；「但改梵為秦，失其藻蔚，雖得大意，殊隔文體，有似嚼飯與人，非徒失味，乃令嘔噦也。」翻譯，就像把飯嚼過再餵給別人，不但沒了味道，還令人作嘔。"},{"h":"輪到你下筆了。"}],"options":[{"k":"A","t":"寧可文字生硬，也要一字一句貼近原本；後人讀不順，至少不會讀錯。","s":{"法相":2},"f":"經"},{"k":"B","t":"像僧叡那樣，找一句既不失原意、又是漢人讀得下去的話；經要有人背誦，才算活在世上。","s":{"三論":1,"天台":1},"f":"融"},{"k":"C","t":"譯文是給修行的人用的。義理對了，繁複的地方就該刪繁就簡，讓一般人也唸得出口。","s":{"淨土":1,"臨濟":1},"f":"山"},{"k":"D","t":"譯經是國家大事。我建議把譯稿先呈給姚興，請他親自對校舊經，讓朝廷更看重這件事。","s":{"華嚴":1,"密":1},"f":"宮"}],"after":["譯《大品般若》時，姚興確實親自手持舊譯本與羅什對校。羅什十二年間譯出三十五部、近三百卷，文字流暢典雅，對繁冗之處不少刪略，如《大智度論》就只全譯首品。後世八宗有一半從這個譯場發芽：《中論》《百論》《十二門論》是三論宗的根本，《法華經》是天台宗的根本，《阿彌陀經》是淨土最常誦的經，《金剛經》《維摩經》是禪家最愛引的經。兩百多年後玄奘重譯，文字更嚴謹，但中國人日常念的，大多仍是羅什的版本。後世尊龍樹為「八宗共祖」；他的論著能在漢地普及，羅什的翻譯是關鍵。"],"source":"<em>出處：《高僧傳》卷二〈鳩摩羅什傳〉、卷六〈僧叡傳〉；《出三藏記集》；《星雲大師全集・佛光教科書 3 菩薩行證》第十課〈八宗共祖龍樹菩薩〉<\/em>","vol":0},{"n":4,"num":"四","title":"臭泥與蓮花","era":"後秦・長安","body":[{"h":"姚興對羅什敬重到了極點，也擔心到了極點：這樣的天才一旦死去，「何可使法種無嗣」？於是他「以妓女十人，逼令受之」。從此羅什不再住在僧坊，另住官舍。"},{"h":"譯場照常運作。只是每次升座講經，羅什總要先打一個譬喻：「如臭泥中生蓮花，但採蓮花，勿取臭泥也。」"},{"h":"這句話在學僧之間傳開了。有人感動，有人嘆息，也有人私下說：既然師父都可以，我們為何不行？這些年間，一位精通戒律的罽賓法師卑摩羅叉也來到長安。"}],"options":[{"k":"A","t":"「但採蓮花」。法是法，人是人；他對「空」的理解無人能及，我繼續留在譯場。","s":{"三論":2},"f":"經"},{"k":"B","t":"無論是否被迫，都違背了戒律。我敬重他的學問，但選擇離開，去山中找持戒清淨的師父。","s":{"律":2},"f":"山"},{"k":"C","t":"這是國主的意思，誰也違抗不了。我不議論，只求譯場在這個局面下繼續運作。","s":{"華嚴":1,"密":1},"f":"宮"},{"k":"D","t":"學問與戒行可以各取所長：在羅什門下學空義，到卑摩羅叉那裡學律。","s":{"天台":1,"律":1},"f":"融"}],"after":["羅什主持譯場直到逝世（卒年有 409、413 兩說，一般依僧肇誄文作 413 年）。他對卑摩羅叉執弟子之禮，也與弗若多羅合譯了《十誦律》。他臨終發願：若所譯無誤，焚身之後舌不燋爛。《高僧傳》記載其後「薪滅形碎，唯舌不灰」。《晉書》另記一則傳說：羅什置針滿缽，對想仿效的僧眾說「若能見效食此者，乃可畜室」，然後把針吞了下去。這是史書中的奇談，未必是事實，卻說明當時人對這件事有多不安。羅什門下的僧肇、道生、僧叡、道融，後世合稱「什門四聖」。"],"source":"<em>出處：《高僧傳》卷二〈鳩摩羅什傳〉〈卑摩羅叉傳〉；《晉書・藝術傳》（CBETA《大藏經補編》正史選輯，B17, no. 91, pp. 461a–464a）；僧肇〈鳩摩羅什法師誄〉（《廣弘明集》卷二十三）<\/em>","vol":0},{"n":5,"num":"五","title":"般若臺前","era":"東晉元興元年（402）七月・廬山般若臺","body":[{"h":"這一天，慧遠與劉遺民等一百二十三人，在般若臺精舍的阿彌陀佛像前設齋立誓，相約同生西方。劉遺民執筆的誓文寫道：大家「僉心西境」，同心嚮往西方；先往生的人不可只顧自己，忘了還在後頭的同伴，先後到達的人都要彼此提攜。"},{"h":"他們修的念佛，和你想像的不同。那不是口中稱念佛號，而是依《般舟三昧經》，專心繫念阿彌陀佛，直到在深定之中親見佛身。這是一門要求極高的禪法。"},{"h":"慧遠心中也有疑問。幾年後，他將寫信到長安問鳩摩羅什：定中所見的佛，是佛真的來了，還是自心所現？若是自心所現，又與夢有何不同？"},{"h":"誓文傳到你手上，筆已濡了墨。"}],"options":[{"k":"A","t":"簽下名字。亂世人命如朝露，一心願生西方，是最穩當的歸宿。","s":{"淨土":2},"f":"山"},{"k":"B","t":"簽名。但我在意的不是身後，而是此生在定中親見佛陀；念佛本身就是一門深禪。","s":{"淨土":1,"曹洞":1},"f":"融"},{"k":"C","t":"先不簽。我想先弄明白：定中所見，究竟是佛來，還是心現？","s":{"法相":1,"三論":1},"f":"經"},{"k":"D","t":"名單上有許多名士。我建議把誓文送到建康傳抄，讓朝中更多貴人知道廬山。","s":{"天台":1,"密":1},"f":"宮"}],"after":["這場集會，後世稱為「白蓮社」，並附會出「十八高賢」「虎溪三笑」等故事，多半是唐宋以後的傳說。宋代淨土行者推慧遠為初祖；但印順導師指出：「其實遠公的念佛，並不重在口念」，而是「定中見阿彌陀佛，正是《般舟三昧經》的法門」。要到北魏曇鸞依世親《往生論》重視稱名，再到唐代善導，淨土才從少數人的深定，變成人人可行的稱名念佛。至於慧遠問羅什的那些問題，羅什以中觀的立場作答，後人將兩人書信編為《大乘大義章》。"],"source":"<em>出處：《高僧傳》卷六〈慧遠傳〉（附劉遺民誓文）；《鳩摩羅什法師大義》；印順《淨土與禪》（CBETA Y17, p. 63、119）<\/em>","vol":0},{"n":6,"num":"六","title":"方外之賓","era":"東晉元興元年至三年（402–404）・廬山東林寺","body":[{"h":"權臣桓玄控制了建康，不久就要篡晉稱帝。他寫信到廬山，重提一個六十年前就吵過的問題：沙門見了君王，該不該跪拜？"},{"h":"桓玄的道理說得堂皇：老子把王侯與道、天、地並列為「大」，君王資生萬物，沙門也吃王土所生的米，憑什麼不拜？同一時間，他下令沙汰天下僧尼，獨獨注明廬山「道德所居，不在搜簡之例」。"},{"h":"這是敬重，也是試探。慧遠年近七十，入廬山已二十年，「影不出山，迹不入俗」。他把你叫進禪房，要你幫忙擬一封回信。"}],"options":[{"k":"A","t":"寸步不讓。「袈裟非朝宗之服，鉢盂非廊廟之器」；一旦向王者跪拜，佛法就成了朝廷的一個衙門。","s":{"律":1,"臨濟":1},"f":"山"},{"k":"B","t":"跪拜不過是禮節，不礙修行。桓玄手握生殺大權，廬山數百人的安危，比一個姿勢重要。","s":{"密":1,"法相":1},"f":"宮"},{"k":"C","t":"回信要寫，但要寫得讓桓玄讀得下去：援引儒家的禮、道家的方外之說，讓他明白不拜正是另一種尊重。","s":{"天台":1,"華嚴":1},"f":"融"},{"k":"D","t":"把雙方往來的書信、議論一一抄錄存檔。這場爭論，不會在我們這一代結束。","s":{"三論":1,"律":1},"f":"經"}],"after":["慧遠在 404 年寫成五篇《沙門不敬王者論》。他並不否定君王：在家奉法者，理當盡忠孝之禮；出家人則是「方外之賓，迹絕於物」，以「遁世以求其志，變俗以達其道」。他還說，只要一個人修得全德，就能「道洽六親，澤流天下」，雖不居王位，已經在輔佐王化。桓玄稱帝後下詔允許沙門不拜，次年兵敗身死。可是問題並沒有結束：唐高宗龍朔二年（662）又議沙門拜君親，道宣等人力爭之後，朝廷免了拜君，卻仍下詔要拜父母。唐宋以後，僧人上表稱臣漸成常態。這些往來書信，靠南朝僧祐編入《弘明集》才流傳至今。"],"source":"<em>出處：《弘明集》卷五、卷十二；《高僧傳》卷六〈慧遠傳〉；彥悰《集沙門不應拜俗等事》<\/em>","vol":1},{"n":7,"num":"七","title":"孤明先發","era":"劉宋元嘉年間・建康","body":[{"h":"建康的僧眾正在讀一部新譯的六卷《泥洹經》。經中說：一切眾生皆有佛性——但「一闡提」除外。一闡提，指的是斷盡善根、永不信法的人。"},{"h":"羅什的高徒竺道生卻說：一闡提也能成佛。經上明明寫著除外，他憑什麼這樣說？道生的回答是：經文尚未譯全，但佛理應當如此。"},{"h":"《高僧傳》形容當時的他「孤明先發，獨見忤眾」——一個人先看見了光，卻因此得罪了所有人。今天的僧眾大會，要表決是否將他逐出建康。輪到你了。"}],"options":[{"k":"A","t":"經文明寫「除一闡提」。在新的經典出現之前，不能以一人之見改動經意。","s":{"法相":2},"f":"經"},{"k":"B","t":"若佛性是眾生本有，就不該有人被排除在外。道生雖然孤單，但他讀懂了佛陀的心。","s":{"天台":1,"華嚴":1},"f":"融"},{"k":"C","t":"擯不擯他是僧團的事。我更在意的是：若人人本具佛性，答案就不在經裡，而在自己心上。","s":{"臨濟":2},"f":"山"},{"k":"D","t":"經義未定，不宜擯人。我去請信佛的朝臣出面調停，等北方的完整譯本傳來再說。","s":{"三論":1,"律":1},"f":"宮"},{"k":"E","t":"我不表決。我要專講《涅槃經》：六卷本既然譯得不全，我就等北涼的大本傳來，一字一句讀通「佛性」兩個字，這是我一生的功課。","s":{"天台":1,"華嚴":1},"f":"經"}],"after":["道生還是被擯出了建康。臨行他在大眾面前立誓：若所說違背經義，願現身患病；若不違實相，願捨壽之時坐於獅子座上。不久，曇無讖在北涼譯出的四十卷本《大般涅槃經》傳到建康，經中果然說一闡提也有佛性。434 年，道生在廬山講經，講畢端坐法座而逝。「生公說法，頑石點頭」是後世的美麗傳說。「一切眾生皆可成佛」從此成為漢傳佛教的主流；道生的「頓悟」說，常被視為禪宗的源頭之一；但印順導師認為達摩禪「學自西來……不必與道生有關」，是南禪流行之後，「學者乃回憶道生」。兩百年後，這個問題將以更尖銳的形式回來。"],"source":"<em>出處：《高僧傳》卷七〈竺道生傳〉；六卷《大般泥洹經》；北本《大般涅槃經》<\/em>","vol":1},{"n":8,"num":"八","title":"經像焚盡之前","era":"北魏太平真君七年（446）・平城","body":[{"h":"北魏太武帝西征叛亂，大軍開進長安。他偶然走進一座佛寺，從寺中搜出弓矢矛盾，又搜出釀酒的器具，以及地方官與富戶寄存的財物。他怒不可遏。"},{"h":"重臣崔浩本就信奉道教，趁機進言，勸帝王盡除佛法。詔令下來了：「諸有佛圖形像及胡經，盡皆擊破焚燒，沙門無少長悉坑之。」"},{"h":"長安的僧人已遭屠戮。然而在京城平城監國的太子拓跋晃素來敬佛，故意放慢了向全國宣詔的速度。消息先一步傳到你在平城的寺院。你只有幾天。"}],"options":[{"k":"A","t":"把經卷與佛像裝箱，埋進山洞，或託付給信佛的人家秘藏。人可以死，經不能亡。","s":{"天台":1,"法相":1},"f":"經"},{"k":"B","t":"脫下袈裟，暫時還俗，混在百姓之中。只要心中有法，風頭過去再出家。","s":{"淨土":1,"臨濟":1},"f":"融"},{"k":"C","t":"帶幾位同修逃進深山石窟，照常持戒、坐禪，就當這世間沒有皇帝。","s":{"曹洞":1,"律":1},"f":"山"},{"k":"D","t":"冒險求見太子，請他把詔書再壓幾天，多救一些人。","s":{"密":1,"三論":1},"f":"宮"}],"after":["《魏書・釋老志》記載：「四方沙門多亡匿獲免，在京邑者亦蒙全濟。金銀寶像及諸經論，大得秘藏。而土木宮塔，聲教所及，莫不畢毀矣。」452 年太武帝被弒，文成帝即位後立刻復佛。沙門曇曜奏請在平城西郊開鑿五座大窟，就是今天的雲岡「曇曜五窟」，學者多認為五尊大佛象徵北魏的五位帝王。曇曜任沙門統後，又奏設「僧祇戶」「佛圖戶」，以國家編戶供養僧團。經歷法難的北方佛教，選擇了與國家綁得更緊。這是「三武一宗」四次法難的第一次。"],"source":"<em>出處：《魏書・釋老志》（CBETA《大藏經補編》正史選輯，B17, no. 91, pp. 508a、510a）；《魏書・世祖紀》（不在 CBETA）<\/em>","vol":1},{"n":9,"num":"九","title":"得法轉少","era":"陳太建七年（575）・金陵瓦官寺","body":[{"h":"上一世，你把經卷埋進了平城外的山洞。《魏書・釋老志》說，那場法難中「金銀寶像及諸經論，大得秘藏」；六年後文成帝復佛，藏起來的經像又重見天日。那一世，你沒有白白守著。","kind":"轉生","c":{"t":"pick","n":8,"k":["A"]}},{"h":"上一世，你在法難中脫下了袈裟。和你一樣的人不少：京師沙門師賢假託行醫還俗，卻「守道不改」；文成帝復佛那天，他立刻重新出家，皇帝親自為他剃髮。那一世，你也是重新剃度的人之一。","kind":"轉生","c":{"t":"pick","n":8,"k":["B"]}},{"h":"上一世，你在深山石窟裡熬過了法難。復佛之後，沙門曇曜奏請在平城西郊的武州塞「鑿山石壁，開窟五所」。你在山中守住的那盞燈，後來換了一種樣子，刻進了雲岡的石壁。","kind":"轉生","c":{"t":"pick","n":8,"k":["C"]}},{"h":"上一世，你冒險求見了太子。太子的勸諫沒有被採納，但他「緩宣詔書，遠近皆豫聞知，得各為計」，許多僧人因此逃過一劫。史書記下了太子，沒有記下你的名字。","kind":"轉生","c":{"t":"pick","n":8,"k":["D"]}},{"h":"智顗在光州大蘇山依慧思學「法華三昧」，奉師命到陳朝京城弘法，在瓦官寺講經八年。王公大臣爭相來聽，寺裡的人一年比一年多。"},{"h":"這一天，智顗對弟子們算了一筆帳：「初瓦官四十人共坐，二十人得法；次年百餘人共坐，二十人得法；次年二百人共坐，減十人得法；其後徒眾轉多，得法轉少。」人越來越多，悟道的人卻越來越少，連自己的修行也受了妨礙。"},{"h":"他說：「群賢各隨所安，吾欲從吾志。」各位隨自己的安排吧，我要去做我想做的事了。他要入天台山。"}],"options":[{"k":"A","t":"隨師父入天台山。人多了，法反而淡了；先成就自己，才能真正度人。","s":{"天台":2},"f":"山"},{"k":"B","t":"留在金陵。朝廷與士大夫都在聽，這是弘法的大好時機；興皇寺的法朗法師也在城裡講三論，我想兩邊都學。","s":{"三論":1,"天台":1},"f":"宮"},{"k":"C","t":"留下來整理師父這八年的講經筆記。說過的法若無人記下，將來就散了。","s":{"天台":1,"華嚴":1},"f":"經"},{"k":"D","t":"我比師父走得更遠：入山之後不講經、不著書，只管坐禪。","s":{"曹洞":2},"f":"山"},{"k":"E","t":"不入山，也不留在瓦官寺。從嶺南回來的法泰正在講真諦新譯的《攝大乘論》，聽的人很少；我想跟他把這部論講的心識學通。","s":{"法相":2},"f":"經"}],"after":["智顗在天台山華頂峰獨自修行，經歷了「華頂降魔」的大悟。他在山中十年，585 年才應陳後主之請回到金陵。他一生批評兩種人：只坐禪、不學教理的「闇證禪師」，只讀經、不修止觀的「誦文法師」。天台宗因此以「教觀雙美」著稱：教，是判釋一代佛法的宏大體系，後人歸納為「五時八教」；觀，是止觀實修。他的講述後來由弟子灌頂筆錄成《法華玄義》《法華文句》《摩訶止觀》，合稱「天台三大部」。"],"source":"<em>出處：灌頂《隋天台智者大師別傳》；《摩訶止觀》；轉生段落：《魏書・釋老志》（B17, no. 91, pp. 508a、509a、510a）<\/em>","vol":1},{"n":10,"num":"十","title":"三間堂","era":"隋開皇九年（589）・金陵","body":[{"h":"隋軍渡江，陳朝滅亡。幾個月前還是京城的金陵，如今「道俗波迸，各棄城邑」，僧俗都在逃。一座座寺院人去樓空，經疏散落在地，無人理會。"},{"h":"興皇寺法朗的弟子吉藏，這一年四十歲。他沒有逃，而是帶著身邊的人走進一座又一座空寺，「但是文疏，並皆收聚」，只要是寫了字的，全部抱走。"},{"h":"吉藏所學的三論，專講龍樹、提婆的空義。有人批評這一派「只破不立」，吉藏日後在《三論玄義》中說：論的意義只有兩條路，「一曰顯正，二曰破邪」；破除了一切執著，正理自然顯現。"},{"h":"天色漸暗。你懷裡已經抱不下了。"}],"options":[{"k":"A","t":"跟著吉藏走遍空寺，凡是文疏一律收起，堆滿三間堂再說。","s":{"三論":1,"法相":1},"f":"經"},{"k":"B","t":"經疏散了還能再寫，人散了就難聚。我去收容逃難的僧眾與百姓。","s":{"淨土":1,"律":1},"f":"山"},{"k":"C","t":"陳亡隋興，新朝的晉王正在招攬江南高僧。我去揚州，為這一系爭取新朝的護持。","s":{"天台":1,"三論":1},"f":"宮"},{"k":"D","t":"收經之外，我更想做吉藏正在做的事：把南北各家的說法讀遍，一一破除其中的執著，讓正理自己顯現。","s":{"三論":2},"f":"融"}],"after":["《續高僧傳》說，吉藏把收來的文疏「置于三間堂內，及平定後方洮簡之，故目學之長勿過於藏」。他因此成為當時讀書最博的學僧，為《中論》《百論》《十二門論》各作疏釋，又寫成《三論玄義》，三論宗至此集大成。他也寫信請智顗講《法華經》，兩位宗師互相敬重。吉藏死於 623 年，臨終前寫下《死不怖論》。吉藏之後，三論宗北方無傳，南方漸衰，印順導師說它「迄唐武滅法而後絕」；但他的高句麗弟子慧灌在 625 年把三論帶到日本，成為日本最早的學派之一。"],"source":"<em>出處：《續高僧傳》卷十一〈吉藏傳〉；吉藏《三論玄義》；《國清百錄》<\/em>","vol":1},{"n":11,"num":"十一","title":"智者","era":"隋開皇十一年（591）・廬山","body":[{"h":"滅陳的統帥是晉王楊廣。如今他坐鎮揚州，總管江南。江南剛剛平定一場叛亂，人心未附。"},{"h":"楊廣一再遣使到廬山，請智顗為他授菩薩戒。智顗曾是陳朝君臣所敬的法師；如今來請他的，是滅了陳朝的人。他推辭了幾次，最後提出幾個條件：不要拿「禪師」的名號來要求他，去留也要由他自己決定。"},{"h":"楊廣的使者在山門外等回信。師父問你怎麼想。"}],"options":[{"k":"A","t":"勸師父答應。江南初定，有晉王護持，天台的教法才能傳遍天下。","s":{"天台":1,"密":1},"f":"宮"},{"k":"B","t":"勸師父推辭。昨日的陳朝君臣今在何處？與權力走得越近，跌得越重。","s":{"曹洞":1,"律":1},"f":"山"},{"k":"C","t":"答應，但條件要先說清楚：法師不是朝廷的屬官，弘法與去留都由自己。","s":{"天台":2},"f":"融"},{"k":"D","t":"趁晉王禮遇，請他出資收集、抄寫戰亂中散佚的經典，讓這份護持落在經藏上。","s":{"華嚴":1,"法相":1},"f":"經"}],"after":["591 年冬，智顗在揚州為楊廣授菩薩戒，楊廣尊他為「智者」。597 年，智顗應楊廣之召下山，行至半路病重，寫下給晉王的遺書後坐化。楊廣依他生前所畫的圖樣建寺，即位後賜名「國清寺」。楊廣就是後來的隋煬帝。天台宗得到隋室護持，聲勢極盛；隋亡之後，唐初聲勢卻遠不及隋時，直到八世紀的湛然才重新振興。"],"source":"<em>出處：灌頂《隋天台智者大師別傳》；《國清百錄》<\/em>","vol":2},{"n":12,"num":"十二","title":"刻在石上的經","era":"隋大業年間（605–618）・幽州白帶山","body":[{"h":"你年幼時親眼見過北周武帝滅佛：寺塔拆毀，經像成灰，僧尼被迫還俗。這是繼北魏太武帝之後，第二次主政者下令滅佛。如今隋朝復興佛教，寺院重建，你心裡卻總有一絲不安。"},{"h":"南嶽慧思在《立誓願文》中推算：佛滅之後，正法五百年、像法一千年、末法一萬年，而他自己生於「末法八十二年」。末法，就是教法還在、卻沒有人能依法證果的時代。"},{"h":"幽州有一位釋靜琬，相傳是慧思的弟子。他在白帶山上鑿岩為室，把佛經一字字刻在石版上，刻滿一室就封住洞口。他問你，願不願意上山。"}],"options":[{"k":"A","t":"隨靜琬上山刻經。紙會朽、木會焚，只有石頭等得到法難過去。","s":{"天台":1,"律":1},"f":"經"},{"k":"B","t":"末法既至，深奧的教理凡夫難以修證；與其刻經，不如專心念佛，求生淨土。","s":{"淨土":2},"f":"山"},{"k":"C","t":"封進山洞的經，若無人讀，與沒有何異？佛法要活在人心裡，我去城中講經。","s":{"華嚴":1,"三論":1},"f":"融"},{"k":"D","t":"去請皇后與朝臣布施，讓這件事成為國家的功德，才做得大、做得久。","s":{"密":1,"法相":1},"f":"宮"},{"k":"E","t":"不上山。信行禪師說，末法時代要做的不是講深理，而是普敬一切人、只認自己的惡。三階教雖然遭朝廷禁斷，長安的信眾仍多；我去投它，把布施存進無盡藏，救濟貧苦。","s":{"律":1,"淨土":1},"f":"山"}],"after":["《冥報記》說，隋煬帝蕭皇后施絹千匹，其弟蕭瑀也施絹五百匹（書中將靜琬作「智苑」）。貞觀二年（628）他在石上題記：正法像法已過，「已浸末法七十五載」；貞觀八年（634）的另一則題記又說「此經為未來佛法難時，擬充經本，世若有經，願勿輒開」——只要世上還有經，就請不要打開。靜琬 639 年逝世後，師徒五代相承，遼、金續刻，前後千年；1956 年起發掘，得刻經石一萬四千餘塊，即「房山石經」。同一種末法焦慮，也催生了信行的三階教：主張末法眾生只能「普敬認惡」，並設「無盡藏」救濟貧苦。三階教盛極一時，隋唐屢遭禁斷，玄宗開元年間嚴令禁絕，此後漸趨衰亡，典籍散佚；直到二十世紀，學者才在敦煌寫本與日本古寺中重新找到它的著作。"],"source":"<em>出處：慧思《南嶽思大禪師立誓願文》；靜琬貞觀二年、貞觀八年題刻（《房山雲居寺石經》，CBETA 大藏經補編 B26, no. 146, pp. 12a、105a）；唐臨《冥報記》（T51, 789c）；《續高僧傳》卷十六〈信行傳〉<\/em>","vol":2},{"n":13,"num":"十三","title":"一粒小豆","era":"隋大業五年（609）以後・并州玄中寺","body":[{"h":"道綽本是講《涅槃經》的名師，前後講了二十四遍。他住的玄中寺，相傳是曇鸞所立，寺中還立著曇鸞的碑。道綽常說：鸞法師那樣的高德，尚且捨了講說、專修淨土，我這點所知所解，又算得了什麼？"},{"h":"於是從大業五年起，他捨了《涅槃經》的講席，一向專念阿彌陀佛，此後只講《觀無量壽經》勸人往生。他寫下的理由很直白：佛法有兩條路，一是靠自力悟道的「聖道」，一是仗佛願力的「往生淨土」；而「當今末法，現是五濁惡世，唯有淨土一門，可通入路」。"},{"h":"他教鄉民每念一聲佛號，就放一粒小豆。你是他當年講經時的同學，他遞給你一把豆子。"}],"options":[{"k":"A","t":"跟著道綽捨講專修。末法眾生根機淺薄，與其在義理裡打轉，不如老實念佛。","s":{"淨土":2},"f":"山"},{"k":"B","t":"我仍要講經。若人人只念佛號，誰來弄清楚佛為什麼這樣說？","s":{"三論":1,"天台":1},"f":"經"},{"k":"C","t":"念佛與禪觀本是一事：口念佛名，心也就收攝了。我兩樣一起修。","s":{"淨土":1,"曹洞":1},"f":"融"},{"k":"D","t":"末法之說太過悲觀。佛法要興，靠的是天下安定、朝廷護持；我去長安，那裡正需要人。","s":{"法相":1,"華嚴":1},"f":"宮"}],"after":["道綽每日稱念佛名以七萬聲為限，又穿木欒子做成數珠分送信眾；《續高僧傳》寫他的法會「人各掐珠，口同佛號」，是漢地以念珠念佛的早期記載。迦才記載，并州三縣七歲以上的人都會念彌陀，精進者用來計數的小豆多達八九十石。他的弟子善導後來在長安把稱名念佛推向高峰。《安樂集》的「聖道、淨土」二門之判，五百年後成為日本法然開創淨土宗的理論基石。淨土在中國始終沒有嚴密的宗派組織，卻成了流傳最廣的法門。"],"source":"<em>出處：《續高僧傳》卷二十〈道綽傳〉（T50, 593c）；迦才《淨土論》卷下（T47, 98b）；道綽《安樂集》卷上（T47, 13c）<\/em>","vol":2},{"n":14,"num":"十四","title":"寧可就西而死","era":"唐貞觀初年（一說 629）・涼州至瓜州","body":[{"h":"年輕的玄奘遍訪名師，後來發現各家對同一部經論說法不一，拿經典對照也各有出入。他決心西行印度，取回《十七地論》（即《瑜伽師地論》），一解眾疑。"},{"h":"可是唐朝初立，嚴禁百姓出境。涼州都督李大亮聽說有個僧人要往西去，逼他回京。河西的惠威法師敦重他的志向，派弟子暗中護送。你就是其中一人。"},{"h":"到了瓜州，緝捕的公文也到了。州吏李昌拿著公文問玄奘：「師不是此耶？」聽完實情，李昌當面把公文撕了，只說：「師須早去。」往前是玉門關、五座烽火台，再往前是八百里的莫賀延磧。玄奘看著你，等你決定。"}],"options":[{"k":"A","t":"跟他走。國禁是人定的，法是佛說的；為求真經，這條命可以不要。","s":{"法相":2},"f":"經"},{"k":"B","t":"不走。私越國境違反國法，出家人也該守法；我勸他上表朝廷，等候准許。","s":{"律":1,"密":1},"f":"宮"},{"k":"C","t":"不走，但不是因為怕。中土的經已經夠多，問題不在經少，而在沒有人真正去修。","s":{"臨濟":2},"f":"山"},{"k":"D","t":"我留在河西，為往來西域的商旅與僧人講經，讓這條路上處處有佛法。","s":{"淨土":1,"天台":1},"f":"融"},{"k":"E","t":"我不跟去。我要東去長安，跟地論師把《十地經論》讀通。各家說法雖然不一，答案總在已經譯出的經論裡。","s":{"華嚴":1,"法相":1},"f":"經"}],"after":["玄奘趁夜在玉門關上游渡河，繞關而過，在莫賀延磧迷了路，又失手打翻水袋，一度想回頭。走了十餘里，他想起自己的誓願：「若不至天竺，終不東歸一步，今何故來？寧可就西而死，豈歸東而生！」於是轉馬西行，四夜五日滴水未進。他後來在那爛陀寺從戒賢學《瑜伽師地論》，645 年帶著六百五十七部經論回到長安。唐太宗不但不追究他私自出境，還為他的譯經親撰《大唐三藏聖教序》。"],"source":"<em>出處：慧立、彥悰《大慈恩寺三藏法師傳》卷一（T50, 223a–224b）；《大唐西域記》序（T51, 867c）<\/em>","vol":2},{"n":15,"num":"十五","title":"無性有情","era":"唐高宗年間（約 664–682）・長安大慈恩寺","body":[{"h":"玄奘已經圓寂。他的弟子窺基在慈恩寺講《成唯識論》，精密得像一座宮殿：八個識、種子與現行、三自性，一切都是識所變現。後人把這一派稱為法相宗，也稱唯識宗。"},{"h":"今天講到「五性各別」：眾生的根性天生分為五類，其中有一類「無性有情」，沒有成就解脫的種子，永遠不能成佛。"},{"h":"講堂上一位老僧站了起來。他說，兩百多年前道生因為主張一闡提也能成佛，被趕出建康，後來《涅槃經》證明他是對的；如今新譯的論書，卻又要把一些人關在門外。全場的目光都落在你身上。"},{"h":"老僧說到道生，你心裡一震。說不上為什麼，你總覺得兩百多年前道生被逐出建康的那一天，自己好像也在場，而且站在他那一邊。","kind":"宿緣","c":{"t":"pick","n":7,"k":["B"]}},{"h":"你看著講堂上的窺基，想起許多年前在河西護送過的那個年輕僧人。那時他還不是三藏法師，只是一個寧可死在路上、也不肯回頭的人。如今他帶回來的論，正在你面前一句一句講開。","kind":"宿緣","c":{"t":"pick","n":14,"k":["A"]}}],"options":[{"k":"A","t":"窺基講的是印度瑜伽行派的原意。經論既然如此說，就不能為了讓人好受而改。","s":{"法相":2},"f":"經"},{"k":"B","t":"「一切眾生皆有佛性」是《涅槃經》明文；說有人永不成佛，違背佛的大悲。","s":{"天台":1,"臨濟":1},"f":"山"},{"k":"C","t":"兩邊都是佛說，差別只在層次：五性之說是方便安立，一切眾生皆可成佛才是究竟。","s":{"華嚴":2},"f":"融"},{"k":"D","t":"新譯的經論有皇帝親自作序，是國家認可的正學；跟著譯場走，才是正途。","s":{"法相":1,"密":1},"f":"宮"},{"k":"E","t":"我想起道生。先別急著下結論：我請窺基法師把「五性各別」和《涅槃經》「一切眾生悉有佛性」並排講，也講講他怎麼會通兩者，讓聽的人自己判斷。","s":{"三論":1,"天台":1},"f":"經","c":{"t":"pick","n":7,"k":["B"]}}],"after":["「五性各別」成了法相宗最受爭議的主張。法寶著《一乘佛性究竟論》反駁，窺基的弟子慧沼則以《能顯中邊慧日論》回應。華嚴宗的法藏把法相判為「大乘始教」，意思是大乘的入門，而非究竟。法相宗在窺基、慧沼、智周三代之後迅速衰微。印順導師說，玄奘所傳的唯識「名相紛繁、重解略行，非華人所好」；「闡提無性」等主張又與中國原有的學統相違，傳入後未能融通；加上天台、華嚴、禪宗興起，「安史亂後乃衰」。窺基的《成唯識論述記》，宋初的《宗鏡錄》還在引用，元代以後才在中國失傳，直到清末從日本請回。"],"source":"<em>出處：窺基《成唯識論述記》；法寶《一乘佛性究竟論》；慧沼《能顯中邊慧日論》；法藏《華嚴一乘教義分齊章》；印順《中國佛教史略》（Y22, p. 46a）；北本《大般涅槃經》（T12, 402c）<\/em>","vol":2},{"n":16,"num":"十六","title":"非戒不立","era":"唐乾封二年（667）二月・長安城南淨業寺","body":[{"h":"道宣七十二歲了。他一生研究《四分律》，寫下的注疏後來合稱「南山律」。當時相部法礪一系的律疏也很流行，對同一條戒的理解與道宣各有不同；稍後懷素又另立東塔一家。道宣的獨到之處，是以大乘唯識的道理解釋「戒體」，主張《四分律》雖是部派的律，精神卻「分通大乘」。"},{"h":"這年二月八日，他在淨業寺建成戒壇。他引經文說：「如何得知佛法久住？若中國十人，邊方五人，如法受戒，是名正法久住。」又說：「道必人弘，非戒不立。」"},{"h":"來自雍州、洛州、荊州、台州、并州的二十多位僧人，依壇重新受戒。你是其中之一。登壇之前，你問自己：我為什麼來？"}],"options":[{"k":"A","t":"戒是佛法的命根。我要一字一句依律受戒、依律生活，不增不減。","s":{"律":2},"f":"經"},{"k":"B","t":"我敬佩道宣，但認為戒的精神在心：守住了心，條文自然不違。","s":{"臨濟":1,"律":1},"f":"山"},{"k":"C","t":"他以大乘的心解釋部派的律，把「守規矩」與「發大心」接在一起，這才是我想學的。","s":{"律":1,"華嚴":1},"f":"融"},{"k":"D","t":"各家解律不一，只會讓僧團分裂。我建議請朝廷頒令，天下一律依南山律受戒。","s":{"律":1,"密":1},"f":"宮"}],"after":["道宣在同年十月圓寂。他也是《續高僧傳》《廣弘明集》的作者，這份腳本中的許多故事，都靠他記下。南山律後來成為漢傳律學的主流，也隨鑑真東渡日本。但律宗的命運起伏不定：北宋元照一度中興，南宋以後漸衰；明末清初寶華山見月讀體重振傳戒儀軌；民國弘一大師發願弘揚南山律，所依的注疏有不少是從日本請回的版本。"],"source":"<em>出處：道宣《關中創立戒壇圖經》（T45, 807a、816b）；《宋高僧傳》卷十四〈道宣傳〉<\/em>","vol":3},{"n":17,"num":"十七","title":"女主之讖","era":"唐載初元年至武周天授元年（690）・洛陽","body":[{"h":"武則天臨朝稱制已經六年，正準備改唐為周、親自登基。儒家經典裡，找不到女人當皇帝的依據。"},{"h":"於是有一群僧人進獻《大雲經》並附上新撰的疏文：經中說淨光天女將以女身為國王，而那位天女，就是如今的「神皇」。《大雲經》本是北涼曇無讖譯出的真經，新寫的疏則把經文解成了武后受命的預言。"},{"h":"參與的僧人「並封縣公，賜紫袈裟、銀龜袋」，天下各州奉令興建大雲寺。你所在的州府也要設講座，府中派人來請你升座宣講。"}],"options":[{"k":"A","t":"推辭。佛經不是替帝王作符命的；把經義扭曲成政治預言，傷佛法更深。我回山裡去。","s":{"曹洞":1,"淨土":1},"f":"山"},{"k":"B","t":"答應。女主臨朝，佛門才有機會超越道教；一篇疏文換來天下大雲寺，值得。","s":{"密":1,"華嚴":1},"f":"宮"},{"k":"C","t":"升座，但只講經文本身：淨光天女的故事，就照曇無讖譯本原原本本地講，疏文一字不念。","s":{"律":1,"法相":1},"f":"經"},{"k":"D","t":"藉這個機會，請朝廷支持重譯完整的《華嚴經》：用一篇政治的疏，換一部真正的大經。","s":{"華嚴":2},"f":"融"}],"after":["武則天在 690 年九月登基，次年下令佛教在道教之上、僧尼列於道士女冠之前。她也支持實叉難陀重譯八十卷《華嚴經》，華嚴學因此大興。《舊唐書》說這些僧人「偽撰」《大雲經》；近代學者比對敦煌寫本《大雲經神皇授記義疏》，才證實「偽」的是疏而不是經。一個王朝用佛經證明自己的正當，佛教也就和這個王朝的榮辱綁在了一起。"],"source":"<em>出處：《舊唐書・則天皇后本紀》；《佛祖統紀》卷三十九（T49, 369c）；敦煌寫本 S.6502《大雲經神皇授記義疏》<\/em>","vol":3},{"n":18,"num":"十八","title":"殿前的金獅子","era":"武周聖曆年間（約 699）・洛陽宮中","body":[{"h":"新譯《華嚴經》完成，武則天請法藏講經。法藏字賢首，祖上是康居人。《宋高僧傳》說他年輕時曾參與玄奘譯場，後來「見識不同而出譯場」，不過學者多懷疑此說。"},{"h":"講到「十重玄門」「六相圓融」，說一中有一切、一切即一，如天帝宮殿的寶網，每一顆珠都映現其他所有的珠。女皇聽得茫然。"},{"h":"法藏不再講下去，只是指著殿角的鎮殿金獅子：金是理，獅子是事。金本無定相，隨工匠成獅子；獅子的每一根毛都是全部的金，一根毛裡，就有整頭獅子。你是他的弟子，就站在一旁。"}],"options":[{"k":"A","t":"這個比喻太妙了。佛法最高的境界，就藏在眼前一件器物裡；我要學會這樣說法。","s":{"華嚴":2},"f":"融"},{"k":"B","t":"用帝王殿前的金獅子說法，也讓帝王更親近佛門；這是弘法最好的位置。","s":{"華嚴":1,"密":1},"f":"宮"},{"k":"C","t":"比喻再好，也只是指月的手指。我要把十玄門一字一句寫成講疏，讓後人不靠比喻也讀得懂。","s":{"華嚴":2},"f":"經"},{"k":"D","t":"金獅子是給帝王看的。真正的「一即一切」，要在劈柴挑水之間去看，不在宮殿裡。","s":{"臨濟":1,"華嚴":1},"f":"山"}],"after":["《宋高僧傳》說，法藏「指鎮殿金獅子為喻，因撰義門，徑捷易解，號《金師子章》……帝遂開悟其旨」。他又為學不了的人設了一個巧妙的裝置：十面鏡子八方上下相對，中安一尊佛像，點一支火炬，鏡中「互影交光」，學者由此明白「剎海涉入無盡」的道理。華嚴宗在武周護持下臻於鼎盛，法藏後世稱為賢首大師。他的判教把一代佛法分為小、始、終、頓、圓五教，華嚴居於「圓教」之頂。"],"source":"<em>出處：《宋高僧傳》卷五〈法藏傳〉（T50, 732a）；法藏《金師子章》《華嚴一乘教義分齊章》<\/em>","vol":3},{"n":19,"num":"十九","title":"肩輿上殿","era":"武周久視元年至大足元年（700–701）・荊州當陽山","body":[{"h":"你在當陽山玉泉寺的度門蘭若，從神秀學禪。神秀已經九十多歲，當年弘忍曾稱讚他：「吾度人多矣，至於懸解圓照，無先汝者。」"},{"h":"武則天的詔書到了，要迎他入京。與他同師的老安也一同受召，卻退避讓位，推美神秀。神秀問你：願不願意與他同行？"}],"options":[{"k":"A","t":"隨師父入京。禪法若能在兩京生根，天下人都會知道東山法門。","s":{"臨濟":1,"華嚴":1},"f":"宮"},{"k":"B","t":"留在山中。帝闕再好，也不是坐禪的地方。","s":{"曹洞":2},"f":"山"},{"k":"C","t":"去嶺南找那位也得了五祖心法的慧能，把兩位大師的教法都記下來。禪門不立文字，後人更需要有人記下真相。","s":{"三論":1,"律":1},"f":"經"},{"k":"D","t":"東山法門也傳念佛，道信祖師說「念佛心是佛」。我想把這一門帶給山下不識字的百姓。","s":{"淨土":1,"曹洞":1},"f":"融"}],"after":["神秀到了洛陽，武則天讓他「肩輿上殿，親加跪禮」；王公士庶「望塵拜伏，日有萬計」。印順導師說，他當時被尊為「兩京法主，三帝門師」。《宋高僧傳》記載神秀曾奏請追慧能入京，慧能固辭：「吾形不揚，北土之人見斯短陋，或不重法。又先師記吾以嶺南有緣，且不可違也。」此後「了不度大庾嶺而終」。印順導師認為，徵召慧能的詔文雖「有過潤飾的痕跡」，但王維碑文明記其事，「是不能看作虛構的」。他也指出：「弘化京洛，不免與政治的關係密切，而多少沾有貴族的氣息。曹溪禪本富於平民的，勞動者的特色。」"],"source":"<em>出處：《宋高僧傳》卷八〈神秀傳〉（T50, 756a–b）；王維〈六祖能禪師碑銘〉（見《王右丞集》，不在 CBETA）；印順《中國禪宗史》（Y40, pp. 109、130、221、229）<\/em>","vol":3},{"n":20,"num":"二十","title":"師承是傍，法門是漸","era":"唐開元二十年（732）正月十五日・滑臺大雲寺","body":[{"h":"神秀去世已二十多年，弟子普寂、義福在兩京受朝野尊崇。「兩京之間皆宗神秀」，北宗就是禪門的正統。"},{"h":"這一天，慧能的弟子神會在滑臺大雲寺召開無遮大會，說要「為天下學道者定宗旨，為天下學道者辨是非」。他宣告：達摩的袈裟一代代傳到了慧能，「其袈裟今現在韶州」；而神秀一系「師承是傍，法門是漸」。"},{"h":"當地有名的講經法師崇遠起身問難。滿堂的人屏息以待。你就坐在人群中。"}],"options":[{"k":"A","t":"神會說得對。漸修是在鏡上拂塵，頓悟才是直見本心；這場是非，早該有人來定。","s":{"臨濟":2},"f":"山"},{"k":"B","t":"不論誰是正統，在大庭廣眾下攻擊同門，都違背了「無諍」。我不參與。","s":{"三論":1,"律":1},"f":"融"},{"k":"C","t":"把神會與崇遠的問答一字不漏記下來。誰是誰非，交給後人去判。","s":{"曹洞":1,"華嚴":1},"f":"經"},{"k":"D","t":"北宗有朝廷撐腰，南宗勢單力薄。真要讓頓教流行，得先爭取京城權貴的支持。","s":{"臨濟":1,"密":1},"f":"宮"}],"after":["神會後來入洛陽大弘頓教，天寶年間被御史盧奕誣奏聚眾，貶出京城。安史之亂爆發，兩京淪陷，朝廷軍費匱乏，各地設戒壇度僧收「香水錢」。神會被推主持壇度，「所獲財帛頓支軍費」，兩京收復後得肅宗詔入內供養。德宗時立他為禪宗第七祖。印順導師評論：「以《壇經》一再告誡的『無諍』的曹溪禪風來說，神會的敵對態度，是不足取的。然而頓禪在京洛的迅速生根而發揚起來，不能不說是神會的勳績！」他也考證「傳衣」之說在慧能生前已為北方所知，不是神會個人造出來的。歷史的諷刺在於：神會的荷澤宗幾代而絕，後來大盛的，是遠離京城的馬祖、石頭兩系。"],"source":"<em>出處：獨孤沛《菩提達摩南宗定是非論》（敦煌寫本）；《宋高僧傳》卷八〈神會傳〉（T50, 756c–757a）；印順《中國禪宗史》（Y40, pp. 204、229–230、308）<\/em>","vol":3},{"n":21,"num":"二十一","title":"風月同天","era":"唐天寶元年（742）・揚州大明寺","body":[{"h":"兩位日本僧人榮叡、普照入唐十年，尋訪能到日本傳戒的律師。他們來到大明寺，頂禮五十五歲的鑑真。"},{"h":"鑑真想起一件事：日本的長屋王曾造千件袈裟布施中國僧眾，袈裟邊上繡著四句話：「山川異域，風月同天；寄諸佛子，共結來緣。」他問在座的弟子：誰願應這遠方之請，到日本傳法？"},{"h":"眾人默然。良久，祥彥開口：「彼國太遠，性命難存；滄海淼漫，百無一至。」鑑真說：「為是法事也，何惜身命？諸人不去，我即去耳。」你就坐在祥彥旁邊。"},{"h":"鑑真說起自己的受戒：他在長安實際寺登壇受具足戒，戒和尚是荊州的弘景律師。你聽著，想起很久以前淨業寺那座新築的戒壇，和那個一字一句依律受戒的自己。","kind":"宿緣","c":{"t":"pick","n":16,"k":["A"]}}],"options":[{"k":"A","t":"跟著站起來：大和上去，我也去。戒律要有人親自傳過去，才算真的傳了。","s":{"律":2},"f":"經"},{"k":"B","t":"祥彥說得沒錯，百無一至。我留在揚州，把戒律傳給江淮的僧眾。","s":{"律":1,"淨土":1},"f":"山"},{"k":"C","t":"要去，就先上奏朝廷取得許可，名正言順地出海，免得中途被官府攔下。","s":{"律":1,"密":1},"f":"宮"},{"k":"D","t":"傳戒之外，也要把天台的止觀、華嚴的經疏帶過去：日本需要的不只是戒律，而是整套佛法。","s":{"天台":1,"華嚴":1},"f":"融"},{"k":"E","t":"我隨大和上去。戒壇該怎麼築、戒該怎麼傳，我記得清清楚楚；到了海的那一邊，我想照道宣律師《戒壇圖經》的樣子，再築一座。","s":{"律":2},"f":"經","c":{"t":"pick","n":16,"k":["A"]}}],"after":["十二年間，鑑真五次東渡失敗：官府阻攔、弟子告密、船隻觸礁，第五次更漂到了海南島。榮叡病逝嶺南，鑑真自己「頻經炎熱，眼光暗昧」，終至失明。753 年第六次出航，終於抵達日本。他在東大寺立戒壇，為聖武上皇授戒，又建唐招提寺，763 年坐化。他帶去的天台章疏，後來被日本僧人最澄讀到；據《叡山大師傳》，這也成了最澄入唐求法的因緣之一；最澄回國後開創了日本天台宗。"],"source":"<em>出處：真人元開《唐大和上東征傳》（收於《遊方記抄》，T51, no. 2089, pp. 988a–b、991c、993a）；《叡山大師傳》（不在 CBETA）<\/em>","vol":4},{"n":22,"num":"二十二","title":"眾生未度","era":"唐至德年間（756–757）・淪陷的長安大興善寺","body":[{"h":"不空是金剛智的弟子。師父去世後，他遠赴師子國與五印度，求得密教經論五百餘部，天寶五年回到長安，為玄宗立壇灌頂。"},{"h":"然後安祿山反了。玄宗入蜀，太子在靈武即位，長安落入叛軍手中。不空被困在城裡，卻「常密奉表起居」，而肅宗「亦密遣使者求祕密法」。"},{"h":"今夜，又有一封密表要送出城。師父把它交到你手上。"}],"options":[{"k":"A","t":"我去送。密法本是護國之法，國若亡了，法也無處安身。","s":{"密":2},"f":"宮"},{"k":"B","t":"我不去。修行人不應捲入兩軍之爭；法要護的是眾生，不是哪一個朝廷。","s":{"曹洞":1,"律":1},"f":"山"},{"k":"C","t":"讓別人去送，我留下來把師父帶回的五百多部梵夾編目、藏好。兵荒馬亂，最怕的是經典散失。","s":{"密":1,"華嚴":1},"f":"經"},{"k":"D","t":"我更想學師父的另一面：他在武威為士庶數千人灌頂，讓密法走出宮廷，進入百姓之間。","s":{"密":1,"淨土":1},"f":"融"}],"after":["長安收復，「事如所料」。肅宗請不空入宮建護摩道場，為帝王行「轉輪王位七寶灌頂」；代宗時他重譯《仁王護國般若經》，皇帝親自作序；他又奏請天下寺院食堂以文殊菩薩為上座。他歷事玄宗、肅宗、代宗三朝，皆為灌頂國師。有一次在終南山修法生起感應，他說：「眾生未度，吾安自度耶？」唐密至此臻於極盛，與宮廷的結合也最深。對於密教，印順導師持批判立場：他認為「秘密大乘佛法」是在印度教興起的情勢下，「多與神（天）教相通」。不過他也指出，唐代密教「猶係密教前期」，一行、不空分別以天台、華嚴義理來解釋，批判的重點在後期的發展。這是一家之見，密教傳承者自有不同的理解。"],"source":"<em>出處：《宋高僧傳》卷一〈不空傳〉（T50, 712c–713b）；印順《印度佛教思想史》自序（Y34, p. a4）；印順《中國佛教史略》（Y22, p. 50a）<\/em>","vol":4},{"n":23,"num":"二十三","title":"傳之東國","era":"唐貞元二十年至永貞元年（804–805）・長安西明寺與青龍寺東塔院","body":[{"h":"貞元二十年（804）臘月，一個三十歲上下的日本僧人隨遣唐使到了長安。他叫空海，原本要在唐朝留學二十年。次年二月，大使啟程回國，他奉敕留住西明寺，開始在城中遍訪名師；罽賓來的般若三藏，後來也把自己帶來的梵夾託付給他。"},{"h":"不空的弟子惠果是代宗、德宗、順宗三朝的國師。他一身兼傳胎藏、金剛界兩部大法，把善無畏與金剛智兩系匯於一處。但他的弟子們「或學一部大法，或得一尊一契，不得兼貫」。"},{"h":"幾個月後，惠果已經病重。空海與西明寺的志明、談勝等五六位法師來拜見，惠果一見他就笑了：「我先知汝來，相待久矣。今日相見大好大好。報命欲竭，無人付法。必須速辨香花，入灌頂壇。」"},{"h":"你是惠果身邊跟了多年的弟子。師父要在幾個月內，把兩部大法全部傳給這位剛到的異國僧人；長安這一邊，則交給義明師兄。"}],"options":[{"k":"A","t":"師父自有法眼。法不分國界，誰能承擔就傳給誰。","s":{"密":2},"f":"經"},{"k":"B","t":"兩部大法是三朝帝師之法，應當留在長安、護持大唐。","s":{"密":1,"華嚴":1},"f":"宮"},{"k":"C","t":"傳給誰都好。但密法若只在灌頂壇上傳，終究太窄；我想把它與天台的教觀放在一起學。","s":{"密":1,"天台":1},"f":"融"},{"k":"D","t":"密法靠師徒口授，傳人一斷就什麼都沒了。我要在長安守住這一脈，哪怕只剩幾個弟子。","s":{"密":1,"律":1},"f":"山"}],"after":["這年六月上旬，空海入胎藏灌頂壇，七月上旬受金剛界灌頂，兩次投花都落在中台的毘盧遮那佛上，惠果驚嘆不已；八月上旬，他受傳法阿闍梨位，寺中設五百僧齋。惠果囑咐他「早歸鄉國以奉國家，流布天下增蒼生福」，又說「義明供奉此處而傳，汝其行矣，傳之東國」。十二月十五日，惠果結毘盧遮那法印，右脅而終，空海為他撰寫碑文。次年空海提前回國，自承「雖闕期之罪死而有餘」，帶回經論、梵字真言、疏章「總二百一十六部四百六十一卷」，以及曼荼羅與法具。他開創真言宗（東密），816 年獲嵯峨天皇賜高野山，835 年入定，921 年獲追賜「弘法大師」之號；同期入唐的最澄回國開創天台宗，其後圓仁、圓珍又發展出「台密」。惠果的法脈，就這樣在日本一代代傳到今天。","長安這一邊，四十年後遇上會昌法難，寺毀壇拆、僧尼還俗，唐密受到致命的一擊。法難之後，青龍寺的法全仍在傳法，855 年還為入唐的日本僧圓珍灌頂；此後，漢地成系統的阿闍梨傳承便少見記載。到了北宋，印順導師說密宗只是「但存法事」，「已無登壇灌頂者」。主流的唐密阿闍梨正統傳承，在漢地基本絕響，卻在海的那一邊延續下來。一九二〇年代，持松、大勇等中國僧人東渡日本學密，史稱「唐密回傳」。"],"source":"<em>出處：空海《御請來目錄》（T55, no. 2161, pp. 1060b–c、1065a–c）；圓珍《青龍寺求法目錄》（T55, no. 2171, p. 1097a）；印順《中國佛教史略》（Y22, p. 79a）；印順《太虛大師年譜》（Y13, pp. 132a、138a）；空海〈大唐神都青龍寺故三朝國師灌頂阿闍梨惠果和尚之碑〉（收於《遍照發揮性靈集》，不在 CBETA）；<a href=\"https://reihokan.or.jp/other/rekishi/rekishigairyaku.pdf\" target=\"_blank\" rel=\"noopener\">高野山靈寶館〈高野山の歴史〉<\/a><\/em>","vol":4},{"n":24,"num":"二十四","title":"一日不作","era":"唐元和年間（約 806–814）・洪州百丈山","body":[{"h":"馬祖道一的弟子懷海住在百丈山。禪宗從達摩到慧能，「多居律寺，雖別院，然於說法住持未合規度」，多半是寄住在別人寺裡的房客。"},{"h":"懷海「創意別立禪居」：不立佛殿，只立法堂；住持稱長老，居於方丈；學眾同住僧堂，上下均力、一同勞動。有人問他為何不依大乘戒律，他說：「吾所宗非局大小乘，非異大小乘，當博約折中，設於制範，務其宜也。」"},{"h":"他年事已高，每次作務仍然「必先於眾」。你和幾位師兄弟不忍心，把他的農具藏了起來。他遍尋不得，那天就沒有吃飯。"}],"options":[{"k":"A","t":"把農具還給師父，跟他一起下田。自耕自食，禪寺才不必看誰的臉色。","s":{"臨濟":1,"曹洞":1},"f":"山"},{"k":"B","t":"律典不許比丘掘地、傷草木；另立規矩，等於公然離開律寺。我想再想一想。","s":{"律":2},"f":"經"},{"k":"C","t":"清規是好的，但寺院要長久，還是得有朝廷敕額與官府承認；我去州府為新寺請額。","s":{"臨濟":1,"密":1},"f":"宮"},{"k":"D","t":"只立法堂、不立佛殿，未免太過。我想讓清規裡也有課誦與念佛，山下的信眾才進得來。","s":{"淨土":1,"曹洞":1},"f":"融"}],"after":["懷海說：「吾無德，爭合勞於人？」於是「一日不作，一日不食」之語「流播寰宇」。他在 814 年圓寂，謚大智禪師。他是否寫成成文的清規，學界存疑；《禪門規式》是宋人的追述，今天所見的《敕修百丈清規》則是元代重編。一般認為，正因為禪寺自耕自足、不靠經藏與宮廷，會昌法難之後禪宗恢復得較早；不過延續下來的主要是洪州、石頭兩系，也得力於南方藩鎮的護持。"],"source":"<em>出處：《景德傳燈錄》卷六〈禪門規式〉（T51, 250c–251a）；《五燈會元》卷三（X80, 73a）；《敕修百丈清規》<\/em>","vol":4},{"n":25,"num":"二十五","title":"遇苦即救","era":"唐大和九年（835）十一月・終南山草堂寺","body":[{"h":"宗密是華嚴學的大師，也是荷澤神會一系的禪者。他主張「禪教一致」：「經是佛語，禪是佛意，諸佛心口必不相違」。有人問他到底是禪師、律師還是講經的法師，後人的回答是：「夫密者，四戰之國也，人無得而名焉。」"},{"h":"宗密與宰相李訓交情深厚。這年十一月，李訓謀誅宦官不成，史稱「甘露之變」。仇士良率禁兵屠殺，朝堂血流成河。"},{"h":"這天傍晚，李訓跌跌撞撞逃到山門前，求宗密為他剪髮，藏在寺中。師父正要起身，你先走到了門口。"}],"options":[{"k":"A","t":"開門。師父常說「遇苦即救」；他是不是叛臣，不是出家人該判的。","s":{"華嚴":1,"臨濟":1},"f":"融"},{"k":"B","t":"不開門。收留朝廷要犯，整座寺院都會被牽連；師父一生的著作、寺中的經藏，都毀不得。","s":{"華嚴":1,"律":1},"f":"經"},{"k":"C","t":"給他一點乾糧，指一條小路讓他往鳳翔走；救人，也不把寺院賭上。","s":{"淨土":1,"曹洞":1},"f":"山"},{"k":"D","t":"立刻派人向神策軍表明寺院與叛黨無關。這個時代，寺院的存亡繫於朝廷。","s":{"密":1,"律":1},"f":"宮"}],"after":["宗密想為李訓剪髮，身邊的人攔住了；李訓改往鳳翔，途中被捕殺。仇士良派人把宗密抓進左軍，當面責他不告，要殺他。宗密怡然說：「貧道識訓年深，亦知其反叛，然本師教法，遇苦即救，不愛身命，死固甘心。」中尉魚恒志嘉許他，奏請赦免；「朝士聞之，扼腕出涕焉」。六年後，宗密圓寂，遺命「舁屍施鳥獸，焚其骨而散之，勿塔」。他是唐代兼通華嚴與禪的代表人物。他去世的第四年，會昌法難爆發。"],"source":"<em>出處：《宋高僧傳》卷六〈宗密傳〉（T50, 742a–b）；《舊唐書・李訓傳》；宗密《禪源諸詮集都序》<\/em>","vol":4},{"n":26,"num":"二十六","title":"二十六萬五百人","era":"唐會昌五年（845）・長安","body":[{"h":"唐武宗崇信道教，身邊有道士趙歸真；朝廷也看中了寺院的田產，與不必納稅的二十多萬僧尼。從會昌初年起，朝廷一步步勒令僧尼還俗、清查寺產。今年，一連串詔令到了頂點：兩京只留少數幾座寺，上州各留一寺，其餘盡數拆毀，銅像鐘磬銷熔鑄錢。"},{"h":"這年五月，日本入唐求法的圓仁也被迫蓄髮、換上俗裝，離開了長安。你是一座寺院的知藏，管著整座藏經樓。官兵明天就到。"},{"h":"你這一世出家在一座敕建的大寺，名字早已登在官府的僧籍上。清查，就從名冊開始。","kind":"宿緣","c":{"t":"fate","f":"宮","op":">=","v":6}},{"h":"你這幾世都離宮廷很遠。官府的名冊上找不到你，官兵也不急著找你；可是你知道，身邊這些經卷逃不過。","kind":"宿緣","c":{"t":"fate","f":"宮","op":"<=","v":2}},{"h":"四十年前，你在青龍寺看著師父把兩部大法傳給遠方來的空海，自己選擇留在長安。這些年你守著師父傳下的壇場與儀軌；如今詔書下來，壇要拆、法器要熔，你手上的這一脈，可能就斷在這裡了。","kind":"宿緣","c":{"t":"pick","n":23,"k":["B","D"]}}],"options":[{"k":"A","t":"把經卷分批託給相熟的居士與商人，運往江南、運上海船；能保一卷是一卷。","s":{"天台":1,"華嚴":1},"f":"經"},{"k":"B","t":"奉旨還俗。念佛不需要寺院，也不需要度牒；在家一樣可以念。","s":{"淨土":2},"f":"融"},{"k":"C","t":"入山。往南方的叢林去，那裡的禪師自耕自食，官府的手伸不到那麼遠。","s":{"臨濟":1,"曹洞":1},"f":"山"},{"k":"D","t":"上書申辯，請求保留本寺。本寺是先帝敕建，皇帝總會念及歷代崇佛的舊情。","s":{"密":1,"法相":1},"f":"宮"}],"after":["《舊唐書》記下了這場法難的規模：拆寺四千六百餘所，還俗僧尼二十六萬五百人，拆招提、蘭若四萬餘所，收良田數千萬頃。次年武宗服丹藥而死，宣宗即位後立刻復佛，但損失已無法挽回。依賴經論與宮廷的宗派——法相、三論、唐密，以及大半的天台與華嚴——典籍散失，傳人凋零。較早復甦的是不立文字、自耕自食的禪宗：印順導師說，南方禪者「簡默無資於典籍」，「因得僅存而獨弘」。淨土不依賴寺院與典籍，民間信仰未曾中斷，但它的大興要到宋代隨天台而起。但禪宗內部也有消長，印順導師指出：「北宗與荷澤宗，經會昌法難，中原衰落而衰落了。禪宗成為洪州與石頭——二大系的天下。」這是「三武一宗」中的第三次法難，也是影響最深的一次。"],"source":"<em>出處：《舊唐書・武宗本紀》會昌五年八月條；圓仁《入唐求法巡禮行記》卷四；印順《中國禪宗史》（Y40, pp. 426–427）；印順《中國佛教史略》（Y22, p. 61a）<\/em>","vol":5},{"n":27,"num":"二十七","title":"同除四住","era":"五代吳越（十世紀中葉）・杭州與天台山","body":[{"h":"上一世，你把經卷分批託上了開往江南與海東的船。那些經後來到了哪裡，你不知道。這一世，你又要為了找回散失的經，望向同一片海。","kind":"轉生","c":{"t":"pick","n":26,"k":["A"]}},{"h":"上一世，你奉旨還俗，在長安的坊間念佛度日。次年武宗病逝，宣宗即位後恢復佛教，你重新受了戒，把晚年留給了佛號。","kind":"轉生","c":{"t":"pick","n":26,"k":["B"]}},{"h":"上一世，你逃進了南方的山林。印順導師說，法難之後「獨南方之禪者，簡默無資於典籍，林間水邊均可以參證；能遠禍，因得僅存而獨弘」。那一世，你看著禪門在山裡一天天壯大。","kind":"轉生","c":{"t":"pick","n":26,"k":["C"]}},{"h":"上一世，你的申辯書沒有回音。本寺不在保留之列，你和二十多萬僧尼一起還了俗，那一世再也沒有披上袈裟。","kind":"轉生","c":{"t":"pick","n":26,"k":["D"]}},{"h":"吳越王錢俶讀永嘉玄覺的《永嘉集》，讀到「同除四住」一句，怎麼也不懂，就去問國師德韶。德韶是禪師，說這是教下的義理，要問天台山的羲寂。"},{"h":"羲寂一聽就知道：這是智者大師《法華玄義》裡的話。可是他又說：「唐末教籍流散海外，今不復存。」經過法難與亂世，天台宗自己的根本典籍，在中國已經湊不齊了。"},{"h":"吳越王決定遣使帶著五十種珍寶渡海求書（《佛祖統紀》或說往高麗，或說往日本，或說兩地都去了）。你是羲寂的弟子，師父問你怎麼看。"},{"h":"你想起很久以前說過的一句話：說過的法若無人記下，將來就散了。那一世你忙著把天台的法記下來、抄下來；如今它們果然散了。","kind":"宿緣","c":{"t":"pick","n":9,"k":["C"]}},{"h":"你想起很久以前，曾請晉王出資收集、抄寫戰亂中散佚的經典。抄下來的書終究也會散；散了，就要再有人去找。","kind":"宿緣","c":{"t":"pick","n":11,"k":["D"]}},{"h":"你知道這些書可能在哪裡。兩百多年前，鑑真東渡的船上載著天台的《止觀法門》與《玄義》《文句》各十卷，你就在那條船上。","kind":"宿緣","c":{"t":"pick","n":21,"k":["A","D","E"]}}],"options":[{"k":"A","t":"請派我隨使者渡海。根本典籍若找不回，我們講的教義就只是殘簡。","s":{"天台":2},"f":"經"},{"k":"B","t":"求書固然好，但天台的生命在止觀實修；書找不回，也要把能修的法修好。","s":{"天台":1,"曹洞":1},"f":"山"},{"k":"C","t":"這件事是禪師德韶引薦的。禪門與教下本可互補，我願在兩家之間奔走。","s":{"曹洞":1,"華嚴":1},"f":"融"},{"k":"D","t":"求回的典籍，請大王以國家之力刻版頒行、藏於官庫，就像大王造八萬四千寶篋印塔那樣護法。","s":{"天台":1,"密":1},"f":"宮"},{"k":"E","t":"讓我去。這些書原來的樣子我記得，哪一卷是真的，我認得出來。","s":{"天台":2},"f":"經","c":{"t":"or","items":[{"t":"pick","n":9,"k":["C"]},{"t":"pick","n":11,"k":["D"]},{"t":"pick","n":21,"k":["A","D","E"]}]}}],"after":["高麗派僧人諦觀送來天台論疏，但國王只准他帶一部分，另有幾部「禁不令傳」；還叮囑他到中國後要「求師問難，若不能答，則奪教文以回」。諦觀到了螺溪，見到羲寂，「一見心服，遂禮為師」，從此留下十年，坐化於此。後人在他的箱篋裡，發現了題為他所撰的《天台四教儀》（志磐認為是據湛然《八教大意》略加修訂而成），後來成為天台入門的名著。《佛祖統紀》說，就是靠著這批「求遺書於海東」的典籍，後來知禮才能中興天台。一百多年後，高麗僧統義天入宋，把華嚴章疏帶給杭州淨源，賢首宗義「乃得重光」；不過印順導師認為，宋代華嚴「實依傍禪宗，維持餘緒」。"],"source":"<em>出處：《佛祖統紀》（T49, 189c、191a、206a、249b）；諦觀《天台四教儀》；印順《中國佛教史略》（Y22, p. 80a）；轉生與宿緣段落：印順《中國佛教史略》（Y22, p. 61a）、《唐大和上東征傳》（T51, 993a）<\/em>","vol":5},{"n":28,"num":"二十八","title":"七度拈鬮","era":"吳越國（約 960–975，宋初）・杭州永明寺","body":[{"h":"延壽出家前是吳越的稅務官。《佛祖統紀》說他拿官錢買魚蝦放生，事發當斬，吳越王派人觀察：臨刑臉色不變，就赦免他。他臨刑果然神色自若。"},{"h":"出家後，他在「一心禪定」與「萬善莊嚴淨土」之間拿不定主意，便到智者禪院作了兩個鬮，許願要七次拈到同一個才算數。七次，都是淨土。"},{"h":"如今他是永明寺住持，徒眾二千。惠洪《林間錄》轉述，他認為賢首、慈恩、天台三宗「㸦相冰炭」，便請三宗精通法義的學僧分住兩閣，「更相質難」，由他以禪宗的一心來折中。你就是閣上的學僧之一。"}],"options":[{"k":"A","t":"禪淨雙修正合我意：參禪明心，念佛往生，兩條路本是一條。","s":{"臨濟":1,"淨土":1},"f":"融"},{"k":"B","t":"把三宗典籍互相對勘，一字一句編進書裡；就算哪一宗斷了，它的話還在這部書裡。","s":{"華嚴":1,"法相":1},"f":"經"},{"k":"C","t":"禪就是禪。教下的名相、淨土的佛號，都是別人的家當；一句話參到底就夠了。","s":{"臨濟":2},"f":"山"},{"k":"D","t":"吳越王最敬重師父。借國王之力，讓這部書流傳海東、遠播高麗。","s":{"天台":1,"密":1},"f":"宮"}],"after":["一百卷《宗鏡錄》「舉一心為宗，照萬法如鏡」，匯集大乘經論六十部、印度與中國賢哲之言三百家。高麗國王讀了他的書，遣使送來金線袈裟與紫水晶數珠。延壽於 975 年圓寂，後世尊為淨土宗的祖師之一。流傳很廣的「四料簡」（「有禪有淨土，猶如戴角虎」）雖然題為延壽所作，卻不見於他的著作，學者多認為是後人託名。印順導師說延壽「以禪融淨，開後代禪淨一致之風」；不過北宋時禪宗與天台仍分庭抗禮，要到明末，諸宗融合才真正成為漢傳寺院的共同底色。"],"source":"<em>出處：《宋高僧傳》卷二十八〈延壽傳〉（T50, 887b）；宗曉《樂邦文類》卷三（T47, 195a）；《佛祖統紀》卷二十六（T49, 264b–c）；延壽《宗鏡錄》序（T48, 417a）；惠洪《林間錄》卷下（X87, 275b）；印順《中國佛教史略》（Y22, pp. 63a–64a）<\/em>","vol":5},{"n":29,"num":"二十九","title":"看話與默照","era":"南宋紹興初年（約 1134）・福建與明州天童山","body":[{"h":"北宋亡於金人，宋室南渡。會昌之後開出的禪門五家，到這時只剩兩家興盛：臨濟與曹洞。"},{"h":"臨濟的大慧宗杲教人「看話頭」：有僧問趙州「狗子還有佛性也無？」趙州答「無」。你就把全部的疑情提在這一個「無」字上，直到疑團爆破。他痛斥另一種修法是「默照邪禪」，只教人「寒灰枯木去……古廟香爐去」。後人還記載，他發現學僧背誦老師圓悟的《碧巖錄》來冒充開悟，為了救這個弊病，把這部書燒了。"},{"h":"大慧批評的究竟是誰，學界看法不一，未必是宏智本人。這時，曹洞的宏智正覺住在明州天童山。他寫下〈默照銘〉：「默默忘言，昭昭現前。」不必追問，也不必等待開悟；只管靜坐，在寂默之中，心自然朗照。"},{"h":"你行腳到江南，兩邊都去參訪過。現在該決定留在哪裡。"},{"h":"你這幾世總是選擇坐下來：在一座又一座的山裡。走進天童山的時候，你覺得那片松風好像一直在等你。","kind":"宿緣","c":{"t":"atleast","v":2,"items":[{"t":"pick","n":1,"k":["D"]},{"t":"pick","n":9,"k":["D"]},{"t":"pick","n":19,"k":["B"]}]}}],"options":[{"k":"A","t":"跟大慧參話頭，也幫他把這個法門帶給在官場塵勞中的士大夫。越是忙亂，越需要一個問題把心抓住。","s":{"臨濟":2},"f":"宮"},{"k":"B","t":"跟宏智在天童山靜坐。不抱著等待開悟的心，悟就在這寂然朗照之中。","s":{"曹洞":2},"f":"山"},{"k":"C","t":"兩者本不相違，都是要讓心又靜又明。我兩門都修，看自己的心此刻需要哪一個。","s":{"臨濟":1,"曹洞":1},"f":"融"},{"k":"D","t":"燒書救不了不讀書的人。我要先把《碧巖錄》裡那一百則公案的來龍去脈讀懂。","s":{"臨濟":1,"華嚴":1},"f":"經"}],"after":["大慧後來因為與主戰派士大夫往來，得罪秦檜，被流放衡州、梅州十餘年。宏智則住持天童將近三十年。1157 年，宏智臨終前「索筆作書，遺大慧禪師，屬以後事」；大慧「夜得書，即至山中」。兩人在法上互不相讓，在情上卻是知交。此後，看話禪成為臨濟的主流修法，默照則是曹洞的宗風。禪林後來有「臨天下，曹一角」之語，說的是臨濟法脈遍佈天下。曹洞則由日本僧人道元帶回日本，開出日本曹洞宗；在中國，曹洞法脈並未斷絕，默照的修法卻漸漸少有人教。要到近代，聖嚴法師以宏智的〈默照銘〉等著作印證自己的修行，重新傳授，默照禪才又復興。"],"source":"<em>出處：《大慧普覺禪師語錄》（T47, 884c）；《宏智禪師廣錄》〈默照銘〉〈行業記〉（T48, 100a、120c）；《碧巖錄》後序（T48, 224c）；印順《中國佛教史略》（Y22, p. 84a）；<a href=\"https://ddmtv.ddm.org.tw/Upload/UserFilesPath/file/201202/201202_02.pdf\" target=\"_blank\" rel=\"noopener\">法鼓山《人生》雜誌資料<\/a><\/em>","vol":5},{"n":30,"num":"三十","title":"末世的叢林","era":"明萬曆年間（約 1580–1600）・杭州雲棲寺","body":[{"h":"明代中葉以後，朝廷為籌款公開賣度牒，出家的門檻一落千丈；朝廷久禁開壇傳戒。叢林荒廢，有人說佛法已到了末世。"},{"h":"雲棲寺的袾宏卻把一座荒廢古寺經營成了天下最整齊的道場：他訂下《雲棲共住規約》，嚴持戒律，倡導戒殺放生，參禪與念佛並行，而以念佛為歸。同一個時代，憨山德清與紫柏真可出入京師，與王公大臣往來。"},{"h":"你初入雲棲，要選一個堂口安身。"}],"options":[{"k":"A","t":"進念佛堂。一句佛號可以攝盡禪、教、律，這是末世最穩的路。","s":{"淨土":2},"f":"融"},{"k":"B","t":"守規約。叢林的敗壞，不是因為教理不精，而是因為沒有人守戒。","s":{"律":2},"f":"山"},{"k":"C","t":"進講堂。佛法衰在無人能講；我要把久已失傳的經疏找回來，重新講起。","s":{"天台":1,"華嚴":1},"f":"經"},{"k":"D","t":"去京城，像憨山、紫柏那樣與王公大臣往來，為佛門爭取朝廷的護持。","s":{"臨濟":1,"密":1},"f":"宮"}],"after":["袾宏後世被尊為蓮宗八祖。憨山在 1595 年被流放雷州，紫柏在 1603 年的「妖書案」中死於獄中：與宮廷太近的代價，在每個時代都一樣。稍後的蕅益智旭以天台教觀整合禪、教、律，而以淨土為歸宿。袾宏、真可、德清、智旭合稱「明末四大師」。他們共同塑造的「禪教律淨、融為一爐」的樣貌，就是今天大多數漢傳寺院的樣子。"],"source":"<em>出處：袾宏《雲棲共住規約》《竹窗隨筆》；憨山德清〈雲棲蓮池宏大師塔銘〉（《憨山老人夢遊集》，X73, 655b–657b）<\/em>","vol":5},{"n":31,"num":"三十一","title":"回家的經","era":"清宣統元年（1909）・南京金陵刻經處","body":[{"h":"太平天國席捲江南，寺院與經版燒毀殆盡。居士楊文會（仁山）在南京創立金陵刻經處，一塊一塊重刻經版。他隨使節出使歐洲時，在倫敦結識了日本學僧南條文雄，得知日本古寺保存著大量中國早已失傳的唐宋典籍。"},{"h":"二十多年間，南條幫他從日本尋回了約三百種佚籍：窺基的《成唯識論述記》、吉藏的三論章疏、曇鸞的《往生論註》……一千年前渡海而去的書，終於回家了。"},{"h":"他在刻經處辦了祇洹精舍，親講《楞嚴經》，還請人教英文。你和一位名叫太虛的年輕僧人、一位名叫歐陽漸的居士同學。到結業那天，你得決定下一步。"},{"h":"楊仁山攤開剛從日本寄回的《成唯識論述記》。你翻了幾頁，那些句子熟得出奇，像是很久以前在慈恩寺的講堂裡聽過。","kind":"宿緣","c":{"t":"or","items":[{"t":"pick","n":14,"k":["A"]},{"t":"pick","n":15,"k":["A"]}]}},{"h":"你聽說，日本高野山至今還在傳惠果的法。一千一百年前，你在青龍寺看著惠果把兩部大法交給一個日本僧人，囑咐他「傳之東國」。","kind":"宿緣","c":{"t":"pick","n":23,"k":["A"]}},{"h":"你聽說，日本的真言宗至今還在為人灌頂，傳的是惠果的法。很久以前你在長安守過的那座壇場，早就拆了；原來那盞燈沒有熄，只是在海的那一邊。","kind":"宿緣","c":{"t":"pick","n":23,"k":["B","D"]}}],"options":[{"k":"A","t":"把《成唯識論述記》刻版重印。唯識失傳千年，一旦重新讀懂，中國佛學就有了最精密的思想工具。","s":{"法相":2},"f":"經"},{"k":"B","t":"八宗本是一家。我要跟太虛一起辦僧學，讓每一宗都在新式學堂裡重新被講授。","s":{"三論":1,"天台":1},"f":"融"},{"k":"C","t":"從日本取回的不該只是書。我要東渡日本，把在漢地斷絕的唐密也學回來。","s":{"密":2},"f":"經"},{"k":"D","t":"書固然重要，但佛法的命脈在修行。我回山中閉關，念佛參禪。","s":{"淨土":1,"曹洞":1},"f":"山"},{"k":"E","t":"這部《述記》讓我來校。我好像在哪裡讀過它。","s":{"法相":2},"f":"經","c":{"t":"or","items":[{"t":"pick","n":14,"k":["A"]},{"t":"pick","n":15,"k":["A"]}]}}],"after":["楊仁山於 1911 年逝世，金陵刻經處至今仍以木版印經。他的學生歐陽漸（竟無）創辦支那內學院，唯識學大興。太虛主張教理、教制、教產三方面的革新，倡導「人生佛教」，1933 年也講過「人間佛教」。他對八宗的看法是：「此之八宗，皆實非權，皆圓非偏，皆妙非麤；皆究竟菩提故，皆同一佛乘故。」1942 年，太虛的學生印順寫成《印度之佛教》，對後期的真常、密教多有批評；太虛撰〈議印度之佛教〉提出異議，印順再作〈敬答〉。師生各持己見，卻終身相敬。印順晚年自述：「我是繼承太虛大師的思想路線（非『鬼化』的人生佛教），而想進一步的（非『天化』的）給以理論的證明。」一九二〇年代，大勇、持松等僧人東渡學密，唐密一度回傳。"],"source":"<em>出處：印順《太虛大師年譜》（Y13, pp. 37–38、79、489）；印順《華雨集》第四冊〈契理契機之人間佛教〉（Y28, p. 69a）、第五冊（Y29, pp. 15–17）；楊文會《楊仁山居士遺書》；南條文雄《懷舊錄》；宿緣段落：空海《御請來目錄》（T55, 1065c）<\/em>","vol":6},{"n":32,"num":"三十二","title":"山門不閉","era":"1937 年 12 月・南京棲霞山棲霞寺","body":[{"h":"這一生，你在南京城東北的棲霞寺出家。這座山古稱攝山。一千四百多年前，高句麗來的僧朗在這裡講三論，再傳僧詮、法朗；吉藏的師父法朗，就是從這座山走出去的。"},{"h":"這年十二月，日軍攻陷南京，城裡城外屠殺、姦淫、焚掠不斷。逃難的百姓一批批湧上山來，大多是婦女、孩子和老人。監院寂然法師與志開、大本兩位法師商量後，決定成立「棲霞山難民收容所」。"},{"h":"寺裡的存糧撐不了多久，日軍又不時闖進寺來搶糧、搜人。曾留學日本的月基法師出面交涉，寺院一度得以平安，可是暴行並沒有停止。"},{"h":"山門外又來了一群人。你是寺裡的年輕僧人，寂然法師回頭看著你。"},{"h":"一千三百多年前，隋軍渡江、陳朝滅亡的那一年，你也在金陵城裡收容過逃難的僧眾與百姓。同一座城，又一次城破。","kind":"宿緣","c":{"t":"pick","n":10,"k":["B"]}},{"h":"你想起宗密說過的「遇苦即救」。一千一百年前，你在終南山為一個被追捕的人開了門；今天，門外是成千上萬的人。","kind":"宿緣","c":{"t":"pick","n":25,"k":["A"]}}],"options":[{"k":"A","t":"開門。出家人吃的是十方供養的飯，今天就該拿來救十方的人；能多收一個，就多收一個。","s":{"淨土":1,"臨濟":1},"f":"融"},{"k":"B","t":"跟志開法師冒險下山籌米。寺裡的存糧撐不了多久，總得有人去找吃的。","s":{"律":1,"曹洞":1},"f":"山"},{"k":"C","t":"把每天發生的事一筆一筆記下來。總有一天，要讓外面的世界知道這裡發生了什麼。","s":{"三論":1,"法相":1},"f":"經"},{"k":"D","t":"進城去找國際安全區的外國人，請有力量的人出面約束日軍；光靠一座山門，擋不住刺刀。","s":{"密":1,"華嚴":1},"f":"宮"},{"k":"E","t":"山坳裡還困著一百多名中國官兵。替他們籌便衣、找小船，送到長江北岸。遇苦即救，不問他穿的是什麼衣服。","s":{"華嚴":1,"臨濟":1},"f":"融","c":{"t":"or","items":[{"t":"pick","n":10,"k":["B"]},{"t":"pick","n":25,"k":["A"]}]}}],"after":["棲霞寺的收容所撐了四個多月，碑文說「時逾四月」，先後救護兩萬三千多人（一說兩萬四千）。最初日供兩餐，到了 1938 年春天，只能一天一頓稀粥。中央軍校教導總隊的廖耀湘等一百多名官兵被困在棲霞山，志開法師籌來便衣，用小船把他們送到長江北岸；抗戰勝利後，廖耀湘回到棲霞寺還願，題贈「棲霞古寺」匾額。1938 年初，寂然法師等僧人寫下〈以人類的名義致所有與此有關的人〉，記錄日軍在寺中的暴行，託人轉給在南京的德國人拉貝，後來收入《拉貝日記》。寂然法師積勞成疾，1939 年 10 月圓寂；2003 年，寺內出土「寂然上人碑」，碑文記下「護救者二萬三千餘人」。後人稱他為佛門的「辛德勒」。","也是在 1938 年，一個十二歲的揚州男孩來到棲霞寺，禮志開上人為師出家，法名悟徹，號今覺，是臨濟宗第四十八代。他就是後來在台灣創建佛光山的星雲大師。救過兩萬多人的那座山門，也剃度了一個日後把人間佛教帶到五大洲的人。"],"source":"<em>出處：《續高僧傳》卷七〈法朗傳〉（T50, 477b–c）；印順《中國佛教史略》（Y22, p. 26a）；《宋高僧傳》卷六〈宗密傳〉（T50, 742b）；<a href=\"https://www.merit-times.com.tw/NewsPage.aspx?unid=873908\" target=\"_blank\" rel=\"noopener\">《人間福報》〈拯救2.4萬名難民！海安高僧志開上人值得被銘記〉<\/a>；<a href=\"https://www.sohu.com/a/281848680_466973\" target=\"_blank\" rel=\"noopener\">搜狐〈寂然法師：直面日軍屠刀，捨命救護同胞〉<\/a>；<a href=\"http://news.sina.com.cn/c/2004-11-17/02304258179s.shtml\" target=\"_blank\" rel=\"noopener\">新浪新聞〈棲霞寺「辛德勒」庇護 24000 南京人〉（2004）<\/a>；《拉貝日記》（不在 CBETA，未逐字核對）<\/em>","vol":6},{"n":33,"num":"三十三","title":"人間的燈","era":"2001 年・台灣","body":[{"h":"這一生，你生在台灣。大學剛畢業，心裡總覺得缺了一塊。"},{"h":"你發現，佛法在這座島上走出了幾條不同的路，或多或少都呼應著太虛大師當年的「人生佛教」；海的那一邊，也有人走出另一條路："},{"h":"<li>九十多歲的<strong>印順導師<\/strong>一生著書，不建大型道場。他說自己「不是宗派徒裔，也不是論師」，只想從印度佛教的演變中，找出契理又契機的「人間佛教」。<\/li>"},{"h":"<li>高雄佛光山的<strong>星雲大師<\/strong>是臨濟正宗第四十八世，十二歲在南京棲霞寺禮志開上人出家。1967 年開山以來，他「以文化弘揚佛法，以教育培養人才，以慈善福利社會，以共修淨化人心」，把人間佛教帶到了五大洲。<\/li>"},{"h":"<li>正在金山興建法鼓山的<strong>聖嚴法師<\/strong>，從東初老人與靈源老和尚承接了曹洞與臨濟兩宗的法。他以「提昇人的品質，建設人間淨土」為理念，提倡心靈環保，也讓久已少人傳授的默照禪重新活了過來。<\/li>"},{"h":"<li>中台禪寺的<strong>惟覺老和尚<\/strong>紹繼臨濟法脈，早年在萬里山中閉關十餘年。他以禪七與遍布各地的精舍推廣禪修，教弟子「對上以敬、對下以慈、對人以和、對事以真」。<\/li>"},{"h":"<li>遠在法國梅村的<strong>一行禪師<\/strong>，是越南臨濟宗第四十二代、了觀一系的傳人。1966 年他為越南和平出國奔走，從此流亡海外；他在西方教人正念呼吸與行禪，講萬物「相即」，說這個道理的源頭在《華嚴經》。<\/li>"},{"h":"這是最後一個選擇。"},{"h":"聖嚴法師的禪期裡有人在教默照。你聽到「默默忘言，昭昭現前」八個字，覺得像是很久以前在天童山的松風裡聽過。","kind":"宿緣","c":{"t":"pick","n":29,"k":["B","C"]}},{"h":"聽說星雲大師的剃度師是志開上人，你心裡一熱。六十多年前那個冬天，你就跟在那位法師身邊，下山找米、送人過江。","kind":"宿緣","c":{"t":"pick","n":32,"k":["B","E"]}},{"h":"聽人說起那位越南禪師講「相即」，你忽然想起洛陽宮殿前那頭金獅子：「眼即耳，耳即鼻，鼻即舌，舌即身。」一千三百年過去，一脈相通的道理，換了一張紙重新說了一次。","kind":"宿緣","c":{"t":"pick","n":18,"k":["A","C"]}}],"options":[{"k":"A","t":"去讀印順導師的書。回到佛陀的本懷，用經論檢驗一切傳統，不為宗派所囿。","s":{"三論":2},"f":"經"},{"k":"B","t":"去佛光山。佛法要走進人群，用文化、教育與慈善，讓更多人歡喜受用。","s":{"臨濟":1,"淨土":1},"f":"融"},{"k":"C","t":"去法鼓山。從自己的心開始做環保，話頭與默照都學，在漢傳禪的傳統上走一條新路。","s":{"曹洞":1,"臨濟":1},"f":"經"},{"k":"D","t":"去中台禪寺打禪七。先把心坐下來，其他的事，坐下來之後自然會明白。","s":{"臨濟":2},"f":"山"},{"k":"E","t":"去法國梅村，跟一行禪師學正念。吸氣時知道自己在吸氣，走路時知道自己在走路；先把這一步走穩。","s":{"華嚴":1,"曹洞":1},"f":"融"}],"after":["印順導師於 2005 年圓寂，世壽百歲（依傳統虛歲計）；聖嚴法師於 2009 年圓寂；惟覺老和尚於 2016 年圓寂；星雲大師於 2023 年圓寂。一行禪師流亡三十九年後，2005 年首次獲准回國，2022 年在順化慈孝寺圓寂。五條路，一條在書裡，一條在人群裡，一條在心裡，一條在禪堂裡，一條在每一次呼吸裡；島上的四條或多或少都呼應著太虛大師的「人生佛教」，第五條則是漢傳的燈經越南傳到了西方。一千五百年的燈，有的熄了，有的在海的那一邊等著，有的一直沒有滅。現在，輪到你了。"],"source":"<em>出處：印順《華雨集》第四冊〈契理契機之人間佛教〉（Y28, p. 69a）；<a href=\"https://n.yam.com/Article/20230206506877\" target=\"_blank\" rel=\"noopener\">星雲大師生平（yam 新聞，2023）<\/a>；<a href=\"https://www.merit-times.com.tw/NewsPage.aspx?unid=873908\" target=\"_blank\" rel=\"noopener\">《人間福報》〈拯救2.4萬名難民！海安高僧志開上人值得被銘記〉<\/a>；<a href=\"https://www.chibs.edu.tw/ch_html/CHIBS30/ch/139.html\" target=\"_blank\" rel=\"noopener\">中華佛學研究所〈聖嚴法師與漢傳禪佛教〉<\/a>；<a href=\"https://ddmtv.ddm.org.tw/Upload/UserFilesPath/file/201202/201202_02.pdf\" target=\"_blank\" rel=\"noopener\">法鼓山資料<\/a>；<a href=\"https://www.storm.mg/article/100644\" target=\"_blank\" rel=\"noopener\">惟覺老和尚生平（風傳媒）<\/a>；<a href=\"https://ctbuddhamind.org/four-tenets-of-chung-tai?lang=zh\" target=\"_blank\" rel=\"noopener\">中台四箴行<\/a>；<a href=\"https://ctworld.org.tw/monthly/304/a01.htm\" target=\"_blank\" rel=\"noopener\">中台禪寺《中台山月刊》<\/a>；<a href=\"https://plumvillage.org/about/thich-nhat-hanh/thich-nhat-hanh-full-biography/\" target=\"_blank\" rel=\"noopener\">梅村〈一行禪師完整傳記〉<\/a>；<a href=\"https://www.ksat.com/news/world/2022/01/22/thich-nhat-hanh-influential-zen-buddhist-monk-dies-at-95/\" target=\"_blank\" rel=\"noopener\">AP 報導（2022）<\/a>；<a href=\"https://www.encyclopediaofbuddhism.org/wiki/Vietnamese_Thien\" target=\"_blank\" rel=\"noopener\">Encyclopedia of Buddhism〈Vietnamese Thien〉<\/a>；宿緣段落：法藏《金師子章》（淨源《金師子章雲間類解》本，T45, no. 1880, p. 665b）<\/em>","vol":6}],"schools":{"三論":{"tag":"破邪即顯正","text":"你不急著建立一套答案。你相信真理不在任何一個主張裡；破邪的當下就是顯正，並沒有另一個真理等著被找出來。你的祖師是龍樹與提婆，由羅什譯入中土，經僧肇到吉藏集其大成。三論宗在吉藏之後漸衰，到會昌法難後斷絕；它的空觀卻溶進了天台與禪宗的血脈。","modern":"印順導師。他以中觀「性空」為思想核心，自述「不是宗派徒裔」，卻是近代影響最深的中觀學者之一。"},"法相":{"tag":"萬法唯識","text":"你不肯含糊。心有幾種、如何生起、如何轉變，你要一項一項弄清楚，寧可門檻高，也不要說錯。你的祖師是玄奘與窺基。法相宗三傳而衰，部分典籍在元明以後失傳數百年，靠日本寺院保存，清末回傳之後，成為民國佛學最活躍的一支。","modern":"太虛大師把「法相唯識」列為大乘三宗之一；印順導師著有《唯識學探源》。"},"天台":{"tag":"教觀雙美","text":"你既要讀懂，也要做到；既不做只坐不學的「闇證禪師」，也不做只讀不修的「誦文法師」。你的祖師是慧思與智顗。天台宗的典籍唐末散佚，靠吳越王從海東求回，宋代知禮中興；在日本，比叡山至今被稱為日本佛教的母山。","modern":"諦閑大師中興天台教觀，弟子倓虛把天台法脈傳到東北、青島與香港。"},"華嚴":{"tag":"一即一切","text":"你看世界的方式，是那十面鏡子：每一物都映現一切，一切也映現在每一物裡。你的祖師是法藏、澄觀與宗密。華嚴宗在會昌之後衰落，宋代高麗義天送回章疏而重光，此後漸漸融入禪與淨土；它的圓融思想，成了漢傳佛教的哲學底座。","modern":"月霞法師創辦華嚴大學；聖嚴法師以宗密《原人論》為題寫成《華嚴心詮》；越南的一行禪師講「相即」，也說源頭在《華嚴經》。"},"律":{"tag":"非戒不立","text":"你相信佛法的久住，不在誰講得最好，而在誰守得最穩。你的祖師是道宣，鑑真把你的法帶過了海。律宗幾度衰微又幾度重振：宋代元照、明末清初見月、民國弘一。今天漢傳僧團傳戒，依的仍是《四分律》。","modern":"弘一大師出家後專研南山律，著《四分律比丘戒相表記》，被尊為重興南山律的一代律師。"},"淨土":{"tag":"一句佛號","text":"你不高估自己，也不放棄任何人。你相信一個不識字的老婦人，和一位博學的法師，在佛的願力面前是一樣的。你的祖師是慧遠、曇鸞、道綽與善導。淨土從沒有嚴密的宗派組織，卻成了漢傳佛教流傳最廣的法門；在日本，法然與親鸞依你的祖師開創了淨土宗與淨土真宗。","modern":"印光大師專弘持名念佛；聖嚴法師以「建設人間淨土」為理念。"},"臨濟":{"tag":"當下直截","text":"你相信開悟不在遠方，就在一喝、一問、一個話頭被參破的那一刹那。你的祖師是慧能、百丈、臨濟義玄，與提倡看話禪的大慧宗杲。會昌法難之後，禪宗較早復甦，臨濟後來「遍天下」，印順導師說一般所知的禪宗「現在僅有臨濟宗與曹洞宗」（《中國禪宗史》序，1971）；今天大多數漢傳寺院的法脈，都上溯到臨濟。","modern":"星雲大師是臨濟正宗第四十八世；惟覺老和尚紹繼臨濟法脈，以禪七接引大眾；聖嚴法師也承接了臨濟的法；越南的一行禪師屬臨濟宗第四十二代、了觀一系，是讓正念走向世界的重要推手之一。"},"曹洞":{"tag":"默照綿密","text":"你不急，也不求奇特；你相信在一次次安靜的坐下之中，心會自己亮起來。你的祖師是石頭希遷一系的洞山良价、曹山本寂，與寫下〈默照銘〉的宏智正覺。曹洞在中國守著「半邊」天下，又由道元傳到日本，成為日本寺院數最多的禪宗宗派。","modern":"聖嚴法師承東初老人的曹洞法脈，以宏智的〈默照銘〉等著作印證自己的修行，復興默照禪，又融合臨濟話頭，立「中華禪法鼓宗」。"},"密":{"tag":"三密相應","text":"你相信佛不在遠處，口誦、手印、心觀相應之時，此身就是道場。你的祖師是善無畏、金剛智、不空與惠果。唐密在會昌法難中受到致命的一擊；此後雖有法全等少數阿闍梨傳法，主流的阿闍梨正統傳承在漢地基本絕響，北宋已只剩「但存法事」。惠果的法脈則由空海帶到日本，以東密延續至今；最澄、圓仁、圓珍一系另有台密。一九二〇年代曾由中國僧人東渡學回。藏傳密教則是另一個傳承系統。","modern":"太虛大師創辦漢藏教理院，促成漢藏佛教交流；他的弟子大勇曾東渡日本學密，後又率團赴康藏求法。"}},"fates":{"宮":{"name":"盛極而斷","text":"你的法脈曾是帝王的座上賓：肩輿上殿，三朝國師，天下大雲寺。但王權給的，王權也能收回。一紙詔令之後，你的傳人散了，經卷燒了。道安當年「不依國主，則法事難立」的那句話，另一半他沒有說出口。"},"經":{"name":"東渡回歸","text":"你把法寄在書頁上。漢地的寺院拆了，你的章疏在高麗與日本的經藏裡靜靜等了幾百年，直到諦觀、義天、南條文雄把它們帶回家。就像靜琬刻在石上的那句話：「世若有經，願勿輒開。」"},"山":{"name":"山林不絕","text":"你的法脈不靠權勢。沒有佛殿也能說法，沒有度牒也能念佛，沒有供養就自己下田。法難來了又去，山裡的燈一直亮著。"},"融":{"name":"百川歸海","text":"你的宗名也許不再被單獨記得，但你的精神在今天每一座寺院裡：戒壇依南山，講堂講天台與賢首，禪堂參話頭，念佛堂稱彌陀。太虛大師說：「此之八宗，皆實非權，皆圓非偏。」只是融合也有代價：印順導師感嘆明代以來的叢林「上也者流於隱逸，下也者趨於應赴」。融合之後，還要有人把燈挑亮。"}},"combosLead":"三十六段解讀，都依四聖諦來讀。法脈有興有衰，凡是因緣所生的都會變；心若緊抓著「一定要興盛、一定要留住」，就會苦，這是「苦」。苦的根源是貪愛與執取，想抓住本來抓不住的東西，這是「集」。貪愛止息，心不再隨得失起伏，那份清涼寂靜就是「滅」，也就是涅槃；它不是保住法脈換來的回報，也不隨興衰增減。每段點到的八正道（一項或幾項），就是走向這份止息的「道」。最後一行「在人群裡」，把四種去向看成四種處境：宮，是靠近權力中心的大組織；經，是以知識與保存為本的團隊；山，是小而自主的團體；融，是正在整合、彼此交融的組織。你的思想所對應的角色（見下一節），在這樣的處境裡會怎麼做事、容易卡在哪裡。各段的「滅」，寫的是那一份特定的貪愛放下時的樣子；貪愛完全止息，才是涅槃。沒有哪一個組合比較高明，只是照見的角度不同。","combos":{"三論":{"盛極而斷":{"lead":"你善於破除別人的執著，你的法脈卻一度倚著宮廷的護持而興。宮門一關，再銳利的論辯也無人聽聞。","parts":[{"k":"苦","t":"最懂「一切依條件而有」的人，眼看著自己倚靠的條件散去；道理早就明白，心裡還是痛。這是壞苦：可愛的東西變壞時的苦。"},{"k":"集","t":"痛的不是宮門關上，而是心底那句「這一次應該例外」。破了別人的常見，自己卻悄悄期待法脈長存，這是有愛：渴求存在延續不斷，暗裡與常見相應。"},{"k":"滅","t":"滅不是宮門重開。那句「應該例外」放下時，心裡不再翻騰；這份寂靜，指向的就是滅。"},{"k":"道","t":"正見。如實看見這也是緣起：緣聚則有，緣散則無；這份見地不只用來破別人，也用來照自己。"},{"k":"在人群裡","t":"在權力中心身邊，審辨者常被請去背書。你的價值在於說真話，而不是替決策找理由；一旦只剩替上位者辯護，你的判斷力也就失去了。"}]},"東渡回歸":{"lead":"你的空觀寫在吉藏的章疏裡，被慧灌帶到了日本，一千兩百多年後又被楊仁山請回中國。","parts":[{"k":"苦","t":"法離開了故土，守在異國的經藏裡，幾百年無人呼應。這是愛別離苦，也是求不得苦。"},{"k":"集","t":"苦的根，在「這是我們的」這一念。最善於破斥執著的學派，最容易忽略的，正是對自家學派的我所執。"},{"k":"滅","t":"「我的」一旦放下，法在哪裡都不算流亡；那份失落也就止息了。"},{"k":"道","t":"正思惟。出離的思惟，從放下對「我的」的貪求開始。"},{"k":"在人群裡","t":"在以知識為本的團隊裡，審辨者是最好的校對者：你知道哪些說法可靠、哪些已經走樣。把判斷寫下來留給後人，比贏下一場辯論更長久。"}]},"山林不絕":{"lead":"你把「破邪」用在自己身上：不爭名、不立門戶，在山中把空觀化為日常的觀照。三論學者後來多轉入禪門，名字不見了，見地還在。","parts":[{"k":"苦","t":"山中清苦，沒有人與你論辯，也沒有人知道你看見了什麼。寂寞也是苦。"},{"k":"集","t":"最細的執著，是對「我看破了」的自許。以清高自居、看輕山下的人，是我慢，也是把自己的見解奉為最高的見取。"},{"k":"滅","t":"連「看破」也不執，心才真的空了下來。龍樹說：「若復見有空，諸佛所不化。」"},{"k":"道","t":"正念。吃飯、走路、起心動念時，清清楚楚看見「這也是因緣所生」。"},{"k":"在人群裡","t":"在小而自主的團體裡，審辨者是品質的守門人；人少，你的一句批評分量更重。開口之前先問：這句話是為了讓事情更好，還是為了證明我對？"}]},"百川歸海":{"lead":"你不急著立宗，只問道理對不對。後來你的空觀流進天台的「一心三觀」、禪門的「無住」，成了漢傳佛教共同的底色。","parts":[{"k":"苦","t":"名字被沖淡，別人用著你的道理，卻不知道那是你。為人作嫁，也會疼。"},{"k":"集","t":"疼的是想被記得的那一念：渴求以某個身分繼續存在，仍是有愛。"},{"k":"滅","t":"一滴水入了海，並沒有失去什麼；心不再要求被看見，那份清涼，正是滅所指的方向。"},{"k":"道","t":"正語。不為立名而辯，只為讓人看清而說；不誇大，不挑撥。"},{"k":"在人群裡","t":"在整合中的組織裡，審辨者是讓不同系統對得上的人：你看得出哪些說法其實一致、哪些只是名稱不同。這樣的人很少被記住，卻讓融合不至於變成混亂。"}]}},"法相":{"盛極而斷":{"lead":"你的學問精密如宮殿，又有皇帝作序加持；但精密需要有人讀得懂，護持需要有人一直給。兩樣同時失去時，法脈也就斷了。","parts":[{"k":"苦","t":"一生的學問，在一紙詔令之後無人可傳。這是壞苦，也是行苦：凡是因緣和合的，都在變動之中，最精密的體系也不例外。"},{"k":"集","t":"唯識自己就說得清楚：苦的根在執取。把學問當成「我」的延伸，就會渴求它被人承認、被權力保住。"},{"k":"滅","t":"當學問不再需要誰來承認，心就不再隨著興衰起落。"},{"k":"道","t":"正見。看清苦從哪裡來，正是四聖諦的第二諦，也是唯識最擅長說明的事：心如何造出苦。"},{"k":"在人群裡","t":"在權力中心身邊，專精者容易成為裝飾：被請來增加分量，卻沒有人真正在聽。與其讓專業替權力背書，不如讓它對真正需要的人有用。"}]},"東渡回歸":{"lead":"你的《述記》在日本的寺院裡靜靜躺了幾百年，等到楊仁山與南條文雄把它帶回家。","parts":[{"k":"苦","t":"沒有人讀的書，像沒有人點的燈。等待，是求不得的苦。"},{"k":"集","t":"等待裡若夾著焦急，就是想控制結果的渴求：一定要回來，一定要被讀懂。"},{"k":"滅","t":"你相信種子念念生滅、相續不斷，遇緣才現行；焦急止息的時候，等待就只是等待。"},{"k":"道","t":"正精進。不因一時無人問津而放棄：已生的善令它增長，未生的善令它生起。"},{"k":"在人群裡","t":"在以知識為本的團隊裡，專精者是最重要的人：你知道哪一頁不能錯。把專業整理成別人接得住的樣子，是你能留下的最好的東西。"}]},"山林不絕":{"lead":"你放下宮廷譯場，帶著幾部論書入山，一邊讀，一邊觀察自己的念頭怎麼生起。","parts":[{"k":"苦","t":"離開了大譯場，沒有同伴切磋，學問只能自己對著自己。"},{"k":"集","t":"苦的根不在孤單，而在心裡那份「我的學問應該被看見」。"},{"k":"滅","t":"唯識真正用在自己身上的那一刻，學問不再是身分，執取也就鬆了。"},{"k":"道","t":"正念。讀完論，就回頭看自己這一念怎麼生起、怎麼被牽走，清清楚楚不放過。"},{"k":"在人群裡","t":"在小而自主的團體裡，專精者常要身兼數職；你的深度是大家的底氣。只是別讓專業成為不參與其他事的理由。"}]},"百川歸海":{"lead":"你把唯識的精密分析，借給了華嚴、天台與禪門；延壽的《宗鏡錄》裡，處處是你的影子。","parts":[{"k":"苦","t":"精密被簡化，名相被借用，原意難免走樣；看著自己的學問被說得粗了，是一種苦。"},{"k":"集","t":"要求別人一字不差地用你的說法，背後是我所執：把「正確」當成了自己的地盤。"},{"k":"滅","t":"放下地盤，看見自己的學問讓別人看心更清楚，那份計較就止息了。"},{"k":"道","t":"正思惟。肯把所知分享出去、不求名歸於己，是出離的思惟；別人說錯了也不生瞋，是無恚的思惟。"},{"k":"在人群裡","t":"在整合中的組織裡，專精者是讓深度不被稀釋的人。你不必守住每一個名詞，但要守住最關鍵的那幾個分別。"}]}},"天台":{"盛極而斷":{"lead":"你曾是帝王之師，國清寺由晉王依圖興建；但隋朝亡了，天台在唐初也聲勢不振。","parts":[{"k":"苦","t":"最會為一切安排位置的人，發現自己的位置也是別人給的；給的人一走，位置就沒了。"},{"k":"集","t":"渴求一個穩固的位置，把護持當成理所當然，苦就埋下了。"},{"k":"滅","t":"心不再靠位置安住的時候，興衰只是興衰。"},{"k":"道","t":"正定。息下攀緣，讓心安住一境而不散亂；這份安住，不依靠任何宮殿。"},{"k":"在人群裡","t":"在權力中心身邊，統籌者最容易被當成管家。你的價值在於讓每一種法門各得其所，而不是讓每一件事都合上位者的意。"}]},"東渡回歸":{"lead":"你的典籍散失海外，又被吳越王從海東求回；諦觀帶著書渡海而來，自己卻留在螺溪不走了。","parts":[{"k":"苦","t":"體系再完整，缺了幾卷就講不圓；守著殘卷講經，是求不得的苦。"},{"k":"集","t":"苦的根是「一定要完整」的渴求；完整本是因緣成就，不是誰能保證的。"},{"k":"滅","t":"諦觀在螺溪一住十年，寫成的《四教儀》藏在箱篋裡，「人無知者」；不計較書歸誰、名歸誰，那份渴求也就止息了。"},{"k":"道","t":"正思惟。不為自己求名位，只願法能回家；這份不為自己的心，就是出離的思惟。"},{"k":"在人群裡","t":"在以知識為本的團隊裡，統籌者是那個知道「什麼東西在哪裡、還缺什麼」的人。一份清楚的目錄，常常比一個天才更能救回一個體系。"}]},"山林不絕":{"lead":"你學智顗入天台山，把止觀當作每天的功課，而不是講台上的題目。","parts":[{"k":"苦","t":"離開講堂，沒有人聽你判教；整套體系在你心裡，卻沒有機會擺給人看。"},{"k":"集","t":"想被聽見、想讓大家照你的框架走，這份渴求到了山中仍會冒出來。"},{"k":"滅","t":"當「止」真的息下攀緣，框架只是工具；用不用、有沒有人聽，都不再牽動你。"},{"k":"道","t":"正精進。每天回到蒲團上實證：未生的善令它生起，已生的善令它增長。"},{"k":"在人群裡","t":"在小而自主的團體裡，統籌者不必分派很多人，卻要讓每個人清楚自己為什麼在這裡。先把自己的功課安排好，就是最好的統籌。"}]},"百川歸海":{"lead":"你的判教本來就是要把一切佛法安放在恰當的位置；後來明末的蕅益以天台教觀統攝禪、教、律，而歸於淨土。你沒有消失，你成了大家說話時的那個框架。","parts":[{"k":"苦","t":"框架人人在用，卻沒人記得它從哪裡來；功勞歸給了別人，是統籌者最常見的失落。"},{"k":"集","t":"想讓人記得「這是天台的」，是有愛，也是對名的貪求。"},{"k":"滅","t":"每一種法門都找到自己的位置時，是誰安排的已經不重要；這份不計較，走在寂滅的方向上。"},{"k":"道","t":"正思惟。安排好了就放手，不求功歸於己；這份不貪求名位的心，就是出離的思惟。"},{"k":"在人群裡","t":"在整合中的組織裡，統籌者最關鍵：沒有好的分類與分工，合併只會變成混亂。你做得越好，別人越看不見你。"}]}},"華嚴":{"盛極而斷":{"lead":"你在女皇的殿上用金獅子說法，講得滿堂歡喜；可是一切相依而起，宮殿的興衰也牽動著你。","parts":[{"k":"苦","t":"最美的比喻，說給了最會變的人聽。殿上的歡喜散了，你的法也冷了。"},{"k":"集","t":"苦在於把說法的舞台當成了法本身，渴求那份滿堂歡喜一直都在。"},{"k":"滅","t":"舞台散了，心不再追著掌聲；那份清涼，不隨宮殿增減。"},{"k":"道","t":"正見。一切相依，本來如此；如實看見無常，宮殿也在相依之中。"},{"k":"在人群裡","t":"在權力中心身邊，創見者容易淪為提供「好看的點子」的人。點子被採用得快，被拋棄得也快；好的想法是為了讓人看見實相，不是為了討好。"}]},"東渡回歸":{"lead":"你的章疏散失了，又由高麗的義天帶回杭州。法藏的十面鏡子裡，每一面都映著其他鏡子；你的法脈也是這樣，在別國的經藏裡映著，等待被照回來。","parts":[{"k":"苦","t":"想法遠在他鄉，十面鏡子少了幾面，整個圖像就不完整。"},{"k":"集","t":"想要圖像完整、想要一切照你的設想回來，是對圓滿的執取。"},{"k":"滅","t":"華嚴說一即一切，一面鏡子也映著全體；心不再要求湊齊，也就不覺得缺了。"},{"k":"道","t":"正念。清楚覺察手上這部經、心裡這一念，都是無數因緣成就的；念念分明，不忘失這份觀照。"},{"k":"在人群裡","t":"在以知識為本的團隊裡，創見者讓舊材料長出新意：你看得出散落的文件之間的關係。只是要把連結寫下來，別人才接得住。"}]},"山林不絕":{"lead":"你把「一即一切」帶到劈柴挑水之間：一碗飯裡有千萬人的勞動，一口呼吸連著整個世界。","parts":[{"k":"苦","t":"離開大殿，你宏大的圖像沒有人共享；山中只有柴與水。"},{"k":"集","t":"若心裡仍覺得「我的想法應該被更多人看見」，那份不甘就是集。"},{"k":"滅","t":"在一碗飯裡看見整個世界時，你已不再需要觀眾。"},{"k":"道","t":"正業。既然一切相依，就照這份相依去生活：不殺生、不偷盜、不邪淫，不傷害與你相連的一切。"},{"k":"在人群裡","t":"在小而自主的團體裡，創見者容易嫌舞台太小。其實小團體最需要你：一個好點子在這裡能立刻試、立刻改，比在大組織裡等批准更快落地。"}]},"百川歸海":{"lead":"宗密說禪教本是一致；你的圓融思想後來成了漢傳佛教的哲學底座，與禪、與淨土互相成全。你的名字淡了，可是每當有人說「圓融」，說的就是你。","parts":[{"k":"苦","t":"「圓融」被說得太多，常常淪為和稀泥；看著自己的思想被用淺了，也是苦。"},{"k":"集","t":"苦在於要別人照你的深度來用你；一切相依，被用淺了，也是因緣。"},{"k":"滅","t":"放下「應該被正確理解」的渴求，圓融才真的圓融。"},{"k":"道","t":"正語。不分高下、不謗他宗，說令人和合、不令人分裂的話。"},{"k":"在人群裡","t":"在整合中的組織裡，創見者提供「讓不同的東西放在一起還說得通」的那套說法。這套說法若只是漂亮話，合併就會失敗；它必須真的化解衝突。"}]}},"律":{"盛極而斷":{"lead":"你曾想請朝廷頒令，讓天下依你的律受戒；可是靠權力推行的規矩，權力一變就鬆了。","parts":[{"k":"苦","t":"規矩一夜之間沒人遵守，守了一輩子的東西被輕易放下，這是壞苦。"},{"k":"集","t":"苦的根，是把「人人照我的規矩」當成目標，借權力推行；心裡渴求的是掌控，不是清淨。"},{"k":"滅","t":"戒的清淨本來不靠詔令；回到自己願意守的那一刻，心就不再隨權力起落。"},{"k":"道","t":"正語、正業、正命。發自內心守住身口：不妄語，不殺、不盜、不邪淫，如法謀生。戒是為了不傷害，不是為了管人。"},{"k":"在人群裡","t":"在權力中心身邊，築基者常被用來推行上面的命令。好的制度讓人安心，借權力壓下去的制度只讓人服從；你要分得清兩者。"}]},"東渡回歸":{"lead":"鑑真雙目失明也要把戒律送過海；一千多年後，弘一大師又依從日本請回的注疏重弘南山律。","parts":[{"k":"苦","t":"五次失敗，弟子病逝，自己失明；為法付出的代價，是真實的苦。"},{"k":"集","t":"付出裡若夾著「一定要成功」「一定要證明」的念頭，辛苦就會變成怨。"},{"k":"滅","t":"盡了力而不執著結果，那份安然就是滅的方向；成敗是因緣，心可以不隨之翻騰。"},{"k":"道","t":"正精進。為法不惜辛勞：未生的惡令它不生，已生的善令它增長。"},{"k":"在人群裡","t":"在以知識為本的團隊裡，築基者把經驗變成流程與文件：怎麼做、怎麼傳。鑑真把整套受戒的做法帶了過去，日本才有了如法的戒壇。"}]},"山林不絕":{"lead":"你不求戒壇宏大，只求每天的行住坐臥合乎分寸。","parts":[{"k":"苦","t":"守戒的日子平淡，沒有人看見，也沒有人稱讚。"},{"k":"集","t":"若守戒是為了自覺比別人清淨，那是我慢；若以為光守條文就能解脫，那是戒禁取。"},{"k":"滅","t":"戒成了自然，不再是咬牙撐住的東西時，心是輕的。"},{"k":"道","t":"正語、正業、正命。不說假話、不挑撥、不罵人、不說廢話；不殺、不偷、不邪淫；不用不正當的方法過活。守得久了，心也就定了。"},{"k":"在人群裡","t":"在小而自主的團體裡，築基者讓大家能自己運轉：沒有人盯著，也知道每天該做什麼。只是別讓規則多到把人綁住。"}]},"百川歸海":{"lead":"今天漢傳的比丘、比丘尼，不論學禪、學教、念佛，登壇受戒時依的都是《四分律》。你沒有自己的宗門，卻是每一宗的地基。","parts":[{"k":"苦","t":"地基沒有人看見；大家讚嘆的，是樓上的風景。"},{"k":"集","t":"想讓人知道「這是律宗的功勞」，是對名的貪求。"},{"k":"滅","t":"地基不需要被看見，只需要穩；心安於此，就不再計較。"},{"k":"道","t":"正命。以戒為師，一衣一食都如法而得、少欲知足，不靠討好或奇特手段過活。"},{"k":"在人群裡","t":"在整合中的組織裡，築基者決定合併能不能真的運作：大家可以有不同的想法，但要守同一套基本規則。這套規則越少、越清楚，越能長久。"}]}},"淨土":{"盛極而斷":{"lead":"念佛本來不需要宮殿；朝廷的護持來了又去，本是因緣。淨土法門講的是信、願、行，靠的是佛的願力與自己的發願，從來不是世間的權勢。","parts":[{"k":"苦","t":"寺院被收回，信眾被驅散，你照顧的人一夜四散，這是愛別離苦。"},{"k":"集","t":"苦的根，是把「大家在一起」寄託在權勢上；希望依附在會變的東西上，就會隨它破碎。"},{"k":"滅","t":"放下世間的依靠，回到一句佛號；心不再隨權勢起伏，這份清涼指向的就是滅。"},{"k":"道","t":"正思惟。不把希望寄在權勢上，這份放下世間依靠的心意，就是出離的思惟。"},{"k":"在人群裡","t":"在權力中心身邊，凝聚者容易變成「讓大家安靜聽話」的人。你的溫暖是要讓人安心，不是讓人不再提問。"}]},"東渡回歸":{"lead":"道綽的《安樂集》、曇鸞的《往生論註》，都曾在日本被讀了又讀：法然借《安樂集》的聖道、淨土二門開宗，親鸞則處處援引《往生論註》；近代《往生論註》又從日本回到中國。一句佛號渡過了海，又渡了回來。","parts":[{"k":"苦","t":"你最在乎的是身邊的人，法卻在遙遠的他方被人讀著；熟悉的人群散了，是愛別離苦。"},{"k":"集","t":"只肯在熟悉的人群裡付出，是把慈悲圈在「我們」之內的執取。"},{"k":"滅","t":"知道一句佛號在哪裡都一樣，「我們」與「他們」的分別放下了，心就寬了。"},{"k":"道","t":"正念。記得那些為法渡海的人，把這份感念放進每一聲佛號，聲聲清楚、念念分明。"},{"k":"在人群裡","t":"在以知識為本的團隊裡，凝聚者讓知識有人傳承：書要有人讀，讀的人要有人陪。你照顧的，是那條把人和典籍連在一起的線。"}]},"山林不絕":{"lead":"你像道綽教鄉民數小豆那樣，在最平凡的日子裡念佛。不必懂深奧的道理，只要每一聲都清清楚楚。","parts":[{"k":"苦","t":"日子平淡，日復一日；世間的苦，並沒有因為念佛就消失。"},{"k":"集","t":"若念佛是為了求一個好回報，心仍在貪求裡；若嫌功課枯燥，則是對新鮮的渴求。"},{"k":"滅","t":"一聲佛號念得清楚的那一刻，心中不求也不嫌；貪愛暫時止息的寧靜，指向的就是滅。"},{"k":"道","t":"正念與正定。每一聲都清楚知道、不忘所念，是正念；心安住在這一句佛號上而不散亂，是正定。"},{"k":"在人群裡","t":"在小而自主的團體裡，凝聚者是黏著劑：大家撐得下去，常常不是因為目標，而是因為有人每天陪著一起數小豆。照顧別人的同時，也別落下自己的功課。"}]},"百川歸海":{"lead":"你是最不像「宗派」的宗派：禪師念佛、法師念佛、律師也念佛。宋明以後，許多漢傳寺院都設有念佛堂。你沒有門戶，所以處處是你的家。","parts":[{"k":"苦","t":"處處是家，也就處處不專屬於你；淨土成了背景，很少有人專門為你說話。"},{"k":"集","t":"想被專門記得、被特別對待，仍是有愛。"},{"k":"滅","t":"不分你我地接引每一個人時，心中已經沒有「我的宗」可以失去。"},{"k":"道","t":"正思惟。不分賢愚，以不瞋、不害、願人人離苦的心接引每一個人。"},{"k":"在人群裡","t":"在整合中的組織裡，凝聚者讓不同背景的人願意坐在一起。你不需要贏，只需要讓大家都還在桌邊。"}]}},"臨濟":{"盛極而斷":{"lead":"你的宗風峻烈，敢說敢當；大慧也曾因時局牽連，被流放十幾年。可見再峻烈的宗風，遇上世間的風浪一樣無常。","parts":[{"k":"苦","t":"敢說敢當的人，最容易被時局反噬；流放、離散，都是真實的苦。"},{"k":"集","t":"苦的根不在敢說，而在把一支法脈綁在某一股權勢上，渴求它替你撐腰。"},{"k":"滅","t":"喝聲本來不需要靠山；放下靠山的那一刻，心也就不隨風浪翻覆。"},{"k":"道","t":"正見。看清倚靠權勢的因，必然帶來隨權勢起落的果。"},{"k":"在人群裡","t":"在權力中心身邊，破局者最危險，也最需要：只有你敢對上位者說不。你要分清楚，自己推動的是真正該改變的事，還是一時的意氣。"}]},"東渡回歸":{"lead":"你的禪被榮西、無學祖元等人帶到日本，成了日本的臨濟宗，後來又經鈴木大拙等人傳到西方。十七世紀，臨濟也由中國僧人傳入越南，近代的一行禪師就出自這一系；而在華人世界，臨濟法脈本來就一直沒有斷。","parts":[{"k":"苦","t":"法到了異國，說著別人的語言，常被誤解成一種風格、一種姿態。"},{"k":"集","t":"急著糾正一切誤解，是想掌控法怎麼被理解；這份急，也是渴求。"},{"k":"滅","t":"一個「無」字，在哪裡參都是同一個「無」；心不再急著證明正宗，就安了。"},{"k":"道","t":"正精進。不論在哪裡都認真參究，不讓懈怠生起。"},{"k":"在人群裡","t":"在以知識為本的團隊裡，破局者會挑戰舊文件、舊做法：「這個還需要嗎？」這是很有價值的問題；只是問完之後，也要聽答案。"}]},"山林不絕":{"lead":"你像臨濟義玄一樣，在一聲喝裡斬斷妄想，在田間、在禪堂，把一個話頭參到底。不靠典籍，不靠權勢。","parts":[{"k":"苦","t":"沒有依靠，只有自己；一個話頭參了多年仍無消息，那份焦灼是苦。"},{"k":"集","t":"焦灼來自「我要開悟」的渴求；把開悟當成要抓到手的東西，它就越遠。"},{"k":"滅","t":"臨濟說「隨處作主，立處皆真」；不再向外馳求的時候，焦灼也就止息了。"},{"k":"道","t":"正精進。一份不肯放過自己的用功，不緊，也不鬆。"},{"k":"在人群裡","t":"在小而自主的團體裡，破局者是發動機。人少，你的節奏就是大家的節奏；推得太猛，大家會散，記得留給別人喘息的空間。"}]},"百川歸海":{"lead":"臨濟後來「遍天下」，明清以後大多數漢傳寺院的法脈都上溯到臨濟。近代的星雲大師、惟覺老和尚、聖嚴法師都承接了臨濟法脈，卻各自走出不同的路。","parts":[{"k":"苦","t":"名字到處都是，峻烈的宗風卻被沖淡了；法脈很大，喝聲很少。"},{"k":"集","t":"苦的根，是要所有人都照同一種方式參禪，渴求一種純粹。"},{"k":"滅","t":"放下對「純粹」的執著，看見不同的路通向同一個方向，心就不再爭。"},{"k":"道","t":"正語。尊重各自的方法，不說輕視別人的話，彼此不相輕。"},{"k":"在人群裡","t":"在整合中的組織裡，破局者防止組織變得溫吞。融合之後最容易的是誰也不得罪；你提醒大家：好好說話，不等於不說真話。"}]}},"曹洞":{"盛極而斷":{"lead":"默照最怕的就是攀緣。法脈一旦倚著權勢，心裡那份「默」就容易變成等待與掛念。曹洞在中國一度只守著「半邊」。","parts":[{"k":"苦","t":"安靜的法被拉到熱鬧的地方，心裡的默照，變成了等待與掛念。"},{"k":"集","t":"等什麼？等被看見、等被重用；這份攀緣，就是集。"},{"k":"滅","t":"攀緣放下，默就只是默，照就只是照。"},{"k":"道","t":"正思惟。放下攀緣，就是出離的思惟。"},{"k":"在人群裡","t":"在權力中心身邊，完成者是把事情做好的人，卻常被要求做「看起來好」的事。守住你的標準：寧可慢一點，也不交出空殼。"}]},"東渡回歸":{"lead":"道元把曹洞帶回日本，「只管打坐」成了日本禪的一大傳統；七百多年後，聖嚴法師以宏智的〈默照銘〉印證自己的修行，讓默照禪在華人世界重新活過來。","parts":[{"k":"苦","t":"默照在漢地漸漸少有人教；幾百年的空白，是求不得的苦。"},{"k":"集","t":"若等待裡帶著焦急，非要它回來不可，就是渴求。"},{"k":"滅","t":"心不再催促因緣，等待裡就沒有了焦灼。"},{"k":"道","t":"正精進。等待因緣的同時，自己的功課一天也不停。"},{"k":"在人群裡","t":"在以知識為本的團隊裡，完成者讓文件可以被下一個人直接使用：完整、準確、沒有遺漏。這份綿密，幾百年後還有人受用。"}]},"山林不絕":{"lead":"你在天童山的松風裡坐了一輩子，不抱著等待開悟的心，也不求人知道。宏智說：「默默忘言，昭昭現前。」","parts":[{"k":"苦","t":"坐了一輩子，沒有驚天動地的開悟故事，日子一天一天過去。"},{"k":"集","t":"心裡若還在等「那一刻」，等待本身就是渴求。"},{"k":"滅","t":"不再等待、不再追逐的心，正朝著貪愛止息的方向。"},{"k":"道","t":"正念與正定。安住在當下，不被念頭拖走。"},{"k":"在人群裡","t":"在小而自主的團體裡，完成者最可靠，也最容易一個人把事全扛下來。綿密不等於獨攬；把方法教給別人，事情才能一代代做下去。"}]},"百川歸海":{"lead":"你不與臨濟爭天下，只守著自己的半邊；到了近代，你和臨濟的話頭在法鼓山並行傳授：默照是默中有照、止觀同時，話頭是起疑情、參到底。兩條路，同一個方向。","parts":[{"k":"苦","t":"守著半邊，看著另一邊遍天下；不爭的人，也會有一點寂寞。"},{"k":"集","t":"若不爭只是表面，心裡仍在比較，那份比較就是集。"},{"k":"滅","t":"真的不比較了，半邊與天下就沒有分別。"},{"k":"道","t":"正語。說話不爭勝負，只說令人和合的話。"},{"k":"在人群裡","t":"在整合中的組織裡，完成者讓兩套方法真的能並行：細節對上了，合作才不會停在口號。"}]}},"密":{"盛極而斷":{"lead":"你曾是三朝帝王的國師，灌頂、護國、祈雨，無一不受倚重；可是會昌年間一連串詔令，長安的道場就散了。","parts":[{"k":"苦","t":"最受倚重的，跌得最重；一整套傳承因一個朝代的轉向而斷，這是無常最直接的示現。"},{"k":"集","t":"苦的根，是對外緣的倚賴：以為有了帝王的護持，法就穩了。"},{"k":"滅","t":"不再把法的安危寄在外緣上，心就不隨宮門開闔。"},{"k":"道","t":"正見。看見這也是因緣所生，緣盡則散。"},{"k":"在人群裡","t":"在權力中心身邊，連結者最有用，也最危險：你能為團隊爭來資源，也可能讓團隊離不開那份資源。好的連結者，會趁資源還在，先讓大家學會自立。"}]},"東渡回歸":{"lead":"惠果一句「傳之東國」，讓空海把兩部大法帶到日本，在高野山延續了一千二百年；一九二〇年代，又有中國僧人東渡把它學回來。","parts":[{"k":"苦","t":"在故土斷絕，只在海的那一邊延續；再回來時，已經要向別人學。"},{"k":"集","t":"若心裡想著「這本來是我們的」，學回來的路上就有不甘。"},{"k":"滅","t":"惠果讓義明在長安傳法，讓空海帶法東歸；法交給能承擔的人，不問國界。放下「我們的」，不甘就止息了。"},{"k":"道","t":"正精進。已生的善令它增長、不令退失：師長所託的法，一代代傳下去，不肯退轉。"},{"k":"在人群裡","t":"在以知識為本的團隊裡，連結者把知識送到需要的地方。空海帶回的「總二百一十六部四百六十一卷」，就是一份連結者的清單：不只帶回人脈，也帶回東西。"}]},"山林不絕":{"lead":"你把密法從宮廷帶回自己身上：口誦真言、手結印契、心作觀想，讓身口意與佛相應，這是三密。","parts":[{"k":"苦","t":"離開宮廷的道場，沒有隆重的儀式，也沒有人看見你的修持。"},{"k":"集","t":"修法若是為了求感應、求神通，那份求就是集。"},{"k":"滅","t":"不求感應，不求人知；心裡沒有求的時候，也就安了。"},{"k":"道","t":"正語、正業、正念。下了座，也不說傷人的話、不做傷害的事，念念清楚。"},{"k":"在人群裡","t":"在小而自主的團體裡，連結者要學的是向內連結：把外面的資源換成團隊自己的能力，讓大家離開你也走得下去。"}]},"百川歸海":{"lead":"唐密在漢地失傳了，卻留下了許多痕跡：寺院的早晚課裡有咒語，焰口、水陸法會裡有密教的儀軌。你化進了漢傳佛教的日常，只是很多人不知道那是你。","parts":[{"k":"苦","t":"被用著，卻沒被認出來；儀軌還在，傳承卻斷了。"},{"k":"集","t":"想被認出、被正名，是對名的貪求。"},{"k":"滅","t":"心裡沒有「被認出」的需要，也就沒有失落。"},{"k":"道","t":"正思惟。不害他人、悲憫眾生的心意，就是無害的思惟。"},{"k":"在人群裡","t":"在整合中的組織裡，連結者把一套方法嵌進另一套系統，讓它成為大家的日常。成功的標誌，往往就是沒有人記得它從哪裡來。"}]}}},"roles":{"臨濟":{"name":"破局者","cat":"行動","text":"你敢說別人不敢說的話；事情卡住時，你是那個逼大家往前走的人，就像臨濟的一聲喝，把繞圈子的念頭當場截斷。短處是急：話說重了會傷人，催得太緊，別人只看見壓力，看不見你的用心。急裡藏著的「集」，是想把局面握在自己手裡：要它快，要它照我的意思成。修正的路是正語：仍然直說，但不妄語、不惡口；把喝聲留給執著，不留給人。你需要凝聚者替你接住人心，也需要審辨者在你衝出去之前，先替你看一眼。"},"律":{"name":"築基者","cat":"行動","text":"你把理想變成做得到的規矩：誰負責什麼、哪一步先做、做錯了怎麼補。團隊因為你而可靠，就像戒律讓僧團在亂世裡還能運作。短處是不夠變通：新情況來了，你可能先問「規定怎麼寫」，而不是「這件事為什麼要做」。這裡的「集」，是把規矩本身當成目的；以為光守條文就能清淨，佛教稱為戒禁取。修正的路是正思惟：每一條規矩都回頭問一次，它是不是為了不傷害、不惱害。你需要創見者帶來新的可能，也需要統籌者向大家說明規矩為何而立。"},"曹洞":{"name":"完成者","cat":"行動","text":"你耐得住、坐得住；別人收工了，你還在把細處一一補齊，事情交到你手上就會被好好做完。這是曹洞「綿密」的功夫：不求奇特，一天一天地做。短處是不容易放手：擔心別人做不好，寧可自己扛；要求完美，事情也就遲遲結束不了。這份放不下，背後是對「萬無一失」的渴求，而世間本來沒有萬無一失。修正的路是正念：做每一件事時清楚知道自己在做，也清楚知道「這已經夠好」的那一刻；做完了，就放下。你需要破局者提醒你時間，也需要統籌者幫你把事分出去。"},"華嚴":{"name":"創見者","cat":"思辨","text":"你看見別人沒看見的連結：兩件看似無關的事，在你眼裡互相映照，像法藏那十面鏡子。新的點子常從你這裡來。短處是想得比做得快：說出來別人聽不懂，或者一個好主意還沒落地，你已經在想下一個。這裡的「集」，是愛上自己的想法，把心中的圖像當成了實相。修正的路是正語與正精進：把話說到對方聽得懂、用得上；挑一個好主意，陪它走到成形，讓已生的善增長。你需要築基者把想法變成步驟，也需要審辨者幫你篩選。"},"三論":{"name":"審辨者","cat":"思辨","text":"你冷靜、公正，能在眾人興奮時指出漏洞；計畫交給你看過，大家心裡就踏實。三論的「破邪」，在你身上是一種判斷力。短處是太挑剔：總看見問題，久了別人覺得你潑冷水；也可能看得太久，遲遲不肯下判斷。這裡的「集」，是對「我是對的」的執取：破了別人的見，沒有破自己的。龍樹說空，連「空」也不可執。修正的路是正見與正思惟：用看清楚來幫人，不是用看清楚來贏人；指出問題時，心裡沒有輕慢。你需要創見者給你值得評估的東西，也需要凝聚者幫你把話說得溫暖。"},"法相":{"name":"專精者","cat":"思辨","text":"你在一個領域鑽得很深，別人說不清的細節，你一項一項說得清清楚楚；團隊遇到真正的難題，最後都會來問你。玄奘寧可就西而死，也要把原典帶回來，就是這種精神。短處是視野容易收窄：只在熟悉的地方發言，對整體方向不太在意，或者用術語把別人隔在外面。這裡的「集」，是把所知當成「我的」，學問成了身分，也成了牆。修正的路是正思惟：不為被需要而學，是出離；不拿所知壓人，是無害。你需要統籌者把你的專長放進全局，也需要連結者把你介紹給需要你的人。"},"天台":{"name":"統籌者","cat":"人際","text":"你看得見每個人的長處，也知道每件事該放在哪裡；你能把目標說清楚，讓大家各就各位。這很像智顗的判教：把一代佛法一一安放在恰當的位置，教與觀各得其所。短處是容易被看成只會分派、自己不動手；太在意全局，也可能把人當成棋子。這裡的「集」，是對「掌握全局」的渴求，以為一切都在自己的框架裡才安心。修正的路是正語與正思惟：不在人與人之間兩面說話，分派時說真話；心裡記得每個人都是人，不是棋子。你需要完成者把事做細，也需要破局者在你協調過頭時推一把。"},"淨土":{"name":"凝聚者","cat":"人際","text":"你讓人覺得被接住：誰沒跟上，你會回頭；誰受了委屈，你會聽。就像道綽教鄉民數著小豆念佛，不分賢愚，一個也不放下。團隊因為你而有溫度。短處是怕衝突：該說的不同意見吞了下去，關鍵時刻難以做決定。這裡的「集」，是想被所有人喜歡、想維持一團和氣的渴求；真正的慈悲，不是讓每個人都滿意。修正的路是正語：說真實、有益的話，在合適的時候說，即使不好聽。你需要破局者陪你做難的決定，也需要審辨者幫你看清哪些和氣只是逃避。"},"密":{"name":"連結者","cat":"人際","text":"你擅長向外：找人、找資源、找機會；別人還在門裡打轉，你已經把門外的路接上了。不空能在三朝帝王之間為密法爭得一席之地，空海能把一整套法從長安帶回日本，靠的都是這份把兩個世界接起來的本事。短處是熱度來得快、退得也快：人脈接上了，後續卻沒有跟上；太會借力，也容易被力量牽著走。這裡的「集」，是對外緣的倚賴與攀緣，以為靠對了人，事情就穩了。修正的路是正命與正念：不靠討好或交換換取資源；每一次向外求，都清楚自己為了什麼。你需要完成者把你接上的線收好，也需要專精者讓你帶出去的東西有分量。"}},"rolesLead":["九宗的選擇，也透露出你和別人一起做事時的習慣。這裡把九宗對應到九種團隊角色，分成三類：<strong>行動型<\/strong>把事情推動、落實、完成；<strong>思辨型<\/strong>提出想法、判斷好壞、鑽研到底；<strong>人際型<\/strong>協調分工、凝聚人心、向外連結。","一個人很少只有一種角色。通常有兩到三個最自然、最不費力的角色：遊戲取你得分最高的兩宗，第三宗若達到第二宗的八成，也算進來。得分最高的那一宗是你的<strong>主角色<\/strong>，也就是你的思想；其餘是<strong>副角色<\/strong>，常常是別人從你做事的方式裡看到的個性。主角色與副角色落在同一類還是不同類，就是你在思想與個性上可能的差異。","每種角色都有長處，也有連帶的短處。短處不必消滅，但值得看清它背後抓著什麼，那就是「集」；再看八正道哪一項能讓它鬆開，那就是「道」。這是借九宗的特質所做的比喻，不是心理測驗。"],"mix":{"行動":{"name":"行動之人","text":"你的自然角色都在行動這一邊。你相信做出來才算數，比起討論，你更想動手；給人的印象是可靠、有力，有時有點硬。你的思想和做法大致一致，心裡怎麼想，手上就怎麼做，這讓你很少內耗，卻也容易少了停下來想一想、回頭看看人的時刻。佛法講止觀雙運：行動之外，也留一段安靜的時間，讓正念看見自己為什麼這麼急。"},"思辨":{"name":"思辨之人","text":"你的自然角色都在思辨這一邊。你先想清楚才動，給人的印象是聰明、冷靜，有時有點遠。你的思想和做法一致到幾乎重疊，你相信看清楚就是做事；這讓你很少犯粗心的錯，卻可能讓想法一直停在紙上。佛法說慧有三層：聽聞而得，思惟而得，修習而得。前兩層之後，還要第三層；給自己一件小事，從頭做到尾。"},"人際":{"name":"人際之人","text":"你的自然角色都在人際這一邊。你天生向著人：協調、照顧、連結，給人的印象是溫暖、好相處，常是大家的中心。你的思想和做法一致，你相信佛法就在人與人之間；這讓團隊少了很多摩擦，但你也可能把自己的看法放得太低，或者用忙著照顧別人，來躲開需要獨自面對的功課。佛陀教人「自洲以自依，法洲以法依」，並說做法就是四念處：照顧別人之前，先回來看看自己的身心。"},"行動+思辨":{"name":"行動為主，兼有思辨","text":"你的思想落在行動，個性裡卻有一塊愛想的地方。別人看你是做事的人，你自己知道，動手之前其實想了很多，只是不說。這份差異是資產，讓你不容易蠻幹；但也可能讓你在「想清楚」與「先做再說」之間拉扯，表面果斷，心裡反覆。給自己一條規矩：想的時間有限，做的時候專注。正見在前，正精進在後，本來就是同一條路的前後兩段。"},"行動+人際":{"name":"行動為主，兼有人際","text":"你的思想落在行動，個性裡卻有一份對人的在乎。你會推進度，也會回頭看誰掉隊了；別人眼中你可能嚴格，私底下卻最記得大家的難處。這份差異讓你的推動有溫度；但兩邊衝突時，你可能為了照顧人而延誤，又為了趕進度而自責。推動事情和照顧人，都是為了少一點苦。把你要什麼說清楚，是正語；也讓人看見你在乎什麼。"},"思辨+行動":{"name":"思辨為主，兼有行動","text":"你的思想落在思辨，個性裡卻有一股要把事做成的勁。你不只想，還要驗證；不只批評，還要提出做法。別人以為你是學者，其實你更像工程師。這份差異讓你的想法落得了地，但你也可能對自己太嚴：想得完美，又要求做得完美。佛陀初轉法輪就說中道，遠離耽著欲樂與刻苦自虐兩邊；給自己留一點餘地。"},"思辨+人際":{"name":"思辨為主，兼有人際","text":"你的思想落在思辨，個性卻偏向人。你想得冷靜，待人溫和；看得出計畫的漏洞，也知道怎麼說才不傷人。別人第一印象覺得你理性，相處久了才發現你很重感情。這份差異讓你的批評能被聽進去；但兩邊衝突時，你可能為了不傷和氣，把該說的判斷收了回去。正語不是只說好聽的話，而是說真實、有益、合時的話。"},"人際+行動":{"name":"人際為主，兼有行動","text":"你的思想落在人際，個性裡卻有行動的力量。你在乎人，也能帶著人把事做完；你不只協調，還是那個最後捲起袖子的人。別人眼中你親切，關鍵時刻卻很能扛。這份差異讓你的關懷不只停在嘴上；但你也可能事事親力親為，把自己耗盡。佛陀用彈琴比喻用功：弦太緊不成聲，太鬆也不成聲。"},"人際+思辨":{"name":"人際為主，兼有思辨","text":"你的思想落在人際，個性裡卻有一塊愛追根究柢的地方。你和人相處自然，心裡卻常在分析：這個人為什麼這樣說，這件事的道理在哪裡。別人看你好相處，其實你看得比他們以為的深。這份差異讓你的協調有洞見；但你也可能把看見的藏起來，只說大家想聽的。試著把你看見的，用溫和的方式說出來；正見說出來，才幫得上人。"},"all":{"name":"三類兼具","text":"你的自然角色橫跨行動、思辨、人際三類。你能想、能做，也能帶人；在不同場合，你會變成不同的樣子，別人對你的印象也常常不一樣。這是難得的完整，也有代價：你可能不知道哪一個才是自己，什麼都會，就什麼都想管。佛法說無我，本來沒有一個固定不變的「真正的我」等著被找到；因緣需要什麼角色，就清清楚楚地做好那個角色，就夠了。"}},"masters":[{"name":"舍利弗","s":{"三論":4,"法相":4,"天台":2},"f":{"經":2,"融":1},"k":[[5,"C"],[13,"B"],[1,"A"]],"bal":false,"text":"佛陀弟子中的「智慧第一」，《增壹阿含經》說他「智慧無窮，決了諸疑」。你像他：遇到問題先要弄清楚，不肯含糊放過；你的選擇裡，思辨與求證的比重很高。他會提醒你：智慧的用處，是替人解開疑惑，不是讓自己站得比別人高。","id":"佛陀弟子中的「智慧第一」，《增壹阿含經》說他「智慧無窮，決了諸疑」。","era":"佛陀時代","yrs":"生卒年不詳","b":-0.12},{"name":"阿難","s":{"天台":2,"法相":2,"淨土":2,"三論":1},"f":{"經":6,"融":1},"k":[[6,"D"],[9,"C"],[19,"C"],[20,"C"],[32,"C"]],"bal":false,"text":"佛陀的侍者，自說「我奉侍佛來二十五年」，是弟子中的「多聞第一」；佛滅後第一次結集，由他誦出經藏，所以經典開頭都是「如是我聞」。你像他：一次又一次，你選擇把發生的事記下來、把說過的法保存好；你在乎的不是自己說了什麼，而是別人說的不要失傳。他會提醒你：聽得多、記得多，還要思惟、還要修，才是自己的。","id":"佛陀的侍者，自說「我奉侍佛來二十五年」，是弟子中的「多聞第一」；佛滅後第一次結集，由他誦出經藏，所以經典開頭都是「如是我聞」。","era":"佛陀時代","yrs":"生卒年不詳","b":0.0574},{"name":"優波離","s":{"律":6},"f":{"經":3,"山":1},"k":[[4,"B"],[16,"A"],[24,"B"]],"bal":false,"text":"佛陀弟子中的「持律第一」，《增壹阿含經》說他「奉持戒律，無所觸犯」；第一次結集時，由他誦出律藏。你像他：你相信規矩是用來保護人的，一字一句守得分明；別人嫌繁瑣的地方，你知道為什麼不能省。他會提醒你：戒的根本是不傷害；守住條文的同時，別忘了條文為何而立。","id":"佛陀弟子中的「持律第一」，《增壹阿含經》說他「奉持戒律，無所觸犯」；第一次結集時，由他誦出律藏。","era":"佛陀時代","yrs":"生卒年不詳","b":-0.0641},{"name":"大迦葉","s":{"曹洞":4,"律":2,"臨濟":1},"f":{"山":5},"k":[[2,"C"],[9,"D"],[19,"B"],[8,"C"]],"bal":false,"text":"佛陀弟子中修苦行的「頭陀第一」；佛滅後由他召集第一次結集，禪宗的傳燈譜系尊他為天竺第一祖。他年老時，佛陀勸他放下頭陀行、接受供養，他回答「不敢捨本所習」；佛陀反而讚歎：「此頭陀行在世者，我法亦當久在於世。」你像他：你一再選擇遠離權勢、回到山林，寧可清苦也要自在，不需要很多人懂你。他會提醒你：遠離，是為了看清，不是為了看輕；山下的人，也是你要度的人。","id":"佛陀弟子中修苦行的「頭陀第一」；佛滅後由他召集第一次結集，禪宗的傳燈譜系尊他為天竺第一祖。","era":"佛陀時代","yrs":"生卒年不詳","b":-0.12},{"name":"大愛道","s":{"律":4,"淨土":2},"f":{"融":3,"山":1},"k":[[2,"D"],[10,"B"]],"bal":false,"text":"佛陀的姨母摩訶波闍波提，在摩耶夫人去世後把太子撫養長大，後來成為佛教第一位比丘尼。她三次請求出家都被佛陀勸止，仍和釋迦族的婦女一路跟隨，赤腳走到那摩提，「塗跣污足，塵土坌體」，哭著站在精舍門外，直到阿難替她向佛陀請求。她圓寂後，佛陀說：大丈夫所能做的，她都做到了。你像她：你認定一條路是對的，就不怕被拒絕；你走在前面，往往不是為了自己，而是替後來的人把門打開。她會提醒你：門打開之後，還要有人照顧進門的人。","id":"佛陀的姨母摩訶波闍波提，在摩耶夫人去世後把太子撫養長大，後來成為佛教第一位比丘尼。","era":"佛陀時代","yrs":"生卒年不詳","b":0.0973},{"name":"須達","s":{"淨土":3,"密":2,"華嚴":1},"f":{"融":3,"宮":2},"k":[[12,"D"],[11,"D"]],"bal":false,"text":"舍衛城的長者須達多，「以常給孤貧辛苦故」，人稱給孤獨長者；《增壹阿含經》稱他「大檀越主」。他第一次見到佛陀，就請佛陀到舍衛城；為了買下祇陀太子的園林，他讓人用象馱出黃金鋪地，鋪到只剩一小塊，太子被他感動，把園中樹木也一起獻出，這就是「祇樹給孤獨園」。你像他：你看得見別人的缺乏，也有本事把資源找來、把人接上；你相信財富和人脈，用對了地方就是功德。他會提醒你：布施的價值不在金子有多少，而在它讓多少人有了安身、聽法的地方。","id":"舍衛城的長者須達多，「以常給孤貧辛苦故」，人稱給孤獨長者；《增壹阿含經》稱他「大檀越主」。","era":"佛陀時代","yrs":"生卒年不詳","b":0.0378},{"name":"勝鬘","s":{"華嚴":3,"天台":2,"律":1},"f":{"融":3,"宮":2},"k":[[15,"C"],[7,"B"]],"bal":false,"text":"《勝鬘經》的說法者，波斯匿王與末利夫人的女兒；印順導師說，她是在家居士，卻「能說非常深奧、圓滿、究竟的法門」。她在佛前發十大受、三大願，其中一受是「不自為己受畜財物，凡有所受悉為成熟貧苦眾生」；她說「三乘即是一乘」，回到阿踰闍國後與友稱王一同教化，舉國向大乘。你像她：你相信每個人都能走到最圓滿的那一步，也相信不必換一個身分，在自己的位置上就能把法說清楚。她會提醒你：攝受正法，是捨得把身、命、財都用在護持正法上。","id":"《勝鬘經》的說法者，波斯匿王與末利夫人的女兒；印順導師說，她是在家居士，卻「能說非常深奧、圓滿、究竟的法門」。","era":"佛陀時代","yrs":"生卒年不詳","b":-0.0404},{"name":"維摩詰","s":{"臨濟":2,"三論":2,"淨土":1,"華嚴":1},"f":{"融":5},"k":[[8,"B"],[26,"B"]],"bal":false,"text":"毘耶離城的長者，《維摩詰經》的主角。經中說他「雖處居家，不著三界；示有妻子，常修梵行」。他稱病在家，佛陀的弟子們一個個推辭不敢去探望，最後由文殊菩薩前往；問他病從何來，他說：「菩薩病者，以大悲起。」眾菩薩各說如何入不二法門，輪到他時，他默然無言。你像他：你不必離開家、離開工作，也能把修行過得很深；你懂得在人群
